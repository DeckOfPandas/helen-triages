[pytest]
testpaths = tests
# Keeps failure output to one line per failure, which matters when a whole
# batch of recipes share the same problem. Use --tb=long to see full messages.
#
# `--durations=10` so every run reports its own ten slowest tests: the suite's
# cost is measured each time and never quoted here.
addopts = -q --tb=line --durations=10

# SUITE MARKERS. NOT FOR SPEED -- the ten slowest tests are printed at the end
# of every run, so the real cost is visible rather than asserted. For SIGNAL:
# while Helen is doing food QA by hand, her in-progress edits make the
# food half red, and a red suite hides a genuine cocktails regression. Run the
# half you are working on.
#
#   pytest -m food        recipes, style, taxonomy, drafts, reference data
#   pytest -m cocktails   the drinks
#   pytest -m shared      architecture, links, rendered pages, suite hygiene
#   pytest                everything, as before
#
# Markers rather than moving files into subdirectories, deliberately: every
# module derives ROOT from its own __file__ and several build path globs from
# it, so a move is exactly the stale-glob failure MANUAL 12 documents -- the
# tests would pass while checking nothing.
markers =
    food: the food collection's own spec
    cocktails: the cocktails collection's own spec
    shared: architecture and cross-site guards, owned by neither

