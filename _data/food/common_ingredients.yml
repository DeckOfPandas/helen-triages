# =============================================================================
# PANTRY STAPLES
#
# Ingredients that don't help you decide whether you can cook something tonight.
# Listed here so the index hint can sink them to the end of the line, leaving
# the distinctive ingredients where the eye lands first.
#
# THIS DOES NOT CHANGE THE DATA. `main_ingredients` stays an unordered set in
# the front matter; ordering happens at render time, in index.html only.
# `main_ingredients` appears nowhere else — the recipe page uses
# `ingredient_groups` — so there is no competing ordering to break.
#
# MATCHING IS EXACT AND LOWERCASE. "onion" is demoted; "yellow onions" and
# "red onions" are not, because when a recipe names the variety it usually
# means it. That is a feature: the list stays conservative by construction.
#
# WHAT BELONGS HERE: things that are never the point of a dish. Butter and
# flour are in a cake but nobody chooses a cake because of them.
#
# WHAT DOES NOT: anything that is sometimes the hero. Carrots are background in
# a braise and the entire point of a carrot cake, so they stay out. Same for
# cream, ginger, lemon, cheese — you would go and buy them, so they earn their
# place at the front.
# =============================================================================

pantry:
  # Fats
  - butter
  - salted butter
  - unsalted butter
  - olive oil
  - extra-virgin olive oil
  - vegetable oil
  - sunflower oil
  - groundnut oil

  # Flours and raising agents
  - flour
  - plain flour
  - self-raising flour
  - cornflour
  - baking powder
  - bicarbonate of soda

  # Sugars
  - sugar
  - caster sugar
  - golden caster sugar
  - icing sugar
  - brown sugar
  - dark brown soft sugar
  - muscovado sugar

  # Dairy basics
  - milk
  - eggs
  - egg
  - egg whites
  - egg yolks

  # Aromatic base — the mirepoix you always have
  - garlic
  - onion
  - onions
  - shallots

  # Liquids you keep in a cupboard
  - chicken stock
  - vegetable stock
  - beef stock
  - water

  # Seasoning
  - salt
  - sea salt
