# Grocery aisles for the food shopping list (#801, DECISIONS §8.2): a keyword
# table, not a list of ingredients, because `item:` strings are free text.
# _plugins/food_shopping.rb applies it at build, once per ingredient; the
# browser is handed the answer and never this table.
# - The longest keyword wins, so an exception is simply a longer entry:
#   `milk` is dairy and `coconut milk` is a tin. There is no precedence
#   between aisles.
# - Matching is on whole words, lowercased, the curly apostrophe flattened;
#   non-alphanumerics are boundaries. Whole words because `ice` is inside
#   `rice`, `juice` and `spice`.
# - An unmatched ingredient lands in `other`, which is a heading and not a
#   bug. test_the_shopping_list_assigns_an_aisle_to_almost_everything keeps
#   that heading small; growth in it is the signal to add a keyword.

# The aisles in the order they appear down the page, which is the order you
# walk a shop. `key` is what the plugin stamps on an ingredient; `label` is
# what is printed.
order:
  - key: produce
    label: "produce"
  - key: meat
    label: "meat"
  - key: fish
    label: "fish"
  - key: dairy
    label: "dairy & eggs"
  - key: bakery
    label: "bakery"
  - key: frozen
    label: "frozen"
  - key: cupboard
    label: "store cupboard"
  - key: spices
    label: "spices & seasonings"
  - key: drinks
    label: "drinks"
  - key: other
    label: "other"

# Never on the list. Matched on the whole folded name, not as a keyword, so
# "water mixed with 3 tsp cornstarch" is still an ingredient and plain "water"
# is not. Nobody buys it.
never:
  - water
  - cold water
  - ice

# The keywords. Each aisle's list is alphabetical so a keyword can be found by
# eye; an entry is needed only where a shorter entry elsewhere would otherwise
# claim it.
keywords:

  # --- produce -----------------------------------------------------------
  # Fresh fruit, fresh vegetables and fresh herbs. A herb is produce when it is
  # fresh and a spice when it is dried, which is why `mint`, `bay leaves` and
  # `dill` are here and `dried mint` and `dried bay leaves` are not.
  produce:
    - apple
    - apples
    - apricots
    - asparagus
    - aubergine
    - baby potatoes
    - banana shallots
    - basil
    - bay leaf
    - bay leaves
