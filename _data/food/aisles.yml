# =============================================================================
# GROCERY AISLES — where each ingredient is found in a shop.
#
# GitHub issue #801, Helen: "Group the shopping list by grocery aisle, e.g.
# produce, dairy, fish, meat, non-perishable etc." She chose the ten below and
# their order, which is the order you walk a supermarket rather than any
# alphabet: fresh around the outside first, dry goods in the middle, `other`
# last because it is the swept-up remainder and not a department.
#
# THIS IS A KEYWORD TABLE, NOT A LIST OF INGREDIENTS, and that is forced by the
# data: the 86 recipes carry 500 distinct `item:` strings, of which 395 survive
# the shopping list's truncation, and they are free text — "a few sprigs of
# fresh rosemary", "thumb-sized piece of fresh ginger", "chopped roasted
# peanuts". A per-item list would be 395 lines that go stale the first time a
# recipe writes "3 sprigs of rosemary" instead. A keyword table answers for
# strings nobody has written yet, which is the only way this survives the next
# ingest.
#
# THE LONGEST KEYWORD WINS, and that single rule is what makes the table
# readable instead of a pile of special cases. `milk` is dairy and
# `coconut milk` is a tin, `butter` is dairy and `peanut butter` is not,
# `garlic` is produce and `garlic paste` is a jar, `mint` is a herb and
# `dried mint` is a spice. In every pair the more specific string is the longer
# one, so the exceptions are simply entries — they need no precedence
# machinery and no ordering between aisles.
#
# MATCHING IS ON WHOLE WORDS, folded to lowercase with the curly apostrophe
# flattened. Whole words rather than substrings because `ice` is in `rice`,
# `juice` and `spice`, and the ice cube is a real ingredient in this
# collection. Non-alphanumerics are boundaries, so `paste-based` contains the
# word `paste`.
#
# WHERE THE RULE IS APPLIED: _plugins/food_shopping.rb, at build, once per
# ingredient. The browser is handed the answer, never the table — the same
# division _plugins/cocktail_costs.rb already keeps, and it is what lets
# tests/test_rendered_pages.py check the assignment of every real ingredient
# against the real build.
#
# AN UNMATCHED INGREDIENT IS `other` AND THAT IS NOT A BUG. It is a heading on
# the list with things under it, which is what a shopping list wants; a miss
# costs you a glance, not an item. test_the_shopping_list_assigns_an_aisle_to
# _almost_everything holds the count down so the heading stays small, and
# growth in it is the signal to add a keyword here.
# =============================================================================

# -----------------------------------------------------------------------------
# The aisles, in the order they appear down the page. Helen's ten, her words.
# `key` is what the plugin stamps on an ingredient; `label` is what is printed.
# -----------------------------------------------------------------------------
order:
  - key: produce
    label: "produce"
  - key: meat
    label: "meat"
  - key: fish
    label: "fish"
  - key: dairy
    label: "dairy & eggs"
  - key: bakery
    label: "bakery"
  - key: frozen
    label: "frozen"
  - key: cupboard
    label: "store cupboard"
  - key: spices
    label: "spices & seasonings"
  - key: drinks
    label: "drinks"
  - key: other
    label: "other"

# -----------------------------------------------------------------------------
# NEVER ON THE LIST. Matched on the WHOLE folded name, not as a keyword, so
# "water mixed with 3 tsp cornstarch" is still an ingredient and plain "water"
# is not. The cocktails shopping list refuses water the same way and for the
# same reason (`not_on_cards` in _data/cocktails/ingredients.yml): nobody buys
# it, and a line for it is a line you read past every week.
# -----------------------------------------------------------------------------
never:
  - water
  - cold water
  - ice

# -----------------------------------------------------------------------------
# THE KEYWORDS. Longest match wins; see the header. Each aisle's list is
# alphabetical so a keyword can be found by eye, and an entry only needs to be
# here if a SHORTER entry elsewhere would otherwise claim it.
# -----------------------------------------------------------------------------
keywords:

  # --- produce -----------------------------------------------------------
  # Fresh fruit, fresh vegetables and fresh herbs. A herb is produce when it is
  # fresh and a spice when it is dried, which is why `mint`, `bay leaves` and
  # `dill` are here and `dried mint` and `dried bay leaves` are not.
  produce:
