# What a food recipe costs, approximately (#1458). Local builds only, behind
# `site.show_costs`; the prices are public either way. MANUAL §8.2.
#
# Matched as aisles.yml is: the longest whole-word keyword in the folded name
# wins, so `butter beans` beats `butter`. A row gives any of `kg`, `l`,
# `each`, `pack` or a named unit (`head`, `cm`), each `[low, high]` in GBP.
# A spoon of a thing priced by weight is costed at 1 ml to 1 g.
#
# A unit written as a food's name, `kg: "goose"`, was researched: the range
# comes at build from that food's shop prices in price_research.yml (MANUAL
# §8.2). A `[low, high]` written here is an estimate, the first to overwrite.

# The day the prices were last compared with shops. A test fails once it is
# two years old; the fix is re-reading the prices, never moving the date alone.
checked: "2026-11-03"

# Every unit the shopping list can total in, by the name assets/js/
# shopping-list.js folds it to, as [family, how many of the family's base
# unit one of it is]. Families: g, ml, each, pack, and free (costs nothing:
# a pinch is not shopping). kg, l, litre and cl are folded into g and ml
# before they arrive. A unit missing here is unpriced, and the figure says
# "from".
units:
  g: [g, 1]
  gram: [g, 1]
  oz: [g, 28.35]
  lb: [g, 453.6]
  g can: [g, 1]
  g tin: [g, 1]
  g jar: [g, 1]
  g pack: [g, 1]
  g bag: [g, 1]
  g piece: [g, 1]
  g bunch: [g, 1]
  knob: [g, 15]
  ml: [ml, 1]
  ml can: [ml, 1]
  pint: [ml, 568]
  fl oz: [ml, 28.4]
  cup: [ml, 240]
  tsp: [ml, 5]
  level tsp: [ml, 5]
  heaped tsp: [ml, 7.5]
  rounded tsp: [ml, 6]
  slightly rounded tsp: [ml, 6]
  large tsp: [ml, 6]
  tbsp: [ml, 15]
  level tbsp: [ml, 15]
  heaped tbsp: [ml, 22]
  rounded tbsp: [ml, 20]
  good tbsp: [ml, 20]
  glass: [ml, 175]
  large glass: [ml, 250]
  bottle: [ml, 750]
  splash: [free, 0]
  "": [each, 1]
  each: [each, 1]
  whole: [each, 1]
  large: [each, 1]
  medium: [each, 1]
  small: [each, 1]
  piece: [each, 1]
  clove: [each, 1]
  stick: [each, 1]
  stalk: [each, 1]
  sprig: [each, 1]
  leaf: [each, 1]
  rasher: [each, 1]
  slice: [each, 1]
  bunch: [pack, 1]
  small bunch: [pack, 1]
  large bunch: [pack, 1.5]
  pack: [pack, 1]
  small pack: [pack, 1]
  handful: [pack, 0.5]
  small handful: [pack, 0.33]
  large handful: [pack, 0.75]
  good handful: [pack, 0.6]
  pinch: [free, 0]
  good pinch: [free, 0]
  dash: [free, 0]
  drop: [free, 0]
  twist: [free, 0]
  good grinding: [free, 0]

# Costs nothing, whatever the amount: seasoning, and what comes out of a tap.
free:
  - salt
  - sea salt
  - black pepper
  - white pepper
  - pepper
  - water
  # Zest comes off a fruit bought for its juice, or is too little to matter;
  # by name, because `lemon` is the longer keyword than `zest`.
  - lemon zest
  - lime zest
  - orange zest

