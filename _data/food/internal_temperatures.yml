# Internal temperatures: out-at and rested figures, endpoints and carryover.
# food/reference/internal-temperatures.html draws every number from here, and
# _layouts/recipe.html resolves a recipe's `internal_temp_ref` (a dot-path into
# this file, plus `doneness` where relevant) to its "Internal temp" line.
# Four shapes; a consumer checks which keys exist on the node, never the name:
#   endpoint + carryover            whole poultry, fish in general
#   doneness: {level: {out_at, rested}} + carryover   a doneness spectrum
#   tender_at                       slow-cooked cuts: a tenderness threshold
#   target + carryover              cured ham: one figure
# Keys any node may carry:
#   chart_anchor  the section of the temperature charts a recipe links to
#   rest_min      minutes of rest, only where a figure is published; the
#                 timings page falls back where there is none
#   safety_min    the cited safety threshold in °C; every chart shades below it
#                 and labels the line, so it sits on each node that needs it

poultry:
  chicken:
    chart_anchor: poultry
    endpoint: "74–75°C in the thigh"
    endpoint_min: 74
    endpoint_max: 75
    carryover: "1–3°C"
    carryover_min: 1
    carryover_max: 3
  turkey:
    chart_anchor: poultry
    endpoint: "74°C in the thigh, out at 71°C"
    endpoint_min: 74
    endpoint_max: 74
    carryover: "3°C"
    carryover_min: 3
    carryover_max: 3
    note: "Probe the thickest part of the thigh, not touching bone. Also check the breast reaches at least 70°C."
  goose:
    chart_anchor: poultry
    # From this entry's own note ("Rest a full 20–30 minutes regardless").
    rest_min: 20
    endpoint: "74–75°C in the thigh"
    endpoint_min: 74
    endpoint_max: 75
    carryover: "1–3°C"
    carryover_min: 1
    carryover_max: 3
    note: "Rest a full 20–30 minutes regardless — goose is fatty enough that this matters more than the temperature reading does."
  duck:
    chart_anchor: poultry
    endpoint: "74–75°C in the thigh"
    endpoint_min: 74
    endpoint_max: 75
    carryover: "1–3°C"
    carryover_min: 1
    carryover_max: 3
    note: "Cooking a whole duck as one piece means accepting the breast will be more well-done than it would be cooked alone."
  # The rested figures are Helen's targets; each out-at is 2°C below, the
  # middle of this node's carryover.
  duck_breast_separate:
    chart_anchor: poultry
    carryover: "1–3°C"
    carryover_min: 1
    carryover_max: 3
    note: "Only applies when a breast is cooked on its own, off the bone."
    sources: "Helen's own targets. America's Test Kitchen, ThermoWorks and Rouxbe all centre on 54–57°C for pink duck breast, the deep-pink level here."
    doneness:
      very_pink:
        out_at: "50–52°C"
        out_at_min: 50
        out_at_max: 52
        rested: "~52–54°C"
        rested_min: 52
        rested_max: 54
      deep_pink:
        out_at: "52–55°C"
        out_at_min: 52
        out_at_max: 55
        rested: "~54–57°C"
        rested_min: 54
        rested_max: 57
        description: "Fine dining standard"
      blushing_pink:
        out_at: "58°C"
        out_at_min: 58
        out_at_max: 58
        rested: "~60°C"
        rested_min: 60
        rested_max: 60
        description: "Lighter, blushing pink"

beef:
  tender_roast:
    chart_anchor: beef-tender-roasting-cuts
    rest_min: 15
    carryover: "4–6°C"
    carryover_min: 4
    carryover_max: 6
    doneness:
      rare:
        out_at: "48–50°C"
        out_at_min: 48
        out_at_max: 50
        rested: "~52–54°C"
        rested_min: 52
        rested_max: 54
      medium_rare:
        out_at: "52–54°C"
        out_at_min: 52
        out_at_max: 54
        rested: "~56–58°C"
        rested_min: 56
        rested_max: 58
      medium:
        out_at: "58–60°C"
        out_at_min: 58
        out_at_max: 60
        rested: "~62–64°C"
        rested_min: 62
        rested_max: 64
      well_done:
        out_at: "68–70°C"
        out_at_min: 68
        out_at_max: 70
        rested: "~72°C"
        rested_min: 72
        rested_max: 72
  tough_cuts:
    # One slow-cooked section for every animal: the beef, lamb, pork and
    # venison collagen figures all draw in it.
    chart_anchor: slow-cooked-cuts
    passes_through: "60–70°C while still tough"
    passes_through_min: 60
    passes_through_max: 70
    tender_at: "90–96°C"
    tender_at_min: 90
    tender_at_max: 96

pork:
  roasting:
    safety_min: 70
    safety_label: "FSA pork 70°C"
    safety_summary: "FSA wants pork held at 70°C for 2 minutes — held, not passed through as it cools. Only well done clears it."
    chart_anchor: pork
    rest_min: 15
    carryover: "3–4°C"
    carryover_min: 3
    carryover_max: 4
    doneness:
      medium:
        out_at: "60–62°C"
        out_at_min: 60
        out_at_max: 62
        rested: "~63–65°C"
        rested_min: 63
        rested_max: 65
        description: "slightly pink, standard for pork today"
      well_done:
        out_at: "68–70°C"
        out_at_min: 68
        out_at_max: 70
        rested: "~71–72°C"
        rested_min: 71
        rested_max: 72
    safety_note: "FOOD SAFETY: the 'medium' out_at temp above (60–62°C) does not clear the UK FSA's own core-temperature equivalence table for pork specifically (gov.uk: 60°C/45min, 65°C/10min, 70°C/2min, 75°C/30sec, 80°C/6sec — held at that temperature, not passed through via carryover). FSA does not extend beef/lamb's 'pink is fine' reasoning to pork (hepatitis E risk cited). USDA's own standard is more permissive (145°F/62.8°C + 3min rest), but that's a different regulatory bar. The well-done option (68–70°C, clears 70°C at out_at with margin) is the one that unambiguously satisfies FSA guidance. Helen keeps the medium figure: plenty of UK cooking still serves pork pink."
  slow_cooked:
    chart_anchor: slow-cooked-cuts
    tender_at: "90–95°C"
    tender_at_min: 90
    tender_at_max: 95

lamb:
  roasting:
    chart_anchor: lamb
    rest_min: 15
    carryover: "3–4°C"
    carryover_min: 3
    carryover_max: 4
    doneness:
      rare:
        out_at: "50–52°C"
        out_at_min: 50
        out_at_max: 52
        rested: "~54–56°C"
        rested_min: 54
        rested_max: 56
      medium_rare:
        out_at: "54–57°C"
        out_at_min: 54
        out_at_max: 57
        rested: "~58–60°C"
        rested_min: 58
        rested_max: 60
      medium:
        out_at: "60–63°C"
        out_at_min: 60
        out_at_max: 63
        rested: "~63–65°C"
        rested_min: 63
        rested_max: 65
      well_done:
        out_at: "68–70°C"
        out_at_min: 68
        out_at_max: 70
        rested: "~71–72°C"
        rested_min: 71
        rested_max: 72
  slow_cooked:
    chart_anchor: slow-cooked-cuts
    tender_at: "90–95°C"
    tender_at_min: 90
    tender_at_max: 95

ham:
  fresh:
    safety_min: 70
    safety_label: "FSA pork 70°C"
    safety_summary: "A fresh ham is pork leg, so the same FSA figures apply: held at 70°C for 2 minutes, not passed through. Only well done clears it."
    chart_anchor: ham
    carryover: "3–4°C"
    carryover_min: 3
    carryover_max: 4
    doneness:
      hint_of_pink:
        out_at: "60–62°C"
        out_at_min: 60
        out_at_max: 62
        rested: "~63–65°C"
        rested_min: 63
        rested_max: 65
      well_done:
        out_at: "68–70°C"
        out_at_min: 68
        out_at_max: 70
    safety_note: "FOOD SAFETY: same issue as pork's medium doneness above (a fresh ham is pork leg) — 60–62°C doesn't clear the FSA's pork-specific core-temperature equivalence table (gov.uk: 60°C/45min, 65°C/10min, 70°C/2min, 75°C/30sec, 80°C/6sec, held not passed-through). The well-done option (68–70°C) is the one that clears FSA guidance unambiguously. Helen keeps the hint-of-pink figure."
  cured:
    chart_anchor: ham
    carryover: "3–4°C"
    carryover_min: 3
    carryover_max: 4
    target: "70–75°C at the thickest point"
    target_min: 70
    target_max: 75
    caveat: "Cured ham labelling varies a lot (unsmoked vs smoked, wet vs dry-cured, cook-before-eating vs ready-to-eat) — check packaging instructions against the thermometer reading rather than relying on this figure alone."
    sources: "Waitrose targets 75°C; FSA's general reference point is 70°C. Confirmed by Helen."

steak:
  chart_anchor: beef-steak
  carryover: "2–3°C"
  carryover_min: 2
  carryover_max: 3
  doneness:
    blue_rare:
      out_at: "46–49°C"
      out_at_min: 46
      out_at_max: 49
      rested: "~49–50°C"
      rested_min: 49
      rested_max: 50
      description: "Cool red centre, barely warmed"
    rare:
      out_at: "50–52°C"
      out_at_min: 50
      out_at_max: 52
      rested: "~52–54°C"
      rested_min: 52
      rested_max: 54
      description: "Red centre, cool-warm"
    medium_rare:
      out_at: "54–57°C"
      out_at_min: 54
      out_at_max: 57
      rested: "~57–59°C"
      rested_min: 57
      rested_max: 59
      description: "Warm red-pink centre"
    medium:
      out_at: "60–63°C"
      out_at_min: 60
      out_at_max: 63
      rested: "~63–65°C"
      rested_min: 63
      rested_max: 65
      description: "Pink centre"
    medium_well:
      out_at: "65–68°C"
      out_at_min: 65
      out_at_max: 68
      rested: "~68–70°C"
      rested_min: 68
      rested_max: 70
      description: "Slight pink, mostly grey-brown"
    well_done:
      out_at: "70°C+"
      out_at_min: 70
      out_at_max: 70
      # An open-ended figure: "70°C+" has no upper bound, so out_at_max
      # repeats out_at_min and this flag stops a chart drawing a range that
      # ends at 70. Any other "X°C+" needs the same flag.
      out_at_open: true
      rested: "~72–74°C"
      rested_min: 72
      rested_max: 74
      description: "No pink"

# Only salmon and tuna get a doneness spectrum. Every other fish is
# conventionally cooked through, and `general` covers those.
fish:
  general:
    chart_anchor: fish-salmon
    endpoint: "~63°C, opaque and flaking"
    endpoint_min: 63
    endpoint_max: 63
    carryover: "1–2°C"
    carryover_min: 1
    carryover_max: 2
    note: "The FSA/USDA food-safety benchmark for fish generally. Chefs take most fish lower, at 54–60°C (`general_chefs`). Don't leave at 63°C for long, to avoid overcooking."
    sources: "USDA FSIS: 145°F/62.8°C. UK FSA points to ~63°C as the standard fish safety benchmark."
  # Drawn beside `general` on the page's "All" chart, so the gap between the
  # chefs' range and the safety figure shows without words.
  general_chefs:
    chart_anchor: fish-salmon
    endpoint: "54–60°C, the chefs' range"
    endpoint_min: 54
    endpoint_max: 60
    sources: "Helen's own range, the one chefs cook fish to."
  salmon:
    safety_min: 63
    safety_label: "FSA/USDA 63°C"
    safety_summary: "FSA advice is a minimum serving temperature of 63°C."
    chart_anchor: fish-salmon
    carryover: "1–2°C"
    carryover_min: 1
    carryover_max: 2
    doneness:
      rare:
        out_at: "43–49°C"
        out_at_min: 43
        out_at_max: 49
        rested: "~45–50°C"
        rested_min: 45
        rested_max: 50
        description: "Very soft, translucent centre — sushi-grade fish only"
      medium_rare:
        out_at: "49–52°C"
        out_at_min: 49
        out_at_max: 52
        rested: "~50–54°C"
        rested_min: 50
        rested_max: 54
        description: "Slightly opaque, soft, still moist — a common restaurant 'just cooked' salmon"
      medium:
        out_at: "52–57°C"
        out_at_min: 52
        out_at_max: 57
        rested: "~54–59°C"
        rested_min: 54
        rested_max: 59
        description: "Flaky and moist — the most commonly recommended sweet spot"
      medium_well:
        out_at: "57–60°C"
        out_at_min: 57
        out_at_max: 60
        rested: "~59–62°C"
        rested_min: 59
        rested_max: 62
        description: "Firmer, lighter pink centre, less moist"
      well_done:
        out_at: "60–63°C"
        out_at_min: 60
        out_at_max: 63
        rested: "~62–65°C"
        rested_min: 62
        rested_max: 65
        description: "Fully opaque. Clears the FSA/USDA ~63°C recommendation."
    safety_note: "Farmed salmon (most UK supermarket salmon) carries negligible parasite risk per FSA/EFSA and doesn't need pre-freezing to eat rare. Wild-caught salmon is the case where freezing first genuinely matters if serving it under well-done."
  tuna:
    chart_anchor: fish-salmon
    carryover: "Often larger than other fish, given how hot the sear usually is — out_at 5–10°C below the target, more towards the low end for a very hot pan."
    doneness:
      blue_rare:
        out_at: "38–41°C"
        out_at_min: 38
        out_at_max: 41
        description: "Seared exterior only, cool centre — essentially raw within"
      rare:
        out_at: "43–46°C"
        out_at_min: 43
        out_at_max: 46
        description: "Warm red centre — the standard way to serve a seared tuna steak"
      medium_rare:
        out_at: "49–52°C"
        out_at_min: 49
        out_at_max: 52
        description: "Pink centre, still soft"
      well_done:
        out_at: "60–65°C"
        out_at_min: 60
        out_at_max: 65
        description: "Cooked through, dry and firm — not traditional for tuna, but the figure to use for no pink at all"
    safety_note: "Standard for sushi-grade tuna, which is typically previously frozen to kill parasites — a supplier/labelling fact, not something a thermometer confirms. Buy from a source that states it, same as for any fish eaten raw or rare."

# Four cuts in two shapes: loin and haunch carry a doneness spectrum; shoulder,
# braised and shank carry a tenderness threshold. Loin and haunch share their
# out-at figures because sources publish core temperatures for venison, not
# per cut; the carryover differs with the size of the joint, so the rested
# figures diverge. No safety threshold on purpose: a whole cut is treated like
# beef and lamb. The `safety_note` on loin and haunch covers mince.
venison:
  loin:
    # Covers tenderloin and fillet as well as loin: same muscle group, same
    # figures.
    chart_anchor: venison-tender-roasting-cuts
    carryover: "2–3°C"
    carryover_min: 2
    carryover_max: 3
    doneness:
      rare:
        out_at: "48–50°C"
        out_at_min: 48
        out_at_max: 50
        rested: "~50–53°C"
        rested_min: 50
        rested_max: 53
      medium_rare:
        out_at: "52–57°C"
        out_at_min: 52
        out_at_max: 57
        rested: "~54–60°C"
        rested_min: 54
        rested_max: 60
      medium:
        out_at: "58–62°C"
        out_at_min: 58
        out_at_max: 62
        rested: "~60–65°C"
        rested_min: 60
        rested_max: 65
      well_done:
        out_at: "68–70°C"
        out_at_min: 68
        out_at_max: 70
        rested: "~70–73°C"
        rested_min: 70
        rested_max: 73
    safety_note: "Venison is a whole muscle, and FSA treats it the way it treats beef and lamb: the bacteria are on the surface, the sear kills them, and pink in the middle is fine. Mince is the exception. FSA's less-than-thoroughly-cooked guidance covers beef burgers only — its advice for a burger made from any other meat, venison included, is to cook it through. Mincing moves the surface into the middle, so a rare venison burger is a different question from a rare venison loin."
    sources: "medium_rare 52–57°C is the strongest figure here: four independent UK game sources land inside it — Farmison 54°C, Wild Meat Company 'circa 55°C', Eversfield Organic 'at least 56°C', Church Farm Oxford 57°C. medium 58–62°C is Great British Recipes' haunch guide (58°C core rising to ~62°C rested). well_done 68–70°C matches UK game guidance ('70°C if you prefer it well done') and this site's own beef and lamb figures. rare 48–50°C is the WEAKEST of the four — no UK venison source publishes a rare figure at all, and this one sits between Wild Meat Company's 45–47°C 'rare, with resting' and Thomas Joseph Butchery's 50°C beef pull. The 2–3°C carryover is INFERRED from this site's own steak node rather than cited: a 600 g loin cannot carry the 5°C a 1.3 kg haunch does."
  haunch:
    chart_anchor: venison-tender-roasting-cuts
    # What the 4–6°C carryover of a big lean joint implies.
    rest_min: 20
    carryover: "4–6°C"
    carryover_min: 4
    carryover_max: 6
    doneness:
      rare:
        out_at: "48–50°C"
        out_at_min: 48
        out_at_max: 50
        rested: "~52–56°C"
        rested_min: 52
        rested_max: 56
      medium_rare:
        out_at: "52–57°C"
        out_at_min: 52
        out_at_max: 57
        rested: "~56–63°C"
        rested_min: 56
        rested_max: 63
      medium:
        out_at: "58–62°C"
        out_at_min: 58
        out_at_max: 62
        rested: "~62–68°C"
        rested_min: 62
        rested_max: 68
      well_done:
        out_at: "68–70°C"
        out_at_min: 68
        out_at_max: 70
        rested: "~72–76°C"
        rested_min: 72
        rested_max: 76
    # The same note as loin's, on purpose: a chart resolves one node at a
    # time, so a note that exists only on loin is invisible to a haunch recipe.
    safety_note: "Venison is a whole muscle, and FSA treats it the way it treats beef and lamb: the bacteria are on the surface, the sear kills them, and pink in the middle is fine. Mince is the exception. FSA's less-than-thoroughly-cooked guidance covers beef burgers only — its advice for a burger made from any other meat, venison included, is to cook it through. Mincing moves the surface into the middle, so a rare venison burger is a different question from a rare venison loin."
    sources: "The out-at figures are venison.loin's, deliberately — UK sources publish core temperatures for venison generally, not per cut; see there for the four that agree on medium rare, and for how little the rare figure rests on. What is haunch's own is the carryover: 4–6°C comes from Great British Recipes' haunch guide, which takes a haunch out at 58°C and has it resting to ~62°C, and every rested figure above is that carryover applied to the shared out-at range."
  shoulder:
    # Shoulder and neck both: the same braising job, and no source separates
    # them.
    chart_anchor: slow-cooked-cuts
    tender_at: "90–95°C"
    tender_at_min: 90
    tender_at_max: 95
    sources: "90–95°C is this site's own collagen figure (see pork.slow_cooked and lamb.slow_cooked), applied to venison by chemistry rather than by citation: NO UK venison source publishes one. Every shoulder and neck recipe found ends 'until it falls off the bone' with no number in it at all. Collagen doesn't know which animal it came from, so the house figure is the honest answer — but it is an inference, and recorded as one."
  braised:
    # Any venison cut braised to tenderness: keyed by method, not cut, as
    # pork.slow_cooked and lamb.slow_cooked are. A braised haunch points here,
    # because venison.haunch is a roasting spectrum and a braise never stops at
    # a doneness.
    chart_anchor: slow-cooked-cuts
    tender_at: "90–95°C"
    tender_at_min: 90
    tender_at_max: 95
    sources: "The house collagen figure again — see venison.shoulder for why 90–95°C is an inference from chemistry rather than a citation, and treat it with the same caution. Nothing about braising changes that reasoning; it is the same connective tissue giving way at the same temperature."
  shank:
    # Same figure and basis as shoulder; its own node so that a recipe naming
    # a shank can say so.
    chart_anchor: slow-cooked-cuts
    tender_at: "90–95°C"
    tender_at_min: 90
    tender_at_max: 95
