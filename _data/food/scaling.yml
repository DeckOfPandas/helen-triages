# =============================================================================
# HOW THE RECIPE PAGE'S PORTION SCALER TREATS A MEASURE TAKEN BY HAND -- #1125
#
# Helen, raising it: "Currently some recipes scale 1 handful to e.g. 1.17
# handfuls, which is obvious nonsense." And, 2026-10-04, asked what should
# happen instead: 'If a recipe calls for "a handful of parsley", three orders
# of that recipe should call for "3 handfuls of parsley".' And then: "Handfuls
# can scale in half steps."
#
# _layouts/recipe.html emits this list onto the scaler control as
# `data-half-step-measures`, assets/js/recipe-scale.js hands it to
# assets/js/food-scale.js, and that is the whole route: adding a measure is a
# line here and no code.
# =============================================================================

# -----------------------------------------------------------------------------
# Half-step measures -- a measure taken by HAND OR EYE. It SCALES, but only to
# a figure a person could act on: the nearest half, never less than a half.
#
#     1 handful   x3    ->  3 handfuls
#     1 handful   x1.5  ->  1½ handfuls
#     1 handful   x7/6  ->  1 handful        (not 1.17)
#     1 handful   x2/3  ->  ½ handfuls
#
# THE ROUNDING IS NOT HERE. It is `halfStep` in assets/js/food-scale.js, one
# function, so that changing it is one line. This file only says WHICH
# measures get it.
#
# HER SENTENCE NAMES HANDFULS; the rule is applied to the whole list below as
# one. A measure she wants treated differently comes out of the list, and
# then scales linearly like a pat.
#
# The word is matched whole, anywhere after the number, singular or plural
# (`s` or `es`): `1 handful`, `2 handfuls`, `1 small handful`,
# `1 large handful each` and `1 pinch` are all caught, and the plural is
# written back to match the new number.
#
# SINGULAR, LOWERCASE, ONE WORD EACH.
#
# THE SAME WORDS SCALE A MEASURE WRITTEN WITH NO NUMBER. A recipe that wrote
# it into `item:` -- "a handful of fresh parsley", "pinch of salt", "A large
# handful of fresh coriander, to serve" -- has `a`, `an`, `one` or nothing
# read as ONE, and scales in place: "3 handfuls of fresh parsley". "a few",
# "some" and "a couple of" are not numbers; those lines stay as written and
# are named on the "(Not scaled: ...)" line, with the measure phrase cut from
# the name: "a few dashes of Tabasco sauce to taste" is listed as "Tabasco
# sauce", which is what Helen's own example of the line reads like.
#
# EVERY WORD HERE WAS IN THE COLLECTION WHEN IT WAS ADDED (2026-10-04, counted
# over _food_recipes/ and _food_drafts/):
#
#   handful   15 numbered amounts in 13 files, and the opening of 51 items
#   pinch      4 numbered amounts in  3 files, and the opening of 37 items
#   splash     1 numbered amount ("1 splash" of red wine vinegar), 2 items
#   knob       1 numbered amount ("1 knob" of salted butter), 4 items
#   dash       0 numbered; it opens 2 items, one of them Helen's own example
#              ("a few dashes of Tabasco sauce to taste")
#
# WHAT IS ABSENT IS RULED, NOT FORGOTTEN -- Helen, 2026-10-04, asked about
# each. A COUNT of a thing you can pick up scales like any other number: "Yes,
# 4 sprigs double is 8, and so on." So `sprig` (3 amounts), `bunch` (5),
# `drop` (1, "3–4 drops" of vanilla), `twist` (1, "5 twists" of black pepper)
# and `lot` (2, batches of another recipe) are not here. They can print a
# fraction (5 twists at two thirds is 3⅓ twists); that is known and reported,
# not an oversight.
#
# `pat` WAS HERE FOR A FEW HOURS AND CAME OUT ON HER WORD: '"pat" is a correct
# term, and should be scaled linearly as "pats"'. "2 large pats" doubled is
# "4 large pats". (2 amounts in 2 published recipes.)
#
# `large`, `medium` and `small` MUST NEVER BE ADDED. Helen, on #1005: "Things
# like '2 large' can scale, surely" -- "2 large eggs" doubled is "4 large".
# They are sizes of a counted thing, and 240 amounts use them.
half_step_measures:
  - handful
  - pinch
  - dash
  - splash
  - knob
