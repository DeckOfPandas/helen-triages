# =============================================================================
# WHAT THE RECIPE PAGE'S PORTION SCALER LEAVES ALONE -- GitHub issue #1125
#
# Helen: "find a way to parameterise ingredient lines that won't scale ... a
# handful of fresh parsley ... The scaler line should say: 'Not scaled: fresh
# parsley'." And: "Currently some recipes scale 1 handful to e.g. 1.17
# handfuls, which is obvious nonsense."
#
# _layouts/recipe.html emits this list onto the scaler control as
# `data-unscaled`, assets/js/recipe-scale.js hands it to
# assets/js/food-scale.js, and that is the whole route: adding a measure is a
# line here and no code.
# =============================================================================

# -----------------------------------------------------------------------------
# Unscaled measures -- a measure taken by HAND OR EYE, which has no fraction.
#
# An amount whose words include one of these stays exactly as written whatever
# the portions box says, and its ingredient is named on the "(Not scaled: ...)"
# line under the control. `1 handful`, `2 handfuls`, `1 small handful`,
# `1 large handful each` and `1 pinch` are all caught: the word is matched
# whole, anywhere after the number, singular or plural (`s` or `es`).
#
# SINGULAR, LOWERCASE, ONE WORD EACH.
#
# THE SAME WORDS ALSO CLEAN THE NAME on that line. A recipe that wrote the
# measure into `item:` instead -- "a few dashes of Tabasco sauce to taste",
# "A large handful of fresh coriander, to serve" -- is listed as "Tabasco
# sauce" and "fresh coriander", which is what Helen's own example of the line
# reads like.
#
# EVERY WORD HERE WAS IN THE COLLECTION WHEN IT WAS ADDED (2026-10-04, counted
# over _food_recipes/ and _food_drafts/, amounts that open with a number):
#
#   handful   15 amounts in 13 files   "1 handful", "2 handfuls",
#                                      "1 small handful", "1 large handful each"
#   pinch      4 amounts in  3 files   "1 pinch"
#   splash     1                       "1 splash" of red wine vinegar
#   knob       1                       "1 knob" of salted butter
#   pat        2 amounts in  2 files   "2 pats", "2 large pats" of salted butter
#   dash       0 with a number; it is here for Helen's own example, which the
#              collection writes inside `item:` ("a few dashes of Tabasco ...")
#
# WHAT IS DELIBERATELY ABSENT, because each is a COUNT of a thing you can pick
# up rather than a measure by eye, and whether a count should scale is a
# different question from whether a handful should: `sprig` (3), `bunch` (5),
# `drop` (1, "3–4 drops" of vanilla), `twist` (1, "5 twists" of black pepper),
# `lot` (2, batches of another recipe). They scale today as they always have.
# Adding one is one line below; it is Helen's call, not a tidy-up.
#
# `large`, `medium` and `small` MUST NEVER BE ADDED. Helen, on #1005: "Things
# like '2 large' can scale, surely" -- "2 large eggs" doubled is "4 large".
# They are sizes of a counted thing, and 240 amounts use them.
unscaled_measures:
  - handful
  - pinch
  - dash
  - splash
  - knob
  - pat
