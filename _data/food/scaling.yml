# How the food scalers treat an amount: the recipe page's portion scaler, the
# index's shopping list, the yield reader and the half-recipe judge. Vocabulary
# only; every rule is in the code named beside each list. DECISIONS §8.2.
#
# The three step lists, as one rule:
#   quarter_step_measures  handful, sprig, bunch: the nearest quarter
#   half_step_measures     pinch, dash, splash, knob: the nearest half
#   half_step_counts       drop, twist, lot, pat: the nearest half
# The recipe page prints the stepped figure. The shopping list buys the next
# whole one and quotes the recipes' figure in brackets, stepped the same way.
# A word is on one list only. One lowercase word each, singular; the scalers
# match it anywhere after the number, plural included, and a measure written
# with no number ("a handful of parsley") counts as one.
# `large`, `medium` and `small` must never be added to a step list: they are
# sizes of a counted thing, and "2 large" eggs doubled is "4 large".

# By-eye measures stepped in halves, never less than a half (`halfStep` in
# assets/js/food-scale.js). This list is also what the half-recipe judge is
# handed as "a by-eye measure, which always halves", so a count never goes here.
half_step_measures:
  - pinch
  - dash
  - splash
  - knob

# Counts stepped in halves. A list apart from `half_step_measures` because the
# half-recipe judge must go on treating these as counts: an odd one, "1 lot" of
# another recipe included, refuses the half recipe. _layouts/recipe.html and
# food/index.html join the two lists for the scalers.
half_step_counts:
  - drop
  - twist
  - lot
  - pat

# Stepped in quarters, never less than a quarter (`quarterStep` in
# assets/js/food-scale.js).
quarter_step_measures:
  - handful
  - sprig
  - bunch

# The words _plugins/food_yield.rb needs to read a `makes:` line, so the scaler
# on a `makes:` recipe counts the thing made and never portions of it (#1286).
yields:
  # A word in front of the number that says it is not exact. Kept on the page,
  # as written, in front of the box ("about 300 ml" -> "about 600 ml").
  approx_words:
    - about
    - approx.
    - approx
    - approximately
    - around
    - estimated
    - roughly

  # A count written as a word, read only at the start of the line. Not `a` or
  # `an`: "a batch" is prose.
  number_words:
    one: 1
    two: 2
    three: 3
    four: 4
    five: 5
    six: 6
    seven: 7
    eight: 8
    nine: 9
    ten: 10
    eleven: 11
    twelve: 12

  # A yield measured rather than counted. It scales by whole orders of the
  # recipe: 950 ml becomes 1900 ml.
  measures:
    - ml
    - l
    - litre
    - litres
    - g
    - kg

  # A word that is itself the thing counted: "1 dozen" doubled is "2 dozen",
  # never 24.
  group_words:
    - dozen

  # A thing that holds what the recipe makes, for the shopping list's row only
  # (`rowWords` in assets/js/filters.js). A container comes before the title
  # with "of" ("2 jars of peanut sauce"); any other thing follows the title.
  # Singular; the last word of the yield is what is looked up.
  container_words:
    - jar
    - tin
    - batch
    - bottle
    - tub
    - pot
    - tray
    - dish
    - loaf

# The words _plugins/food_half_recipe.rb judges by. A `makes:` recipe is offered
# x½ only where every line halves to a figure a person could act on; one line
# that will not halve refuses the whole recipe. An amount in a unit on none of
# these lists is a count of things and halves only if it is even (#1286).
half_recipe:
  # By-eye measures that are not in `half_step_measures` and must still halve
  # always; the judge adds this list to that one itself. `sprig` and `bunch`
  # are deliberately absent: they are counts to the judge.
  by_eye_also:
    - handful
  # A yield of one of these halves below one: a batch is an amount of mixture,
  # not an object, so "½ batch" is a real thing to make where "½ cake" is not.
  # Every ingredient line must still halve (DECISIONS §8.2).
  halvable_yields:
    - batch
  # Always halves, whatever the number.
  divisible_units:
    - g
    - kg
    - ml
    - l
    - cl
    - litre
    - litres
    - cm
    - mm
    - inch
    - inches

  # Halves when the amount is a multiple of a quarter: an eighth is the
  # smallest fraction the page has a glyph for (¼ tsp -> ⅛ tsp).
  quarter_units:
    - tsp
    - tbsp
    - oz
    - lb
    - pint
    - pints

  # Halves when the amount is a multiple of a half: a cup goes down to a
  # quarter and no further, so the page never prints "⅞ cups".
  half_units:
    - cup
    - cups

  # A counted ingredient of which half is a real thing, so an odd count is
  # fine. Every word here lets a recipe through, and the judge is meant to
  # refuse when unsure. `leaves` is listed beside `leaf` because the judge only
  # adds `s` or `es`. Ruled out: `egg`, `sprig`, `bunch`, `can`, `pack`, `lot`.
  # About ingredients only: a yield of "1 jar" still does not halve.
  halvable:
    - lemon
    - lime
    - orange
    - onion
    - shallot
    - garlic
    - clove
    - chilli
    - cinnamon stick
    - vanilla pod
    - leaf
    - leaves
    - star anise
    - nutmeg
    - stock cube
    - sachet
    - tin
    - jar

# Nouns the index's shopping list may make plural or singular so a counted
# row's label agrees with its number ("2 lemons", #1297). A spelling some
# recipe wrote is used first; a made form only for a noun here, because a
# general plural rule gets "sprigs thyme" and "goose" wrong.
# The last word of an ingredient's name, singular, lowercase, with a regular
# plural (`s`, or `es` after a sibilant). Not `leaf`, `tomato`, `potato`,
# `chilli`, `goose`, or anything sold by weight.
count_nouns:
  - lemon
  - lime
  - orange
  - grapefruit
  - clementine
  - apple
  - pear
  - banana
  - peach
  - plum
  - pineapple
  - pomegranate
  - watermelon
  - avocado
  - onion
  - shallot
  - carrot
  - leek
  - courgette
  - aubergine
  - cucumber
  - pepper
  - beetroot
  - cauliflower
  - swede
  - cabbage
  - lettuce
  - egg
  - yolk
  - chicken
  - duck
  - breast
  - thigh
  - leg
  - fillet
  - steak
  - chop
  - sausage
  - bun
  - croissant
  - flatbread
  - teabag
  - sprig
  - stick
  - stalk
  - pod
  - cube
  - clove
  - bulb
  - wedge

# One fruit, two parts, on the index's shopping list (#1297): "zest of 1 lemon"
# and "juice of 1 lemon" buy one lemon. _plugins/food_shopping.rb marks a line
# with the part it uses; assets/js/food-shopping-list.js merges. Both written
# forms are read:
#   item: "juice of 1 lemon"                      the count is in the item
#   amount: "1", item: "lemon, zested and juiced" the part is after the comma
# Within one recipe different parts of a fruit take the larger count; the same
# part twice adds up, and so do two recipes.
whole_fruit:
  # Matched as the last word of the ingredient's name, singular or plural:
  # "unwaxed lemons" is a lemon, "lemon juice" is not.
  fruits:
    - lemon
    - lime
    - orange
    - grapefruit
    - clementine
  # The words for each part, as a recipe writes them.
  parts:
    juice:
      - juice
      - juiced
    zest:
      - zest
      - zested
      - rind
  # What may sit in front of the part in the item's own text ("finely grated
  # zest of 1 lemon"), and between the count and the fruit ("1 small orange").
  preparations:
    - finely
    - freshly
    - coarsely
    - grated
    - squeezed
  sizes:
    - small
    - medium
    - large
    - big
    - juicy
    - unwaxed
  # A line with no amount whose note opens this way points at another line of
  # the same ingredient and buys nothing more: "olive oil, the rest of the oil
  # above". Not every no-amount line: "olive oil, to drizzle" is extra, and
  # stays counted.
  pointers:
    - the rest of
    - the remainder of
    - the remaining
