# =============================================================================
# HOW THE RECIPE PAGE'S PORTION SCALER TREATS A MEASURE TAKEN BY HAND -- #1125
#
# Helen, raising it: "Currently some recipes scale 1 handful to e.g. 1.17
# handfuls, which is obvious nonsense." And, 2026-10-04, asked what should
# happen instead: 'If a recipe calls for "a handful of parsley", three orders
# of that recipe should call for "3 handfuls of parsley".' And then: "Handfuls
# can scale in half steps."
#
# _layouts/recipe.html emits this list onto the scaler control as
# `data-half-step-measures`, assets/js/recipe-scale.js hands it to
# assets/js/food-scale.js, and that is the whole route: adding a measure is a
# line here and no code.
# =============================================================================

# -----------------------------------------------------------------------------
# Half-step measures -- a measure taken by HAND OR EYE. It SCALES, but only to
# a figure a person could act on: the nearest half, never less than a half.
#
#     1 handful   x3    ->  3 handfuls
#     1 handful   x1.5  ->  1½ handfuls
#     1 handful   x7/6  ->  1 handful        (not 1.17)
#     1 handful   x2/3  ->  ½ handfuls
#
# THE ROUNDING IS NOT HERE. It is `halfStep` in assets/js/food-scale.js, one
# function, so that changing it is one line. This file only says WHICH
# measures get it.
#
# HER SENTENCE NAMES HANDFULS; the rule is applied to the whole list below as
# one. A measure she wants treated differently comes out of the list, and
# then scales linearly like a pat.
#
# The word is matched whole, anywhere after the number, singular or plural
# (`s` or `es`): `1 handful`, `2 handfuls`, `1 small handful`,
# `1 large handful each` and `1 pinch` are all caught, and the plural is
# written back to match the new number.
#
# SINGULAR, LOWERCASE, ONE WORD EACH.
#
# THE SAME WORDS SCALE A MEASURE WRITTEN WITH NO NUMBER. A recipe that wrote
# it into `item:` -- "a handful of fresh parsley", "pinch of salt", "A large
# handful of fresh coriander, to serve" -- has `a`, `an`, `one` or nothing
# read as ONE, and scales in place: "3 handfuls of fresh parsley". "a few",
# "some" and "a couple of" are not numbers; those lines stay as written and
# are named on the "(Not scaled: ...)" line, with the measure phrase cut from
# the name: "a few dashes of Tabasco sauce to taste" is listed as "Tabasco
# sauce", which is what Helen's own example of the line reads like.
#
# EVERY WORD HERE WAS IN THE COLLECTION WHEN IT WAS ADDED (2026-10-04, counted
# over _food_recipes/ and _food_drafts/):
#
#   handful   15 numbered amounts in 13 files, and the opening of 51 items
#   pinch      4 numbered amounts in  3 files, and the opening of 37 items
#   splash     1 numbered amount ("1 splash" of red wine vinegar), 2 items
#   knob       1 numbered amount ("1 knob" of salted butter), 4 items
#   dash       0 numbered; it opens 2 items, one of them Helen's own example
#              ("a few dashes of Tabasco sauce to taste")
#
# WHAT IS ABSENT IS RULED, NOT FORGOTTEN -- Helen, 2026-10-04, asked about
# each. A COUNT of a thing you can pick up scales like any other number: "Yes,
# 4 sprigs double is 8, and so on." So `sprig` (3 amounts), `bunch` (5),
# `drop` (1, "3–4 drops" of vanilla), `twist` (1, "5 twists" of black pepper)
# and `lot` (2, batches of another recipe) are not here. They can print a
# fraction (5 twists at two thirds is 3⅓ twists); that is known and reported,
# not an oversight.
#
# `pat` WAS HERE FOR A FEW HOURS AND CAME OUT ON HER WORD: '"pat" is a correct
# term, and should be scaled linearly as "pats"'. "2 large pats" doubled is
# "4 large pats". (2 amounts in 2 published recipes.)
#
# `large`, `medium` and `small` MUST NEVER BE ADDED. Helen, on #1005: "Things
# like '2 large' can scale, surely" -- "2 large eggs" doubled is "4 large".
# They are sizes of a counted thing, and 240 amounts use them.
half_step_measures:
  - handful
  - pinch
  - dash
  - splash
  - knob

# -----------------------------------------------------------------------------
# Yields -- the words _plugins/food_yield.rb needs to read a `makes:` line, so
# that the scaler on a `makes:` recipe counts THE THING MADE. GitHub issue
# #1286, Helen, 2026-10-04: "Never tell me how many cookies are in a portion!!!"
#
# The plugin's header has the rules and her words for each. These four lists
# are everything in it that is vocabulary rather than rule.
# -----------------------------------------------------------------------------
yields:
  # A word in front of the number that says it is not exact. Kept on the page,
  # as written, in front of the box ("about 300 ml" -> "about 600 ml"). Every
  # one of these opens a real `makes:` line except `approximately`, `roughly`
  # and bare `approx`, which are here so the next recipe does not fall through
  # to the portions box for the sake of a spelling.
  approx_words:
    - about
    - approx.
    - approx
    - approximately
    - around
    - estimated
    - roughly

  # A count written as a word. ONLY AT THE START of the line: "Plenty for two
  # people" and "Enough for one normal lemon meringue pie" are not counts, and
  # the 8 of "one 8-inch cake" is never read at all. `one` is the only one the
  # collection writes today (7 lines: six cakes and a pie, one tin); the rest
  # are here because "two 8-inch cakes" is the very next thing anyone would
  # write. NOT `a` or `an`: "a batch" is prose, and nothing writes it.
  number_words:
    one: 1
    two: 2
    three: 3
    four: 4
    five: 5
    six: 6
    seven: 7
    eight: 8
    nine: 9
    ten: 10
    eleven: 11
    twelve: 12

  # A yield measured rather than counted. It scales by WHOLE ORDERS of the
  # recipe: "950 ml for one order of a recipe becomes 1900 ml for 2". As
  # written in the collection: ml (15 lines), g (3), litre (3), kg (1).
  measures:
    - ml
    - l
    - litre
    - litres
    - g
    - kg

  # A word that is itself the thing counted and does not change with the
  # number: '"1 dozen" doubled can be "two dozen"'. The count stays in dozens
  # and is never turned into 12.
  group_words:
    - dozen

# -----------------------------------------------------------------------------
# Half a recipe -- the words _plugins/food_half_recipe.rb judges by. A `makes:`
# recipe steps x1, x2, x3; it is offered ONE step below, x½, only where
# halving gives figures a person could act on. Helen, #1286: "Half a recipe
# would be great where the numbers aren't insane! Can we judge that?"
#
# The plugin's header has the rule. One ingredient that will not halve refuses
# the whole recipe; an amount in a unit on NONE of these lists is a count of
# things and halves only if it is even.
# -----------------------------------------------------------------------------
half_recipe:
  # Always halves, whatever the number: the scaler already prints 31 g.
  divisible_units:
    - g
    - kg
    - ml
    - l
    - cl
    - litre
    - litres
    - cm
    - mm
    - inch
    - inches

  # Halves when the amount is a multiple of a QUARTER, because an eighth is
  # the smallest fraction the page has a glyph for (¼ tsp -> ⅛ tsp).
  quarter_units:
    - tsp
    - tbsp
    - oz
    - lb
    - pint
    - pints

  # Halves when the amount is a multiple of a HALF: a cup goes down to a
  # quarter and no further. Helen saw "⅞ cups whole milk" on half a batch of
  # waffles (1¾ cups, halved) and took the half step off them: "2-3 waffles
  # isn't enough!!!!" Nobody measures seven eighths of a cup.
  half_units:
    - cup
    - cups

  # A counted thing of which HALF IS A REAL THING, so an odd count is fine:
  # half a lemon, half an onion. STARTED SMALL ON PURPOSE -- every word here
  # lets a recipe through, and the judge is meant to refuse when unsure.
  #
  # IN: fruit and alliums you cut anyway, the two sticks you snap, and the
  # seven Helen added on 2026-10-04: "In: leaf, star anise, nutmeg, stock
  # cube, sachet, tin, jar. Rest correct." (`leaves` is `leaf` written twice:
  # the judge adds `s` or `es` to a word and that does not reach it.)
  #
  # OUT, AND RULED: `egg` (and so yolk, white) -- "Eggs: not halvable for food
  # recipes." Also out, as she left them: `sprig`, `bunch`, `can`, `pack`,
  # and a `lot` of another recipe ("Neither mince pies nor sweet cream base
  # halve").
  #
  # THIS LIST IS ABOUT INGREDIENTS. A YIELD of "1 jar" still does not halve:
  # that is the yield rule, which asks for at least one of the thing made.
  halvable:
    - lemon
    - lime
    - orange
    - onion
    - shallot
    - garlic
    - clove
    - chilli
    - cinnamon stick
    - vanilla pod
    - leaf
    - leaves
    - star anise
    - nutmeg
    - stock cube
    - sachet
    - tin
    - jar
