# Pantry staples: ingredients that are never the point of a dish. The index
# sinks them to the end of a recipe's ingredient line; `main_ingredients` in
# the front matter is not reordered. Anything that is sometimes the hero
# (carrots, cream, ginger, lemon, cheese) stays out.
# Matching is exact and lowercase: "onion" is demoted, "red onions" is not.
# A bare list, not a `pantry:` key: food/index.html reads
# `site.data.food.pantry`, and scripts/related_recipes.py and
# scripts/derive_main_ingredients.py read the file as a list too.

# Fats
- butter
- salted butter
- unsalted butter
- olive oil
- extra-virgin olive oil
- vegetable oil
- sunflower oil
- groundnut oil

# Flours and raising agents
- plain flour
- self-raising flour
- cornflour
- baking powder
- bicarbonate of soda

# Sugars
- sugar
- caster sugar
- golden caster sugar
- icing sugar
- brown sugar
- dark brown soft sugar
- muscovado sugar

# Dairy basics
- milk
- eggs
- egg
- egg whites
- egg yolks

# Aromatic base — the mirepoix you always have
- garlic
- onion
- onions
- shallots

# Liquids you keep in a cupboard
- chicken stock
- vegetable stock
- beef stock
- water

# Seasoning
- salt
- sea salt
