# The shop prices behind every researched row of costs.yml (#1458, MANUAL
# §8.2). A costs.yml unit written as a food's name here, `kg: "goose"`, is
# priced from that food's list in that unit at build: the middle 50% of 6+
# prices (inclusive quartiles), the whole range of 3-5, both of 2, the one
# price twice. Confidence: high for 4+ prices with the dearest at most twice
# the cheapest, medium for 2+, low for one price or a row marked `thin`.
#
# Each price is "GBP-per-unit shop and pack". Shelf prices, never offers; FD
# is Farm Direct. Add, correct or remove a price and move `checked`; costs.yml
# follows on the next build. `scripts/food_price_table.py` writes the table.

