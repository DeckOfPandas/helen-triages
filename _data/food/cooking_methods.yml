# Cooking methods: oven settings, timings and coverings. Edited by hand, and
# the source of truth: food/reference/cooking-methods-and-timings.html renders
# from it. scripts/build_cooking_methods.py and build_cooking_methods_prose.py
# are one-off migration tools pinned to an old commit; running either
# overwrites the hand edits here. The sourcing notes for these figures are in
# food/reference/cooking-methods-prose-archive.html (#400). DECISIONS §14.
#
# `shape` says what kind of thing a timing is, so the calculator never
# averages one it cannot multiply:
#   rate         rate_min/rate_max minutes per kg, plus optional flat_add
#   total        a fixed time that does not scale with weight
#   staged       two rates in sequence (simmer, then roast)
#   by_doneness  a different rate per doneness level
#   relative     defined against another row; no figure of its own
#   disputed     sources disagree; refuse, never average

# Steak, fish and shellfish are absent on purpose: they carry no timings.
# `internal_temp_ref` is a dot-path into internal_temperatures.yml, so a
# schedule can finish on a thermometer figure. `label` is the dropdown line
# and the heading the calculator writes over the methods. `oven` is a list of
# short stage lines, one per oven setting in the order they happen ("220°C fan
# for 20 min", then "180°C fan for the rest"); a relative row says what it
# follows and what it adds. test_every_oven_temperature_says_fan reads the
# lines joined.
chicken:
  label: Chicken (whole)
  internal_temp_ref: poultry.chicken
  chart_anchor: poultry
  methods:
  - id: standard_constant_roast
    name: Standard constant roast
    shape: rate
    timing: ~40 min/kg + 20 min
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Reliable default
    oven:
    - 180°C fan
    oven_basis: stated
    rate_min: 40
    rate_max: 40
    flat_add: 20
    notes: Simple, reliable; skin browns gradually
  - id: high_heat_start_then_reduce
    name: High-heat start, then reduce
    shape: rate
    timing: ~40 min/kg + 20 min total
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step down
    outcome: Crisp skin, moist meat
    oven:
    - 220°C fan for 20 min
    - 180°C fan for the rest
    oven_basis: inferred
    rate_min: 40
    rate_max: 40
    flat_add: 20
    notes: Kickstarts crisp skin, then finishes gently so it doesn't dry out
  - id: low_and_slow_high_heat_blast_at_end
    name: Low and slow, high-heat blast at end
    shape: rate
    timing: ~90–105 min/kg total
    group: Whole bird, roasting methods
    covering: Uncovered until final blast
    temp_change: One step up near the end
    outcome: Juiciest meat
    oven:
    - 150–160°C fan for most of cook
    - 220°C fan for last 15–20 min
    oven_basis: inferred
    rate_min: 90
    rate_max: 105
    notes: Very juicy meat; skin crisps at the very end rather than throughout
  - id: foil_tented_roast
    name: Foil-tented roast
    shape: rate
    timing: ~40 min/kg + 20 min
    group: Whole bird, roasting methods
    covering: Foil loosely over breast for first ⅔ of cook, removed for last 20–30 min
    temp_change: None
    outcome: Protects the breast
    oven:
    - 190–200°C fan
    oven_basis: inferred
    rate_min: 40
    rate_max: 40
    flat_add: 20
    notes: Protects breast from drying/over-browning while legs catch up
  - id: fully_foil_wrapped_steam_roast
    name: Fully foil-wrapped (steam-roast)
    shape: rate
    timing: ~40 min/kg + 20 min, foil removed for last 20–25 min
    group: Whole bird, roasting methods
    covering: Fully wrapped, then opened at the end
    temp_change: None
    outcome: Very moist, pale skin
    oven:
    - 180°C fan
    oven_basis: inferred
    rate_min: 40
    rate_max: 40
    flat_add: 20
    notes: Very moist, almost pot-roast texture; skin won't crisp until unwrapped
  - id: roasting_bag
    name: Roasting bag
    shape: rate
    timing: ~33–44 min/kg (bags cook slightly faster than open roasting, but not as fast as this used to claim)
    group: Whole bird, roasting methods
    covering: Sealed in bag throughout, slit open for last 10–15 min if you want colour
    temp_change: None
    outcome: Fast, least mess
    oven:
    - 190–200°C fan, or the bag's max
    oven_basis: inferred
    rate_min: 33
    rate_max: 44
    notes: Fast, very moist, minimal oven mess; skin stays pale unless opened at the end
  - id: spatchcocked_flattened
    name: Spatchcocked (flattened)
    shape: total
    timing: ~40 min total for a typical 1.5–2 kg bird
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Fastest, most even
    oven:
    - 220°C fan
    oven_basis: inferred
    total_min: 40
    total_max: 40
    notes: Much faster and more even than trussed roasting; not "whole" in shape but often grouped with whole-bird methods
turkey:
  label: Turkey (whole)
  internal_temp_ref: poultry.turkey
  chart_anchor: poultry
  methods:
  - id: standard_constant_roast
    name: Standard constant roast
    shape: rate
    timing: ~35–40 min/kg unstuffed
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Reliable default
    oven:
    - 160–170°C fan
    oven_basis: stated
    weight_range: 4–8 kg
    weight_min: 4
    weight_max: 8
    rate_min: 35
    rate_max: 40
  - id: high_heat_start_then_reduce
    name: High-heat start, then reduce
    shape: rate
    timing: ~35–46 min/kg total after the initial blast
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step down
    outcome: Browned skin, gentle finish
    oven:
    - 220°C fan for 20–30 min
    - 160–170°C fan for the rest
    oven_basis: inferred
    weight_range: 4–8 kg
    weight_min: 4
    weight_max: 8
    rate_min: 35
    rate_max: 46
    notes: Browns skin early, then finishes gently
  - id: foil_tented_throughout_removed_at_end
    name: Foil-tented throughout, removed at end
    shape: rate
    timing: ~30–35 min/kg (estimated by analogy to the standard rate above — not separately sourced)
    group: Whole bird, roasting methods
    covering: Loosely tented whole time, foil off for last 30–45 min
    temp_change: None
    outcome: For the biggest birds
    oven:
    - 160–180°C fan
    oven_basis: inferred
    weight_range: 4–10 kg
    weight_min: 4
    weight_max: 10
    rate_min: 30
    rate_max: 35
    notes: Standard for larger birds; essential above ~6 kg
  - id: fully_wrapped_steam_roast
    name: Fully wrapped/steam-roast
    shape: rate
    timing: ~25–30 min/kg, unwrapped for last 30–40 min (estimated — not separately sourced)
    group: Whole bird, roasting methods
    covering: Fully wrapped, opened at end
    temp_change: None
    outcome: Very moist, pale skin
    oven:
    - 160–180°C fan
    oven_basis: inferred
    weight_range: 4–8 kg
    weight_min: 4
    weight_max: 8
    rate_min: 25
    rate_max: 30
    notes: Very moist; skin only crisps once unwrapped
  - id: roasting_bag
    name: Roasting bag
    shape: rate
    timing: ~20–24 min/kg
    group: Whole bird, roasting methods
    covering: Sealed, slit open last 20–30 min for colour
    temp_change: None
    outcome: Fastest enclosed method
    oven:
    - 180–190°C fan, or the bag's max
    oven_basis: inferred
    weight_range: 4–8 kg
    weight_min: 4
    weight_max: 8
    rate_min: 20
    rate_max: 24
    notes: Faster and more even than open roasting — but this is the fastest of the enclosed methods, not the fastest thing on the page
  - id: low_and_slow_blast_at_end
    name: Low and slow, blast at end
    shape: rate
    timing: ~45–55 min/kg total (estimated by analogy — chicken's low-and-slow row undershot by a similar margin; not directly sourced for turkey at this exact temperature)
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step up at the end
    outcome: Most tender, long haul
    oven:
    - 120–140°C fan for most of cook
    - 220°C fan for last 20–30 min
    oven_basis: inferred
    weight_range: 4–7 kg
    weight_min: 4
    weight_max: 7
    rate_min: 45
    rate_max: 55
    notes: Very tender, but a long commitment
  - id: spatchcocked
    name: Spatchcocked
    shape: rate
    timing: ~10–16 min/kg (much faster overall)
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Fastest overall
    oven:
    - 200–220°C fan
    oven_basis: inferred
    weight_range: 3–6.5 kg
    weight_min: 3
    weight_max: 6.5
    rate_min: 10
    rate_max: 16
    notes: Rarely done above ~6.5 kg — too large to lie flat in most ovens
goose:
  label: Goose (whole)
  internal_temp_ref: poultry.goose
  chart_anchor: poultry
  methods:
  - id: standard_constant_roast
    name: Standard constant roast
    shape: rate
    timing: ~30–40 min/kg
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Reliable default
    oven:
    - 160–170°C fan
    oven_basis: inferred
    weight_range: 3.5–6 kg
    weight_min: 3.5
    weight_max: 6
    rate_min: 30
    rate_max: 40
    notes: Goose renders a lot of fat; draining the tray periodically is standard practice
  - id: high_heat_start_then_reduce
    name: High-heat start, then reduce
    shape: rate
    timing: ~25–30 min/kg after initial blast
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step down
    outcome: Crisp skin first
    oven:
    - 220°C fan for 20–30 min
    - 170°C fan for the rest
    oven_basis: inferred
    weight_range: 3.5–6 kg
    weight_min: 3.5
    weight_max: 6
    rate_min: 25
    rate_max: 30
    notes: Crisps skin before the long, fatty render
  - id: low_and_slow_blast_at_end
    name: Low and slow, blast at end
    shape: rate
    timing: ~40–50 min/kg total
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step up at the end
    outcome: Best fat render
    oven:
    - 140–150°C fan for most of cook
    - 220°C fan for last 20 min
    oven_basis: inferred
    weight_range: 3.5–5.5 kg
    weight_min: 3.5
    weight_max: 5.5
    rate_min: 40
    rate_max: 50
    notes: Common approach — long, gentle render of fat before final crisping
  - id: foil_tented_removed_at_end
    name: Foil-tented, removed at end
    shape: rate
    timing: ~30–35 min/kg (estimated by analogy to the standard rate above — not separately sourced)
    group: Whole bird, roasting methods
    covering: Tented for first ⅔, off for last 30 min
    temp_change: None
    outcome: Protects the breast
    oven:
    - 160–170°C fan
    oven_basis: inferred
    weight_range: 4–6.5 kg
    weight_min: 4
    weight_max: 6.5
    rate_min: 30
    rate_max: 35
    notes: Less common than with turkey (goose skin needs open air to render fat), useful for very large birds
  - id: steaming_parboil_assisted
    name: Steaming/parboil-assisted
    shape: rate
    timing: ~25–30 min/kg roasting time after initial steam (estimated by analogy — not separately sourced)
    group: Whole bird, roasting methods
    covering: Uncovered during roast
    temp_change: None
    outcome: Traditional, crispest skin
    oven:
    - Steam or simmer briefly first
    - 180–200°C fan
    oven_basis: inferred
    weight_range: 3.5–5.5 kg
    weight_min: 3.5
    weight_max: 5.5
    rate_min: 25
    rate_max: 30
    notes: Traditional method — renders fat and tightens skin before roasting
duck:
  label: Duck (whole)
  internal_temp_ref: poultry.duck
  chart_anchor: poultry
  methods:
  - id: standard_constant_roast
    name: Standard constant roast
    shape: rate
    timing: ~35–40 min/kg + 20 min
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Reliable default
    oven:
    - 200–220°C fan
    oven_basis: inferred
    weight_range: 1.5–3 kg
    weight_min: 1.5
    weight_max: 3
    rate_min: 35
    rate_max: 40
    flat_add: 20
    notes: A true 180°C-throughout version would need longer than this; no source found for that specific combination, so it isn't listed as its own row
  - id: high_heat_start_then_reduce
    name: High-heat start, then reduce
    shape: rate
    timing: ~35 min/kg after initial blast
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step down
    outcome: Fast crisp skin
    oven:
    - 220°C fan for 15–20 min
    - 180°C fan for the rest
    oven_basis: inferred
    weight_range: 1.5–3 kg
    weight_min: 1.5
    weight_max: 3
    rate_min: 35
    rate_max: 35
    notes: Renders and crisps skin quickly before finishing. Rate roughly confirmed — a 2 kg duck at this rate (~100 min) matches Gressingham's own 220°C figure closely
  - id: low_and_slow_blast_at_end
    name: Low and slow, blast at end
    shape: rate
    timing: ~70–90 min/kg total (widened from ~45–50 — see note)
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step up at the end
    outcome: Maximum fat render
    oven:
    - 150–160°C fan for most of cook
    - 220°C fan for last 15 min
    oven_basis: inferred
    weight_range: 1.5–2.5 kg
    weight_min: 1.5
    weight_max: 2.5
    rate_min: 70
    rate_max: 90
    notes: Favoured for maximum fat render without drying the meat. Not directly sourced at this exact temperature — Nigella's genuine low-temp method runs hotter (170°C) and still takes ~120 min/kg for a similar-size duck, which suggests an even lower 150–160°C would need at least this long, possibly more
  - id: steaming_parboil_assisted
    name: Steaming/parboil-assisted
    shape: rate
    timing: ~30–35 min/kg roasting time after steam (not independently confirmed either way)
    group: Whole bird, roasting methods
    covering: Uncovered during roast
    temp_change: None
    outcome: Crispest skin
    oven:
    - Steam briefly first
    - 200°C fan
    oven_basis: inferred
    weight_range: 1.5–3 kg
    weight_min: 1.5
    weight_max: 3
    rate_min: 30
    rate_max: 35
    notes: Classic technique for very crisp skin
  - id: spatchcocked
    name: Spatchcocked
    shape: disputed
    timing: ~20–60 min/kg — genuinely conflicting sources, see note
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Even breast and leg
    oven:
    - 200–220°C fan
    oven_basis: inferred
    weight_range: 1.5–2.5 kg
    weight_min: 1.5
    weight_max: 2.5
    rate_min: 20
    rate_max: 60
    notes: Good for smaller ducks where breast and leg doneness otherwise diverge. One US recipe (450°F) matches the fast end of this range; one UK recipe uses a gentler 160–180°C for 120 min on a 2 kg bird — nearly 3× longer. Use a thermometer rather than trusting either end
beef:
  label: Beef
  internal_temp_ref: beef.tender_roast
  chart_anchor: beef-tender-roasting-cuts
  methods:
  - id: standard_constant_roast
    name: Standard constant roast
    shape: by_doneness
    timing: ~40 min/kg + 20 min for rare, ~50 min/kg + 25 min for medium
    group: Tender roasting cuts — rib roast, ribeye roast, round/topside, sirloin roast
    covering: Uncovered
    temp_change: None
    outcome: Reliable default
    oven:
    - 160–180°C fan
    oven_basis: inferred
    by_doneness:
      rare:
        rate_min: 40
        rate_max: 40
        flat_add: 20
      medium:
        rate_min: 50
        rate_max: 50
        flat_add: 25
    notes: Reliable, even results; use a thermometer
  - id: high_heat_sear_then_reduce
    name: High-heat sear, then reduce
    shape: rate
    timing: ~33 min/kg (rare) to 44 min/kg (medium) after the sear
    group: Tender roasting cuts — rib roast, ribeye roast, round/topside, sirloin roast
    covering: Uncovered
    temp_change: One step down
    outcome: Crusted outside
    oven:
    - 220–230°C fan for 20 min
    - 160°C fan for the rest
    oven_basis: inferred
    rate_min: 33
    rate_max: 33
    notes: Builds a crust before the gentle finish; popular for rib roast
    source_note: Drop-to temperature confirmed — Delia's version uses 190°C at a similar rate, so 160°C and 190°C both seem to work
  - id: low_temp_roast_reverse_method
    name: Low-temp roast (reverse method)
    shape: rate
    timing: ~55–75 min/kg (moderate confidence — see note)
    group: Tender roasting cuts — rib roast, ribeye roast, round/topside, sirloin roast
    covering: Uncovered
    temp_change: None
    outcome: Evenest colour throughout
    oven:
    - 100–120°C fan throughout
    oven_basis: inferred
    rate_min: 55
    rate_max: 75
    notes: Extremely even edge-to-edge colour, minimal grey band
  - id: low_temp_roast_hot_blast_at_end
    name: Low-temp roast + hot blast at end
    shape: rate
    timing: ~55–75 min/kg + 10–15 min
    group: Tender roasting cuts — rib roast, ribeye roast, round/topside, sirloin roast
    covering: Uncovered
    temp_change: One step up at the end
    outcome: Even, with a crust
    oven:
    - 100–120°C fan for most of cook
    - 230°C fan for last 10–15 min
    oven_basis: inferred
    rate_min: 55
    rate_max: 75
    flat_add: 10
    flat_add_max: 15
    notes: Combines even cook with a crisp exterior. Same base-rate correction as the row above
  - id: oven_brisket_covered_no_liquid
    name: Oven brisket, covered, no liquid
    shape: rate
    timing: ~1–1.25 hrs/kg
    group: Tough/working cuts — brisket, chuck, short rib, pot roast
    liquid: None (self-bastes)
    covering: Tightly foil-wrapped throughout
    outcome: Roast-like brisket
    oven:
    - 150–160°C fan
    oven_basis: inferred
    rate_min: 60
    rate_max: 75
    notes: Simple; texture closer to roast than braise
  - id: oven_brisket_low_and_slow
    name: Oven brisket, low and slow
    shape: rate
    timing: ~2.2–3.3 hrs/kg (widened from ~1.5–2, moderate confidence)
    group: Tough/working cuts — brisket, chuck, short rib, pot roast
    liquid: None or a splash of water/stock
    covering: Covered (foil or lidded pan)
    outcome: Most tender brisket
    oven:
    - 120–140°C fan
    oven_basis: inferred
    rate_min: 132
    rate_max: 198
    notes: Very tender, more forgiving of timing
    source_note: Widely-cited BBQ/oven guidance for brisket runs closer to 1–1.5 hr/lb at 250°F/121°C, which is this range once converted
  - id: pot_roast_chuck_or_similar_braised
    name: Pot roast (chuck or similar), braised
    shape: rate
    timing: ~1–1.5 hrs/kg
    group: Tough/working cuts — brisket, chuck, short rib, pot roast
    liquid: Fully or half-submerged
    covering: Covered (lidded pot)
    outcome: Wet braise
    oven:
    - 150–160°C fan
    oven_basis: inferred
    rate_min: 60
    rate_max: 90
    notes: A wet braise rather than a dry roast
  - id: short_rib_braised
    name: Short rib, braised
    shape: total
    timing: ~2.5–3.5 hrs total (timed by piece, not weight)
    group: Tough/working cuts — brisket, chuck, short rib, pot roast
    liquid: Half-submerged
    covering: Covered
    outcome: Falls off the bone
    oven:
    - 140–150°C fan
    oven_basis: inferred
    total_min: 150
    total_max: 210
    notes: Cook until meat pulls easily from bone
  - id: chuck_roast_dry_covered_no_liquid
    name: Chuck roast, dry-covered (no liquid)
    shape: rate
    timing: ~1.25–1.5 hrs/kg
    group: Tough/working cuts — brisket, chuck, short rib, pot roast
    liquid: None
    covering: Tightly covered
    outcome: Sliceable, not shreddy
    oven:
    - 140–150°C fan
    oven_basis: inferred
    rate_min: 75
    rate_max: 90
    notes: More roast-like (less shreddy) texture than a wet braise
    source_note: Not independently re-checked this pass — the other rows here mostly held up, so this wasn't specifically flagged, but it wasn't specifically confirmed either
