    before: []
    after:
    - kind: weight
      html: '<strong>Weight range:</strong> holds for <strong>2–5 kg</strong> (bone-in) or <strong>1.8–4.5 kg</strong> (boneless). Doneness temperatures: see <a href="../temperatures/#ham">temperature charts</a>.'
    - kind: safety
      html: <strong>FOOD SAFETY:</strong> a fresh ham is pork leg, so the same flag applies as pork above — the "hint of pink" doneness option (60–62°C) on the <a href="../temperatures/#ham">temperature charts</a> page does not clear FSA's pork-specific guidance. The well-done option does.
    - kind: sources
      html: 'Sources: this table''s timing rates were mostly confirmed as-is against UK guides (~30–40 min/kg at 180°C is the common range; a 220–230°C blast for 20–30 min then 180°C at ~30–40 min/kg also matches typical practice) — no changes made here, unlike the cured table below. Checked once, 2026-08-12 — tidy/remove this note once you''ve confirmed a row yourself.'
