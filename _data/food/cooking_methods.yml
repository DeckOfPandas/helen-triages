      liquid: "None"
      covering: "Tightly covered"
      rate_min: 75
      rate_max: 90
      notes: "More roast-like (less shreddy) texture than a wet braise. Not independently re-checked this pass — the other rows here mostly held up, so this wasn't specifically flagged, but it wasn't specifically confirmed either"

