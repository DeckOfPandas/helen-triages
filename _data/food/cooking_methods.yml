    oven:
    - 200–220°C fan
    oven_basis: inferred
    rate_min: 40
    rate_max: 60
    notes: Cooks far quicker; easy to overshoot, check early
  - id: shoulder_low_and_slow
    name: Shoulder, low and slow
    shape: rate
    timing: ~1–1.25 hrs/kg for a moderately tender result; real "falls apart" recipes at this temperature band run up to ~3–4 hrs/kg — the right number depends on how far you want to push it, not one fixed rate
    group: Slow-cooked cuts — shoulder/pork butt, belly
    covering: Uncovered (or loosely tented if browning too fast)
    outcome: Pulled pork
    oven:
    - 140–150°C fan
    oven_basis: inferred
    rate_min: 60
    rate_max: 75
    notes: Classic "pulled pork" style cook. Widened from a single ~1–1.25 hrs/kg figure, which is plausible for a lighter result but understates genuine pulled-pork timing
  - id: shoulder_very_low_and_slow
    name: Shoulder, very low and slow
    shape: rate
    timing: ~1.5–2 hrs/kg, though real examples at even lower temperatures (100°C, 12 hrs for a 1.6 kg shoulder ≈ 5.5 hrs/kg) suggest true low-temp fall-apart cooking runs considerably longer than this at the low end of the range — moderate-to-low confidence
    group: Slow-cooked cuts — shoulder/pork butt, belly
    covering: Uncovered
    outcome: Most tender, most forgiving
    oven:
    - 110–120°C fan
    oven_basis: inferred
    rate_min: 90
    rate_max: 120
    notes: Maximises tenderness; very forgiving of timing
  - id: shoulder_covered_then_uncovered
    name: Shoulder, covered then uncovered
    shape: rate
    timing: ~1–1.25 hrs/kg covered + final blast (not independently re-checked this pass)
    group: Slow-cooked cuts — shoulder/pork butt, belly
    covering: Covered for bulk of cook, uncovered at the end
    outcome: Moist, crisp at the end
    oven:
    - 150°C fan, covered
    - 220°C fan, uncovered, for last 20–30 min
    oven_basis: inferred
    rate_min: 60
    rate_max: 75
    notes: Keeps meat moist, crisps skin only at the end
  - id: belly_low_and_slow_then_blast
    name: Belly, low and slow then blast
    shape: rate
    timing: ~50–60 min/kg total (not independently re-checked this pass)
    group: Slow-cooked cuts — shoulder/pork butt, belly
    covering: Uncovered throughout
    outcome: Crackling on belly
    oven:
    - 140–150°C fan for most of cook
    - 220°C fan for last 20–30 min
    oven_basis: inferred
    rate_min: 50
    rate_max: 60
    notes: High fat self-bastes; final blast essential for crackling
lamb:
  label: Lamb
  internal_temp_ref: lamb.roasting
  chart_anchor: lamb
  methods:
  - id: standard_constant_roast
    name: Standard constant roast
    shape: rate
    timing: ~25–30 min/kg + 20 min (optimistic — not confirmed, see note)
    group: Roasting cuts — leg, rack, saddle, loin
    covering: Uncovered
    temp_change: None
    outcome: Reliable for leg
    oven:
    - 180°C fan
    oven_basis: inferred
    rate_min: 25
    rate_max: 30
    flat_add: 20
    notes: Reliable default for leg. The American Lamb Board's own figures (15–25 min/lb ≈ 33–55 min/kg) are at a cooler 163°C, which should if anything cook slower than our hotter 180°C — but that's an indirect comparison at a different temperature, not a same-temperature check, so this row is flagged rather than changed outright
  - id: high_heat_start_then_reduce
    name: High-heat start, then reduce
