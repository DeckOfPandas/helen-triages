  groups:
  - name: Roasting cuts — loin, leg/fresh ham, rack/crown roast, tenderloin
    columns:
    - Method
    - Oven temp
    - Timing
    - Temp change
    - Covering
    - Notes
    before: []
    after:
    - kind: weight
      html: '<strong>Weight range:</strong> holds well <strong>1.5–4.5 kg</strong> (loin/leg). Below 1.5 kg (or tenderloin generally), check well before the formula suggests. Above 4.5–5 kg, drop toward the low-temp end of the range. Doneness temperatures: see <a href="../temperatures/#pork">temperature charts</a>.'
    - kind: safety
      html: <strong>FOOD SAFETY:</strong> the doneness figures this timing table cooks toward (see <a href="../temperatures/#pork">temperature charts</a>) include a "medium, slightly pink" option at 60–62°C that does not clear the UK FSA's own core-temperature guidance for pork specifically — unlike beef or lamb, FSA doesn't treat pink pork the same as pink beef. Full detail on the temperature charts; flagging here too since this is the page you'd actually be timing against mid-cook.
    - kind: sources
      html: 'Sources: <a href="https://www.goodto.com/food/how-to/how-to-roast-pork-294839">Good To Know</a> and Village Butchers for the leg/crackling rate (~30 min/500g = ~60 min/kg after a blast). US-style guidance (~40 min/kg at 175–180°C) for lean loin — kept as a separate row rather than overwriting the leg rate, since the two cuts genuinely cook at different speeds. <a href="https://www.waitrose.com/ecom/content/inspiration/guides/roast-guide/roast-pork">Waitrose''s roast guide</a> and a BBC pork fillet recipe for the tenderloin correction. Low-temp reverse-sear rate confirmed against Kenji López-Alt/Serious Eats practice, unchanged. Checked once, 2026-08-12 — tidy/remove these notes once you''ve confirmed a row yourself.'
  - name: Slow-cooked cuts — shoulder/pork butt, belly
    columns:
    - Method
    - Oven temp
    - Timing
    - Covering
    - Notes
    before:
    - kind: prose
      html: Cooked past the "done" temperature until fat and collagen render — timing by tenderness, not just weight.
    after:
    - kind: weight
      html: <strong>Weight range:</strong> holds well <strong>2–5 kg</strong>. Below 2 kg, check earlier. Above 5–6 kg, go by tenderness rather than extrapolating.
    - kind: sources
      html: 'Sources: collagen breakdown at 90–95°C (temperature charts page) is the standard fall-apart range. The shoulder timing spread reflects real recipes at very different target textures rather than one being wrong — a 1.6 kg shoulder at 150°C for 6 hrs and a 100°C/12hr version were both used as reference points. Only the two "shoulder, low and slow" rows were re-checked this pass; covered/uncovered and belly weren''t specifically tested. Checked once, 2026-08-12 — tidy/remove these notes once you''ve confirmed a row yourself.'
