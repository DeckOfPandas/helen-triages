# =============================================================================
# COOKING METHODS — oven temperatures, timings and coverings, as DATA.
# =============================================================================
# THIS FILE IS THE SOURCE OF TRUTH, EDITED BY HAND. It is no longer generated
# from the page. food/reference/cooking-methods.html now RENDERS FROM this
# file, via _includes/food/method_table.html -- the page is the consumer, not
# the source. To add a new protein or method, edit this file directly.
#
# scripts/build_cooking_methods.py and scripts/build_cooking_methods_prose.py
# are MIGRATION TOOLS, not generators to re-run. They did the original
# transcription and are pinned to commit 8bdbd27, the last version of the page
# that still held the tables -- running either against the current working
# tree finds no tables left to parse and would emit an empty data file, which
# in turn blanks the page it feeds. That has already happened once. Leave
# those scripts alone; edit this file, or the page's prose furniture in
# `groups`, instead.
#
# The figures themselves were transcribed by machine, not retyped, when this
# file was first built, so nothing was re-researched and nothing changed value
# in the move from page to data. Correction history has been dropped from the
# notes (Helen, 2026-08-13: "keep safety and sources, drop correction
# history") -- that was scaffolding for a fact-check pass that is finished.
#
# `shape` IS THE FIELD THAT MATTERS, and it exists because a timing is not
# always a formula. 52 of the 66 rows are `rate` and a calculator can just
# multiply; the rest are one of five other things, and a calculator that
# averaged them into a confident serving time would be worse than none:
#
#   rate         rate_min/rate_max minutes per kg, plus optional flat_add
#   total        a fixed time that does NOT scale with weight
#   staged       two rates in sequence (simmer, then roast)
#   by_doneness  a different rate per doneness level
#   relative     defined against another row; no figure of its own
#   disputed     sources genuinely disagree; refuse rather than average
#   unparsed     prose, no formula recoverable
#
# Steak, fish and shellfish are absent on purpose: their tables carry cuts and
# recommended methods, with no timings in them at all.
#
# internal_temp_ref points into internal_temperatures.yml, so a schedule can
# finish on a thermometer figure rather than on a clock.
#
# `groups` carries the page furniture around each table: its subtitle, its
# column names, and TWO ORDERED LISTS of prose -- `before` the table and
# `after` it -- each item keeping its original class and inner HTML verbatim.
#
# Ordered lists rather than named fields (weight_note, safety_note, ...) so that
# a kind of paragraph nobody anticipated still survives, in the right place,
# with its markup. The `kind` label is a hint for styling, not a filter: an
# unrecognised paragraph renders as `prose` rather than disappearing.
#
# Steak, fish and shellfish are absent by design -- no timings, so nothing to
# reconcile, and the fish table's 11 rowspans don't survive a generic loop.

chicken:
  label: Chicken
  internal_temp_ref: poultry.chicken
  chart_anchor: poultry
  methods:
  - id: standard_constant_roast
    name: Standard constant roast
    shape: rate
    timing: ~40 min/kg + 20 min
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Reliable default
    oven: 180°C fan
    oven_basis: stated
    rate_min: 40
    rate_max: 40
    flat_add: 20
    notes: Simple, reliable; skin browns gradually
  - id: high_heat_start_then_reduce
    name: High-heat start, then reduce
    shape: rate
    timing: ~40 min/kg + 20 min total
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step down
    outcome: Crisp skin, moist meat
    oven: Start 220°C fan, drop to 180°C fan after 20 min
    oven_basis: inferred
    rate_min: 40
    rate_max: 40
    flat_add: 20
    notes: Kickstarts crisp skin, then finishes gently so it doesn't dry out
  - id: low_and_slow_high_heat_blast_at_end
    name: Low and slow, high-heat blast at end
    shape: rate
    timing: ~90–105 min/kg total
    group: Whole bird, roasting methods
    covering: Uncovered until final blast
    temp_change: One step up near the end
    outcome: Juiciest meat
    oven: 150–160°C fan for most of cook, then up to 220°C fan for last 15–20 min
    oven_basis: inferred
    rate_min: 90
    rate_max: 105
    notes: Very juicy meat; skin crisps at the very end rather than throughout
  - id: foil_tented_roast
    name: Foil-tented roast
    shape: rate
    timing: ~40 min/kg + 20 min
    group: Whole bird, roasting methods
    covering: Foil loosely over breast for first 2/3 of cook, removed for last 20–30 min
    temp_change: None
    outcome: Protects the breast
    oven: 190–200°C fan
    oven_basis: inferred
    rate_min: 40
    rate_max: 40
    flat_add: 20
    notes: Protects breast from drying/over-browning while legs catch up
  - id: fully_foil_wrapped_steam_roast
    name: Fully foil-wrapped (steam-roast)
    shape: rate
    timing: ~40 min/kg + 20 min, foil removed for last 20–25 min
    group: Whole bird, roasting methods
    covering: Fully wrapped, then opened at the end
    temp_change: None
    outcome: Very moist, pale skin
    oven: 180°C fan
    oven_basis: inferred
    rate_min: 40
    rate_max: 40
    flat_add: 20
    notes: Very moist, almost pot-roast texture; skin won't crisp until unwrapped
  - id: roasting_bag
    name: Roasting bag
    shape: rate
    timing: ~33–44 min/kg (bags cook slightly faster than open roasting, but not as fast as this used to claim)
    group: Whole bird, roasting methods
    covering: Sealed in bag throughout, slit open for last 10–15 min if you want colour
    temp_change: None
    outcome: Fast, least mess
    oven: 190–200°C fan (check bag manufacturer's max)
    oven_basis: inferred
    rate_min: 33
    rate_max: 44
    notes: Fast, very moist, minimal oven mess; skin stays pale unless opened at the end
  - id: spatchcocked_flattened
    name: Spatchcocked (flattened)
    shape: total
    timing: ~40 min total for a typical 1.5–2 kg bird
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Fastest, most even
    oven: 220°C fan
    oven_basis: inferred
    total_min: 40
    total_max: 40
    notes: Much faster and more even than trussed roasting; not "whole" in shape but often grouped with whole-bird methods
  groups:
  - name: Whole bird, roasting methods
    columns:
    - Method
    - Oven temp
    - Timing (per kg)
    - Temp change
    - Covering
    - Notes
    before: []
    after:
    - kind: weight
      html: <strong>Weight calculus:</strong> the "X min/kg + 20 min" formulas (standard, high-then-low, foil-tented, fully-wrapped) hold reliably for birds roughly <strong>1.3 kg to 3 kg</strong>. Below ~1.3 kg the flat +20 min addition becomes disproportionately large relative to cook time — use a flat total time (~1 hr to 1 hr 10 min) and check temperature. Above ~3 kg, heat penetration to the thigh becomes the bottleneck, so larger birds need a lower temperature (160–170°C) for a longer, gentler cook.
    - kind: sources
      html: 'Sources: standard/high-heat-start rates match BBC Good Food and Delia Smith''s common "20 min per 450g + 20 min" formula (≈44 min/kg+20min). Low-and-slow and roasting-bag corrections and the spatchcock rewrite are from Reynolds'' own oven-bag timing chart and comparable recipes (Bell &amp; Evans and others) for a whole spatchcocked bird at 220–230°C. Foil-tented/fully-wrapped weren''t specifically re-checked this pass — same weight-calculus caveat as everything above. Checked once, 2026-08-12 — tidy/remove these notes once you''ve confirmed a row yourself.'
turkey:
  label: Turkey
  internal_temp_ref: poultry.turkey
  chart_anchor: poultry
  methods:
  - id: standard_constant_roast
    name: Standard constant roast
    shape: rate
    timing: ~35–40 min/kg unstuffed
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Reliable default
    oven: 160–170°C fan
    oven_basis: stated
    weight_range: 4–8 kg
    weight_min: 4
    weight_max: 8
    rate_min: 35
    rate_max: 40
  - id: high_heat_start_then_reduce
    name: High-heat start, then reduce
    shape: rate
    timing: ~35–46 min/kg total after the initial blast
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step down
    outcome: Browned skin, gentle finish
    oven: Start 220°C fan for 20–30 min, drop to 160–170°C fan
    oven_basis: inferred
    weight_range: 4–8 kg
    weight_min: 4
    weight_max: 8
    rate_min: 35
    rate_max: 46
    notes: Browns skin early, then finishes gently
  - id: foil_tented_throughout_removed_at_end
    name: Foil-tented throughout, removed at end
    shape: rate
    timing: ~30–35 min/kg (estimated by analogy to the standard rate above — not separately sourced)
    group: Whole bird, roasting methods
    covering: Loosely tented whole time, foil off for last 30–45 min
    temp_change: None
    outcome: For the biggest birds
    oven: 160–180°C fan
    oven_basis: inferred
    weight_range: 4–10 kg
    weight_min: 4
    weight_max: 10
    rate_min: 30
    rate_max: 35
    notes: Standard for larger birds; essential above ~6 kg
  - id: fully_wrapped_steam_roast
    name: Fully wrapped/steam-roast
    shape: rate
    timing: ~25–30 min/kg, unwrapped for last 30–40 min (estimated — not separately sourced)
    group: Whole bird, roasting methods
    covering: Fully wrapped, opened at end
    temp_change: None
    outcome: Very moist, pale skin
    oven: 160–180°C fan
    oven_basis: inferred
    weight_range: 4–8 kg
    weight_min: 4
    weight_max: 8
    rate_min: 25
    rate_max: 30
    notes: Very moist; skin only crisps once unwrapped
  - id: roasting_bag
    name: Roasting bag
    shape: rate
    timing: ~20–24 min/kg
    group: Whole bird, roasting methods
    covering: Sealed, slit open last 20–30 min for colour
    temp_change: None
    outcome: Fastest enclosed method
    oven: 180–190°C fan (check bag max)
    oven_basis: inferred
    weight_range: 4–8 kg
    weight_min: 4
    weight_max: 8
    rate_min: 20
    rate_max: 24
    notes: Faster and more even than open roasting — but this is the fastest of the enclosed methods, not the fastest thing on the page
  - id: low_and_slow_blast_at_end
    name: Low and slow, blast at end
    shape: rate
    timing: ~45–55 min/kg total (estimated by analogy — chicken's low-and-slow row undershot by a similar margin; not directly sourced for turkey at this exact temperature)
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step up at the end
    outcome: Most tender, long haul
    oven: 120–140°C fan for most of cook, up to 220°C fan for final 20–30 min
    oven_basis: inferred
    weight_range: 4–7 kg
    weight_min: 4
    weight_max: 7
    rate_min: 45
    rate_max: 55
    notes: Very tender, but a long commitment
  - id: spatchcocked
    name: Spatchcocked
    shape: rate
    timing: ~10–16 min/kg (much faster overall)
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Fastest overall
    oven: 200–220°C fan
    oven_basis: inferred
    weight_range: 3–6.5 kg
    weight_min: 3
    weight_max: 6.5
    rate_min: 10
    rate_max: 16
    notes: Rarely done above ~6.5 kg — too large to lie flat in most ovens
  groups:
  - name: Whole bird, roasting methods
    columns:
    - Method
    - Oven temp
    - Timing
    - Temp change
    - Covering
    - Weight range
    - Notes
    before: []
    after:
    - kind: weight
      html: <strong>Weight edge cases:</strong> below ~4 kg, treat like a very large chicken — check from the low end of the timing. Above ~10 kg, per-kg formulas break down; use a much lower oven temperature (140–150°C) and time by thermometer alone, checking from about two-thirds of the naive estimate onward.
    - kind: sources
      html: 'Sources: standard rate confirmed against four independent UK sources (Jamie Oliver, Delia Smith, BBC Good Food, Butterball/USDA) all converging on ~35–44 min/kg for a whole unstuffed bird — the old ~20 min/kg figure undercooked a 5 kg turkey by roughly an hour against your own recipe''s actual 2½ hr/30 min-per-kg result, which is itself a useful cross-check against this table. High-heat-start rate from Mary Berry''s method. Roasting-bag rate from Reynolds'' own oven-bag chart (the fastest of the enclosed methods, used as the anchor for the tented/wrapped estimates above it, which weren''t independently sourced). Spatchcock rate from Bon Appétit-style conversions. Tented/wrapped/low-and-slow rows are estimates by analogy, not independently confirmed — check these first if you cook a turkey this way. Checked once, 2026-08-12 — tidy/remove these notes once you''ve confirmed a row yourself.'
goose:
  label: Goose
  internal_temp_ref: poultry.goose
  chart_anchor: poultry
  methods:
  - id: standard_constant_roast
    name: Standard constant roast
    shape: rate
    timing: ~30–40 min/kg
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Reliable default
    oven: 160–170°C fan
    oven_basis: inferred
    weight_range: 3.5–6 kg
    weight_min: 3.5
    weight_max: 6
    rate_min: 30
    rate_max: 40
    notes: Goose renders a lot of fat; draining the tray periodically is standard practice
  - id: high_heat_start_then_reduce
    name: High-heat start, then reduce
    shape: rate
    timing: ~25–30 min/kg after initial blast
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step down
    outcome: Crisp skin first
    oven: Start 220°C fan for 20–30 min, drop to 170°C fan
    oven_basis: inferred
    weight_range: 3.5–6 kg
    weight_min: 3.5
    weight_max: 6
    rate_min: 25
    rate_max: 30
    notes: Crisps skin before the long, fatty render
  - id: low_and_slow_blast_at_end
    name: Low and slow, blast at end
    shape: rate
    timing: ~40–50 min/kg total
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step up at the end
    outcome: Best fat render
    oven: 140–150°C fan for bulk of cook, up to 220°C fan for last 20 min
    oven_basis: inferred
    weight_range: 3.5–5.5 kg
    weight_min: 3.5
    weight_max: 5.5
    rate_min: 40
    rate_max: 50
    notes: Common approach — long, gentle render of fat before final crisping
  - id: foil_tented_removed_at_end
    name: Foil-tented, removed at end
    shape: rate
    timing: ~30–35 min/kg (estimated by analogy to the standard rate above — not separately sourced)
    group: Whole bird, roasting methods
    covering: Tented for first 2/3, off for last 30 min
    temp_change: None
    outcome: Protects the breast
    oven: 160–170°C fan
    oven_basis: inferred
    weight_range: 4–6.5 kg
    weight_min: 4
    weight_max: 6.5
    rate_min: 30
    rate_max: 35
    notes: Less common than with turkey (goose skin needs open air to render fat), useful for very large birds
  - id: steaming_parboil_assisted
    name: Steaming/parboil-assisted
    shape: rate
    timing: ~25–30 min/kg roasting time after initial steam (estimated by analogy — not separately sourced)
    group: Whole bird, roasting methods
    covering: Uncovered during roast
    temp_change: None
    outcome: Traditional, crispest skin
    oven: Steam or simmer briefly before roasting at 180–200°C fan
    oven_basis: inferred
    weight_range: 3.5–5.5 kg
    weight_min: 3.5
    weight_max: 5.5
    rate_min: 25
    rate_max: 30
    notes: Traditional method — renders fat and tightens skin before roasting
  groups:
  - name: Whole bird, roasting methods
    columns:
    - Method
    - Oven temp
    - Timing
    - Temp change
    - Covering
    - Weight range
    - Notes
    before: []
    after:
    - kind: weight
      html: <strong>Weight edge cases:</strong> geese vary less in weight than turkeys (commercially usually 3.5–6.5 kg), so the per-kg formulas are reasonably reliable across the typical range. Below ~3.5 kg, treat like a very large duck and check earlier than the formula suggests.
    - kind: sources
      html: 'Sources: standard and high-heat-start rates from Delia Smith''s own goose recipe (5.4 kg bird, 30 min blast + 3 hrs at 180°C ≈ 39 min/kg), Gordon Ramsay''s recipe (220°C blast 25–30 min, drop to 170°C, then 30 min/kg), and Abel &amp; Cole (same pattern). Low-and-slow rate from genuine 150°C/300°F goose recipes running 3–4 hrs for a ~5 kg bird. Tented and steaming rows are estimates by analogy, not independently sourced. Checked once, 2026-08-12 — tidy/remove these notes once you''ve confirmed a row yourself.'
duck:
  label: Duck
  internal_temp_ref: poultry.duck
  chart_anchor: poultry
  methods:
  - id: standard_constant_roast
    name: Standard constant roast
    shape: rate
    timing: ~35–40 min/kg + 20 min
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Reliable default
    oven: 200–220°C fan
    oven_basis: inferred
    weight_range: 1.5–3 kg
    weight_min: 1.5
    weight_max: 3
    rate_min: 35
    rate_max: 40
    flat_add: 20
    notes: A true 180°C-throughout version would need longer than this; no source found for that specific combination, so it isn't listed as its own row
  - id: high_heat_start_then_reduce
    name: High-heat start, then reduce
    shape: rate
    timing: ~35 min/kg after initial blast
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step down
    outcome: Fast crisp skin
    oven: Start 220°C fan for 15–20 min, drop to 180°C fan
    oven_basis: inferred
    weight_range: 1.5–3 kg
    weight_min: 1.5
    weight_max: 3
    rate_min: 35
    rate_max: 35
    notes: Renders and crisps skin quickly before finishing. Rate roughly confirmed — a 2 kg duck at this rate (~100 min) matches Gressingham's own 220°C figure closely
  - id: low_and_slow_blast_at_end
    name: Low and slow, blast at end
    shape: rate
    timing: ~70–90 min/kg total (widened from ~45–50 — see note)
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: One step up at the end
    outcome: Maximum fat render
    oven: 150–160°C fan for bulk, up to 220°C fan for last 15 min
    oven_basis: inferred
    weight_range: 1.5–2.5 kg
    weight_min: 1.5
    weight_max: 2.5
    rate_min: 70
    rate_max: 90
    notes: Favoured for maximum fat render without drying the meat. Not directly sourced at this exact temperature — Nigella's genuine low-temp method runs hotter (170°C) and still takes ~120 min/kg for a similar-size duck, which suggests an even lower 150–160°C would need at least this long, possibly more
  - id: steaming_parboil_assisted
    name: Steaming/parboil-assisted
    shape: rate
    timing: ~30–35 min/kg roasting time after steam (not independently confirmed either way)
    group: Whole bird, roasting methods
    covering: Uncovered during roast
    temp_change: None
    outcome: Crispest skin
    oven: Steam briefly, then roast at 200°C fan
    oven_basis: inferred
    weight_range: 1.5–3 kg
    weight_min: 1.5
    weight_max: 3
    rate_min: 30
    rate_max: 35
    notes: Classic technique for very crisp skin
  - id: spatchcocked
    name: Spatchcocked
    shape: disputed
    timing: ~20–60 min/kg — genuinely conflicting sources, see note
    group: Whole bird, roasting methods
    covering: Uncovered
    temp_change: None
    outcome: Even breast and leg
    oven: 200–220°C fan
    oven_basis: inferred
    weight_range: 1.5–2.5 kg
    weight_min: 1.5
    weight_max: 2.5
    rate_min: 20
    rate_max: 60
    notes: Good for smaller ducks where breast and leg doneness otherwise diverge. One US recipe (450°F) matches the fast end of this range; one UK recipe uses a gentler 160–180°C for 120 min on a 2 kg bird — nearly 3× longer. Use a thermometer rather than trusting either end
  groups:
  - name: Whole bird, roasting methods
    columns:
    - Method
    - Oven temp
    - Timing
    - Temp change
    - Covering
    - Weight range
    - Notes
    before: []
    after:
    - kind: weight
      html: <strong>Weight edge cases:</strong> most whole ducks sold are 1.5–2.5 kg. Below ~1.5 kg the flat +20 min addition becomes disproportionate — treat like a very large poussin and check early. Above ~3 kg is unusual for domestic duck; use a lower temperature (150–160°C) for longer to render fat fully without scorching the skin.
    - kind: sources
      html: 'Sources: Gressingham''s own roasting guide and Great British Chefs for the standard/high-heat rates. Nigella''s slow-roast duck method for the low-and-slow row (indirect comparison, different temperature — treat as a wide estimate, not a confirmed figure). Spatchcock range reflects genuinely conflicting US vs UK sources rather than one being simply wrong — this is the one row on this page where the disagreement is between real recipes, not a unit-conversion error. Duck is the protein least affected by the systematic error found elsewhere on this page. Checked once, 2026-08-12 — tidy/remove these notes once you''ve confirmed a row yourself.'
beef:
  label: Beef
  internal_temp_ref: beef.tender_roast
  chart_anchor: beef-tender-roasting-cuts
  methods:
  - id: standard_constant_roast
    name: Standard constant roast
    shape: by_doneness
    timing: ~40 min/kg + 20 min for rare, ~50 min/kg + 25 min for medium
    group: Tender roasting cuts — rib roast, ribeye roast, round/topside, sirloin roast
    covering: Uncovered
    temp_change: None
    outcome: Reliable default
    oven: 160–180°C fan
    oven_basis: inferred
    by_doneness:
      rare:
        rate_min: 40
        rate_max: 40
        flat_add: 20
      medium:
        rate_min: 50
        rate_max: 50
        flat_add: 25
    notes: Reliable, even results; use a thermometer
  - id: high_heat_sear_then_reduce
    name: High-heat sear, then reduce
    shape: rate
    timing: ~33 min/kg (rare) to 44 min/kg (medium) after the sear
    group: Tender roasting cuts — rib roast, ribeye roast, round/topside, sirloin roast
    covering: Uncovered
    temp_change: One step down
    outcome: Crusted outside
    oven: Start 220–230°C fan for 20 min, drop to 160°C fan
    oven_basis: inferred
    rate_min: 33
    rate_max: 33
    notes: Builds a crust before the gentle finish; popular for rib roast
    source_note: Drop-to temperature confirmed — Delia's version uses 190°C at a similar rate, so 160°C and 190°C both seem to work
  - id: low_temp_roast_reverse_method
    name: Low-temp roast (reverse method)
    shape: rate
    timing: ~55–75 min/kg (moderate confidence — see note)
    group: Tender roasting cuts — rib roast, ribeye roast, round/topside, sirloin roast
    covering: Uncovered
    temp_change: None
    outcome: Evenest colour throughout
    oven: 100–120°C fan throughout
    oven_basis: inferred
    rate_min: 55
    rate_max: 75
    notes: Extremely even edge-to-edge colour, minimal grey band
  - id: low_temp_roast_hot_blast_at_end
    name: Low-temp roast + hot blast at end
    shape: rate
    timing: ~55–75 min/kg + 10–15 min
    group: Tender roasting cuts — rib roast, ribeye roast, round/topside, sirloin roast
    covering: Uncovered
    temp_change: One step up at the end
    outcome: Even, with a crust
    oven: 100–120°C fan, then up to 230°C fan for last 10–15 min
    oven_basis: inferred
    rate_min: 55
    rate_max: 75
    flat_add: 10
    flat_add_max: 15
    notes: Combines even cook with a crisp exterior. Same base-rate correction as the row above
  - id: oven_brisket_covered_no_liquid
    name: Oven brisket, covered, no liquid
    shape: rate
    timing: ~1–1.25 hrs/kg
    group: Tough/working cuts — brisket, chuck, short rib, pot roast
    liquid: None (self-bastes)
    covering: Tightly foil-wrapped throughout
    outcome: Roast-like brisket
    oven: 150–160°C fan
    oven_basis: inferred
    rate_min: 60
    rate_max: 75
    notes: Simple; texture closer to roast than braise
  - id: oven_brisket_low_and_slow
    name: Oven brisket, low and slow
    shape: rate
    timing: ~2.2–3.3 hrs/kg (widened from ~1.5–2, moderate confidence)
    group: Tough/working cuts — brisket, chuck, short rib, pot roast
    liquid: None or a splash of water/stock
    covering: Covered (foil or lidded pan)
    outcome: Most tender brisket
    oven: 120–140°C fan
    oven_basis: inferred
    rate_min: 132
    rate_max: 198
    notes: Very tender, more forgiving of timing
    source_note: Widely-cited BBQ/oven guidance for brisket runs closer to 1–1.5 hr/lb at 250°F/121°C, which is this range once converted
  - id: pot_roast_chuck_or_similar_braised
    name: Pot roast (chuck or similar), braised
    shape: rate
    timing: ~1–1.5 hrs/kg
    group: Tough/working cuts — brisket, chuck, short rib, pot roast
    liquid: Fully or half-submerged
    covering: Covered (lidded pot)
    outcome: Wet braise
    oven: 150–160°C fan
    oven_basis: inferred
    rate_min: 60
    rate_max: 90
    notes: A wet braise rather than a dry roast
