      shape: "rate"
      timing: "~35–40 min/kg + 20 min"
      group: "Whole bird, roasting methods"
      oven: "200–220°C"
      covering: "Uncovered"
      temp_change: "None"
      weight_min: 1.5
      weight_max: 3
      rate_min: 35
      rate_max: 40
      flat_add: 20
      notes: "Temperature A true 180°C-throughout version would need longer than this; no source found for that specific combination, so it isn't listed as its own row"
    - id: "high_heat_start_then_reduce"
      name: "High-heat start, then reduce"
      shape: "rate"
      timing: "~35 min/kg after initial blast"
      group: "Whole bird, roasting methods"
      oven: "Start 220°C for 15–20 min, drop to 180°C"
      covering: "Uncovered"
      temp_change: "One step down"
      weight_min: 1.5
      weight_max: 3
      rate_min: 35
      rate_max: 35
      notes: "Renders and crisps skin quickly before finishing. Rate roughly confirmed — a 2 kg duck at this rate (~100 min) matches Gressingham's own 220°C figure closely"
    - id: "low_and_slow_blast_at_end"
      name: "Low and slow, blast at end"
      shape: "rate"
      timing: "~70–90 min/kg total (widened from ~45–50 — see note)"
      group: "Whole bird, roasting methods"
      oven: "150–160°C for bulk, up to 220°C for last 15 min"
      covering: "Uncovered"
      temp_change: "One step up at the end"
      weight_min: 1.5
      weight_max: 2.5
      rate_min: 70
      rate_max: 90
      notes: "Favoured for maximum fat render without drying the meat. Not directly sourced at this exact temperature — Nigella's genuine low-temp method runs hotter (170°C) and still takes ~120 min/kg for a similar-size duck, which suggests an even lower 150–160°C would need at least this long, possibly more"
    - id: "steaming_parboil_assisted"
      name: "Steaming/parboil-assisted"
      shape: "rate"
      timing: "~30–35 min/kg roasting time after steam (not independently confirmed either way)"
      group: "Whole bird, roasting methods"
      oven: "Steam briefly, then roast at 200°C"
      covering: "Uncovered during roast"
      temp_change: "None"
      weight_min: 1.5
      weight_max: 3
      rate_min: 30
      rate_max: 35
      notes: "Classic technique for very crisp skin"
    - id: "spatchcocked"
      name: "Spatchcocked"
      shape: "disputed"
      timing: "~20–60 min/kg — genuinely conflicting sources, see note"
      group: "Whole bird, roasting methods"
      oven: "200–220°C"
      covering: "Uncovered"
      temp_change: "None"
      weight_min: 1.5
      weight_max: 2.5
      rate_min: 20
      rate_max: 60
      notes: "Good for smaller ducks where breast and leg doneness otherwise diverge. One US recipe (450°F) matches the fast end of this range; one UK recipe uses a gentler 160–180°C for 120 min on a 2 kg bird — nearly 3× longer. Use a thermometer rather than trusting either end"

