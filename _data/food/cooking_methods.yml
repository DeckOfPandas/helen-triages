lamb:
  label: "Lamb"
  internal_temp_ref: lamb.roasting
  methods:
    - id: "standard_constant_roast"
      name: "Standard constant roast"
      shape: "rate"
      timing: "~25–30 min/kg + 20 min (optimistic — not confirmed, see note)"
      group: "Roasting cuts — leg, rack, saddle, loin"
      oven: "180°C"
      covering: "Uncovered"
      temp_change: "None"
      rate_min: 25
      rate_max: 30
      flat_add: 20
      notes: "Reliable default for leg. The American Lamb Board's own figures (15–25 min/lb ≈ 33–55 min/kg) are at a cooler 163°C, which should if anything cook slower than our hotter 180°C — but that's an indirect comparison at a different temperature, not a same-temperature check, so this row is flagged rather than changed outright"
    - id: "high_heat_start_then_reduce"
      name: "High-heat start, then reduce"
      shape: "rate"
      timing: "~20–25 min/kg after the initial blast"
      group: "Roasting cuts — leg, rack, saddle, loin"
      oven: "Start 220°C for 20 min, drop to 180°C"
      covering: "Uncovered"
      temp_change: "One step down"
      rate_min: 20
      rate_max: 25
      notes: "Browns exterior early, finishes gently. Confirmed — Jamie Oliver's 2.4 kg leg recipe (220°C→180°C, medium doneness, 70 min cook) triangulates to ~21–23 min/kg after the blast"
    - id: "low_temp_roast_reverse_method"
      name: "Low-temp roast (reverse method)"
      shape: "rate"
      timing: "~40–50 min/kg (not independently re-checked this pass)"
      group: "Roasting cuts — leg, rack, saddle, loin"
      oven: "120–140°C throughout"
      covering: "Uncovered"
      temp_change: "None"
      rate_min: 40
      rate_max: 50
      notes: "Very even, minimal grey band"
    - id: "low_temp_roast_hot_blast_at_end"
      name: "Low-temp roast + hot blast at end"
      shape: "rate"
      timing: "~40–50 min/kg + 15 min"
      group: "Roasting cuts — leg, rack, saddle, loin"
      oven: "120–140°C, then up to 230°C for last 15 min"
      covering: "Uncovered"
      temp_change: "One step up at the end"
      rate_min: 40
      rate_max: 50
      flat_add: 15
      notes: "Combines even cooking with a crisp finish"
    - id: "rack_high_heat_throughout"
      name: "Rack, high heat throughout"
      shape: "total"
      timing: "~15–25 min total for a typical 400–600g rack"
      group: "Roasting cuts — leg, rack, saddle, loin"
      oven: "200–220°C"
      covering: "Uncovered"
      temp_change: "None"
      total_min: 15
      total_max: 25
      notes: "Cooks quickly; check early. Given as a total time, not min/kg — a rack is too small/thin for a per-kg rate to mean much; the old \"~15–20 min/kg\" here implied a much longer cook than any real rack recipe actually takes"
    - id: "rack_sear_then_oven_finish"
      name: "Rack, sear then oven finish"
      shape: "total"
      timing: "~10–15 min total oven time after searing"
      group: "Roasting cuts — leg, rack, saddle, loin"
      oven: "Sear on stove, then 200°C oven"
      covering: "Uncovered"
      temp_change: "None"
      total_min: 10
      total_max: 15
      notes: "Common restaurant method"
    - id: "shoulder_low_and_slow"
      name: "Shoulder, low and slow"
      shape: "rate"
      timing: "~1–1.25 hrs/kg for a moderately tender result; genuinely fall-apart shoulder recipes at this band run notably longer (a 2.5 kg shoulder at 160°C for 6 hrs ≈ 2.4 hrs/kg) — depends how far you want to push it, same pattern as pork shoulder above"
      group: "Slow-cooked cuts — shoulder, breast"
      oven: "140–150°C"
      covering: "Uncovered (or loosely tented if browning too fast)"
      rate_min: 60
      rate_max: 75
      notes: "Classic \"pulled lamb\" style cook. Widened from a single ~1–1.25 hrs/kg figure"
    - id: "shoulder_very_low_and_slow"
      name: "Shoulder, very low and slow"
      shape: "rate"
      timing: "~1.5–2 hrs/kg (not independently re-checked this pass)"
      group: "Slow-cooked cuts — shoulder, breast"
      oven: "110–120°C"
      covering: "Uncovered"
      rate_min: 90
      rate_max: 120
      notes: "Maximises tenderness; very forgiving"
    - id: "shoulder_covered_then_uncovered"
      name: "Shoulder, covered then uncovered"
      shape: "rate"
      timing: "~1–1.25 hrs/kg covered + final blast (not independently re-checked this pass)"
      group: "Slow-cooked cuts — shoulder, breast"
      oven: "150°C covered, then 220°C uncovered for last 20–30 min"
      covering: "Covered for bulk, uncovered at the end"
      rate_min: 60
      rate_max: 75
      notes: "Keeps meat moist, crisps exterior only at the end"
    - id: "breast_low_and_slow_then_blast"
      name: "Breast, low and slow then blast"
      shape: "rate"
      timing: "~1–1.25 hrs/kg total (not independently re-checked this pass)"
      group: "Slow-cooked cuts — shoulder, breast"
      oven: "140–150°C for bulk, up to 220°C for last 20 min"
      covering: "Uncovered throughout"
      rate_min: 60
      rate_max: 75
      notes: "High fat self-bastes; final blast crisps exterior"

ham:
  label: "Ham"
  internal_temp_ref: ham.cured
  methods:
    - id: "standard_constant_roast_plain"
      name: "Standard constant roast, plain"
      shape: "rate"
      timing: "~35–40 min/kg + 20 min"
      group: "Fresh (uncured, raw) ham — bone-in or boneless"
      oven: "180°C"
      covering: "Uncovered"
      temp_change: "None"
      rate_min: 35
      rate_max: 40
      flat_add: 20
      notes: "Same base rate as pork leg — a fresh ham is pork leg"
    - id: "high_heat_start_then_reduce_plain"
      name: "High-heat start, then reduce, plain"
      shape: "rate"
      timing: "~30–35 min/kg after initial blast"
      group: "Fresh (uncured, raw) ham — bone-in or boneless"
      oven: "Start 220°C for 20–25 min, drop to 180°C"
      covering: "Uncovered"
      temp_change: "One step down"
      rate_min: 30
      rate_max: 35
      notes: "Crisps skin/crackling early if scored"
    - id: "low_and_slow_hot_blast_plain"
      name: "Low and slow + hot blast, plain"
      shape: "rate"
      timing: "~50–60 min/kg + 15–20 min"
      group: "Fresh (uncured, raw) ham — bone-in or boneless"
      oven: "120–140°C, then up to 230°C for last 15–20 min"
      covering: "Uncovered"
      temp_change: "One step up at the end"
      rate_min: 50
      rate_max: 60
      flat_add: 15
      flat_add_max: 20
      notes: "Very even, tender result"
    - id: "sugar_rubbed_roast"
      name: "Sugar-rubbed roast"
      shape: "relative"
      timing: "Same as plain equivalent"
      group: "Fresh (uncured, raw) ham — bone-in or boneless"
      oven: "180°C, or 220°C then drop"
      covering: "Uncovered for final 20–30 min so sugar can caramelise"
      temp_change: "As per chosen base method"
      relative_to: "Same as plain equivalent"
      notes: "Rub applied for the last third of cooking, not from the start, or it burns"
    - id: "marmalade_or_treacle_glazed"
      name: "Marmalade or treacle glazed"
      shape: "relative"
      timing: "Same as plain equivalent"
      group: "Fresh (uncured, raw) ham — bone-in or boneless"
      oven: "180°C, or 220°C then drop"
      covering: "Glaze brushed on for last 20–30 min only, uncovered"
      temp_change: "As per chosen base method"
      relative_to: "Same as plain equivalent"
      notes: "Sugar burns if applied too early; scoring fat first helps glaze adhere"
    - id: "boneless_netted_rolled"
      name: "Boneless, netted/rolled"
      shape: "relative"
      timing: "Add ~10% to time vs. same-weight bone-in"
      group: "Fresh (uncured, raw) ham — bone-in or boneless"
      oven: "Same as bone-in equivalents"
      covering: "Same as bone-in equivalents"
      temp_change: "Same as bone-in equivalents"
      relative_to: "Add ~10% to time vs. same-weight bone-in"
      notes: "Denser without the bone conducting heat"
    - id: "boil_then_roast_plain"
      name: "Boil then roast, plain"
      shape: "staged"
      timing: "Simmer ~45 min/kg, then roast ~15–20 min/kg"
      group: "Cured (and/or smoked) whole ham — bone-in or boneless"
      oven: "Simmer in water first, then oven at 180°C"
      covering: "Uncovered during roast"
      temp_change: "None during roast phase"
      stages:
        - name: "simmer"
          rate_min: 45
          rate_max: 45
        - name: "roast"
          rate_min: 15
          rate_max: 20
      notes: "Traditional — boiling removes excess surface salt; skin removed and scored before roasting. Simmer rate"
    - id: "roast_only_plain"
      name: "Roast only, plain"
      shape: "rate"
      timing: "~60 min/kg + 30 min"
      group: "Cured (and/or smoked) whole ham — bone-in or boneless"
      oven: "160–170°C fan (≈180–190°C conventional)"
      covering: "Loosely covered for the bulk, uncovered last 20–30 min"
      temp_change: "None"
      rate_min: 60
      rate_max: 60
      flat_add: 30
      notes: "Slightly gentler and slower than fresh ham. Timing Temperature itself wasn't actually wrong — written out here as fan/conventional explicitly since a cited \"180°C\" source turned out to mean the same oven setting as our existing 160–170°C fan figure, not a different one"
    - id: "sugar_rubbed_after_boil_or_roast_base"
      name: "Sugar-rubbed (after boil or roast base)"
      shape: "relative"
      timing: "Base method + final uncovered stage"
      group: "Cured (and/or smoked) whole ham — bone-in or boneless"
      oven: "As per base method, uncovered at 200–220°C for last 15–20 min"
