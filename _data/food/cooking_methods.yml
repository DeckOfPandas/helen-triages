ham:
  label: Ham
  internal_temp_ref: ham.cured
  chart_anchor: ham
  methods:
  - id: standard_constant_roast_plain
    name: Standard constant roast, plain
    shape: rate
    timing: ~35–40 min/kg + 20 min
    group: Fresh (uncured, raw) ham — bone-in or boneless
    covering: Uncovered
    temp_change: None
    outcome: Reliable default
    oven:
    - 180°C fan
    oven_basis: inferred
    rate_min: 35
    rate_max: 40
    flat_add: 20
    notes: Same base rate as pork leg — a fresh ham is pork leg
  - id: high_heat_start_then_reduce_plain
    name: High-heat start, then reduce, plain
    shape: rate
    timing: ~30–35 min/kg after initial blast
    group: Fresh (uncured, raw) ham — bone-in or boneless
    covering: Uncovered
    temp_change: One step down
    outcome: Crackling early
    oven:
    - 220°C fan for 20–25 min
    - 180°C fan for the rest
    oven_basis: inferred
    rate_min: 30
    rate_max: 35
    notes: Crisps skin/crackling early if scored
  - id: low_and_slow_hot_blast_plain
    name: Low and slow + hot blast, plain
    shape: rate
    timing: ~50–60 min/kg + 15–20 min
    group: Fresh (uncured, raw) ham — bone-in or boneless
    covering: Uncovered
    temp_change: One step up at the end
    outcome: Evenest, most tender
    oven:
    - 120–140°C fan for most of cook
    - 230°C fan for last 15–20 min
    oven_basis: inferred
    rate_min: 50
    rate_max: 60
    flat_add: 15
    flat_add_max: 20
    notes: Very even, tender result
  - id: sugar_rubbed_roast
    name: Sugar-rubbed roast
    shape: relative
    timing: Same as plain equivalent
    group: Fresh (uncured, raw) ham — bone-in or boneless
    covering: Uncovered for final 20–30 min so sugar can caramelise
    temp_change: As per chosen base method
    outcome: Caramelised crust
    oven:
    - As the plain method
    - Rub on for last 20–30 min
    oven_basis: inferred
    relative_to: Same as plain equivalent
    notes: Rub applied for the last third of cooking, not from the start, or it burns
  - id: marmalade_or_treacle_glazed
    name: Marmalade or treacle glazed
    shape: relative
    timing: Same as plain equivalent
    group: Fresh (uncured, raw) ham — bone-in or boneless
    covering: Glaze brushed on for last 20–30 min only, uncovered
    temp_change: As per chosen base method
    outcome: Glazed finish
    oven:
    - As the plain method
    - Glaze on for last 20–30 min
    oven_basis: inferred
    relative_to: Same as plain equivalent
    notes: Sugar burns if applied too early; scoring fat first helps glaze adhere
  - id: boneless_netted_rolled
    name: Boneless, netted/rolled
    shape: relative
    timing: Add ~10% to time vs. same-weight bone-in
    group: Fresh (uncured, raw) ham — bone-in or boneless
    covering: Same as bone-in equivalents
    temp_change: Same as bone-in equivalents
    outcome: Boneless, denser
    oven:
    - As the bone-in method
    oven_basis: inferred
    relative_to: Add ~10% to time vs. same-weight bone-in
    notes: Denser without the bone conducting heat
  - id: boil_then_roast_plain
    name: Boil then roast, plain
    shape: staged
    timing: Simmer ~45 min/kg, then roast ~15–20 min/kg
    group: Cured (and/or smoked) whole ham — bone-in or boneless
    covering: Uncovered during roast
    temp_change: None during roast phase
    outcome: Less salty, traditional
    oven:
    - Simmer in water first
    - 180°C fan
    oven_basis: inferred
    stages:
    - name: simmer
      rate_min: 45
      rate_max: 45
    - name: roast
      rate_min: 15
      rate_max: 20
    notes: Traditional — boiling removes excess surface salt; skin removed and scored before roasting
  - id: roast_only_plain
    name: Roast only, plain
    shape: rate
    timing: ~60 min/kg + 30 min
    group: Cured (and/or smoked) whole ham — bone-in or boneless
    covering: Loosely covered for the bulk, uncovered last 20–30 min
    temp_change: None
    outcome: Simplest for cured ham
    oven:
    - 160–170°C fan
    oven_basis: stated
    rate_min: 60
    rate_max: 60
    flat_add: 30
    notes: Slightly gentler and slower than fresh ham
    source_note: Temperature itself wasn't actually wrong — written out here as fan/conventional explicitly since a cited "180°C" source turned out to mean the same oven setting as our existing 160–170°C fan figure, not a different one
  - id: sugar_rubbed_after_boil_or_roast_base
    name: Sugar-rubbed (after boil or roast base)
    shape: relative
    timing: Base method + final uncovered stage
    group: Cured (and/or smoked) whole ham — bone-in or boneless
    covering: Uncovered for the sugar-crisping stage
    temp_change: One step up at the very end
    outcome: Caramelised crust
    oven:
    - As the base method
    - 200–220°C fan, uncovered, for last 15–20 min
    oven_basis: inferred
    relative_to: Base method + final uncovered stage
    notes: Applied only at the very end
  - id: marmalade_or_treacle_glazed_after_boil_or_roast_base
    name: Marmalade or treacle glazed (after boil or roast base)
    shape: relative
    timing: Base method + final glazing stage
    group: Cured (and/or smoked) whole ham — bone-in or boneless
    covering: Uncovered for the glazing stage
    temp_change: One step up at the very end
    outcome: Glazed finish
    oven:
    - As the base method
    - 200–220°C fan, uncovered, for last 15–20 min
    oven_basis: inferred
    relative_to: Base method + final glazing stage
    notes: Glaze goes on right before the final high-heat stage
  - id: boneless_netted_rolled_cured
    name: Boneless, netted/rolled, cured
    shape: relative
    timing: Add ~10% to time vs. same-weight bone-in
    group: Cured (and/or smoked) whole ham — bone-in or boneless
    covering: Same as bone-in equivalents
    temp_change: Same as bone-in equivalents
    outcome: Boneless, denser
    oven:
    - As the bone-in method
    oven_basis: inferred
    relative_to: Add ~10% to time vs. same-weight bone-in
    notes: Same adjustment as fresh ham
venison:
  label: Venison
  internal_temp_ref: venison.haunch
  chart_anchor: venison-tender-roasting-cuts
  methods:
  - id: haunch_high_heat_start_then_reduce
    name: Haunch, high-heat start then reduce
    shape: by_doneness
    timing: ~15–20 mins/kg + 20 mins for rare, ~20–30 mins/kg + 20 mins for medium
    group: Roasting cuts — haunch, loin, saddle, rack
    covering: Uncovered
    temp_change: One step down
    outcome: Crusted outside, pink centre
    oven:
    - 200°C fan for 20 min
    - 140–160°C fan for the rest
    oven_basis: stated
    by_doneness:
      rare:
        rate_min: 15
        rate_max: 20
        flat_add: 20
      medium:
        rate_min: 20
        rate_max: 30
        flat_add: 20
    notes: The standard UK haunch method — a hard blast to seal a very lean joint, then a long gentle finish. For 1.8 kg, about 50 mins to 1 hr for rare, 1 hr to 1 hr 15 for medium.
  - id: haunch_standard_constant_roast
    name: Haunch, standard constant roast
    shape: rate
    timing: ~30 mins/kg
    group: Roasting cuts — haunch, loin, saddle, rack
    covering: Uncovered
    temp_change: None
    outcome: Simplest haunch roast
    oven:
    - 160°C fan
    oven_basis: inferred
    rate_min: 30
    rate_max: 30
    notes: 'One temperature from start to finish, and the least there is to get wrong. For 2 kg: ~1 hr.'
  - id: haunch_foil_wrapped
    name: Haunch, foil-wrapped
    shape: rate
    timing: ~33 mins/kg
    group: Roasting cuts — haunch, loin, saddle, rack
    covering: Wrapped in foil throughout, foil replaced to rest
    temp_change: None
    outcome: Moist, no crust
    oven:
    - 160°C fan
    oven_basis: inferred
    rate_min: 33
    rate_max: 33
    notes: 'The Wild Meat Company''s own instruction for a rolled haunch — wrapped, so it steams rather than roasts and never browns. Rest it still wrapped, about 11 mins per kg. For 1.5 kg: ~50 mins.'
  - id: rack_high_heat_throughout
    name: Rack, high heat throughout
    shape: total
    timing: ~10–15 mins total for a rack
    group: Roasting cuts — haunch, loin, saddle, rack
    covering: Uncovered
    temp_change: None
    outcome: Quickest, for a rack
    oven:
    - 200°C fan
    oven_basis: inferred
    total_min: 10
    total_max: 15
    notes: Timed by the piece rather than per kg, the same way this site's lamb rack rows are — a rack is too small and too thin for a per-kg rate to mean anything.
  - id: loin_sear_then_oven_finish
    name: Loin, sear then oven finish
    shape: total
    timing: ~5–7 mins total oven time after searing
    group: Roasting cuts — haunch, loin, saddle, rack
    covering: Uncovered
    temp_change: None
    outcome: Restaurant method, for loin
    oven:
    - Sear on the stove first
    - 160°C fan
    oven_basis: inferred
    total_min: 5
    total_max: 7
    notes: A hard sear for colour, then just long enough in the oven to bring the middle up. Easy to overshoot — a thermometer cut, not a clock one.
  - id: shoulder_low_and_slow
    name: Shoulder, low and slow
    shape: rate
    timing: ~1.3–1.6 hrs/kg
    group: Slow-cooked cuts — shoulder, neck, shank
    liquid: None or a splash of stock
    covering: Covered for the whole cook
    outcome: Pulled venison
    oven:
    - 150°C fan
    oven_basis: stated
    rate_min: 80
    rate_max: 96
    notes: 'The classic pulled-venison cook, covered the whole way because venison shoulder has nothing like pork shoulder''s fat to protect it. Done when it pulls apart with two forks, not when the clock says so. For 2.5 kg: ~4 hrs.'
  - id: shoulder_pot_roast_braised
    name: Shoulder, pot-roasted (braised)
    shape: rate
    timing: ~1–1.5 hrs/kg
    group: Slow-cooked cuts — shoulder, neck, shank
    liquid: Half-submerged
    covering: Covered (lidded pot)
    outcome: Wet braise
    oven:
    - 130°C fan
    oven_basis: inferred
    rate_min: 60
    rate_max: 90
    notes: 'Seared first, then braised in liquid rather than dry-roasted. Neck goes here too, on the same rate. For 2 kg: ~3 hrs.'
  - id: shank_braised
    name: Shank, braised
    shape: total
    timing: ~2–3 hrs total (timed by piece, not weight)
    group: Slow-cooked cuts — shoulder, neck, shank
    liquid: Half-submerged
    covering: Covered (lid or foil)
    outcome: Falls off the bone
    oven:
    - 130–160°C fan
    oven_basis: inferred
    total_min: 120
    total_max: 180
    notes: Venison osso buco. Shanks are sold by the piece and vary from muntjac-small to red-deer-large, so this is a total time like beef short rib rather than a rate. Done when the meat leaves the bone.
