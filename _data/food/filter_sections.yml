# Filter section presentation on the food index: label text, CSS class and
# order. Which tags exist is _data/food/taxonomy.yml: each `tag_groups` entry's
# `name` keys into `taxonomy.tags`, so adding a tag never touches this file.
# Colour is in _sass. A label is plain text: no square brackets, which are the
# wordmark's device and belong to a template.

star: 
  label: "STAR INGREDIENT"
  class: category--star

ingredients:
  # The same words as the cocktails index, which asks the same question (#583).
  label: "HAS TO HAVE"

exclude:
  label: "LEAVE OUT"

tag_groups:
  - name: mood
    label: "MOOD"
    class: category--mood

  - name: practicalities
    label: "PRACTICALITIES"
    class: category--practicalities

name_search:
  label: "I KNOW WHAT I WANT"
