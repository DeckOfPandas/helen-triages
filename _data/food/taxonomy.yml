# The food vocabulary: which star ingredients and tags exist, and how they
# relate. Nothing about how they look: labels, classes and order are in
# _data/food/filter_sections.yml, colour is in _sass. food/index.html builds
# the filter buttons from this file, _includes/recipe_badges.html picks a
# badge class from it, and tests/test_taxonomy.py holds every recipe to it.
# A tag not listed here renders on a recipe page but has no filter button.
# DECISIONS §7.

# The one thing a recipe is about. Declared, not derived, so a typo fails a
# test and does not create a new value. `star_ingredient` is optional: a plain
# sponge, a spice blend or a dressing has no hero and stays blank.
star_ingredients:
  - beef
  - chocolate
  - duck
  # Only where the dish is about the egg. Blank where egg is technique or
  # structure: a quiche, a soufflé, pancakes, a fritter's binder (#187).
  - eggs
  - fruit
  - game
  # Leaves and brassicas: kale, cavolo nero, cabbage, sprouts, broccoli,
  # cauliflower, chard, spinach, lettuce, radicchio. Not tomatoes, courgettes,
  # peppers or beans.
  - greens
  - lamb
  # Lentils, chickpeas and beans, fresh or dried, edamame included.
  - legumes
  - mushrooms
  - oily fish
  - pork
  - poultry
  - root veg
  - shellfish
  - white fish

# Retired values, each with its reason. test_star_ingredient_is_declared reads
# this first, so a file still carrying one fails with the reason and not just
# "not declared".
retired_star_ingredients:
  something unusual: >-
    Retired 2026-08-09 -- defined relative to a subjective, cultural norm
    rather than an actual food group, not a real craving the way "beef" or
    "greens" are, and barely/inconsistently used. Not coming back -- blank
    the field, don't reintroduce it.

# Two groups, different in kind. A recipe may carry any number from either.
#   mood            what you feel like eating: a craving
#   practicalities  what the occasion or the recipe demands of you, whatever
#                   you feel like
# The note above a tag is its meaning, and is what an ingest proposal is read
# against.
tags:
  mood:
    # A baked good out of the oven: cake, biscuit, bread, pastry, and a quiche,
    # a baked cheesecake, pizza dough, fondants, puddings, crumbles. The test:
    # would it appear on Great British Bake Off? Not a soufflé or a Wellington.
    - bakes
    # The starch is the point: pasta, rice, potatoes, pies, dumplings.
    - carbs party
    # Cheese is the pleasure of the dish, not a garnish. Feta does not count,
    # even a whole baked block; burrata does.
    - cheese-tastic
    # A pudding course served at the table.
    - dessert
    # Anything made to drink that is not a cocktail: a frappé, a cordial, a
    # hot chocolate. Cocktails belong to the sibling site.
    - drinks
    # A home version of something you would order in.
    - fakeaway
    # The process is the point: several components or stages, hands-on work,
    # some precision. Slow is not fiddly, nor is threading skewers, and the
    # fiddle has to be one a cook would really do. May sit with `showstopper`.
    - fiddly and fun
    # A main where a vegetable, a pulse or a mushroom is the point of the dish
    # and the reason to cook it: a whole roast celeriac, chargrilled radicchio,
    # a leek tart. Never a side (`co_tags`). Not a promise of vegetarian:
    # anchovy, bacon or chorizo in a supporting role is fine. Wider than
    # `virtuous`, which is about lightness.
    - herbivore-ish
    # Small, hot and eaten between meals: toasties, fritters, things on toast.
    - hot snack
    - ice cream
    # A sit-down dinner eaten with a knife and fork and cooked properly: a
    # roast, a braise, a whole fish, a vegetable centrepiece. About how it is
    # eaten, not what is on the plate, so it needs no animal. The counterpart
    # of `one-handed food`.
    - knife and fork
    # Finger food to pass round with drinks.
    - nibbles
    # Food you can eat curled on the sofa: nothing that rolls, spills or has to
    # be chased. Tagged by hand on the eating mechanics. Never a soup; a
    # meatball alone is, on spaghetti or in a broth it is not.
    - one-handed food
    - salad
    # The result makes people gasp at the table, however little work it took.
    - showstopper
    - soup
    # Small sweet things eaten by hand outside a meal, made or named as
    # individual pieces: a biscuit, a bun, a brownie, a bar, a scone. Not a
    # whole cake in slices, nor a traybake cut into squares.
    - sweet snack
    - virtuous

  practicalities:
    # Eaten in the morning.
    - breakfast
    # Not a dish by itself: sides, sauces, stocks, pickles, doughs.
    - extras
    # Christmas or another named feast, and the dish has to be the feast's
    # own: using up the Seder horseradish does not make a chicken festive.
    - festive
    # You can make this and stash it for later. A separate axis from
    # `make-ahead` and never a co-tag of it.
    - freezable
    # This could be dinner. Never with dessert, sweet snack, ice cream, drinks
    # or nibbles; asked about with bakes, extras, starter, breakfast or hot
    # snack. Egg dishes and savoury pancakes are breakfast or a snack, never a
    # main; a vegetable fritter or griddle cake may be one.
    - main
    # A substantial part of the dish, or all of it, is prepared well before
    # serving without losing quality, and what is left for the day is trivial
    # (#216). Not a bake that merely keeps, not an overnight marinade whose
    # dish is still cooked at serving time, not a base recipe or condiment.
    - make-ahead
    # `cook_time: "None"`, which test_no_cook_tag_implies_no_cook_time holds
    # to the tag. Melting chocolate is prep, not cooking.
    - no-cook
    # Works as a first course at a dinner party.
    - starter

# Tags that imply other tags. An implied tag is sound when it is a rollup (a
# broader category someone browses) or a genuine affordance (something you
# could not have guessed). It is unsound when it is definitional or only
# sometimes true: `ice cream -> freezable` and `soup -> one-handed food` are
# deliberately absent on that test.
co_tags:
  ice cream:
    - dessert
    - make-ahead
  # Helen's ruling, not an inference: the mood is for mains only.
  herbivore-ish:
    - main

# What scripts/check_food_tags.py reads: a report, never a rule. Nothing here
# writes a tag and no test fails a recipe on one; a hint that fires says "worth
# an eye", and the recipe may well be right. Only tags the title or text can
# show have a hint; the judgement tags have none because there is none to find.
#   title            any of these as a whole word in the title, plural or not
#   ingredients_all  every one of these as a whole word in the ingredient items
#   text_any         any of these phrases in the tagline, method or notes
tag_hints:
  tags:
    salad:     { title: [salad] }
    soup:      { title: [soup] }
    ice cream: { title: [ice cream] }
    bakes:     { ingredients_all: [flour, sugar] }
    # There is no field for freezing, so the hint reads the prose for phrases
    # that are a claim. Bare `frozen` and `freeze` are deliberately absent:
    # they are frozen peas and every ice cream's last step.
    freezable:
      text_any:
        - freezes well
        - freeze well
        - freezable
        - frozen for up to
        - freeze for up to
        - keep frozen
        - in the freezer for up to
        - months in the freezer
        - can be frozen
        - freeze in portions
  star_ingredient:
    chocolate:  { title: [chocolate] }
    poultry:    { title: [chicken, turkey] }
    duck:       { title: [duck] }
    lamb:       { title: [lamb] }
    # Not `steak`: it fires on cauliflower steaks and venison steaks. A cut is
    # not an animal.
    beef:       { title: [beef] }
    pork:       { title: [pork] }
    oily fish:  { title: [salmon, mackerel] }
    white fish: { title: [cod, haddock] }
    shellfish:  { title: [prawn] }
    # Not `bean`: it fires on pork chops with butter beans, where the pork is
    # the point.
    legumes:    { title: [lentil, chickpea] }
    mushrooms:  { title: [mushroom] }

# Words that may open an ingredient tip or note with a capital (#71); every
# other first word must be lower case. Whether a word is a proper noun is
# Helen's call, not something a test can infer.
# test_ingredient_notes_are_lowercase_fragments checks only the first word, so
# a compound name (Maris Piper, Granny Smith) is listed as its separate words.
proper_nouns:
  - Aleppo
  - Bart
  - Brussels
  - Cab
  - Caesar
  - Calvados
  - Ceylon
  - Cheddar
  - Cheshire
  - Chinese
  - Delia
  - Demerara
  - Dijon
  - English
  - French
  - Gold
  - Granny
  - Greek
  - Gressingham
  - Guinness
  - Kalamata
  - Kallo
  - Kashmiri
  - Knorr
  - Lancashire
  - Maris
  - Marmite
  - Merlot
  - Morrisons
  - Norfolk
  - Parma
  - Parmesan
  - Piper
  - Sichuan
  - Skippy
  - Smith
  - Thai
  - Worcestershire
  - Yukon

# Names that are themselves spelled with an ampersand. House style is "and" in
# a title; test_no_ampersand_in_title waives only an exact phrase listed here,
# so a stylistic "&" still fails.
ampersand_proper_nouns:
  - "Ben & Jerry's"
