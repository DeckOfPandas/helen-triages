# =============================================================================
# THE VOCABULARY LAYER — single source of truth for the taxonomy.
#
# What exists, and how the terms relate to each other. Nothing about how any of
# it LOOKS: no colours, no labels, no CSS classes. Those live in
# _data/filter_sections.yml (labels, classes, order) and _sass (colour).
#
# Everything downstream reads this file:
#   index.html            builds the filter buttons from it
#   recipe_badges.html    decides which badge class a tag gets
#   tests/test_taxonomy.py enforces it against every recipe
#
# Adding a term here is all that is needed to make it real. A tag not listed
# here will render on a recipe page but will have no filter button, so nobody
# browsing the index can ever find it.
# =============================================================================

# -----------------------------------------------------------------------------
# Star ingredients
#
# The one thing a recipe is ABOUT. Declared, not derived: before this file
# existed the list was built by mapping over front matter, which meant a typo
# silently created a brand new star ingredient with one recipe under it.
#
# `star_ingredient` is OPTIONAL. Roughly a quarter of the collection leaves it
# blank, and that is correct — a plain sponge, a spice blend or a dressing has
# no hero ingredient, and inventing one for them would be worse than nothing.
#
# `something unusual` retired 2026-08-09, Helen's call: it's the only entry
# defined relative to a subjective, cultural norm rather than an actual food
# group, it isn't a real craving the way "beef" or "greens" are, and it was
# barely used (1 of 77 recipes) — and not even consistently: peanut-butter-
# cookies.md has the identical headline ingredient (peanut butter) and was
# left blank instead. peanut-butter-ice-cream.md, its one user, is blank now.
#
# `legumes` considered and NOT added, same date: only two candidate recipes
# existed (lemony-cavolo-nero-butter-bean-soup.md, pancetta-white-bean-
# stew.md, both already covered by `greens`/`pork`) — not enough to be a
# useful discriminator across the collection. Don't re-raise this on your
# own; Helen will bring it back if her own cooking makes it worth it.
#
# `eggs` retired 2026-08-09, reinstated 2026-08-12 (issue #187), both
# Helen's explicit call. The 2026-08-09 retirement was sound for the six
# members it was retired over (asparagus-gruyere-quiche, ben-jerrys-sweet-
# cream-base-1, delias-classic-pancakes, henrys-quick-bulletproof-
# hollandaise-sauce, henrys-sunday-waffles, mrs-nicholsons-yorkshire-
# puddings) — every one used egg as a technique or structural ingredient,
# not the thing the dish is actually about, and all six stayed blank. But
# by 2026-08-12 eight _food_drafts/ recipes had `star_ingredient: eggs`
# sitting invalid against the retirement, which is what surfaced this as a
# real, not hypothetical, question — checked recipe by recipe against the
# same test ("is egg the craving, or just doing technique/structural
# work"), not reinstated wholesale: ajitsuke-tamago (literally "seasoned
# egg", nothing else in the dish), green-baked-eggs, pink-eggs-beetroot-
# yogurt-chilli-butter (the poached eggs' colour is the tagline's own
# selling point), and spring-onion-feta-frittata kept eggs. quick-creme-
# brulees, spring-herb-goats-cheese-souffle (egg whites are the leavening
# mechanism, same reasoning that already correctly keeps dark-chocolate-
# souffles.md on "chocolate"), caramelised-leek-udon-sesame-fried-eggs
# (title's own head clause, before "with", is "Caramelised Leek Udon") and
# broad-bean-herb-and-ricotta-fritters (egg as fritter binder) went back to
# blank, the original retirement reasoning applied to them specifically.
# -----------------------------------------------------------------------------
star_ingredients:
  - beef
  - chocolate
  - duck
  - eggs
  - fruit
  - game
  - greens
  - lamb
  - oily fish
  - pork
  - poultry
  - root veg
  - shellfish
  - white fish

# Retired star_ingredient values, with the reason -- same shape as
# test_front_matter.py's RETIRED dict for front-matter fields. A value here
# is a NAME COLLISION waiting to happen: `star_ingredient` isn't declared
# anywhere else, so a retired value left in a file renders no filter button
# and looks like ordinary undeclared-star noise until you know the value used
# to mean something. test_star_ingredient_is_declared (test_taxonomy.py,
# test_drafts.py) checks this dict first so the failure names the reason
# instead of just "not declared" -- caught for real 2026-08-12: five drafts
# (hazelnut-paris-brest, leratos-tanzanian-banana-curry, matcha-white-
# chocolate-blondies, ukrainian-dumplings-chestnuts-kraut-filling,
# zucchini-orange-cake-with-pistachios) were still carrying `something
# unusual` three days after it was retired, invisible until someone actually
# read the test output rather than trusting a green run. All five are blank
# now, the correct state per the retirement note above.
retired_star_ingredients:
  something unusual: >-
    Retired 2026-08-09 -- defined relative to a subjective, cultural norm
    rather than an actual food group, not a real craving the way "beef" or
    "greens" are, and barely/inconsistently used. Not coming back -- blank
    the field, don't reintroduce it.

# -----------------------------------------------------------------------------
# Tags
#
# Two groups, deliberately different in kind:
#
#   mood            what you feel like eating -- a craving
#   practicalities  what the occasion or the recipe demands of you, regardless
#                   of what you feel like -- breakfast happens at breakfast
#                   time whether or not you crave it
#
# A recipe may carry any number from either group. Reclassified 2026-08-01:
# breakfast, extras, festive and starter moved out of mood on this test --
# nobody wakes up craving a starter, they're cooking for a dinner party and
# need one. showstopper stayed in mood on the same test: it IS a craving, for
# Helen specifically -- "let's make something unnecessarily complicated".
#
# -----------------------------------------------------------------------------
# `make-ahead` -- DEFINED 2026-08-16, GitHub issue #216, Helen's own words:
#
#   "a substantial part -- or the entirety -- of the dish can be prepared well
#   in advance of serving without losing quality, flavour or structural
#   integrity."
#
# The definition alone did not settle the collection, because three large
# groups of recipes can each be argued either way. Her rulings on all three,
# recorded so the tag stays applied the same way next time:
#
#   A BAKE THAT MERELY KEEPS IS NOT MAKE-AHEAD. "Will keep for three days in an
#   airtight tin" describes leftovers, not planning, and almost every cake in
#   the collection says it -- so counting it would make the tag mean roughly
#   "is a bake" and stop it narrowing anything. Same test that retired
#   `one-pot` for honestly covering 57% of the collection. A bake DOES qualify
#   when it is genuinely assembled ahead and finished later: a cheesecake set
#   overnight, an arctic roll, anything that has to wait.
#
#   AN OVERNIGHT MARINADE IS NOT MAKE-AHEAD. Satay, char siu, buttermilk
#   chicken: real advance work, but nothing is FINISHED ahead and the whole
#   dish still has to be cooked at serving time. It is a constraint on your
#   planning rather than a reduction in the work on the day, which is the
#   opposite of what someone browsing this tag wants.
#
#   THE EXCEPTION SHE DREW ON 2026-10-10, of a BBQ spatchcock duck rubbed a day
#   ahead: "keep make ahead -- the rub is the thing here, and roasting on the
#   day is trivial." So the test is where the WORK is, not whether heat is
#   applied on the day: if what is left for serving time is trivial, the dish
#   is make-ahead. A Christmas turkey buttered the day before is not, because
#   the roast is the work.
#
#   A BASE RECIPE OR CONDIMENT DOES NOT CARRY IT. A spice blend, a curry paste,
#   a dukkah, a lemon curd, a cranberry sauce: these have no "serving" to be
#   ahead of, so the tag tells you nothing you did not already know from what
#   the thing is. Removed from the nine that had it.
#
# FREEZABLE AND MAKE-AHEAD ARE SEPARATE AXES, and deliberately NOT a co-tag.
# Making freezable imply make-ahead was considered and rejected the same day:
# it would have forced the tag onto 19 files, about 11 of them the very cakes
# ruling A excludes, plus three freezable base recipes ruling C excludes --
# a rule that quietly overturns two others is worse than no rule. `freezable`
# answers "can I keep the leftovers", `make-ahead` answers "can I do this on
# Saturday". A dish may be either, both or neither.
#
# -----------------------------------------------------------------------------
# THE TWELVE THAT HAD NO WRITTEN MEANING -- AGREED 2026-10-10. Until then
# these were names in a list, which is why an ingest's proposals for them were
# hit and miss. A session drafted one line each and Helen answered "Agree on
# all", adding the test for `bakes` in her own words. (One of the twelve was
# then renamed the same day: `sweets` became `sweet snack`.)
#
#   bakes          a baked good out of the oven: cake, biscuit, bread, pastry.
#                  Not anything that merely goes in the oven. HER TEST: "would
#                  this appear on Great British Bake Off?" -- so chocolate
#                  mousse tartlets, with their baked pastry cases, are in.
#                  And, the same day: "Pizza dough, fondants, cheesecake (if
#                  the baked kind of cheesecake not the set kind of
#                  cheesecake), puddings and crumbles are all 'bakes'." The
#                  burger buns are in too, though they "gave me a moment".
#                  NOT bakes, also hers: a soufflé, and a beef Wellington
#                  ("10 is not a bake"), pastry or no pastry. A quiche is.
#                  Nor meringue swans, which gave the second half of the
#                  test: "No one gets in cosy baking mode and makes ad hoc
#                  swans with creme diplomat..." A BAKE IS WHAT YOU MAKE IN
#                  COSY BAKING MODE.
#   dessert        a pudding course you serve at the table.
#   sweet snack    small sweet things eaten by hand outside a meal: brownies,
#                  biscuits, fudge, truffles, a fairy cake, a scone. HER
#                  TEST: "would I serve it on a cake plate at 4 o clock after
#                  a long improving walk?"
#                  THIS TAG WAS `sweets` UNTIL 2026-10-10, and the name was
#                  the fault: "every single time I have to remind myself why
#                  it's not just toffee and chocolate truffles." Under the
#                  old name she ruled fairy cakes OUT; under the new one,
#                  the same afternoon, "Fairy cakes are in again now." It
#                  is `hot snack`'s twin, singular like it.
#                  A WHOLE CAKE SERVED IN SLICES IS NOT ONE. Asked outright,
#                  since the cake-plate test would let every loaf and sponge
#                  in: "No." It has to be made as individual pieces -- a
#                  biscuit, a bun, a muffin, a brownie square.
#   carbs party    the starch is the point: pasta, rice, potatoes, pies,
#                  dumplings.
#   cheese-tastic  cheese is the pleasure of the dish, not a garnish. FETA
#                  DOES NOT COUNT, even a whole baked block of it ("oooh,
#                  yeah, feta doesn't count for cheese-tastic"). Burrata
#                  does.
#   fakeaway       a home version of something you would order in.
#   hot snack      small, hot and eaten between meals: toasties, fritters,
#                  things on toast.
#   nibbles        finger food to pass round with drinks.
#   breakfast      eaten in the morning.
#   extras         not a dish by itself: sides, sauces, stocks, pickles, doughs.
#   festive        Christmas, or another named feast. The dish has to BE the
#                  feast's: a chicken that uses up the Seder horseradish is
#                  not festive, though a Rosh Hashanah honey cake is.
#   starter        works as a first course at a dinner party.
#
# -----------------------------------------------------------------------------
# `fiddly and fun` -- A NEW MOOD, 2026-10-10, AND WHAT IT TAKES OFF
# `showstopper`'s SHOULDERS.
#
# Helen: "I wonder if we need a 'I want to faff' tag ... Sometimes when I want
# to faff I choose to make fiddly desserts, but I honestly prefer savoury
# things, so remembering about e.g. tomato tarte tatin would scratch the itch
# for sure."
#
# `showstopper` was MEANT to be this -- the group note above has her calling it
# "let's make something unnecessarily complicated" -- but the name pulled it
# towards the RESULT, and it came to sit on a beef fillet that is seared and
# roasted and a venison loin that takes 15 minutes. She agreed it had drifted.
# So there are two tags now, one for each half:
#
#   fiddly and fun   you make it because you want to potter. Several
#                    components or stages, hands-on work, some precision. The
#                    PROCESS is the point, whatever it looks like at the end.
#   showstopper      it makes people gasp when it lands on the table. About
#                    the RESULT, however little work it took.
#
# A dish may carry both (macarons, a Wellington), the first alone (a quiche
# with pastry from scratch, a ganache, wontons) or the second alone (a roast
# fillet, a goose). Slow is not fiddly: a stew that sits in the oven for six
# hours is neither. Nor is threading skewers (the chicken satay: "isn't
# fiddly"). AND THE FIDDLE HAS TO BE ONE SHE WOULD ACTUALLY DO: the crab salad
# with homemade crispbreads is out, "because, come on, who's going to be
# making those crispbreads from scratch!!!"
#
# The name is hers, chosen over "make me think". It is a MOOD by this file's
# own test -- wanting to faff is a craving, not something an occasion demands
# -- which also puts it beside `dessert` and `bakes` in the filter, so picking
# it without them finds the savoury faff she was after.
# -----------------------------------------------------------------------------
#
# The other eight already had hers: `make-ahead` and `freezable` above,
# `one-handed food` and `drinks` beside `co_tags` below, `showstopper` in the
# group note above, `no-cook`, `virtuous` and `ice cream` in MANUAL §7.
# -----------------------------------------------------------------------------
tags:
  mood:
    - bakes
    - carbs party
    - cheese-tastic
    - dessert
    - drinks
    - fakeaway
    - fiddly and fun
    - hot snack
    - ice cream
    - nibbles
    - one-handed food
    - salad
    - showstopper
    - soup
    - sweet snack
    - virtuous

  practicalities:
    - breakfast
    - extras
    - festive
    - freezable
    - make-ahead
    - no-cook
    - starter

# -----------------------------------------------------------------------------
# Co-tags — tags that imply other tags.
#
# THE TEST FOR ADDING ONE: an implied tag is sound when it is either a ROLLUP
# (a broader category someone might browse, where you want this to appear) or a
# GENUINE AFFORDANCE (it tells you something you could not have guessed). It is
# unsound when it is DEFINITIONAL — true by the meaning of the words, and
# therefore carrying no information while quietly polluting the filter it
# belongs to.
#
# Two rules were removed in July 2026 on exactly that test:
#
#   ice cream -> freezable
#       Definitional. Ice cream lives in the freezer; that is not a property,
#       it is the definition. `freezable` should mean "you can make this and
#       stash it for later", which is a discovery. Filling that filter with
#       things that are trivially freezable makes it useless for the case it
#       exists to serve.
#
#   soup -> one-handed food
#       Unsound because it is only sometimes true. `one-handed food` means food
#       you can eat curled on the sofa, so anything that rolls, spills or has to
#       be chased or picked out disqualifies itself. Thick spoonable soups still
#       carry the tag; noodle soups, pho, wontons and tom kha gai no longer do.
#       Tagged by hand now, on the eating mechanics rather than the category.
#
#       A MEATBALL ON ITS OWN IS ONE-HANDED; IT IS THE COMPANY THAT DISQUALIFIES
#       IT. Helen, 2026-10-10, when a session proposed taking the tag off
#       Bronte's Swedish meatballs as "the chasing-with-a-fork case": "I think
#       chasing meatballs is funny, and I'd call that one-handed food if I
#       didn't also have to deal with e.g. spaghetti, or fish the meatballs
#       out of a soup." So the Swedish meatballs keep it; meatballs on
#       spaghetti or in a broth do not.
# -----------------------------------------------------------------------------
# `drinks` covers anything you make to drink that is not a cocktail — the frappé,
# a cordial, a hot chocolate. Cocktails proper belong to the sibling cocktails
# site; a frappuccino has no place in a cocktail book but certainly does in a
# recipe book.
co_tags:
  ice cream:
    - dessert
    - make-ahead

# -----------------------------------------------------------------------------
# Tag hints — what `scripts/check_food_tags.py` reads. A REPORT, NEVER A RULE.
#
# Measured 2026-10-08, when Helen asked whether food tags could be derived the
# way cocktail moods are. Every one- and two-feature rule was searched over 90
# published recipes and 359 drafts, and scored on recipes held out of the
# search. The answer was no deriver: the only tags the data can see are the
# ones the TITLE already says, and the ingest proposal gets those right anyway.
# What the same rules are good for is the opposite job -- noticing a draft
# whose tag and whose title disagree, for her to look at when she proofreads.
#
# So nothing here writes a tag, and no test fails a recipe on one. A hint that
# fires says "worth an eye", and the recipe may well be right: a chicken and
# chorizo stew can be about the pork.
#
# ONLY THE ONES THAT HELD UP ARE HERE. `salad`, `bakes` and the `chocolate`,
# `poultry` and `beef` stars scored .75 to .95 against her own published
# recipes with the rule found on drafts alone; `soup`, `ice cream`, `duck`,
# `lamb`, `white fish` and `shellfish` fit the drafts as well and have too few
# published recipes to confirm. `virtuous`, `carbs party`, `showstopper`,
# `festive`, `starter` and the other judgement tags scored at or below a
# search run on shuffled tags and have no hint, because there is none to find.
#
# SHAPE. `title:` is any of these as a whole word in the title, with or
# without a plural `s`. `ingredients_all:` is every one of these as a whole
# word somewhere in the ingredient items. `text_any:` is any of these phrases
# anywhere in the tagline, the method or the notes.
#
# `no-cook` HAS NO HINT BECAUSE IT ALREADY HAS A TEST. `cook_time: "None"` is
# the fact and the tag is the filter (test_no_cook_tag_matches_cook_time); on
# 2026-10-08 all 17 recipes with one had the other.
# -----------------------------------------------------------------------------
tag_hints:
  tags:
    salad:     { title: [salad] }
    soup:      { title: [soup] }
    ice cream: { title: [ice cream] }
    bakes:     { ingredients_all: [flour, sugar] }
    # `freezable` IS A CLAIM THE RECIPE MAKES IN ITS OWN WORDS, and there is no
    # field for it: 39 of the 51 recipes that carry the tag mention freezing
    # in a step, a note or the tagline, and the other 12 are stews and bakes
    # tagged from knowing they freeze. So the hint reads the prose, for the
    # phrases that are a CLAIM. Bare `frozen` and `freeze` are deliberately
    # absent: they are frozen peas, frozen cherries and every ice cream's
    # last step.
    freezable:
      text_any:
        - freezes well
        - freeze well
        - freezable
        - frozen for up to
        - freeze for up to
        - keep frozen
        - in the freezer for up to
        - months in the freezer
        - can be frozen
        - freeze in portions
  star_ingredient:
    chocolate:  { title: [chocolate] }
    poultry:    { title: [chicken, turkey] }
    duck:       { title: [duck] }
    lamb:       { title: [lamb] }
    # `steak` WAS HERE FOR ONE RUN and fired on cauliflower steaks and venison
    # steaks. A cut is not an animal.
    beef:       { title: [beef] }
    pork:       { title: [pork] }
    oily fish:  { title: [salmon, mackerel] }
    white fish: { title: [cod, haddock] }
    shellfish:  { title: [prawn] }

# -----------------------------------------------------------------------------
# Proper nouns
#
# GitHub issue #71: ingredient tips/notes are lower case except for proper
# nouns (the pronoun "I" is also always allowed, checked separately --
# it isn't a noun). Declared here for the same reason star_ingredients and
# tags are declared above: whether a word is a genuine proper noun (Parmesan)
# or just a sentence-initial capital that needs lowercasing (Preferably,
# Thaw, Use...) is Helen's judgement call, not something a test can infer.
# Seeded 2026-08-04 from words recurring across the recipe corpus (brands,
# place names, demonyms, cultivar names). test_ingredient_annotation_style
# only checks the FIRST WORD of a tip/note, so compound names (Maris Piper,
# Granny Smith, Yukon Gold) are split into their individual words -- either
# one could plausibly open a sentence.
# -----------------------------------------------------------------------------
proper_nouns:
  - Aleppo
  - Bart
  - Brussels
  - Cab
  - Caesar
  - Calvados
  - Ceylon
  - Cheddar
  - Cheshire
  - Chinese
  - Delia
  - Demerara
  - Dijon
  - English
  - French
  - Gold
  - Granny
  - Greek
  - Gressingham
  - Guinness
  - Kalamata
  - Kallo
  - Kashmiri
  - Knorr
  - Lancashire
  - Maris
  - Marmite
  - Merlot
  - Morrisons
  - Norfolk
  - Parma
  - Parmesan
  - Piper
  - Sichuan
  - Skippy
  - Smith
  - Thai
  - Worcestershire
  - Yukon

# -----------------------------------------------------------------------------
# Ampersand proper nouns
#
# House style is "and", never "&", in a title (MANUAL.md §5)
# -- but a real brand or proper name that is itself spelled with an ampersand
# ("Ben & Jerry's") would be misspelled by swapping it for "and". Same
# reasoning and same shape as proper_nouns above: whether an "&" is a genuine
# part of a name or just a lazy join is Helen's call, declared here rather
# than guessed at. test_no_ampersand_in_title only waives the ampersands
# actually covered by an exact phrase below -- anything else still fails, so
# a new stylistic "&" still needs fixing, not a new taxonomy entry.
# -----------------------------------------------------------------------------
ampersand_proper_nouns:
  - "Ben & Jerry's"
