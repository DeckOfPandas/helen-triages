# =============================================================================
# INGREDIENT SEARCH VOCABULARY
#
# Everything filters.js needs to know about ingredient WORDS. Lifted out of the
# JavaScript so that changing how search behaves is a YAML edit, not a code edit.
#
# index.html emits this as JSON in a <script type="application/json"> block and
# filters.js reads it at startup. No build tooling, no bundler — plain Jekyll.
# =============================================================================

search:
  # A query must be at least this long before "(all)" family buttons appear.
  #
  # THIS NUMBER LIVES HERE AND NOWHERE ELSE. It used to be a bare `>= 3` inside
  # filters.js with no definition behind it, which meant every rewrite of that
  # file re-derived it from scratch and landed on 2 — the intuitive default for
  # a substring search. It was not a bug, it was an absence of a definition.
  #
  # Two shows too much: with a two-character query, nearly every ingredient
  # matches something and the family buttons become noise rather than a
  # shortcut. Three is where the suggestions start being useful.
  family_button_min_chars: 3

# -----------------------------------------------------------------------------
# Modifiers — leading words the search UI strips before matching, so
# "chopped pistachios" and "pistachios" are treated as the one ingredient.
#
# Recipe files are NOT touched — main_ingredients keeps the word, because
# it's an accurate instruction there. This list only governs how the search
# box matches and labels things.
#
# Deliberately short, and deliberately NOT a general "strip adjectives" list.
# A word belongs here only if it describes a preparation state with no
# product distinction riding on it. Checked against every multi-word
# main_ingredients entry in the collection before being added — words that
# looked like candidates but were rejected because they mark a genuinely
# different product: "smoked" (smoked haddock vs haddock), "roasted"
# (roasted red peppers), "whole" (whole milk vs milk — note "ground" and
# "dried" have no such collision: nothing else in the collection is just
# "almonds"/"ginger"/"pasta"/"porcini" with a different qualifier, so
# stripping them loses no distinction the way stripping "whole" or "smoked"
# would).
#
# Those rejections still stand AS BLANKET STRIPS, which is the only thing
# this list can do: a word here fires on every entry that starts with it,
# sight unseen, now and for every recipe added later. "smoked", "roasted" and
# "toasted" are nonetheless collapsed for three SPECIFIC entries — see
# `aliases` below, and Helen's reasoning there for why avoidance asks a
# different question of them than searching does. A named phrase can be judged
# one at a time; a word on this list cannot be judged at all.
modifiers:
  - chopped
  - crispy
  - ground
  - dried
  - leftover
  # "gressingham" is a different KIND of exception to the rest of this list —
  # it's a breed/brand qualifier, not a preparation state, so it doesn't pass
  # the "no product distinction" test the others do. It's here anyway, at
  # Helen's explicit call: "duck leg" and "Gressingham duck legs" aren't
  # meaningfully distinct results for a decision-support search, even though
  # they're genuinely different products on a shelf. Not a precedent for
  # stripping other brand names without asking first.
  - gressingham

# -----------------------------------------------------------------------------
# Quantity units — the unit words that may follow a leading NUMBER in an
# `item:` string, and are dropped with it. GitHub issue #273.
#
# The exclude filter's vocabulary is DERIVED from `item:` free text rather
# than from the curated main_ingredients, so it inherits every way a recipe
# happened to be written. Five recipes put the amount in `item:` instead of
# `amount:` — "1 tsp salt", "150 g gruyère", "4–5.5 kg fresh goose" — and the
# picker duly offered the quantity as if it were the ingredient's name. The
# recipes are the real bug and are being reported separately; this makes the
# picker survive them, because it will happen again.
#
# THE RULE IS DELIBERATELY NARROW, and narrower than it could be. Only a
# leading token made ENTIRELY of digits, vulgar fractions and the characters
# that join them (". / - – —") is treated as a quantity, and only the unit
# words listed here are dropped after it. That means "3-bone rib of beef" and
# "70% dark chocolate" keep their first word: both tokens carry a letter or a
# percent sign, so neither is a bare number, and neither gets touched. Both
# are under-strips, and that is the intended trade — for an EXCLUDE filter,
# under-stripping is visible and annoying while over-stripping silently
# merges two ingredients and hides recipes the cook never meant to exclude.
#
# Multi-word units are listed as their own single words ("fl", "oz"): the
# strip drops every consecutive unit word after a number, so "3 fl oz" goes
# in one pass without needing a phrase form. No unit here is also an
# ingredient name anywhere in the collection — checked before adding, the
# same way `modifiers` and `never_family` were.
quantity_units:
  - g
  - kg
  - mg
  - ml
  - cl
  - l
  - tsp
  - tbsp
  - fl
  - oz
  - lb

# -----------------------------------------------------------------------------
# Measure phrases — whole leading phrases meaning "some of", stripped so the
# entry is the ingredient. GitHub issue #273.
#
# "a few sprigs of fresh thyme" is fresh thyme; "a good pinch of salt" is
# salt. Seven derived entries were being offered as a portion size rather
# than as a food.
#
# WHOLE PHRASES, NOT WORDS, and that is the whole point. A general rule —
# strip anything before an "of" — would take "bicarbonate of soda" down to
# "soda" and "cream of tartar" to "tartar", inventing merges the cook never
# asked for. Each phrase here is matched literally at the front of the entry,
# including its leading "a" and trailing "of", so it can only ever fire on
# text that was actually written that way. Add to it by finding the real
# entry that needs it, not by imagining phrases that might appear.
#
# Longest match wins, so a phrase that contains a shorter one still strips in
# full. Never strips the entire entry: something always survives.
measure_phrases:
  - a few handfuls of
  - a few sprigs of
  - a glass of
  - a good pinch of
  - a large handful of
  - a pat of

# GitHub issue #281, 2026-08-16. The six above came from main_ingredients,
# where a stray portion word is rare. These came from reading all 1421 DERIVED
# entries -- the exclude picker's vocabulary, built from raw `item:` lines
# written for a cook rather than for a filter -- and every one below has at
# least one real entry behind it. Counts where they matter: "handful of" 20,
# "pinch of" 14, "small bunch of" 10, "small handful of" 9.
#
# THE TRAPS ARE THE POINT. "bicarbonate of" (2 entries) and "cream of" (1) are
# deliberately ABSENT: they end in "of" and lead an entry, and stripping them
# would hand back "soda" and "tartar" -- the exact merge the section header
# above warns about. Read the real list before adding to this one.
  - a bunch of
  - a handful of
  - a knob of
  - a pinch of
  - a splash of
  - balls of
  - bunch of
  - cloves of
  - dash of
  - drizzle of
  - few dashes of
  - fillets of
  - glug of
  - grated thumb-sized piece of
  - grating of
  - green tops of
  - handful of
  - handfuls of
  - jar of
  - knob of
  - large knob of
  - large sprig of
  - leg of
  - mixture of
  - nests of
  - pack of
  - pats of
  - piece of
  - pinch of
  - pinches of
  - rashers of
  - shoulder of
  - slice of
  - small bunch of
  - small handful each of
  - small handful of
  - small pinch of
  - splash of
  - sprig of
  - sprigs of
  - squeeze of
  - the rest of
  - thumb-sized piece of
  - tins of
  - white ends of

# The same habit without the "of": a container standing in for a quantity.
# "can chickpeas" is chickpeas; "rashers smoked streaky bacon" is bacon. 44
# derived entries read this way.
#
# SAFE BECAUSE stripMeasurePhrase MATCHES `phrase + ' '`: "can " cannot fire on
# "cannellini beans", and bare "cloves" (the spice) is untouched because there
# is no trailing space to match -- only "cloves garlic" strips. That trailing
# space is load-bearing; a word-list version of this would destroy both.
  - balls
  - big sprigs
  - bunch
  - bushy sprigs
  - can
  - cans
  - cloves
  - fillets
  - handful
  - heads
  - jar
  - pack
  - pinch
  - rashers
  - slice

# A second pass over what survived the first (issue #281, same day). Mostly
# the singular or "of"-less twin of a phrase already above -- "sprigs thyme"
# beside "sprigs of thyme", "small bunch basil" beside "small bunch of basil".
#
# "a little" AND "a little extra" CARRY THEIR LEADING "a" FOR A REASON, and it
# is the same trap as bicarbonate of soda: the collection contains "little gem
# lettuce", "little gem lettuces" and "large little gem lettuce". A bare
# "little" would strip all three down to "gem lettuce", inventing a vegetable.
# The "a" is what makes the phrase mean "a small amount of" rather than an
# adjective attached to the name.
#
# "a few tbsp" sits beside "a few" so the longest-match rule can take the whole
# thing: "a few" alone would leave "tbsp chopped roasted pistachios".
  - a few
  - a few tbsp
  - a little
  - a little extra
  - dash
  - large handful of
  - small bunch
  - small handful
  - sprig
  - sprigs
  - tin

# -----------------------------------------------------------------------------
# Trailing phrases — instructions to the cook that got written into `item:`
# after the ingredient, stripped from the END. GitHub issue #273.
#
# "herbs to taste" is herbs; "sriracha to serve" is sriracha. These are not
# part of any ingredient's name — they say when or how much, which is a
# method note that happens to have landed in the item string.
#
# Mirrors `measure_phrases` at the other end of the entry, and is a separate
# list for the same reason `modifiers` and `stopwords` are separate: the
# position is the rule. A word list stripped from anywhere would catch the
# "to" in a name; these four phrases can only fire where they actually mean
# what they say.
#
# "to glaze" has no live example in _food_recipes/ today — it is here at
# Helen's call alongside the three that do, because the four are one habit
# and a picker that handles three of them is a trap for the fourth.
trailing_phrases:
  - to taste
  - to serve
  - to glaze
  - to garnish

# -----------------------------------------------------------------------------
# Stopwords — connector words that never count as a match target, wherever
# they fall in an entry. "chicken thighs and drumsticks" contains "and", so
# typing "a" matched it; "pork or turkey mince" contains "or", so typing "o"
# matched that and "leg of lamb" too. Neither is a real ingredient word.
#
# The first example is collapsed to "chicken" by `aliases` below and no longer
# exists as an entry — the rule it illustrates does, for every compound
# `aliases` doesn't name ("pork or turkey mince" and "leg of lamb" are both
# still live) and for every one written into a recipe tomorrow. Aliases name
# phrases one at a time; this list is what handles the ones nobody has looked
# at yet.
#
# Different from `modifiers`: modifiers are stripped from the FRONT and
# change the canonical entry ("chopped pistachios" becomes "pistachios"
# everywhere, including the button label). Stopwords are invisible to
# MATCHING ONLY, wherever they sit in the phrase — the display text keeps
# "and"/"or"/"of" exactly as written, because dropping them would leave a
# broken sentence ("chicken thighs drumsticks"), not a cleaner ingredient
# name.
#
# Checked against every multi-word main_ingredients entry: these four are
# the only connector words that actually appear as their own word anywhere
# in the collection.
stopwords:
  - and
  - or
  - of
  - with

# -----------------------------------------------------------------------------
# Never-family words — first words that head 2+ entries but should never earn
# an "(all)" button, because the entries sharing them aren't a real family.
#
# Different from `modifiers` above: these words are NOT stripped. "red onion"
# stays "red onion" — "red" is a genuine, meaningful variety, the same way
# "smoked" and "whole" are (see the modifiers comment). The problem isn't the
# word, it's treating everything that happens to start with it as one group:
# "red (all)" would lump together red wine, red onion and red Thai curry
# paste, which have nothing in common but the word "red". Nobody searching
# thinks "what can I cook with some kind of red".
#
# Every word here was checked against the real data first. Most head at
# least two main_ingredients entries that are otherwise unrelated foods,
# purely coincidentally sharing a colour or variety word, and are never
# themselves a standalone ingredient — "cherry" and "oyster" don't qualify
# on that test (bare "cherries" and oyster as a shellfish are real
# ingredients), so they get their own handling in `family_exceptions` below
# instead.
#
# "tomato" and "fennel" are exceptions to the "never standalone" test — both
# ARE real ingredients — but earn a place here anyway: once "tomato ketchup"
# is correctly excluded (see family_exceptions), the only other tomato
# member is "tomato purée", and once "fennel seed"/"fennel seeds" correctly
# collapse into one entry (see `singulars`), the only other fennel member is
# "fennel seed" itself. A purée and a spice are both background
# flavour-builders used by the tablespoon or teaspoon, not something you'd
# reach for the way you'd reach for a tomato or a fennel bulb. A two-member
# family whose members don't actually substitute for each other isn't a
# useful "(all)" any more than a coincidental one is — the real test
# throughout this list is "would a user think of these as some kind of the
# same thing", and word-sharing is only the most common way to fail it.
never_family:
  - mixed
  - red
  - white
  - brown
  - dark
  - golden
  - green
  - soft
  - sweet
  - baby
  - hot
  - light
  - pearl
  - plum
  - salted
  - spring
  - thai
  - whole
  - tomato
  - fennel

# -----------------------------------------------------------------------------
# Family exceptions — specific entries excluded from counting towards their
# own head word's family, because they aren't really a kind of that word at
# all, just a coincidental compound name. "cherry tomatoes" isn't a cherry;
# "oyster mushrooms" aren't related to oysters, they're named for their shape.
#
# Different from `never_family`: the WORD still heads a family if a genuine
# member justifies one. Here, neither word does — "cherry" and "oyster" both
# lose their (all) button entirely, because once the impostor is excluded,
# nothing legitimate is left to group (bare "cherries" and "oyster sauce"
# are the only real members, one each). ("tomato ketchup" isn't listed here
# any more — "tomato" moved to never_family outright, once its only other
# member, "tomato purée", turned out not to be a good enough reason to keep
# the family either.)
#
# These entries still show up as normal individual search results — this
# only stops them being swept into an (all) button under a word they don't
# actually belong to.
family_exceptions:
  - cherry tomatoes
  - oyster mushrooms

# -----------------------------------------------------------------------------
# Aliases — whole-phrase entry on the left, what it becomes on the right.
# THREE FORMS, ONE MECHANISM:
#
#   a NAME        five-spice powder: five-spice
#                 A RENAME. The entry collapses into that one, and only the
#                 right-hand form ever appears as a search result.
#
#   a LIST        beef or venison stock: [beef stock, venison stock]
#                 A SPLIT. One written item naming two foods becomes both,
#                 so each can be picked on its own.
#
#   an EMPTY LIST flavouring or fruit: []
#                 A DROP, for an entry that names no food at all and so can
#                 never be a useful thing to search for or avoid.
#
# A single name and a one-item list mean the same thing; the bare name is
# kept because it reads better and because it is what was already here.
#
# Different from `singulars`: singulars normalises one WORD for MATCHING only
# ("chicken legs" still displays as "chicken legs", it just also matches
# "chicken leg"). This collapses, splits or drops whole master-list entries —
# the same "duck leg"/"Gressingham duck legs" call already made for
# `modifiers`' "gressingham" entry, just phrased for a whole phrase instead
# of a leading word.
#
# "five-spice" (five-spice-crispy-duck-legs.md) and "five-spice powder"
# (gordons-christmas-five-spice-roast-goose.md) are the one product, written
# two ways across two recipes — five-spice-powder.md, the ingredient's own
# page, is titled "Five-Spice Powder". Typing "five" used to surface three things:
# "five-spice", "five-spice powder", and a "five (all)" umbrella over just
# those two — Helen: collapse the two into one, and don't add a family
# button for a "family" that's actually one ingredient spelled two ways.
# Collapsing them to a single master-list entry does both at once: with
# only one entry left, "five (all)" no longer has 2+ members to group.
#
# Not a general "strip trailing powder" rule — "cocoa powder" stays as
# written: most "powder" entries mark a real product difference (chilli
# powder vs. chilli), so this only ever collapses phrases explicitly listed
# here.
#
# THAT IS THE PROPERTY THE WHOLE LIST RESTS ON, and it is why the thirty-four
# entries added below for GitHub issue #273 are named one at a time instead of
# derived by a rule. The exclude picker's vocabulary is built from `item:`
# free text rather than from curated main_ingredients, so it inherits every
# way a recipe happened to be written: items naming two foods at once ("beef
# or venison stock"), items naming none ("seasoning and flavourings — see
# note"), and preparation states the leading-word `modifiers` strip can't
# reach ("boneless skinless chicken breast"). A general "split on and/or" rule
# would coin an entry called "whatever you prefer" and would halve any name
# with a connector inside it; a general prep-stripper would have to be trusted
# never to reach "apple cider vinegar". A named phrase cannot reach anything
# it does not name — which matters most for an EXCLUDE filter, where
# under-stripping is visible and annoying while over-stripping silently merges
# two ingredients and hides recipes the cook never meant to exclude.
#
# SMOKED, ROASTED AND TOASTED ARE IN THE LIST, and Helen's reasoning settles
# the category rather than the three entries it names: "No one is going to
# dislike sesame oil but not toasted sesame oil, and this isn't an allergen
# avoider tool." The distinction those words mark is real when you are
# SEARCHING — smoked haddock is a different thing to buy, which is exactly why
# `modifiers` still refuses to strip them for everyone — but this vocabulary
# serves AVOIDANCE, where the only question is "does this dish contain the
# thing I don't like", and both forms answer yes. Named phrase by phrase here
# rather than added to `modifiers`, because a modifier fires on every entry
# beginning with the word, everywhere, while a named phrase reaches only
# itself: "smoked haddock" and "dry roasted peanuts" are not keys and come
# through exactly as written.
#
# FOUR OF THE #273 KEYS ALSO OCCUR IN main_ingredients, so the include picker
# — which goes through the same buildMasterList — sees them too: "roasted
# peanuts" becomes peanuts, "smoked mackerel fillets" becomes mackerel,
# "chicken thighs and drumsticks" becomes chicken, "cooked chestnuts" becomes
# chestnuts, in the include list as well as the exclude one. Recorded rather
# than quietly accepted: the ruling above was made about avoidance, and
# whether the same merge is right for the include picker is a separate
# question nobody has been asked. If the answer turns out to be no, the fix is
# to run this list over the derived vocabulary only.
#
# KEYS ARE THE POST-STRIP FORM — what an entry looks like once the quantity,
# measure-phrase, trailing-phrase and modifier strips have run, because that
# is the form applyAlias() is handed. "chopped almonds or whatever you prefer"
# is keyed as "almonds or whatever you prefer"; "sorrel or more to taste" as
# "sorrel or more". Every key below was checked against the real derived
# vocabulary of a build — a key matching nothing would sit here inert while
# looking like it was doing something.
#
# APPLIES TO BOTH SIDES. The picker's vocabulary and each recipe row's own
# entries go through the one buildMasterList, so a row that lists "beef or
# venison stock" carries beef stock and venison stock too — and exclusion,
# being set membership, only works because both sides were rewritten.
# -----------------------------------------------------------------------------
aliases:
  five-spice powder: five-spice
  # GitHub issue #273 — the derived vocabulary's compounds and prep states.
  almonds or whatever you prefer: almonds
  barley or brown rice miso: miso
  beef or venison stock: [beef stock, venison stock]
  black sesame seeds and fresh coriander leaves: [black sesame seeds, fresh coriander leaves]
  bone-in chicken thighs: chicken thighs
  boneless skinless chicken breast: chicken breast
  chicken thighs and drumsticks: chicken
  coconut oil or olive oil: [coconut oil, olive oil]
  cooked and peeled beetroot: beetroot
  cooked chestnuts: chestnuts
  crème fraîche or double cream: [crème fraîche, double cream]
  crème fraîche or single cream: [crème fraîche, single cream]
  flatbreads or rice: [flatbreads, rice]
  flavouring or fruit: []
  fresh or frozen cranberries: cranberries
  grated fresh galangal: fresh galangal
  grated fresh ginger: fresh ginger
  grated parmesan: parmesan
  greens like broccoli and pak choi: [broccoli, pak choi]
  groundnut or canola oil: [groundnut oil, canola oil]
  handful of fresh chives and/or parsley: [fresh chives, parsley]
  large handful each of tarragon and flat-leaf parsley: [tarragon, flat-leaf parsley]
  lemon or 30 ml lemon juice: lemon
  roasted peanuts: peanuts
  salmon or trout fillets: [salmon, trout fillets]
  salt and plenty of pepper: [salt, pepper]
  sea salt and freshly ground black pepper: [sea salt, black pepper]
  seasoning and flavourings — see note: []
  smoked mackerel fillets: mackerel
  sorrel or more: sorrel
  steamed white or sticky rice: rice
  toasted sesame oil: sesame oil
  vegetable stock powder or 1 organic vegetable stock cube: vegetable stock
  woody herb sprigs such as thyme or rosemary: [thyme, rosemary]

  # GitHub issue #281, 2026-08-16 -- the derived vocabulary, read end to end.
  #
  # COMPOUNDS, split only where BOTH halves are already a known ingredient
  # somewhere in the collection. Helen's call, and the conservative half of a
  # real choice: a blind split on " or " turns "a little red or purple food
  # colouring" into "red", inventing an ingredient nobody wrote. 94 compounds
  # are deliberately left whole for that reason and listed in the issue.
  butter or olive oil: [butter, olive oil]
  chicken or vegetable stock: [chicken, vegetable stock]
  clotted cream or crème fraîche: [clotted cream, crème fraîche]
  cottage cheese or crème fraîche: [cottage cheese, crème fraîche]
  cream or 100 g mascarpone: [cream, mascarpone]
  cream or custard: [cream, custard]
  currants or raisins: [currants, raisins]
  custard or cream: [custard, cream]
  fine semolina or plain flour: [fine semolina, plain flour]
  ghee or vegetable oil: [ghee, vegetable oil]
  hummus or yoghurt: [hummus, yoghurt]
  kale or cavolo nero: [kale, cavolo nero]
  kosher salt or 4 tsp fine sea salt: [kosher salt, fine sea salt]
  lamb or chicken stock: [lamb, chicken stock]
  maple syrup or honey: [maple syrup, honey]
  natural yoghurt or milk: [natural yoghurt, milk]
  oil or butter: [oil, butter]
  parmesan or pecorino: [parmesan, pecorino]
  pecorino or parmesan: [pecorino, parmesan]
  pork or turkey mince: [pork, turkey mince]
  rice or cider vinegar: [rice, cider vinegar]
  rock sugar or caster sugar: [rock sugar, caster sugar]
  shallots or onions: [shallots, onions]
  soy sauce or tamari: [soy sauce, tamari]
  sugar or honey: [sugar, honey]
  sunflower oil or butter: [sunflower oil, butter]
  toasted sesame oil or vegetable oil: [sesame oil, vegetable oil]
  vanilla bean paste or vanilla extract: [vanilla bean paste, vanilla extract]
  vanilla or almond extract: [vanilla, almond extract]
  whipped cream or crème fraîche: [whipped cream, crème fraîche]
  white wine or cider vinegar: [white wine, cider vinegar]
  white wine or stock: [white wine, stock]
  white wine vinegar or cider vinegar: [white wine vinegar, cider vinegar]

  # CITRUS BY WAY OF ITS JUICE OR ZEST. Helen's call: excluding "lemon" should
  # hide a recipe that uses only its juice, because someone avoiding lemon
  # means the flavour, not the fruit's physical body. Written out one entry at
  # a time rather than as a "juice of" measure phrase, because measure phrases
  # strip AFTER the quantity strip has already run -- "juice of 2 lemons" would
  # be left as "2 lemons", which is worse than leaving it alone.
  finely grated zest 1 orange: orange
  finely grated zest and juice of ½ lime: lime
  finely grated zest of 1 lemon: lemon
  juice 1 lime: lime
  juice and zest of ½ a lime: lime
  juice of 1 lemon: lemon
  juice of 2 limes: lime
  juice of ½ lemon: lemon
  zest and juice of 1 orange: orange
  zest of 1 orange: orange
  zest of 2 lemons: lemon
  zest of ½ orange: orange

  # Quantities the strip cannot reach, for the same ordering reason: a leading
  # "about" blocks stripLeadingQuantity, and by the time a measure phrase could
  # remove it the quantity strip has been and gone. Three entries, so they are
  # named rather than given a mechanism.
  about 2 tbsp vegetable oil: vegetable oil
  about 200 g raw king prawns: king prawns
  about 75 g seaweed: seaweed

  # A clove of garlic is garlic. Ten spellings of the same thing, none of which
  # a cook excluding garlic would want to hunt for separately. The spice
  # "cloves" is NOT in this list and stays its own entry -- see the note on the
  # trailing space in measure_phrases.
  cloves garlic: garlic
  crushed garlic clove: garlic
  fresh garlic cloves: garlic
  garlic clove: garlic
  garlic cloves: garlic
  large garlic clove: garlic
  large garlic cloves: garlic
  medium cloves garlic: garlic
  small garlic clove: garlic
  small garlic cloves: garlic

# -----------------------------------------------------------------------------
# Display names — the entry on the left (a master-list/alias TARGET, after
# collapsing) shows as the text on the right, for the button label only.
#
# Kept separate from `aliases` on purpose: matching still runs against the
# left-hand key ("five-spice"), because that's the literal text that has to
# overlap with what's actually in main_ingredients for at least one recipe
# ("five-spice" in five-spice-crispy-duck-legs.md). "Chinese five-spice
# powder" appears in neither recipe's main_ingredients verbatim — using it
# as the match key itself would match zero recipes. This only swaps the
# label shown on the button and pre-filled into the search box once
# selected; what gets matched against recipes never changes.
# -----------------------------------------------------------------------------
display_names:
  five-spice: Chinese five-spice powder

# -----------------------------------------------------------------------------
# Singulars — plural form on the left, the form to match on, on the right.
#
# Used to normalise ingredient words before comparison, so that "chicken legs"
# and "chicken leg" collapse to the same entry rather than both appearing.
# Only irregular or non-obvious plurals need listing.
# -----------------------------------------------------------------------------
singulars:
  anchovies: anchovy
  apples: apple
  beans: bean
  berries: berry
  breasts: breast
  cashews: cashew
  cheeks: cheek
  cherries: cherry
  chips: chip
  chops: chop
  cloves: clove
  eggs: egg
  fillets: fillet
  leaves: leaf
  legs: leg
  mussels: mussel
  noodles: noodle
  olives: olive
  oranges: orange
  peaches: peach
  potatoes: potato
  prawns: prawn
  ribs: rib
  sardines: sardine
  scallops: scallop
  seeds: seed
  steaks: steak
  thighs: thigh
  tomatoes: tomato

# -----------------------------------------------------------------------------
# Synonyms — the collapse behaviour.
#
# When a query exactly matches a key, any ingredient containing any of the
# listed words counts as a match, and the key earns a forced "(all)" button.
# This is what makes searching "cheese" return Cheshire, cheddar and mozzarella.
#
# The key should always appear in its own list, so that a literal match still
# works.
#
# DO NOT add unaccented variants here. `comte` and `gruyere` used to be listed
# as accent workarounds, which had the unwanted effect of making those queries
# return the ENTIRE cheese family rather than the one cheese. filters.js now
# strips diacritics when matching, so the accented spelling is the only entry
# needed and typing without accents still works.
# -----------------------------------------------------------------------------
synonyms:
  pasta:
    - pasta
    - spaghetti
    - tagliatelle
    - linguine
    - pappardelle
    - fettuccine
    - farfalle
    - fusilli
    - penne
    - rigatoni
    - conchiglie
    - orecchiette
    - orzo
    - macaroni
    - lasagne
    - lasagna
    - gnocchi
    - tortellini
    - ravioli
    - cannelloni

  cheese:
    - cheese
    - cheddar
    - parmesan
    - parmigiano
    - gruyère
    - mozzarella
    - ricotta
    - feta
    - brie
    - camembert
    - gouda
    - stilton
    - gorgonzola
    - manchego
    - pecorino
    - halloumi
    - burrata
    - mascarpone
    - cream cheese
    - cottage cheese
    # Named cheeses that no longer carry the word "cheese" in main_ingredients,
    # so they need listing explicitly to stay findable under a "cheese" search.
    - cheshire
    - lancashire
    - comté
    - swiss

  stock:
    - stock
    - broth

  # GitHub issue #59: flour is always the TRAILING word in this corpus
  # ("plain flour", "self-raising flour") — never the first — so it can
  # never form a family the structural, first-word-only way. Cornflour is
  # deliberately excluded: a different product (cornstarch), not a wheat
  # flour, the same call already made for "cherry tomatoes" not counting
  # towards "cherry".
  flour:
    - flour
    - plain flour
    - self-raising flour
    - plain white flour
