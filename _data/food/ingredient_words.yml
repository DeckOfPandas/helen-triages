# Everything the ingredient pickers know about ingredient words. food/index.html
# emits this file as JSON for the index scripts, so changing how search behaves
# is an edit here and no code. The pipeline is in assets/js/ingredient-search.js
# (`normaliseEntry`, then `applyAlias`): trailing phrase, leading quantity,
# measure phrase, modifier, alias.
# The exclude picker's vocabulary is derived from raw `item:` text. For it,
# over-stripping silently merges two ingredients and hides recipes the cook
# never meant to exclude, while under-stripping is only a visible duplicate:
# when unsure, leave an entry alone. DECISIONS §8.

search:
  # A query must be at least this long before "(all)" family buttons appear.
  # Defined here and nowhere else. At two characters nearly every ingredient
  # matches and the family buttons are noise.
  family_button_min_chars: 3

# Leading words stripped before matching and labelling, so "chopped
# pistachios" and "pistachios" are one ingredient. Recipe files keep the word.
# A word here fires on every entry that starts with it, in every later recipe
# too, so it belongs only if no cook would treat the two forms as different
# when deciding what to leave out. Deliberately absent, each marking a
# different product: smoked, roasted, toasted, whole, baby, all-butter,
# wholemeal, wholewheat. One phrase that needs collapsing is an alias instead.
modifiers:
  - chopped
  - crispy
  - ground
  - dried
  - leftover
  # A butchery state, or the state the shop sold it in (#366).
  - boneless
  - skinless
  - ready-rolled
  # Size describes the instance, not the ingredient.
  - large
  - medium
  - medium-sized
  - small
  # These qualify the shopping, not the ingredient. `dried` is stripped, so
  # its twin `fresh` is too.
  - fresh
  - free-range
  - organic

  # A breed name, not a preparation state: the one exception, and not a
  # precedent for stripping other brand names without asking Helen.
  - gressingham

# Unit words dropped along with a leading number, for an `item:` that carries
# its own amount ("150 g gruyère", #273). Only a leading token made entirely
# of digits, fractions and their joining characters counts as a number, so
# "3-bone rib of beef" and "70% dark chocolate" keep their first word.
# Multi-word units are listed as single words ("fl", "oz"): every consecutive
# unit word goes. No unit here may also be an ingredient's name.
quantity_units:
  - g
  - kg
  - mg
  - ml
  - cl
  - l
  - tsp
  - tbsp
  - fl
  - oz
  - lb

# Leading phrases meaning "some of", stripped so the entry is the ingredient:
# "a few sprigs of fresh thyme" is fresh thyme (#273, #281). Whole phrases
# matched literally at the front, never a general "strip before of" rule:
# "bicarbonate of" and "cream of" are deliberately absent, because stripping
# them leaves "soda" and "tartar". Longest match wins, and an entry is never
# stripped to nothing. Add a phrase only for a real entry that needs it.
measure_phrases:
  - a few handfuls of
  - a few sprigs of
  - a glass of
  - a good pinch of
  - a large handful of
  - a pat of
  - a bunch of
  - a handful of
  - a knob of
  - a pinch of
  - a splash of
  - balls of
  - bunch of
  - cloves of
  - dash of
  - drizzle of
  - few dashes of
  - fillets of
  - glug of
  - grated thumb-sized piece of
  - grating of
  - green tops of
  - handful of
  - handfuls of
  - jar of
  - knob of
  - large knob of
  - large sprig of
  - leg of
  - mixture of
  - nests of
  - pack of
  - pats of
  - piece of
  - pinch of
  - pinches of
  - rashers of
  - shoulder of
  - slice of
  - small bunch of
  - small handful each of
  - small handful of
  - small pinch of
  - splash of
  - sprig of
  - sprigs of
  - squeeze of
  - the rest of
  - thumb-sized piece of
  - tins of
  - white ends of

  # A container standing in for a quantity, with no "of": "can chickpeas".
  # Safe only because the strip matches the phrase plus a trailing space:
  # "can" cannot fire on "cannellini beans", and bare "cloves" (the spice) is
  # untouched.
  - balls
  - big sprigs
  - bunch
  - bushy sprigs
  - can
  - cans
  - cloves
  - fillets
  - handful
  - heads
  - jar
  - pack
  - pinch
  - rashers
  - slice

  # "a little" carries its leading "a" so that "little gem lettuce" is not
  # stripped to "gem lettuce". "a few tbsp" sits beside "a few" so the longest
  # match takes the whole thing.
  - a few
  - a few tbsp
  - a little
  - a little extra
  - dash
  - large handful of
  - small bunch
  - small handful
  - sprig
  - sprigs
  - tin

# Instructions written into `item:` after the ingredient, stripped from the
# end: "sriracha to serve" is sriracha (#273). Whole phrases at the end only;
# a word list would catch the "to" inside a name. Also handed to the recipe
# page's scaler (`data-trailing` in _layouts/recipe.html).
trailing_phrases:
  - to taste
  - to serve
  - to glaze
  - to garnish

# Connector words that never count as a match target, wherever they fall, so
# typing "o" does not match "pork or turkey mince" or "leg of lamb". Invisible
# to matching only: the label keeps them as written.
stopwords:
  - and
  - or
  - of
  - with

# First words that head two or more entries but never earn an "(all)" button,
# because the entries sharing them are not a family: "red (all)" would lump
# red wine with red onion. The word is not stripped. The test is whether a
# user would think of the members as kinds of the same thing: `tomato` and
# `fennel` are real ingredients, and are here because their only other
# members are a purée and a spice.
never_family:
  - mixed
  - red
  - white
  - brown
  - dark
  - golden
  - green
  - soft
  - sweet
  - baby
  - hot
  - light
  - pearl
  - plum
  - salted
  - spring
  - thai
  - whole
  - tomato
  - fennel

# Entries that do not count towards their head word's family because they are
# not a kind of it: cherry tomatoes are not cherries. They still appear as
# ordinary search results.
family_exceptions:
  - cherry tomatoes
  - oyster mushrooms

# Whole-entry rewrites, keyed on the post-strip form `applyAlias` is handed:
#   five-spice powder: five-spice                        a rename
#   beef or venison stock: [beef stock, venison stock]   a split
#   flavouring or fruit: []                              a drop: no food named
# An alias resolves one hop: never point at a key that is itself aliased
# (test_no_food_alias_points_at_another_alias, #1175). Each phrase is named,
# never derived by a rule such as "split on or". A descriptor that does not
# change what the thing is collapses; a different product keeps its entry.
aliases:
  five-spice powder: five-spice
  # No alias joins cornflour to "corn flour" or beansprouts to "bean sprouts"
  # (#619). An alias rewrites the picker's entries, but the include side
  # matches a row on its raw `main_ingredients`, so the merged chip would
  # match only half the recipes it names. On the exclude side each row's own
  # entries go through this list too, so a merge there is safe.
  vanilla bean paste: vanilla paste
  vanilla bean paste or extract: [vanilla paste, vanilla extract]
  vanilla extract or paste: [vanilla extract, vanilla paste]
  # Plurals offered beside their own singular. `singulars` cannot do this: it
  # normalises a word for matching and does not merge two entries. Singular
  # wins, so the label reads as the ingredient.
  apples: apple
  aubergines: aubergine
  banana shallots: banana shallot
  bananas: banana
  beef short ribs: beef short rib
  beetroots: beetroot
  black cardamom pods: black cardamom pod
  carrots: carrot
  celery sticks: celery stick
  chicken breasts: chicken breast
  chicken stock cubes: chicken stock cube
  cinnamon sticks: cinnamon stick
  courgettes: courgette
  cucumbers: cucumber
  eating apples: eating apple
  egg whites: egg white
  egg yolks: egg yolk
  eggs: egg
  free-range eggs: free-range egg
  green chillies: green chilli
  leeks: leek
  lemons: lemon
  limes: lime
  little gem lettuces: little gem lettuce
  mashed potatoes: mashed potato
  onions: onion
  oranges: orange
  potatoes: potato
  red chillies: red chilli
  red onions: red onion
  red peppers: red pepper
  ripe avocados: ripe avocado
  spring onions: spring onion
  sweet potatoes: sweet potato
  thyme sprigs: thyme sprig
  tomatoes: tomato
  # `almond` goes the other way on purpose: the plural is what most recipes
  # write, and what "ground almonds" and "flaked almonds" already read as.
  plums: plum
  almond: almonds
  # "baby" is not a modifier (baby corn is not corn), so these are judged one
  # phrase at a time.
  baby carrots: carrot
  baby spinach: spinach
  baby pak choi: pak choi
  rainbow carrots: carrot
  # Adjectives left standing alone by the upstream comma split. A modifier is
  # stripped from something; here nothing is left, so the entry is dropped.
  boneless: []
  skinless: []
  large: []
  # Compounds, named one at a time.
  herb sprigs like thyme or rosemary: [thyme, rosemary]
  plenty of salt and pepper: [salt, pepper]
  seasonings and flavourings like chicken stock cubes: chicken stock
  tamari or dark soy sauce: [tamari, dark soy sauce]
  butter and apricot jam: [butter, apricot jam]
  ready-rolled puff pastry: puff pastry
  all-butter puff pastry sheets: puff pastry
  filo pastry sheets: filo pastry
  lasagne sheets: lasagne
  # Keyed on the post-modifier form: `small` is stripped before aliases run.
  pasta shells: pasta
  casarecce or similar pasta: pasta
  tamarind concentrate or paste: [tamarind concentrate, tamarind paste]
  lemongrass stalk: lemongrass
  lemongrass stalks: lemongrass
  stalks lemongrass: lemongrass
  guinness or other stout: [guinness, stout]
  camp coffee or espresso: [camp coffee, espresso]
  espresso or 30 ml very strong coffee: espresso
  espresso coffee: espresso
  pure coconut or flavourless oil: [coconut oil, flavourless oil]
  soda water if possible: soda water
  each turmeric: turmeric
  each ground cumin and ground turmeric: [cumin, turmeric]
  turkey breast mince: turkey mince
  mature cheddar cheese: mature cheddar
  naturally brewed soy sauce: soy sauce
  kale or cabbage or a mixture: [kale, cabbage]
  natural/organic vegetable or chicken stock cube: [vegetable stock, chicken stock]
  # Fat level and culture are not what anyone excludes. The target is `natural
  # yoghurt`, not bare `yoghurt`: sweetened and flavoured yoghurts are a
  # different answer.
  full-fat natural bio yoghurt: natural yoghurt
  full-fat natural yoghurt: natural yoghurt
  low-fat natural yoghurt: natural yoghurt
  natural bio yoghurt: natural yoghurt
  thick natural yoghurt: natural yoghurt
  unsweetened natural yoghurt: natural yoghurt
  gel- or paste-based colouring if wanted: food colouring
  # Compounds and prep states from the derived vocabulary (#273).
  almonds or whatever you prefer: almonds
  barley or brown rice miso: miso
  beef or venison stock: [beef stock, venison stock]
  black sesame seeds and fresh coriander leaves: [black sesame seeds, fresh coriander leaves]
  bone-in chicken thighs: chicken thighs
  boneless skinless chicken breast: chicken breast
  chicken thighs and drumsticks: chicken
  coconut oil or olive oil: [coconut oil, olive oil]
  cooked and peeled beetroot: beetroot
  cooked chestnuts: chestnuts
  crème fraîche or double cream: [crème fraîche, double cream]
  crème fraîche or single cream: [crème fraîche, single cream]
  flatbreads or rice: [flatbreads, rice]
  flavouring or fruit: []
  fresh or frozen cranberries: cranberries
  grated fresh galangal: fresh galangal
  grated fresh ginger: fresh ginger
  grated parmesan: parmesan
  greens like broccoli and pak choi: [broccoli, pak choi]
  groundnut or canola oil: [groundnut oil, canola oil]
  handful of fresh chives and/or parsley: [fresh chives, parsley]
  large handful each of tarragon and flat-leaf parsley: [tarragon, flat-leaf parsley]
  lemon or 30 ml lemon juice: lemon
  roasted peanuts: peanuts
  salmon or trout fillets: [salmon, trout fillets]
  salt and plenty of pepper: [salt, pepper]
  sea salt and freshly ground black pepper: [sea salt, black pepper]
  seasoning and flavourings — see note: []
  smoked mackerel fillets: mackerel
  sorrel or more: sorrel
  steamed white or sticky rice: rice
  toasted sesame oil: sesame oil
  vegetable stock powder or 1 organic vegetable stock cube: vegetable stock
  woody herb sprigs such as thyme or rosemary: [thyme, rosemary]

  # Compounds split only where both halves are already a known ingredient
  # somewhere in the collection (#281): a blind split on " or " makes "red"
  # out of "red or purple food colouring".
  butter or olive oil: [butter, olive oil]
  chicken or vegetable stock: [chicken, vegetable stock]
  clotted cream or crème fraîche: [clotted cream, crème fraîche]
  cottage cheese or crème fraîche: [cottage cheese, crème fraîche]
  cream or 100 g mascarpone: [cream, mascarpone]
  cream or custard: [cream, custard]
  currants or raisins: [currants, raisins]
  custard or cream: [custard, cream]
  fine semolina or plain flour: [fine semolina, plain flour]
  ghee or vegetable oil: [ghee, vegetable oil]
  hummus or yoghurt: [hummus, yoghurt]
  kale or cavolo nero: [kale, cavolo nero]
  kosher salt or 4 tsp fine sea salt: [kosher salt, fine sea salt]
  lamb or chicken stock: [lamb, chicken stock]
  maple syrup or honey: [maple syrup, honey]
  natural yoghurt or milk: [natural yoghurt, milk]
  oil or butter: [oil, butter]
  parmesan or pecorino: [parmesan, pecorino]
  pecorino or parmesan: [pecorino, parmesan]
  pork or turkey mince: [pork, turkey mince]
  rice or cider vinegar: [rice, cider vinegar]
  rock sugar or caster sugar: [rock sugar, caster sugar]
  shallots or onions: [shallots, onion]
  soy sauce or tamari: [soy sauce, tamari]
  sugar or honey: [sugar, honey]
  sunflower oil or butter: [sunflower oil, butter]
  toasted sesame oil or vegetable oil: [sesame oil, vegetable oil]
  # Targets `vanilla paste`, not `vanilla bean paste`, which is itself a key.
  vanilla bean paste or vanilla extract: [vanilla paste, vanilla extract]
  vanilla or almond extract: [vanilla, almond extract]
  whipped cream or crème fraîche: [whipped cream, crème fraîche]
  white wine or cider vinegar: [white wine, cider vinegar]
  white wine or stock: [white wine, stock]
  white wine vinegar or cider vinegar: [white wine vinegar, cider vinegar]

  # Citrus by its juice or zest: excluding "lemon" hides a recipe that uses
  # only the juice. Named entry by entry because the measure-phrase strip runs
  # after the quantity strip, so a "juice of" phrase would leave "2 lemons".
  finely grated zest 1 orange: orange
  finely grated zest and juice of ½ lime: lime
  finely grated zest of 1 lemon: lemon
  juice 1 lime: lime
  juice and zest of ½ a lime: lime
  juice of 1 lemon: lemon
  juice of 2 limes: lime
  juice of ½ lemon: lemon
  zest and juice of 1 orange: orange
  zest of 1 orange: orange
  zest of 2 lemons: lemon
  zest of ½ orange: orange

  # A leading "about" blocks the quantity strip, so these are named.
  about 2 tbsp vegetable oil: vegetable oil
  about 200 g raw king prawns: king prawns
  about 75 g seaweed: seaweed

  # A clove of garlic is garlic. The spice "cloves" is not here and keeps its
  # own entry.
  cloves garlic: garlic
  crushed garlic clove: garlic
  fresh garlic cloves: garlic
  garlic clove: garlic
  garlic cloves: garlic
  large garlic clove: garlic
  large garlic cloves: garlic
  medium cloves garlic: garlic
  small garlic clove: garlic
  small garlic cloves: garlic

  # An instruction that landed in `item:`: when, how much, or what to do.
  double cream with salt: [double cream, salt]
  "dusting as preferred: icing sugar": icing sugar
  extra demerara sugar to coat: demerara sugar
  plain flour sifted with a pinch of salt: [plain flour, salt]
  "flavouring to taste: bailey's": bailey's
  flavourings like curry powder: curry powder
  flavourings like worcestershire sauce: worcestershire sauce
  flavourings to taste like onion powder: onion powder
  seasoning including mushroom ketchup: mushroom ketchup

  # Two ingredients joined by the method, not by "or". Both halves count: a
  # recipe whose only milk is behind a "dissolved in" still contains milk.
  bicarbonate of soda dissolved in 3 fl oz milk: [bicarbonate of soda, milk]
  cornstarch dissolved in 3 tbsp water: [cornstarch, water]
  water mixed with 3 tsp cornstarch: [water, cornstarch]
  whole milk mixed with 90ml water: [whole milk, water]
  fresh chives and/or parsley: [fresh chives, parsley]

  # Prep and cut that do not change what the thing is. The brown sugars are
  # deliberately not here: they are distinct products a baker chooses between.
  extra virgin olive oil: olive oil
  freshly ground black peppercorns: black peppercorns
  freshly ground szechuan peppercorns: szechuan peppercorns
  skin-on boneless pork belly: pork belly
  spring onions in thin strips: spring onion
  thick-cut beef short ribs: beef short rib
  unsalted butter straight from the fridge: unsalted butter
  bart bouquet garni bags: bouquet garni

# Button label only: the entry on the left (an alias target) shows as the text
# on the right. Matching still runs against the left-hand key, which is the
# text a recipe's `main_ingredients` actually holds.
display_names:
  five-spice: Chinese five-spice powder

# Plural word on the left, the form to match on, on the right. Normalises one
# word for matching, so "chicken legs" and "chicken leg" are one entry. Also
# handed to the recipe page's scaler (`data-singulars` in
# _layouts/recipe.html).
singulars:
  anchovies: anchovy
  apples: apple
  beans: bean
  berries: berry
  breasts: breast
  cashews: cashew
  cheeks: cheek
  cherries: cherry
  chips: chip
  chops: chop
  cloves: clove
  eggs: egg
  fillets: fillet
  leaves: leaf
  legs: leg
  mussels: mussel
  noodles: noodle
  olives: olive
  oranges: orange
  peaches: peach
  potatoes: potato
  prawns: prawn
  ribs: rib
  sardines: sardine
  scallops: scallop
  seeds: seed
  steaks: steak
  thighs: thigh
  tomatoes: tomato

# When a query exactly matches a key, any ingredient containing any listed
# word matches and the key earns a forced "(all)" button: "cheese" returns
# Cheshire, cheddar and mozzarella. The key always appears in its own list.
# Never add an unaccented variant: matching strips diacritics, and a variant
# here makes that query return the whole family and not the one cheese.
synonyms:
  pasta:
    - pasta
    - spaghetti
    - tagliatelle
    - linguine
    - pappardelle
    - fettuccine
    - farfalle
    - fusilli
    - penne
    - rigatoni
    - conchiglie
    - orecchiette
    - orzo
    - macaroni
    - lasagne
    - lasagna
    - gnocchi
    - tortellini
    - ravioli
    - cannelloni

  cheese:
    - cheese
    - cheddar
    - parmesan
    - parmigiano
    - gruyère
    - mozzarella
    - ricotta
    - feta
    - brie
    - camembert
    - gouda
    - stilton
    - gorgonzola
    - manchego
    - pecorino
    - halloumi
    - burrata
    - mascarpone
    - cream cheese
    - cottage cheese
    # Named cheeses whose entries do not carry the word "cheese", listed so a
    # "cheese" search still finds them.
    - cheshire
    - lancashire
    - comté
    - swiss

  stock:
    - stock
    - broth

  # No entry is bare `nut`, which would take butternut squash, nutmeg and
  # groundnut oil, and `chestnuts` is plural so it does not take chestnut
  # mushrooms. Coconut is deliberately absent. Not an allergy filter (#619).
  nuts:
    - nuts
    - almond
    - walnut
    - hazelnut
    - peanut
    - pistachio
    - cashew
    - pecan
    - macadamia
    - chestnuts
    - pine nut

  # Flour is always the trailing word ("plain flour"), so it never forms a
  # family by first word (#59). Cornflour is deliberately excluded: a
  # different product.
  flour:
    - flour
    - plain flour
    - self-raising flour
    - plain white flour
