# Culinary words whose correct spelling carries an accent: unaccented form to
# accented form. `tests/test_style.py` checks recipe prose against `words`;
# slugs, filenames and the `source:` field are not checked (URLs stay ASCII, and
# a citation is spelled as the publication spells it).
#
# `scripts/tidy_drafts.py` reads this file as TEXT, line by line: any line that
# starts in column 0 ends the block it is in. Never put a comment at column 0
# between the entries of `words` or `no_accent`.

words:
  acai: açaí
  aioli: aïoli
  bearnaise: béarnaise
  bechamel: béchamel
  brulee: brûlée
  cafe: café
  canape: canapé
  canapes: canapés
  chevre: chèvre
  comte: comté
  consomme: consommé
  creme: crème
  cremeux: crémeux
  creole: créole
  crepe: crêpe
  crepes: crêpes
  crudites: crudités
  eclair: éclair
  eclairs: éclairs
  entrecote: entrecôte
  flambe: flambé
  fraiche: fraîche
  frisee: frisée
  gateau: gâteau
  glace: glacé
  gougere: gougère
  gougeres: gougères
  gruyere: gruyère
  jalapeno: jalapeño
  jalapenos: jalapeños
  mariniere: marinière
  nicoise: niçoise
  pate: pâté
  patisserie: pâtisserie
  patissiere: pâtissière
  pina: piña
  puree: purée
  pureed: puréed
  purees: purées
  ragu: ragù
  rosti: rösti
  saute: sauté
  sautes: sautés
  sauteed: sautéed
  souffle: soufflé
  souffles: soufflés
  veloute: velouté

# Words that look as though they want an accent and do not, so nobody adds one.
no_accent:
  - echalion    # UK trade name for banana shallots; unaccented in British usage
  - chorizo
  - gratin
  - julienne
  - vinaigrette
  - dauphinoise
  - mornay
  - confit
  - mole        # mole poblano -- Helen, 2026-09-03: no diacritic on either word
  - poblano
