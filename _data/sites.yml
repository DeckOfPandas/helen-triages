# =============================================================================
# SITE IDENTITY — what distinguishes one site in the mono-repo from the other.
# =============================================================================
# Selected by `site_key`, which _config.yml's `defaults:` sets per collection
# and per page directory. _layouts/default.html reads this and nothing else to
# decide what the page calls itself and what it links.
#
# This is the VOCABULARY layer for the mono-repo, in exactly the sense the
# three-layer rule means it: the shared layout knows a site has a wordmark and
# a stylesheet, and knows nothing about which sites exist or what they say.
# Adding a third site should be an edit here plus a palette, not a template
# change.
#
# KEYS
#   title       <title>, og:site_name, the footer, and the second half of the
#               wordmark's accessible name
#   word        the bracketed word on the taped strip: [ FOOD ]
#   description fallback meta description for pages with no tagline of their own
#   css         basename under assets/css/ — `food` means assets/css/food.scss
#   home        where the wordmark links, relative to baseurl
#   tape        subdirectory under assets/img/<key>/ holding the torn strips
#               behind the wordmark, named tape-1.svg … tape-N.svg; omit for no
#               tape. tape_count is N — it lives here rather than in the JS so
#               a site can have a different number of them
#   tape_count  how many tape-N.svg files that directory holds
#   footer_svg  path under assets/img/<key>/ for the footer decoration; omit
#               entirely for none. Absent means NO fetch is attempted, rather
#               than a fetch that 404s and warns — which is what a site with no
#               artwork yet needs.
#   about_url   where the header's small "??" link goes. Omit entirely for no
#               link — the "??" itself isn't rendered rather than pointing
#               nowhere, same absent-means-nothing convention as footer_svg.
#   home_icon   basename (no .svg) of an _includes/icons/ partial linking to
#               this site's own home, shown in the header nav. Omit for none.
#   switch_site the OTHER site's key in this file — shown in the header nav as
#               an icon linking to that site's home. Omit for no switcher
#               (e.g. a site with no sibling yet).
#   switch_icon basename (no .svg) of an _includes/icons/ partial used for the
#               switch_site link above. Required if switch_site is set.
# =============================================================================

food:
  title: Helen Triages Food
  word: FOOD
  description: What to cook, not how to cook
  css: food
  home: /food/
  tape: tape
  tape_count: 7
  footer_svg: hearts/site-footer-hearts.svg
  about_url: /food/about/
  # Reference pages worth reaching from anywhere, listed in the footer beside
  # the heart graphic under this site's own bracketed word. Absent means the
  # block isn't rendered at all -- the same convention footer_svg and about_url
  # already use, so cocktails shows nothing here until it has reference pages
  # of its own rather than showing an empty heading.
  reference_links:
    - text: internal temperatures
      url: /food/reference/temperatures/
    - text: times and methods
      url: /food/reference/timings/
  home_icon: food-cloche-heart
  switch_site: cocktails
  switch_icon: glass-martini

cocktails:
  title: Helen Triages Cocktails
  word: COCKTAILS
  description: What to drink, not how to mix it
  css: cocktails
  home: /cocktails/
  # tape points at assets/img/cocktails/tape/, which holds a direct COPY of
  # food's current 7 tape-*.svg files (the redesigned set from issue #122,
  # 2026-08-10) — kept in parity with food deliberately, at Helen's explicit
  # call in issue #223 (2026-08-15), so the wordmark isn't bare while
  # cocktails' own visual language is still undecided. When cocktails gets its
  # own visual language, swap the files in that directory; this key doesn't
  # need to change.
  tape: tape
  tape_count: 7
  # footer_svg still omitted: nothing drawn for the footer yet, and an absent
  # key means no fetch is attempted rather than one that 404s and warns.
