# Site identity: what distinguishes one site in the mono-repo from the other.
# Selected by `site_key`, which _config.yml's `defaults:` sets per collection
# and per page directory. Only what differs between the sites belongs here: a
# key says where you are. What the chrome is belongs in _data/chrome.yml (#374).
#
# Keys:
#   title        <title>, og:site_name, the footer, and the second half of the
#                wordmark's accessible name
#   word         the bracketed word on the taped strip: [ FOOD ]
#   description  fallback meta description for pages with no tagline
#   css          basename under assets/css/: `food` means assets/css/food.scss
#   home         where this site's own nav link goes, relative to baseurl
#   icon         basename (no .svg) of an _includes/icons/ partial: the site's
#                mark. Not drawn in the header nav (#1007);
#                test_site_nav_links_resolve_to_real_pages still asks for it.
#   social_image this site's link-preview card (og:image), a PNG under
#                assets/img/social/ rendered by scripts/render_social_images.py
#   reference_links
#                this site's reference pages, a footer column under its word.
#                A site with none gets no column. An entry may carry
#                `local_only: true`, which drops it from any build without
#                `show_local_reference_links`; set and clear it together with
#                the page's own `published: false`.

food:
  title: Helen Triages Food
  word: FOOD
  description: What to cook, not how to cook
  css: food
  home: /food/
  icon: food-cloche-heart
  social_image: /assets/img/social/food.png
  reference_links:
    - text: internal temperatures
      url: /food/reference/internal-temperatures/
    # "methods and times": the wording follows the page's name (#385).
    - text: methods and times
      url: /food/reference/cooking-methods-and-timings/

cocktails:
  title: Helen Triages Cocktails
  word: COCKTAILS
  # Exactly this, full stop included (#1097). Also the fallback
  # <meta description> for a cocktails page with no tagline of its own.
  description: What to drink.
  css: cocktails
  home: /cocktails/
  icon: glass-martini
  social_image: /assets/img/social/cocktails.png
  reference_links:
    - text: rum categories
      url: /cocktails/reference/rum-categories/
    # What each glass type holds (#295).
    - text: glasses
      url: /cocktails/reference/glasses/
