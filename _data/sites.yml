# =============================================================================
# SITE IDENTITY — what distinguishes one site in the mono-repo from the other.
# =============================================================================
# Selected by `site_key`, which _config.yml's `defaults:` sets per collection
# and per page directory. _layouts/default.html reads this and nothing else to
# decide what the page calls itself and what stylesheet it links.
#
# This is the VOCABULARY layer for the mono-repo, in exactly the sense the
# three-layer rule means it: the shared layout knows a site has a wordmark and
# a stylesheet, and knows nothing about which sites exist or what they say.
# Adding a third site should be an edit here plus a palette, not a template
# change.
#
# WHAT IS NO LONGER HERE, AND WHY -- issue #374, 2026-08-19.
# This file used to carry the header nav and the footer decoration as per-site
# keys: home_icon, switch_site, switch_icon, about_url, footer_svg, tape,
# tape_count. Every one of them was configuration for chrome that is meant to
# be IDENTICAL on both sites, which meant "the same header" was something two
# sets of data had to agree on rather than something the code guaranteed. They
# did not agree: cocktails had none of the nav keys, so it rendered no header
# nav at all, and its footer was food's minus three blocks. The tape was worse
# -- two directories holding byte-identical artwork, kept in step by hand, which
# had already drifted for five days (issue #223).
#
# Helen: "I don't want parity between two footers -- I want one footer for the
# whole site. And one header. Literally the same code and assets." So the chrome
# no longer asks this file anything about itself. What is left below is only
# what genuinely differs, and the test to apply before adding a key is: does
# this say WHERE YOU ARE, or does it say WHAT THE CHROME IS? The second belongs
# in _data/chrome.yml, or nowhere.
#
# KEYS
#   title       <title>, og:site_name, the footer, and the second half of the
#               wordmark's accessible name
#   word        the bracketed word on the taped strip: [ FOOD ]
#   description fallback meta description for pages with no tagline of their own
#   css         basename under assets/css/ — `food` means assets/css/food.scss
#   home        where this site's own nav icon links, relative to baseurl
#   icon        basename (no .svg) of an _includes/icons/ partial standing for
#               this site in the header nav. Every site gets one slot in that
#               row, on every page, in the order they appear in this file --
#               so the row is the same wherever you are, and the icon you are
#               looking at is not the odd one out.
#   reference_links
#               reference pages belonging to THIS site, rendered in the shared
#               footer as a column headed by this site's own bracketed word. The
#               footer draws a column per site that has any and skips the ones
#               that do not, so it is one footer everywhere while still saying
#               truthfully which material is whose. Cocktails has no reference
#               pages yet and so contributes no column -- the same
#               absent-means-nothing convention used throughout this file.
# =============================================================================

food:
  title: Helen Triages Food
  word: FOOD
  description: What to cook, not how to cook
  css: food
  home: /food/
  icon: food-cloche-heart
  reference_links:
    - text: internal temperatures
      url: /food/reference/temperatures/
    - text: times and methods
      url: /food/reference/timings/

cocktails:
  title: Helen Triages Cocktails
  word: COCKTAILS
  description: What to drink, not how to mix it
  css: cocktails
  home: /cocktails/
  icon: glass-martini
  # No reference_links: cocktails has no reference pages yet, so the footer
  # draws no [ COCKTAILS ] column. It gets one the day it has material, with no
  # template change -- which is the whole point of the footer reading this file
  # rather than naming food's pages directly.
