# The publications a drink's `source` names, and how each one is spelled. A
# spelling table, not a coverage requirement: `source: ""` is correct on most
# drinks, and a `source` matching nothing here is free text and passes.
# test_every_source_spelling_is_canonical fails a drink that uses a listed
# alias; scripts/build_ingest_vocab.py prints the canonical names in the
# ingest document. A compound attribution ("Difford's / Rémy Martin") names
# two sources on purpose, is not a variant, and is not listed.

publications:
  "Difford's":
    # No case-only variants: the match folds case, and a string that is both a
    # name and an alias fails the test.
    aliases: ["Difford's Guide", "Diffords", "Diffords Guide"]

  "Death & Co":
    # `&`, not `and`: this is the bar's own name, not one of Helen's titles.
    aliases: ["Death and Co", "Death & Company", "Death and Company"]

  "Punch":
    # From punchdrink.com. The URL form inside a compound attribution is left
    # alone.
    aliases: ["Punch Drink", "punchdrink.com"]

  "Alcohol Professor":
    aliases: ["The Alcohol Professor", "alcoholprofessor.com"]

  "Thrillist":
    aliases: ["thrillist.com"]

  "kindredcocktails.com":
    # The domain is the canonical form: the one drink that cites it writes the
    # domain, and a citation is reproduced as its publication writes it.
    aliases: ["Kindred Cocktails", "Kindred"]
