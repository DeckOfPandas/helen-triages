# =============================================================================
# HOW STRONG A BOTTLE IS. Spec: #297. Filled 2026-09-06.
# =============================================================================
# Helen, 2026-09-06: "I want the number of units in a drink, not the ABV of the
# drink, i.e. water etc don't matter." That sentence decides the whole shape of
# this file. A UK unit is 10 ml of pure alcohol, so a pour contributes
# `ml x abv / 1000` units and a pour of something at 0% contributes nothing --
# which is why dilution, juice and syrup need no arithmetic at all. They are
# still DECLARED here, at `abv: 0`, and that is the point of the
# `non_alcoholic` block below.
#
# WHY A SEPARATE FILE FROM costs.yml, WHICH THIS OTHERWISE MIRRORS. A price is
# true on a day, in a shop, and goes stale on its own -- costs.yml says so at
# length and carries a `checked:` date as its honesty. A strength does not decay
# that way: Tanqueray has been 43.1% for decades. The two files answer different
# questions about the same bottles and would date each other if merged.
#
# WHY NOT IN bottles.yml, WHICH PREDICTED THIS. That file's header says "#297
# (ABV) sits on the same invariant side" as `generic` and the appellations, and
# it is right -- Appleton 12 is 43% in every drink that pours it, exactly as it
# is a moderately-aged Jamaican in every drink that pours it. The disagreement
# is only about WHERE, and it is the argument costs.yml already won: 127 numbers
# buried in 933 lines of prose rulings cannot be reread or corrected without
# disturbing prose that must not be disturbed. The invariance claim is accepted;
# the interleaving is declined.
#
# TWO LAYERS, AND A POUR TAKES THE FIRST THAT ANSWERS. Identical to costs.rb.
#   1. the pour NAMES A BOTTLE -> that bottle's abv. An exact figure.
#   2. it names a generic only -> derived, and the drink is marked approximate.
# A GENERIC WITH BOTTLES UNDER IT IS DELIBERATELY ABSENT from `generics:` below,
# for the reason costs.yml gives: a figure written here as well would be a
# second truth about the same category. It derives instead, and the rule is:
#
#   HELEN'S `default_bottles` RULING DECIDES IT WHEN SHE HAS GIVEN ONE.
#   "London dry gin let's say the default is tanqueray" makes an unqualified gin
#   pour 43.1%, which is a REAL number off a real bottle rather than an average
#   of six gins she would not have poured. (A default of TWO bottles -- blanco
#   tequila -- is her "real range" and is averaged, as before.)
#
#   ABSENT A RULING, THE MODE, SINCE 2026-09-14 -- #1016, Helen: "if a bottle
#   isn't stated for a cocktail recipe, assume the MODE ABV of bottles we've
#   declared. This will be more meaningful than mean or median." It was the mean
#   until then. The mode is a strength a real bottle on her shelf actually has;
#   the mean was often none of them (rhum agricole blanc averaged 45.25% across
#   bottles that are all 40, 42 or 50).
#
#   A CATEGORY WITH NO MODE GETS A DEFAULT BOTTLE, NOT A FALLBACK. Asked what
#   to do where no strength repeats -- seven categories, bourbon among them --
#   she chose "name a default bottle" over the highest, the mean or the median,
#   and named all seven the same day (costs.yml `default_bottles`). So a
#   no-mode category with no default is a TEST FAILURE
#   (test_every_bottled_generic_resolves_to_one_strength), not a silent guess:
#   the day a new bottle breaks a tie, the build says so and names the
#   category. The plugin still falls back to the mean so a page never breaks,
#   and that fallback is what the test exists to keep from ever being read.
#
# WHY A SINGLE FIGURE HERE WHEN COST PRINTS A RANGE. Helen's call, 2026-09-06,
# asked directly: "one figure, marked approximate when it's a fallback." Cost
# ranges because two bottles under one category are genuinely two prices and she
# will pay one of them. Strength ranges far less -- most categories here span a
# point or two, not the 2x that separates Beefeater from a premium gin -- so a
# range would be decoration where cost's is information.
#
# CONFIDENCE IS PER ROW AND MEANS WHAT costs.yml MADE IT MEAN:
#   high    printed on every bottle of it and stable for years. Read off the
#           label or too well known to be worth doubting.
#   medium  right for this bottle within about a point. Fine for a unit count.
#   low     a genuine guess. OVERWRITE THESE FIRST.
# A row that needs HELEN specifically -- not a better source, her bottle --
# also carries `qq:` saying why, and every one is something no source settles:
# a rhum bottled at three strengths, a bottle whose name matches no product I
# could place, a category whose range spans 20 points.
#
#   THE WORKLIST IS `python3 scripts/abv_worklist.py`, NOT `grep -n 'qq:'`,
#   since the unit count went public (#1001, 2026-09-14). The grep lists the
#   rows; the script replays the units plugin's own resolution over the
#   PUBLISHED drinks and says which of them change a number somebody can see.
#   Many do not: both Bob's bitters are only ever poured in dashes, and a dash
#   never reaches the arithmetic (see the bitters block below). They are flagged
#   anyway, because the day one of them is poured in millilitres is not the day
#   to discover the strength was a guess.
#
#   NO COUNT IN THIS COMMENT, AND THAT IS THE RULE. This said "There are
#   ELEVEN" from the web pass until 2026-09-14, five days after Flaggpunsch was
#   promoted to a checked figure (the note recording it is a few blocks down)
#   and nobody moved the number -- and one session copied the stale figure into
#   four more files before anyone counted. A count in a comment is a second copy
#   of something the file already knows, and it goes stale the first time
#   anybody edits the thing it counts. Which rows reach a published drink is not
#   even a constant: the Caribbean Sazerac pours a bare `rhum agricole blanc`,
#   which averages every bottle under that category, so proofreading that one
#   drink changes the answer. Run the script.
#
# IT WAS SEVENTEEN UNTIL THE WEB PASS, 2026-09-06. Helen's instruction was
# "knowledge first, web only for the doubtful ones", and the web half settled
# six -- three of them by CORRECTING a figure rather than confirming it, which
# is the argument for having done it:
#
#   Suze                            15 -> 20    the UK bottle is 20; Europe is 15
#   Clairin Communal              53.5 -> 43    `Communal` is the four-village
#                                               BLEND, not a single clairin
#   Gabriel Boudier Creme de Menthe 18 -> 21
#   Rhum JM Blanc                     50        confirmed (the 55 is a second
#                                               product, not this one)
#   Opihr                             40        confirmed
#   Amaro Ciociaro                    30        confirmed
#
# TWO SPELLING FAULTS SURFACED WITH THEM, and BOTH ARE NOW BEING FIXED under
# #701 rather than left as a note here. The reason this block once said "not
# fixed here" still holds and is worth keeping: correcting a name in THIS file
# alone would make it disagree with bottles.yml, and
# `test_every_declared_bottle_has_an_abv` checks both directions. So each was
# renamed everywhere at once, not here first.
#
#   `Ophir` -> `Opihr`      DONE 2026-09-07. A BOTTLE, so bottles.yml keeps the
#                           old spelling as an alias and nothing can fail to
#                           resolve (Helen's La Favorite rule, 2026-09-06).
#   `Amaro Ciociano` -> `Amaro Ciociaro`
#                           DONE 2026-09-07. A GENERIC, and generics have no
#                           alias mechanism, so it went through one merge with
#                           BOTH spellings declared -- the drink lives in the
#                           other repo and the two cannot land in one commit.
#
# NO WEB SOURCE WAS USED FOR THE `high` ROWS, and that is a difference from
# costs.yml worth stating plainly. These are from knowledge, not from a search
# result on a dated day. `high` here means "this is Cointreau, it is 40%", not
# "a shop said so on 2026-09-06".
#
# PROOF SYSTEMS ARE A TRAP AND TWO ROWS BELOW WOULD BE WRONG WITHOUT THE NOTE.
# Rittenhouse 100 is 100 US proof, which is 50% -- not 57%. Wood's 100 is 100
# BRITISH proof, which IS 57%. Two bottles, both called 100, eleven points apart.
# =============================================================================

# The day these were filled in. Unlike costs.yml's `checked`, this does not
# decay on its own -- it is here so that a reformulation (Campari has dropped
# its strength twice) has a date to be measured against.
filled: "2026-09-06"

