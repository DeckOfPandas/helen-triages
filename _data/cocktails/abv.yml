  - lime juice
  - lemon juice
  - orange juice
  - grapefruit juice
  - pineapple juice
  - apple juice
  - cane sugar syrup 1:1
  - demerara sugar syrup
  - vanilla syrup
  - agave syrup
  - grenadine
