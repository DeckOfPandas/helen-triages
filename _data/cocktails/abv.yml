# How strong a bottle is, for a drink's UK units (#297): a pour contributes
# ml x abv / 1000. Read by _plugins/cocktail_units.rb. Apart from costs.yml
# because a price goes stale and a strength does not.
#
# A pour that names a bottle takes that bottle's figure. A pour that names a
# generic only is marked approximate and takes the generic's row in
# `generics:`, or, where the generic has bottles, Helen's `default_bottles`
# entry in costs.yml, else the MODE of its bottles' strengths (#1016). A
# generic with bottles has no row of its own
# (test_no_generic_gets_its_strength_from_two_places).
#
# confidence: high = on every label and stable for years; medium = right
# within about a point; low = a guess, overwrite first, and it carries a `qq:`
# saying what Helen has to check. `python3 scripts/abv_worklist.py` lists the
# guesses a published drink can show.

# The day these were filled in. Unlike costs.yml's `checked`, this does not
# decay on its own -- it is here so that a reformulation (Campari has dropped
# its strength twice) has a date to be measured against.
filled: "2026-09-06"

