# --- poured, and contributes nothing ------------------------------------------
# EVERY ONE OF THESE IS A DELIBERATE ZERO, not a gap. Helen: "water etc don't
# matter." They are listed rather than defaulted so that a new ingredient with
# no strength recorded fails a test instead of quietly diluting a total.
#
# NOTE WHAT IS *NOT* HERE. `falernum` is 11% and is an easy one to assume is a
# syrup because it sits beside the syrups in every recipe that uses it -- it
# derives from Velvet Falernum above. `grenadine` and `orgeat` really are 0.
