# Bottles -> category (#529, DECISIONS §9.3.2). The dictionary of what Helen
# would reach for, not of what qualifies: `not_reached_for` holds the bottles
# that qualify and are out, with her reasons.
#
# One generic per bottle, and it must be a generic ingredients.yml declares. A
# bottle's category is bottle-invariant; `character` is a property of a
# recipe's use and has no column here (#441). Strength is in abv.yml and price
# in costs.yml, each keyed by the same bottle names.
#
# The key is the product's name and every other spelling anyone writes is an
# alias, matched case-insensitively: add the spelling, never a second bottle.
# A renamed bottle keeps its old spellings as aliases (Plantation for
# Planteray), so a suggestion typed the old way still resolves. A bare house
# name is an alias only where it can mean one product here.

bottles:

  # --- Jamaican ---
  "Appleton Estate Signature":
    generic: "moderately aged Jamaican rum"
    aliases: ["Appleton Signature", "Appleton Estate V/X rum", "Appleton V/X"]
  # "Appleton Estate Reserve" is not an alias: an unnumbered Reserve exists
  # and the two must not collapse.
  "Appleton Estate 8 Year Reserve":
    generic: "moderately aged Jamaican rum"
    aliases: ["Appleton 8", "Appleton 8-year", "Appleton Estate 8 Reserve"]
  "Appleton Estate 12 Rare Casks":
    generic: "moderately aged Jamaican rum"
    aliases: ["Appleton 12 Rare Casks", "Appleton Rare Casks",
              "Appleton Estate Rare 12 year old blended rum"]
  # With Myers, Helen's marker for the caramel-forward style (#314).
  "Blackwell":
    generic: "caramel-forward Jamaican rum"
    aliases: []
  # Aged, so not the unaged overproof style: 57% is a strength, which that
  # category does not name.
  "Smith & Cross":
    generic: "moderately aged Jamaican rum"
    aliases: ["Smith and Cross", "Smith & Cross rum"]
    note: "57% ABV — be sensible about how much you use."
  "Wray & Nephew":
    generic: "overproof Jamaican rum, unaged"
    aliases: ["Wray and Nephew", "Wray & Nephew Overproof"]
  # Its own bottle, not an alias of Wray & Nephew: same category, chosen by
  # mood.
  "Rum Fire":
    generic: "overproof Jamaican rum, unaged"
    aliases: []

  # --- Demerara: an appellation, 100% DDL distillate, Guyana ---
  # Canonical form "El Dorado N Year Old"; the older spellings are aliases.
  # The 3 sits with its siblings and is a `lightly aged and filtered rum`.
  "El Dorado 3 Year Old":
    generic: "lightly aged and filtered rum"
    aliases: ["El Dorado 3 year old rum", "El Dorado 3", "ED3", "El Dorado 3yo", "El Dorado 3yo rum"]
  "El Dorado 5 Year Old":
    generic: "aged Demerara rum"
    aliases: ["El Dorado 5 year old rum", "El Dorado 5"]
  "El Dorado 8 Year Old":
    generic: "aged Demerara rum"
    aliases: ["El Dorado 8 year old rum", "El Dorado 8"]
  "El Dorado 12 Year Old":
    generic: "aged Demerara rum"
    aliases: ["El Dorado 12 year old rum", "El Dorado 12"]
  # Every rum in the blend is DDL's, on Helen's word, so it passes the 100%
  # rule.
  "Skipper's":
    generic: "aged Demerara rum"
    aliases: ["Skippers dark rum", "Skippers"]
  # 57% is at proof, not over it (overproof starts above 57.15%), so this is
  # not an overproof Demerara.
  "Wood's":
    generic: "aged Demerara rum"
    aliases: ["Woods", "Wood's 100"]

  # --- moderately aged: the residual style, no region and no other marker ---
  # Both Pusser's here blend Trinidadian rum, so they fail the 100% DDL test
  # whatever they taste like.
  "Pusser's Blue Label":
    generic: "moderately aged rum"
    aliases: ["Pusser's Blue"]
  "Pusser's Gunpowder":
    generic: "moderately aged rum"
    aliases: ["Pusser's Gunpowder Proof", "Pusser's Navy rum 54.5%"]
  # Reached for for its blackstrap, which is a recipe's `character` and never
  # a generic (#314).
  "Gosling's Black Seal":
    generic: "moderately aged rum"
    aliases: ["Gosling's", "Goslings"]
  "Havana Club 7 year old":
    generic: "moderately aged rum"
    aliases: ["Havana Club 7", "Havana 7", "Havana Club 7yo"]
  "Planteray 5 Year Old Barbados":
    generic: "moderately aged rum"
    aliases: ["Planteray Barbados 5", "Plantation Barbados 5",
              "Plantation Barbados 5 year old rum"]
  # A St Croix rum, so the origin-free style (#1108).
  "Cruzan Single Barrel":
    generic: "moderately aged rum"
    aliases: ["Cruzan Single Barrel rum"]

  # --- lightly aged and filtered ---
  "Havana Club 3 year old":
    generic: "lightly aged and filtered rum"
    aliases: ["Havana Club 3", "Havana 3", "Havana Club 3yo rum", "Havana 3 year old",
              "Havana Club Original Añejo 3 Años Cuban rum"]
  "Flor de Caña Extra Dry":
    generic: "lightly aged and filtered rum"
    aliases: ["Flor de Caña extra dry white rum"]
  # The key is Helen's wording (#1108). Not a pricing input: `default_bottles`
  # in costs.yml prices the category.
  "Pedro Mandinga Panama silver rum":
    generic: "lightly aged and filtered rum"
    aliases: ["Pedro Mandinga Silver", "Pedro Mandinga silver rum"]

  # JW Spicers is deliberately absent: what is cheap or needs using up is a
  # fact about the shelf, not about a drink.

  # --- blended multi-region, clear ---
  # A genuine Barbados/Jamaica/Trinidad blend; Havana Club 3 and El Dorado 3
  # are single-origin and sit under `lightly aged and filtered`.
  "Planteray 3 Stars":
    generic: "clear blended multi-region rum"
    aliases: ["Plantation 3 Stars", "Plantation 3 Stars rum", "Planteray 3",
              "Plantation 3"]

  # --- overproof and flavoured rums ---
  # A Guyana/Jamaica/Barbados blend: its own category, not a Demerara (#314).
  "Planteray O.F.T.D.":
    generic: "blended overproof rum"
    aliases: ["Plantation OFTD", "Planteray OFTD", "OFTD"]
  # All Guyanese, so it passes the 100% DDL rule that the other two Pusser's
  # fail (DECISIONS §9.3.2).
  "Pusser's 151":
    generic: "overproof Demerara rum, lightly aged"
    aliases: ["Pussers 151", "Pusser's Navy Rum 151"]
  "Planteray Stiggins' Fancy":
    generic: "pineapple rum"
    aliases: ["Plantation Stiggins Fancy Pineapple rum",
              "Plantation pineapple-infused rum"]
  "Malibu":
    generic: "coconut rum"
    aliases: ["Coconut rum"]

  # --- cane juice: agricole and cachaça ---
  # Each carries an `origin:` (#591), from the closed list `bottle_origins` in
  # ingredients.yml. A recipe cannot require an origin; its suggestions carry
  # it.
  "Clément Rhum Agricole Blanc":
    generic: "rhum agricole blanc"
    aliases: ["Clément Agricole Blanc", "Clement Agricole Blanc"]
    origin: "Martinique"
  "Clément Rhum Agricole Canne Bleue":
    generic: "rhum agricole blanc"
    aliases: ["Clement Rhum Agricole Canne Bleue", "Clément Canne Bleue", "Clement Canne Bleue"]
    origin: "Martinique"
  # Three Damoiseau blancs; the degree sign is part of the name.
  "Damoiseau Rhum Agricole Blanc 40°":
    generic: "rhum agricole blanc"
    aliases: ["Damoiseau Rhum Agricole Blanc", "Damoiseau Rhum Agricole Blanc 40 proof",
              "Damoiseau Blanc", "Damoiseau 40"]
    origin: "Guadeloupe"
  "Damoiseau Rhum Agricole Blanc 50°":
    generic: "rhum agricole blanc"
    aliases: ["Damoiseau 50"]
    origin: "Guadeloupe"
  "Damoiseau Rhum Agricole Blanc Pure Cane":
    generic: "rhum agricole blanc"
    aliases: ["Damoiseau Pure Cane", "Damoiseau Rhum Pure Cane"]
    origin: "Guadeloupe"
  # Favorite, no `u`: a standing correction. `La Favourite` stays an alias on
  # every La Favorite bottle.
  "La Favorite Rhum Agricole Blanc":
    generic: "rhum agricole blanc"
    aliases: ["La Favorite Blanc", "La Favourite Rhum Agricole Blanc",
              "La Favourite Blanc"]
    origin: "Martinique"
  "La Favorite L'Authentique Ambré":
    generic: "rhum agricole vieux"
    aliases: ["La Favourite L'Authentique Ambré"]
    origin: "Martinique"
  # No bare `JM` alias: two JM bottles are stocked, in different generics
  # (#702).
  "Rhum JM Ambré":
    generic: "rhum agricole vieux"
    aliases: ["JM Rhum Agricole ambre"]
    origin: "Martinique"
  # Barbancourt is cane juice, so `rhum agricole vieux` although the label
  # does not say agricole. The label's full name is an alias.
  "Barbancourt 5 Star":
    generic: "rhum agricole vieux"
    aliases: ["Barbancourt Five Star Reserve Speciale 8yo Rum",
              "Barbancourt Five Star Réserve Spéciale", "Barbancourt 8 year old"]
    origin: "Haiti"
  "Barbancourt 3 Star":
    generic: "rhum agricole vieux"
    aliases: ["Barbancourt Three Star rum", "Barbancourt 3-star rum"]
    origin: "Haiti"
  # Clairin Communal is a generic, not a bottle here: each clairin is its own
  # generic (#1108).
  "Sagatiba":
    generic: "cachaça"
    aliases: []
    origin: "Brazil"
  "Leblon":
    generic: "cachaça"
    aliases: []
    origin: "Brazil"
  "Velho Barreiro":
    generic: "cachaça"
    aliases: ["Viero Barriero"]
    origin: "Brazil"

  # --- a caramel-forward Jamaican, and the two arracks ---
  "Myers":
    generic: "caramel-forward Jamaican rum"
    aliases: ["Myers's", "Myer's"]
  # `Van Osten` misspells the house; the old spellings stay as aliases (#796).
  "Batavia Arrack van Oosten":
    generic: "Batavia arrack"
    aliases: ["Van Osten Botanik Arrack", "Van Osten", "Van Oosten", "Batavia Arrack Van Oosten"]
  # The key is the label (#796). Coconut flower sap: it shares only a name
  # with the Batavia above. `Ceylon arrack` needs no alias: it differs from
  # the key only in case.
  "Ceylon Arrack":
    generic: "coconut-flower arrack"
    aliases: []

  # --- more Martinique agricole blanc ---
  "Rhum JM Blanc":
    generic: "rhum agricole blanc"
    aliases: ["JM Blanc", "JM blanc"]
    origin: "Martinique"
  "Trois Rivières Cuvée de l'Océan":
    generic: "rhum agricole blanc"
    aliases: ["Trois Rivieres Cuvee de l'Ocean", "Trois Rivières", "Cuvée de l'Océan"]
    origin: "Martinique"
  "La Favorite Cœur de Canne":
    generic: "rhum agricole blanc"
    aliases: ["La Favorite Coeur de Canne", "Coeur de Canne", "Cœur de Canne",
              "La Favourite Cœur de Canne", "La Favourite Coeur de Canne"]
    origin: "Martinique"

  # St Lucian, not Jamaican, so the origin-free style.
  "Chairman's Reserve":
    generic: "moderately aged rum"
    aliases: ["Chairmans Reserve", "Chairman's"]
  "Disaronno":
    generic: "amaretto"
    aliases: ["Disaronno Originale"]

  # === beyond rum ===
  # Every bottle a drink names is declared and classified. Its generic is what
  # the collection spells out or Helen names, never an inference (DECISIONS
  # §9.3.2).

  # --- gin ---
  # Opihr, not Ophir; the misspellings stay as aliases (#701).
  "Opihr":
    generic: "speciality"
    aliases: ["Ophir", "Ophir spiced London dry gin", "Ophir Spiced Gin",
              "Opihr Oriental Spiced", "Opihr Oriental Spiced London Dry Gin"]
  "Beefeater":
    generic: "London dry gin"
  "Tanqueray":
    generic: "London dry gin"
  # Two Hayman's, in different generics, so there is no bare "Hayman's" alias
  # (#702).
  "Hayman's London Dry":
    generic: "London dry gin"
    aliases: ["Hayman's London Dry Gin"]
  "Hayman's Old Tom":
    generic: "Old Tom gin"
    aliases: ["Hayman's Old Tom Gin"]
  "Rutte":
    generic: "London dry gin"
  "Portobello Road":
    generic: "London dry gin"
    aliases: ["Portobello"]

  # --- vodka ---
  "Ketel One":
    generic: "vodka"
    aliases: ["Ketel One vodka"]
  # `Vanilia` is the label's own spelling.
  "Absolut Vanilla":
    generic: "vanilla vodka"
    aliases: ["Absolut vanilla vodka", "Absolut Vanilia"]
  "Ciroc Pineapple Flavoured Vodka":
    generic: "pineapple vodka"
    aliases: ["Ciroc Pineapple", "Cîroc Pineapple", "Ciroc pineapple vodka"]
  "Absolut Citron":
    generic: "lemon vodka"
    aliases: ["Absolut Citron Vodka"]

  # --- whisky ---
  "Elijah Craig 12":
    generic: "bourbon"
    aliases: ["Elijah Craig 12 year old bourbon", "Elijah Craig 12 Year Old"]
  # The curly apostrophe is a second string for the same bottle, so it is an
  # alias.
  "Woodford's Reserve":
    generic: "bourbon"
    aliases: ["Woodford’s Reserve", "Woodfords Reserve"]
  # The bottled-in-bond, 100 proof. Bare "Rittenhouse" is a different bottle
  # and not an alias.
  "Rittenhouse 100":
    generic: "rye"
    aliases: ["Rittenhouse Rye 100", "Rittenhouse Bottled in Bond"]
  # A bourbon here: Tennessee whiskey meets the bourbon standard in full
  # (DECISIONS §9.3.2).
  "Jack Daniels":
    generic: "bourbon"
    aliases: ["Jack Daniel's", "Jack Daniels No. 7"]
  # The bourbon and the rye are both stocked, so the generic is in each name
  # and there is no bare `Bulleit` alias.
  "Bulleit Bourbon":
    generic: "bourbon"
    note: "Not being replaced when it runs out — Helen's call, 2026-09-02."
  "Bulleit Rye":
    generic: "rye"
  # `Ardbeg XO` is a mis-transcription of this bottle (#1012).
  "Ardbeg An Oa":
    generic: "single malt scotch whisky"
    aliases: ["Ardbeg XO"]
  # A rye of that name, which Helen owns; not the drink's title.
  "Sazerac":
    generic: "rye"

  # --- agave ---
  # Patrón and Añejo take their diacritics; the unaccented forms are aliases.
  "Patrón Reposado":
    generic: "reposado tequila"
    aliases: ["Patron Reposado", "Patrón Reposado tequila"]
  "Del Maguey Vida":
    generic: "mezcal"
    aliases: ["Del Maguey VIDA", "Del Maguey vida"]

  # "Tequila" is in these two names and not in the Bianco's: Helen's wording,
  # kept.
  "Rooster Rojo Tequila Reposado":
    generic: "reposado tequila"
    aliases: ["Rooster Rojo Reposado", "Rooster Reposado"]
  "Rooster Rojo Tequila Añejo":
    generic: "añejo tequila"
    aliases: ["Rooster Rojo Tequila Anejo", "Rooster Rojo Añejo",
              "Rooster Rojo Anejo", "Rooster Añejo"]
  "Patrón Añejo":
    generic: "añejo tequila"
    aliases: ["Patron Añejo", "Patron Anejo", "Patrón Anejo"]

  "Patrón Silver":
    generic: "blanco tequila"
    aliases: ["Patron Silver"]
  "Rooster Rojo Bianco":
    generic: "blanco tequila"
    aliases: ["Rooster Bianco"]

  # --- brandy ---
  "Courvoisier":
    generic: "cognac"
    aliases: []
  # A different bottle from the Ambré below (#745); each keeps its own
  # spellings.
  "Pierre Ferrand 1840":
    generic: "cognac"
    aliases: ["Pièrre Ferrand 1840", "Pierre Ferrand 1840 Original Formula"]
  # `eau de vie` is the generic the drink carries; `kirschwasser` is the
  # narrower term.
  "Massenez Kirsch Vieux":
    generic: "eau de vie"
    aliases: ["Massenez Kirsch Vieux cherry brandy", "Massenez Kirsch"]
  # Canonical without the word "Cognac"; the accent is part of the name.
  "Pierre Ferrand Ambré":
    generic: "cognac"
    aliases: ["Pierre Ferrand Ambre", "Pierre Ferrand ambre",
              "Pièrre Ferrand Ambre", "Pièrre Ferrand Ambre cognac",
              "Pierre Ferrand Cognac Ambré", "Pierre Ferrand Cognac Ambre"]
  "Avallen":
    generic: "calvados"

  # --- sherry, vermouth and aromatised wine ---
  "Lustau Amontillado":
    generic: "amontillado sherry"
    aliases: ["Lustau Amontillado sherry", "Lustau Los Arcos Amontillado"]
  "Barbadillo Principe":
    generic: "amontillado sherry"
    aliases: ["Barbadillo Principe Amontillado sherry", "Barbadillo Príncipe"]
  "Lustau Don Nuño Oloroso":
    generic: "oloroso sherry"
    aliases: ["Lustau Oloroso Don Nuño Sherry", "Lustau Don Nuno Oloroso"]
  # `tawny port` has no bottle (see `not_reached_for`); costs.yml prices it as
  # a category.
  "Carpano Antica Formula":
    generic: "sweet vermouth"
  "Martini Rosso":
    generic: "sweet vermouth"
    aliases: ["Martini Rosso vermouth"]
  # Not Cocchi Americano, which is an `americano`.
  "Cocchi Vermouth di Torino":
    generic: "sweet vermouth"
    aliases: ["Cocchi di Torino"]
  "Cocchi Americano":
    generic: "americano"
    aliases: ["Cocchi Americano Bianco", "Americano bianco"]
  # What Helen pours where a recipe names Kina Lillet, which no longer exists.
  "Lillet Blanc":
    generic: "quinquina"
    aliases: ["Lillet", "Lillet blanc"]
  # A bottle, not a generic: a useful category name exists, and a generic
  # named as its own suggestion prints "Punt e Mes (Punt e Mes)".
  "Punt e Mes":
    generic: "sweet vermouth"
    aliases: ["Carpano Punt e Mes", "Punt E Mes"]
  # Dolin Dry, Blanc and Rouge are three bottles, not spellings of one.
  "Dolin Dry":
    generic: "dry vermouth"
    aliases: ["Dolin dry"]
  "Dolin Blanc":
    generic: "blanc vermouth"
    aliases: ["Dolin blanc"]
  # The label says Rouge; "Dolin red" is Helen's wording and an alias.
  "Dolin Rouge":
    generic: "sweet vermouth"
    aliases: ["Dolin red", "Dolin Red", "Dolin rouge", "Dolin Rouge Vermouth de Chambéry"]

  # --- liqueurs ---
  "Kahlua":
    generic: "coffee liqueur"
    aliases: ["Kahlúa"]
  "Passoa":
    generic: "passion fruit liqueur"
    aliases: ["Passoã", "Passoa passion fruit liqueur"]
  "King's Ginger":
    generic: "ginger liqueur"
    aliases: ["King's ginger liqueur", "Kings Ginger"]
  "L'Original Combier Triple Sec":
    generic: "triple sec"
    aliases: ["L'Original Combier Triple Sec Liqueur", "Combier Triple Sec",
              "Combier"]
  # Stays although Giffard is otherwise not suggested: it is the only bottle
  # behind `crème de mûre`, and without it every drink pouring that generic
  # unnamed loses its cost and strength (DECISIONS §9.3.2).
  "Giffard Crème de Mûre":
    generic: "crème de mûre"
    aliases: ["Giffard Creme de Mure"]
  "Fernet Branca":
    generic: "fernet"
    aliases: ["Fernet Branca liqueur", "Fernet-Branca"]
  # Three bottles whose generic is their own brand, because no category name
  # would help choose. The bottle entry gives strength and cost somewhere to
  # live.
  "Liquore Strega":
    generic: "Strega"
    aliases: ["Strega liqueur", "Strega"]
  "Bénédictine D.O.M.":
    generic: "Bénédictine"
    aliases: ["Benedictine D.O.M.", "Bénédictine", "Benedictine"]
  "Galliano L'Autentico":
    generic: "Galliano"
    aliases: ["Galliano L'Autentico liqueur", "Galliano"]
  "Cointreau":
    generic: "triple sec"
  # A cherry brandy; Briottet Crème de Cerise is a cherry liqueur. Two
  # generics.
  "Cherry Heering":
    generic: "cherry brandy"
  "Suze":
    generic: "gentian liqueur"
  # `Velvet` alone resolves because nothing else here is a velvet-anything.
  "John D Taylor's Velvet Falernum":
    generic: "falernum"
    aliases: ["Velvet", "Velvet Falernum", "Velvet falernum"]
  # Pimento is the allspice berry, so a pimento dram is an allspice dram.
  "Bitter Truth Pimento Dram":
    generic: "allspice dram"
    aliases: ["The Bitter Truth Pimento Dram", "The Bitter Truth Pimento Dram Liqueur",
              "Bitter Truth Pimento Dram Liqueur"]

  # --- Briottet: a house, so each product is declared by name ---
  # The white cacao and menthe are named for their colour; a brown cacao or a
  # green menthe is a second entry, not a wider alias.
  "Briottet Crème de Pêche":
    generic: "crème de pêche"
  "Briottet Crème de Cacao Blanc":
    generic: "white crème de cacao"
  "Briottet Crème de Violette":
    generic: "crème de violette"
  "Briottet Crème de Menthe Blanche":
    generic: "crème de menthe"
  "Briottet Curaçao Bleu":
    generic: "blue Curaçao"
  "Briottet Curaçao Orange":
    generic: "orange Curaçao"
  "Briottet Crème d'Abricot":
    generic: "apricot liqueur"
    aliases: ["Briottet Creme d'Abricôt", "Briottet Crème d'Abricôt"]
  "Briottet Maraschino":
    generic: "maraschino liqueur"
    aliases: ["Briottet maraschino liqueur"]
  # `cerise` takes no accent in French; Helen's accented spellings are
