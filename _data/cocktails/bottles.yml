# =============================================================================
# BOTTLES -> CATEGORY. Spec: #529. The check it unblocks: #534.
# =============================================================================
# NOT RUM-ONLY SINCE 2026-08-30, Helen's call. It was built as a rum reference
# and `test_every_bottle_names_a_declared_generic` used to enforce that, on the
# reasoning that "a bottle typed `cognac` would be a scoping mistake rather than
# a typo". The scope had already drifted past it: Ceylon arrack is in the card
# names, `Tesco Finest` sits in `unresolved_suggestions` standing in for a
# kirsch and a sloe gin, and the Kamaniwanalaya's Disaronno had nowhere to
# resolve to. Widening the file was the honest move rather than keeping a rule
# the data had stopped obeying.
#
# The TYPO half of that test survives and is the half worth having: a bottle's
# generic must still be DECLARED, so a renamed style that does not get followed
# here fails loudly instead of silently.
#
# Everything below about rum is unchanged and still the bulk of the file --
# #314's rulings, the appellations, `not_reached_for`. A non-rum entry simply
# does not have to argue with any of it.
# WHAT THIS IS FOR, and it is not an encyclopaedia (#459). Cocktail cards stopped
# naming bottles and started naming categories (#501), which moved a question
# from the page to the reader: "which of mine is a Demerara rum?" This is where
# that gets answered, and #529's reference page reads it.
#
# WHY A BOTTLE TABLE IS ALLOWED HERE WHEN #441 REJECTED ONE. That issue killed a
# shared bottle table for `character`, because character is why THIS DRINK wants
# THIS BOTTLE -- a property of the recipe's use, correctly restated per recipe. A
# bottle's CATEGORY is bottle-invariant: Appleton 12 is a moderately-aged
# Jamaican in every drink that pours it. Helen's own #314 rulings are written in
# exactly this shape ("Blackwell is Jamaican, caramel forward"), which is what
# settled it. #297 (ABV) sits on the same invariant side; `character` does not.
#
# THE LIST MEANS BOTTLES HELEN WOULD REACH FOR, NOT BOTTLES THAT QUALIFY.
# Settled 2026-08-27 by the case that separates them: Lemon Hart 151 clears the
# Demerara appellation and is deliberately absent, because "I don't like Lemon
# Hart 151, never mind whether or not I could get hold of it." A column headed
# "what qualifies" is the busywork #459 rules out; one headed "what I'd reach
# for" answers a question she actually has. `not_reached_for` below records the
# exclusions WITH their reasons, the `family_less` idiom.
#
# `Demerara, aged` AND `Demerara, overproof` ARE APPELLATIONS, NOT FLAVOURS.
# Helen, 2026-08-27, from Minimalist Tiki: the category requires 100% of the
# distillate to come from DDL in Guyana. This makes two of the eleven rum styles
# a different KIND of category from the other nine -- checkable against a fact
# about the bottle rather than argued from the glass -- and it is why both
# Pusser's are `moderately aged` despite tasting Demerara to most people. It is
# also why Skipper's needed Helen rather than inference: "all seven distinct rums
# blended into it are by DDL." A Halewood bottling of Guyanese rum very probably
# qualifies, and "very probably" is not what a 100% rule asserts.
#
# ONE GENERIC PER BOTTLE, deliberately. A bottle serving two categories was the
# state before #314 -- Havana 3 sat under both `lightly aged and filtered` and
# `blended multi-region rum, clear` -- and Helen resolved it rather than blessing
# it. If a genuine two-category bottle ever turns up, that is a decision to make
# then, not a shape to leave open now.
#
# ALIASES ARE HOW A BOTTLE KEEPS ONE IDENTITY. Twelve suggestion strings in the
# collection collapse to about five bottles: ED3 / El Dorado 3 / El Dorado 3yo /
# El Dorado 3yo rum. Matching is case-insensitive; add the spelling, do not add
# a second bottle.
#
# PLANTERAY IS THE CANONICAL SPELLING AND PLANTATION IS ALWAYS AN ALIAS --
# Helen, 2026-08-27: "please collapse Plantation and rename to Planteray
# everywhere." They are one brand, renamed, which no string comparison recovers,
# so the collapse has to be declared. The old spellings STAY as aliases and that
# is not a half-finished rename: the drinks were written before the rebrand and
# a suggestion must keep resolving whether or not its drink has been retyped
# yet. Same division `canonical_glasses` draws in glasses.yml -- the rule
# governs what is WRITTEN, the alias map governs what can be READ.

bottles:

  # --- Jamaican ------------------------------------------------------------
  "Appleton Estate Signature":
    generic: "moderately aged Jamaican rum"
    aliases: ["Appleton Signature", "Appleton Estate V/X rum", "Appleton V/X"]
  "Appleton Estate 8 Year Reserve":
    generic: "moderately aged Jamaican rum"
    aliases: ["Appleton 8", "Appleton 8-year", "Appleton Estate 8 Reserve"]
  "Appleton Estate 12 Rare Casks":
    generic: "moderately aged Jamaican rum"
    aliases: ["Appleton 12 Rare Casks", "Appleton Rare Casks",
              "Appleton Estate Rare 12 year old blended rum"]
  # #314, Helen 2026-08-27. Her marker for the caramel-forward style, along with
  # Myers -- which no drink names yet, so it is not listed here.
  "Blackwell":
    generic: "caramel-forward Jamaican rum"
    aliases: []
  # RECLASSIFIED 2026-08-27, from `Jamaican, overproof, unaged`. Helen's call,
  # and it resolves the one bottle that had been sitting under two generics: it
  # is aged, so the unaged overproof style was never right. 57% is what made it
  # look like one -- and strength is not what that category names.
  "Smith & Cross":
    generic: "moderately aged Jamaican rum"
    aliases: ["Smith and Cross", "Smith & Cross rum"]
    note: "57% ABV — be sensible about how much you use."
  "Wray & Nephew":
    generic: "unaged overproof Jamaican rum"
    aliases: ["Wray and Nephew", "Wray & Nephew Overproof"]
  # Its own thing rather than a Wray & Nephew substitute -- Helen, 2026-08-27:
  # "choice of that or W&N is mood by mood." Same category, not interchangeable
  # on autopilot, which is why both are listed rather than one carrying the
  # other as an alias.
  "Rum Fire":
    generic: "unaged overproof Jamaican rum"
    aliases: []

  # --- Demerara: 100% DDL, Guyana. See the appellation note above. ----------
  "El Dorado 3":
    generic: "lightly aged and filtered rum"
    aliases: ["ED3", "El Dorado 3yo", "El Dorado 3yo rum"]
  "El Dorado 5":
    generic: "aged Demerara rum"
    aliases: []
  "El Dorado 8":
    generic: "aged Demerara rum"
    aliases: []
  "El Dorado 12":
    generic: "aged Demerara rum"
    aliases: ["El Dorado 12 year old rum"]
  "El Dorado 151":
    generic: "overproof Demerara rum"
    aliases: ["El Dorado 151 rum"]
    # Helen, 2026-08-27: the ONLY bottle in this category, and on the shopping
    # list rather than on the shelf. Wanted counts as reached-for; see
    # `not_reached_for` for what does not.
  "Skipper's":
    generic: "aged Demerara rum"
    aliases: ["Skippers dark rum", "Skippers"]
  # Ruled 2026-08-27 and used by no drink yet. 57% is AT proof, not over it --
  # overproof begins above 57.15% -- so this is not a `Demerara, overproof`
  # however much the strength suggests otherwise.
  "Wood's":
    generic: "aged Demerara rum"
    aliases: ["Woods", "Wood's 100"]

  # --- moderately aged: the residual style, no region and no other marker ---
  # BOTH PUSSER'S LIVE HERE, and this is the appellation rule biting rather than
  # a flavour judgement -- Pusser's blends Trinidadian rum, so it fails the 100%
  # DDL test whatever it tastes like. Same blend at two strengths, so splitting
  # them across two categories would have been the odd outcome.
  "Pusser's Blue Label":
    generic: "moderately aged rum"
    aliases: ["Pusser's Blue"]
  "Pusser's Gunpowder":
    generic: "moderately aged rum"
    aliases: ["Pusser's Gunpowder Proof", "Pusser's Navy rum 54.5%"]
  "Gosling's Black Seal":
    generic: "moderately aged rum"
    aliases: ["Gosling's", "Goslings"]
    # Reached for FOR its blackstrap, which is a `character` on the recipe and
    # never a generic -- #314, and the reason this file has no character column.
  "Havana Club 7":
    generic: "moderately aged rum"
    aliases: ["Havana 7", "Havana Club 7yo"]
  "Ron del Barrito":
    generic: "moderately aged rum"
    aliases: ["Ron del Barrito 3 star rum"]
  "Planteray Barbados 5":
    generic: "moderately aged rum"
    aliases: ["Plantation Barbados 5", "Plantation Barbados 5 year old rum"]

  # --- lightly aged and filtered -------------------------------------------
  "Havana Club 3":
    generic: "lightly aged and filtered rum"
    aliases: ["Havana 3", "Havana Club 3yo rum", "Havana 3 year old",
              "Havana Club Original Añejo 3 Años Cuban rum"]
  "Flor de Caña Extra Dry":
    generic: "lightly aged and filtered rum"
    aliases: ["Flor de Caña extra dry white rum"]
  # JW SPICERS IS DELIBERATELY ABSENT. Helen, 2026-08-27: "never name Spicers --
  # if I have it skulking at the back of the nonsense shelf then I'll throw it
  # in where I can." Same rule as Long Island Iced Tea's rum: what is cheap and
  # what needs using up are facts about the shelf on the day, not about the
  # drink. Frozen Fruit Daiquiri's suggestion goes rather than being corrected.

  # --- blended multi-region, clear -----------------------------------------
  # EFFECTIVELY THE ONLY BOTTLE IN ITS CATEGORY since #314 put Havana 3 and
  # El Dorado 3 firmly in `lightly aged and filtered`. That is production rather
  # than preference: 3 Stars is a genuine Barbados/Jamaica/Trinidad blend where
  # the other two are single-origin.
  "Planteray 3 Stars":
    generic: "clear blended multi-region rum"
    aliases: ["Plantation 3 Stars", "Plantation 3 Stars rum", "Planteray 3",
              "Plantation 3"]

  # --- brand-generics: the bottle IS the category (#314 rum_untyped) --------
  "Planteray O.F.T.D.":
    generic: "blended overproof rum"
    aliases: ["Plantation OFTD", "Planteray OFTD", "OFTD"]
    # #314, Helen 2026-08-27: "not an aged Demerara, it is its own category".
    # 69%, and a Guyana/Jamaica/Barbados blend, so it fails DDL twice over.
  "Planteray Stiggins' Fancy":
    generic: "pineapple rum"
    aliases: ["Plantation Stiggins Fancy Pineapple rum",
              "Plantation pineapple-infused rum"]
  "Malibu":
    generic: "coconut rum"
    aliases: ["Coconut rum"]

  # --- cane juice: agricole, clairin, cachaça ------------------------------
  "Clément Agricole Blanc":
    generic: "rhum agricole blanc"
    aliases: ["Clement Agricole Blanc"]
  "Damoiseau Rhum Agricole Blanc":
    generic: "rhum agricole blanc"
    aliases: ["Damoiseau Rhum Agricole Blanc 40 proof", "Damoiseau Blanc"]
  "La Favourite Rhum Agricole Blanc":
    generic: "rhum agricole blanc"
    aliases: ["La Favourite Blanc"]
  "La Favourite L'Authentique Ambré":
    generic: "rhum agricole vieux"
    aliases: []
  "Rhum JM Ambré":
    generic: "rhum agricole vieux"
    aliases: ["JM Rhum Agricole ambre", "JM"]
  "Barbancourt 3 Star":
    generic: "rhum agricole vieux"
    aliases: ["Barbancourt Three Star rum", "Barbancourt 3-star rum"]
    # Haitian cane juice, so agricole by production even though the word on the
    # label is not "agricole".
  "Clairin Communal":
    generic: "clairin"
    aliases: []
  "Sagatiba":
    generic: "cachaça"
    aliases: []
  "Leblon":
    generic: "cachaça"
    aliases: []
  # Added 2026-08-27 at Helen's request, and it CORRECTS A SPELLING that has
  # been sitting in Caipirinha's drink-level note since ingestion: that note
  # ranks "Sagatiba = Leblon > Viero Barriero > Abelho > Yaguara Organic", and
  # the brand is Velho Barreiro. The note was transcribed verbatim on purpose
  # ("Future Helen will know exactly what I mean", #457) so it was never
  # proofread as a bottle name -- which is exactly how a misspelling survives a
  # deliberate decision not to touch something.
  "Velho Barreiro":
    generic: "cachaça"
    aliases: ["Viero Barriero"]
  # Named by Helen 2026-08-27 for `Jamaican, caramel forward`, alongside
  # Blackwell. NO DRINK MENTIONS IT, and it is listed anyway: this file is what
  # she would reach for, not an index of what the collection happens to cite.
  "Myers":
    generic: "caramel-forward Jamaican rum"
    aliases: ["Myers's", "Myer's"]
  "Van Osten Botanik Arrack":
    generic: "Batavia arrack"
    aliases: ["Van Osten"]

  # --- the Martinique agricoles, 2026-08-30 ---------------------------------
  # Named by Helen for the Martinique Swizzle, one per reason: JM for the
  # classic build, Trois Rivières for a savoury one, La Favourite for high
  # proof. All three are `rhum agricole blanc` and the ORIGIN THAT SEPARATES
  # THEM IS NOT RECORDABLE YET -- she asked for "a way of noting the origin of
  # agricole given flavour varies so much" and it is a real gap: thirteen drinks
  # use an agricole generic and Barbancourt, which is Haitian, is typed
  # `rhum agricole vieux` behind a QQ admitting the value was inferred. Raised
  # rather than invented here.
  "Rhum JM Blanc":
    generic: "rhum agricole blanc"
    aliases: ["JM Blanc", "JM blanc"]
  "Trois Rivières Cuvée de l'Océan":
    generic: "rhum agricole blanc"
    aliases: ["Trois Rivieres Cuvee de l'Ocean", "Trois Rivières", "Cuvée de l'Océan"]
  "La Favourite Cœur de Canne":
    generic: "rhum agricole blanc"
    aliases: ["La Favourite Coeur de Canne", "Coeur de Canne", "Cœur de Canne"]

  # --- not a rum ------------------------------------------------------------
  # The first entries here that are not cane spirits at all, which is what the
  # 2026-08-30 widening at the top of this file is about.
  #
  # ST LUCIAN, NOT JAMAICAN, and that is why it sits under the origin-free
  # style. Helen named it for the Kamaniwanalaya's Jamaican arm; St Lucia
  # Distillers is not Jamaica, and her call when shown that was to move it to
  # the arm that makes no origin claim.
  "Chairman's Reserve":
    generic: "moderately aged rum"
    aliases: ["Chairmans Reserve", "Chairman's"]
  "Disaronno":
    generic: "amaretto"
    aliases: ["Disaronno Originale"]

  # ===========================================================================
  # BEYOND RUM -- 2026-08-30
  # ===========================================================================
  # Declared so that `test_every_suggested_bottle_resolves` can stop being
  # rum-only. Helen's call: "are we now assuming every named bottle should be in
  # it, and classified? That feels right to me."
  #
  # EVERY GENERIC HERE IS READ FROM THE COLLECTION, NOT REMEMBERED. It is the
  # generic of the ingredient the suggestion is written beside, in every drink
  # that names the bottle -- so `Cointreau -> triple sec` is what the drinks
  # already say, not what anyone recalls about the bottle. The four brands that
  # sit beside MORE than one generic (Briottet, Monin, Gabriel Boudier, Acacia)
  # are deliberately absent: a brand is not a bottle, and which product is meant
  # is Helen's.

  # --- gin ------------------------------------------------------------------
  "Beefeater":
    generic: "London dry gin"
  "Tanqueray":
    generic: "London dry gin"
  "Hayman's":
    generic: "London dry gin"
  "Rutte":
    generic: "London dry gin"

  # --- whisky ---------------------------------------------------------------
  "Woodford's Reserve":
    generic: "bourbon"
    # The curly apostrophe is a SECOND STRING for one bottle and invisible on
    # the page -- it made two entries out of one in every count until now.
    aliases: ["Woodford’s Reserve", "Woodfords Reserve"]
  "Ardbeg XO":
    generic: "single malt scotch whisky"

  # --- agave ----------------------------------------------------------------
  "Del Maguey Vida":
    generic: "mezcal"
    aliases: ["Del Maguey VIDA", "Del Maguey vida"]
  "Tapatio":
    generic: "blanco tequila"

  # --- brandy ---------------------------------------------------------------
  "Pierre Ferrand Ambre":
    generic: "cognac"
    aliases: ["Pierre Ferrand ambre"]

  # --- aromatised wine. See #568, which proposes splitting these further -----
  "Carpano Antica Formula":
    generic: "sweet vermouth"
  # A BRAND THAT IS ITS OWN GENERIC, the pattern #314 permits for three rums
  # because nothing generalises the bottle. The Ridgwell pours this AND a sweet
  # vermouth in the same drink, 12.5 ml of each, which is the proof that
  # "sweet vermouth" does not generalise it.
  "Punt e Mes":
    generic: "Punt e Mes"
    aliases: ["Carpano Punt e Mes", "Punt E Mes"]
  "Dolin Dry":
    generic: "dry vermouth"
    aliases: ["Dolin dry"]

  # --- liqueurs -------------------------------------------------------------
  "Cointreau":
    generic: "triple sec"
  "Cherry Heering":
    generic: "cherry liqueur"
  "Suze":
    generic: "gentian liqueur"
  "John D Taylor's Velvet Falernum":
    generic: "falernum"
    # `Velvet` alone is how two drinks write it, which is a fragment rather than
    # a name -- resolvable here precisely because the falernum is the only
    # velvet-anything in the collection.
    aliases: ["Velvet", "Velvet Falernum", "Velvet falernum"]
  "Briottet Crème de Pêche":
    generic: "crème de pêche"
  "Briottet Crème d'Abricot":
    generic: "apricot liqueur"
    # The written spelling carries a stray circumflex and an unaccented Creme.
    # Aliased rather than corrected in the draft: this file governs what can be
    # READ, and #585 is where the writing gets fixed.
    aliases: ["Briottet Creme d'Abricôt", "Briottet Crème d'Abricôt"]

  # --- bitters --------------------------------------------------------------
  "Angostura":
    generic: "aromatic bitters"
    aliases: ["Angostura bitters"]
  "Bittermens Xocolatl Mole":
    generic: "chocolate bitters"

  # --- absinthe and pastis --------------------------------------------------
  "Vieux Pontarlier":
    generic: "absinthe"

  # --- syrups, juices and the rest ------------------------------------------
  "Monin Gingembre":
    generic: "ginger syrup"
  "Bottle Green":
    generic: "ginger and lemongrass cordial"
  "Biona unsweetened":
    generic: "cranberry juice"

# =============================================================================
# QUALIFIES, DELIBERATELY NOT REACHED FOR -- the reason attached, as family_less
# =============================================================================
not_reached_for:
  "Lemon Hart 151": >-
    Clears the Demerara appellation and is out anyway. Helen, 2026-08-27: "I
    don't like Lemon Hart 151, never mind whether or not I could get hold of it
    if I wanted it." This is the case that settled what this file means -- it is
    what she would POUR, not what would be permitted. Port-au-Prince still names
    it as its `item`; the substitution it wants is Planteray OFTD, which crosses
    a category and therefore wants a note (#534).
  "Pusser's 151": >-
    Fails the 100% DDL rule the same way the other two Pusser's do, so it was
    never a `Demerara, overproof` -- and unlike them it has no obvious home,
    since `moderately aged` says nothing about strength. Named only inside
    Swizzle's prose suggestion, which is being rewritten anyway. Give it a
    category if a drink ever genuinely wants it.

# =============================================================================
# SUGGESTION STRINGS THAT DO NOT NAME A BOTTLE -- known, and failing on purpose
# =============================================================================
# #457 settled that `suggestion` is bottle NAME(S) ONLY and these predate or
# escaped it. Listed rather than tolerated so that
# test_every_suggested_bottle_resolves bites on the NEXT one while these are
# being fixed; deleting a line here is how one gets retired.
#
# The two compound strings are the interesting ones: both name bottles from two
# different categories inside a single string, which is what a list `generic`
# exists to express and a comma cannot.
unresolved_suggestions:
  # NOT A RUM, AND THE FIRST NON-RUM ENTRY HERE -- deliberate, and the same
  # widening `card_names` already took when Ceylon arrack joined it. Helen,
  # 2026-08-29, on finding it offered as an ingredient chip by typing "sco":
  # "This should never be there anyway, but certainly never without the kind of
  # alcohol it actually is."
  #
  # A retailer's own-brand RANGE is not a product. It names no distillery, no
  # style and -- the part that makes it useless rather than merely vague -- no
  # spirit: both drinks that carry it want an `eau de vie`, and nothing in the
  # string says so. It is the one entry in the collection flagged by neither the
  # prose rule nor the bottle aliases, because it is a perfectly well-formed
  # name for the wrong kind of thing.
  #
  # Listing it here keeps it out of the picker and records WHY, which is what
  # this block is for. #585 is where it gets fixed: Helen names the bottle.
  "Tesco Finest": >-
    A retailer range rather than a bottle. Charleston and Cobra Effect both
    want an `eau de vie` and this says neither which one nor even which
    spirit. Needs Helen.
  "Appleton 8, or Appleton 12 Rare Casks": >-
    Two bottles in one string; wants the list form. Both are
    `Jamaican, moderately aged`, so nothing is at stake beyond the shape.
  "ED3 or Havana 3": >-
    Two bottles in one string; wants the list form. Both `lightly aged and
    filtered` since #314.
  # Re-keyed from "ED3, Plantation" on 2026-08-30 when #582 corrected the
  # spelling in the drink. This block names STRINGS AS WRITTEN, so it moves with
  # them -- and `test_every_suggested_bottle_resolves` caught the gap the moment
  # the draft changed, which is the whole reason a declared exception beats a
  # comment.
  "ED3, Planteray": >-
    Two bottles in one string, and since #314 they are in DIFFERENT categories --
    El Dorado 3 is `lightly aged and filtered`, Planteray 3 Stars is `blended
    multi-region rum, clear`. Royal Bermuda Yacht Club's generic is the
    disjunctive pair, so the list form would say exactly the right thing.
  "El Dorado 5 or 8": >-
    Two bottles in one string; wants the list form. Both `Demerara, aged`.
  "Wray & Nephew, or Rum Fire": >-
    Two bottles in one string; wants the list form. Both `Jamaican, overproof,
    unaged`.
  "Havana 7, Appleton 8": >-
    Two bottles in one string, in two categories, and Carta Switchel's generic
    is already the matching disjunctive pair -- Havana 7 is `moderately aged`
    and Appleton 8 is `Jamaican, moderately aged` (#314). The list form makes
    the pairing legible instead of coincidental.
  # BOTH OF THE "NEEDS HELEN" COMPOUNDS CAME OFF ON 2026-08-30, and neither by
  # being reworded -- the drinks were rewritten and the strings went with them.
  #
  # Kamaniwanalaya's "Pusser's Gunpowder, or Smith & Cross" is now a real list:
  # the generic is `[moderately aged Jamaican rum, moderately aged rum]` and the
  # suggestion is `[Appleton 8, Chairman's Reserve, Pusser's Gunpowder]`, with
  # Smith & Cross moved to a note "for more hogo". That is exactly the half this
  # entry said needed her.
  #
  # Swizzle's "Pusser's 151, or Planteray OFTD for a 138 Swizzle" went further:
  # Helen, "Swizzle has got a bit confused. It should be Martinique Swizzle", so
  # the drink is 60 ml of unaged agricole and neither bottle is in it.
  # --- HANDED BACK 2026-08-30, and the reason is the same for eleven of them --
  # Helen: "Keep only what the collection already spells out; hand me back the
  # rest." These were declared in this session by DERIVING the bottle's category
  # from the generic of the ingredient it sits beside -- which is a good default
  # and not a rule, because a suggestion may deliberately cross categories.
  # Helen's own example: "a recipe might call for cherry brandy, and I suggest
  # Cherry Heering OR Briottet cerise even though that's a cherry liqueur not a
  # brandy, leaving it to future Helen to choose."
  #
  # The one that was actually WRONG is first, and it is the argument for the
  # other eleven: a plausible-looking declaration would have taught #534's
  # cross-category check a false fact and blinded it to a substitution the drink
  # already documents.
  "Pernod": >-
    Declared `absinthe` in error. Don's Mai Tai suggests it against an absinthe
    and that drink's own note says "the source says absinthe and then names
    Pernod, which is a pastis. Carried as written rather than corrected." So
    this is a cross-category substitution; `pastis` is a declared generic and is
    almost certainly the right value, but it is Helen's to confirm rather than
    mine to infer twice.
  "aguardiente": >-
    A spirit TYPE rather than a bottle. Bali Hai writes `Aguardiente brandy` as
    its item and this as its suggestion, so the suggestion repeats the item
    instead of naming a bottle.
  "kirschwasser": >-
    A spirit TYPE rather than a bottle, same as aguardiente.
  "Portobello": >-
    A brand, and completing it to Portobello Road was memory rather than
    reading. Tailspin's generic is `London dry gin`.
  "Sazerac": >-
    Written by the drink of the same name against `rye`, so it is not even
    certain this names a bottle rather than repeating the title.
  "Luxardo": >-
    A house, not a bottle. Three drinks write it against `maraschino liqueur`.
  "Roots": >-
    A house, not a bottle. Art de Vivre writes it against `mastiha liqueur`.
  "Bob's": >-
    A house that makes a great many bitters. Minty Pentones writes it against
    `peppermint bitters`.
  "Cocchi di Torino": >-
    Short of the product name. Man o' War writes it against `sweet vermouth`.
  "Pierre Ferrand dry": >-
    Short of the product name, and ambiguous with the Ambre already declared.
    El Presidente writes it against `orange Curaçao`.
  "Bob's Margarita bitters": >-
    A real product name whose CATEGORY is in doubt: Margarita writes it against
    `lavender-forward bitters` and nothing in the collection says whether these
    are lavender-led.
  "Elemakule Tiki": >-
    Christmas Daiquiri writes it against `warm-spiced bitters`. Probably
    Bittermens', which is memory rather than reading.

  # --- BEYOND RUM, 2026-08-30 ------------------------------------------------
  # Declared so `test_every_suggested_bottle_resolves` could stop being
  # rum-only. Each of these is REAL DEBT with a reason attached, not a way of
  # silencing the check: the other 43 non-rum suggestions resolved to a bottle.

  # A BRAND IS NOT A BOTTLE. Each of these names a house that makes several of
  # the things the collection pours, so the string cannot say which product is
  # meant -- and unlike `Velvet`, no single candidate makes it unambiguous. The
  # generic beside each one narrows it in every case; completing the string is
  # Helen's, because "Briottet make a crème de cacao" is an assumption about a
  # range rather than a fact in the data.
  "Briottet": >-
    A brand, not a bottle. Written beside SIX different generics -- crème de
    cacao, crème de violette, crème de pêche, blue Curaçao, crème de menthe and
    orange Curaçao -- so the string names a house and the drink names the
    product. Two of its bottles ARE declared (Crème de Pêche, Crème d'Abricot);
    these are the ones written bare.
  "Edmond Briottet": >-
    The same house under its founder's name, beside `orange Curaçao` in Don's
    Mai Tai. One generic, so it is resolvable in principle -- but it is still a
    brand rather than a product, and naming it would guess which Curaçao.
  "Gabriel Boudier": >-
    A brand, beside `crème de banane` and `orange Curaçao`.
  "Monin": >-
    A brand, beside four generics -- sugar syrup 2:1, cinnamon syrup, passion
    fruit syrup and orgeat. `Monin Gingembre` is declared because it names the
    product; these do not.
  "Acacia": >-
    A honey VARIETY rather than a bottle, and beside two generics (`honey` and
    `honey water 2:1`).
  "acacia honey": >-
    The same thing spelled out, beside `honey water 2:1`. A SCHEMA MISMATCH
    rather than a naming one: the suggestion is which honey to make the syrup
    FROM, and `suggestion` means which bottle to pour. Worth its own decision.

  # PROSE, and each already kept out of the index by the search's prose rule --
  # this is the data half. #585 is the backlog.
  "Avallen -- a round, fresh taste if you need to sub": >-
    A bottle plus a reason. Avallen is a calvados and Apple Cart's generic says
    so; #457's shape is the bottle in `suggestion` and the reason in `note`.
  "Dolin Rouge?": >-
    A question mark, and #568 answers it: Helen lists Dolin Rouge under sweet
    red vermouth, "I pick this one when I want a lighter character". The
    Ridgwell's generic is already `sweet vermouth`, so this wants the question
    mark taken off rather than a decision.
  "Jack Daniels > Bulleit": >-
    A comparison, and the direction is ambiguous -- ">" could mean "prefer" or
    "replaced by". Banana Boulevardier's generic is `bourbon`; Bulleit makes a
    bourbon and a rye, and Jack Daniels is neither by category.
  "Or 20g palm sugar": >-
    An alternative INGREDIENT, not an alternative bottle -- Caipirinha's generic
    is `raw sugar`. It wants a `note`, or a second option on the generic.
  "Patron Silver, Rooster Bianco": >-
    Two bottles in one string. Patrón Silver is a blanco tequila and matches
    Margarita's generic; Rooster Rojo Bianco is also a blanco, so this is the
    list form (#457) rather than a real question.
  "or other Creole-style bitters": >-
    Prose. Sazerac's generic is already `Creole bitters`, so the string says
    only "or something else of the same kind" -- which the generic says better.
  "or other aromatic bitters": >-
    The same, against `aromatic bitters`.

  "Best with ED3, Havana 3 is fine": >-
    Prose carrying a real preference between two bottles Helen owns, which is
    why it STAYS while the two below went: ED3 is the pick and Havana 3 is
    acceptable, and that is a fact about the drink rather than about the shelf.
    #457's shape is `suggestion: ["El Dorado 3", "Havana Club 3"]` in that
    order, with the ranking as a `note`.
  # `Planteray` (bare, on Long Island Iced Tea) and "the cheapest white rum to
  # hand; sometimes JW Spicers" (Milliners Punch) WERE HERE AND ARE
  # GONE, 2026-08-27, because the suggestions themselves are gone. Resolved the
  # same way, and it is a rule rather than a coincidence: Helen reached for
  # those bottles because they were cheap and because she was using them up,
  # neither of which is a fact about the drink. "I'd rather not specify any rum
  # at all for LIIT because neither I nor the drink care", and "never name
  # Spicers". So the `suggestion` came off rather than being corrected -- the
  # generic already says everything the drink requires. A genuinely absent
  # suggestion is a real answer, and these are the first in the collection.
  #
  # An entry here is deleted when its string stops existing. Leaving it would be
  # the exact rot this block guards against: a declared exception that reads as
  # an outstanding problem while pointing at nothing.
  "Havana 3 year old and Clément Agricole Blanc": >-
    AND, not OR -- Daisy de Santiago pours both, and its `generic` is correctly
    the disjunctive pair. One suggestion string covering two separate pours is
    the real problem here; it may want splitting across two ingredient entries.
