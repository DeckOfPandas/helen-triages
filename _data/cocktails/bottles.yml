  "Briottet Crème de Cerise":
    generic: "cherry liqueur"
    aliases: ["Briottet Cérise", "Briottet Cerise", "Briottet cerise",
              "Briottet Crème de Cérise", "Briotte Cérise"]
  # The label's spelling is canonical; the unaccented one is the alias.
  "Briottet Crème de Myrtille":
    generic: "crème de myrtille"
    aliases: ["Briottet Creme de Myrtille"]
  # A bare house alias, safe because Luxardo only ever means the maraschino
  # here. A second Luxardo product is a second entry, and the alias comes off.
  "Luxardo Maraschino":
    generic: "maraschino liqueur"
    aliases: ["Luxardo"]

  # --- Gabriel Boudier: declared by product, whether or not a drink names it ---
  "Gabriel Boudier Crème de Banane":
    generic: "crème de banane"
  "Gabriel Boudier Curaçao Orange":
    generic: "orange Curaçao"
  "Gabriel Boudier Crème de Menthe":
    generic: "crème de menthe"
  "Gabriel Boudier Liqueur de Gingembre":
    generic: "ginger liqueur"
    aliases: ["Gabriel Boudier Gingembre"]
  # Frozen Ginger Daiquiri uses it where the recipe asks for ginger syrup.
  "Briottet Liqueur de Gingembre":
    generic: "ginger liqueur"
  # A rhum-based liqueur, filed with the liqueurs like Créole Shrubb, so "no
  # rum tonight" does not drop it.
  "Clément Mahina Coconut Rhum Liqueur":
    generic: "coconut rhum"
    aliases: ["Clement Mahina Coconut Rhum Liqueur", "Clément Mahina Coco",
              "Clement Mahina Coco", "Mahina Coco"]
    origin: "Martinique"
  "Briottet Liqueur de Sapin":
    generic: "liqueur de sapin"
  "La Tomato Liqueur":
    generic: "tomato liqueur"
  # Bare `Roots` resolves: one product in the collection.
  "Roots Mastiha":
    generic: "mastiha liqueur"
    aliases: ["Roots"]
  "Pierre Ferrand Dry Curaçao":
    generic: "dry orange Curaçao"
    aliases: ["Pierre Ferrand dry"]
  # Its generic is its own brand: a rhum-based orange liqueur, not a rum.
  "Rhum Clément Créole Shrubb":
    generic: "Créole Shrubb"
    aliases: ["Rhum Clement Créole Shrubb", "Clément Créole Shrubb",
              "Créole Shrubb", "Rhum Clement Creole Shrub",
              "Rhum Agricole Clément Créole shrub",
              "Rhum Clément Créole Shrubb liqueur"]

  # --- bitters ---
  "Bitter Truth Aromatic":
    generic: "aromatic bitters"
    aliases: ["Bitter Truth Aromatic bitters", "The Bitter Truth Aromatic"]
  "Angostura":
    generic: "aromatic bitters"
    aliases: ["Angostura bitters"]
  # A different product from "Angostura" above, so it has its own fully
  # spelled key (#984).
  "Angostura orange bitters":
    generic: "orange-forward bitters"
    aliases: []
  "Peychaud's":
    generic: "Créole bitters"  # accent aigu added -- #882
    aliases: ["Peychauds", "Peychaud's bitters", "Peychaud’s"]
  "Bittermens Xocolatl Mole":
    generic: "chocolate bitters"
    aliases: ["Bittermen’s Xocolatl Mole bitters", "Bittermens Xocolatl Mole bitters",
              "Bittermen's Xocolatl Mole"]
  # No leading apostrophe, on Helen's ruling (#879); the apostrophised
  # spellings are aliases.
  "Bittermens Elemakule Tiki Bitters":
    generic: "warm-spiced bitters"
    aliases: ["Elemakule Tiki", "Bittermens 'Elemakule Tiki Bitters",
              "Bittermens ’Elemakule Tiki Bitters"]
  # Bare `Bob's` is safe as an alias only while the other Bob's is always
  # written in full.
  "Bob's Peppermint Bitters":
    generic: "peppermint bitters"
    aliases: ["Bob's"]
  "Bob's Margarita Bitters":
    generic: "lavender-forward bitters"
    aliases: ["Bob's Margarita bitters"]

  # --- absinthe ---
  "Vieux Pontarlier":
    generic: "absinthe"
  # Bare "Pernod" could also mean Pernod Anise, a pastis; here it resolves to
  # the absinthe.
  "Pernod Absinthe":
    generic: "absinthe"
    aliases: ["Pernod"]
    note: "Pernod Anise, the 40% yellow one, is a different bottle and a pastis."

  # --- syrups, juices and the rest ---
  # Monin is a house: each syrup is declared by product.
  "Monin Gingembre":
    generic: "ginger syrup"
  "Monin Cinnamon":
    generic: "cinnamon syrup"
  "Monin Passion Fruit":
    generic: "passion fruit syrup"
  "Monin Orgeat":
    generic: "orgeat"
  # Monin's 2:1 cane sugar syrup.
  "Monin Pure Cane Sugar":
    generic: "cane sugar syrup 2:1"
  # A honey, not a syrup: a honey water's suggestion names what it is made
  # from. Filed under the flat `honey water` because the ratio belongs to the
  # recipe; `_same_category` in tests/test_cocktails.py lets it cover the
  # ratio generics.
  "Acacia honey":
    generic: "honey water"
    aliases: ["Acacia", "acacia honey"]
  "Bottle Green":
    generic: "ginger and lemongrass cordial"
  "Biona unsweetened":
    generic: "cranberry juice"

# Qualifies, and deliberately not reached for, with the reason. Do not re-add
# a bottle because its category looks thin; delete its line when the bottle
# comes back into the house.
not_reached_for:
  "Anchor Junipiero": >-
    A real London dry gin and not one she keeps. It was the expensive end of
    that category -- GBP 38 against Beefeater's 18 -- so the range narrows to
    GBP 18-26 without it, and her `default_bottles` ruling the same day had
    already settled the category on Tanqueray anyway. Charleston named it and
    no longer does.
  "Ottoman 10 Year Tawny": >-
    The ONLY `tawny port` the file declared, so removing it leaves that
    category with no bottle -- the El Dorado 151 situation exactly, and handled
    the same way: the generic stays, because Port Authority still asks for a
    tawny port, and costs.yml prices the category instead. If a tawny comes
    into the house, this is the line to delete.
  "El Dorado 151": >-
    Withdrawn 2026-09-05, declared again on 2026-09-08 under #750 when Helen
    was asked which bottle the `overproof Demerara rum, lightly aged` category
    wanted and named this one -- and withdrawn for good on 2026-09-09, when she
    corrected it herself: "I made a mistake, my overproof Demerara rum is
    Pusser's 151." She does not own an El Dorado 151 and never did; the 2026-09-05
    withdrawal was right and the re-declaration was a misunderstanding of the
    question, not a change of mind. Do not re-add it because the category looks
    thin -- that is the mistake this block exists to stop.
    PUSSER'S 151 IS THE BOTTLE THAT CATEGORY ACTUALLY HAS, settled the same
    day: Helen named it in the same breath as the correction, and it was
    retyped from `blended overproof rum` to this Demerara on her ruling that it
    is 100% Guyanese. So the category is NOT bottle-less -- see the Pusser's
    151 entry above for the whole argument.
  "Tapatio": >-
    Helen, 2026-09-05: "I've run out of Tapatio! Let's delete it." NOT THE SAME
    KIND OF EXCLUSION as the three above, and the line is here so nobody has to
    guess which: running out is a fact about today, not a judgement about the
    bottle. If it comes back into the house this line is the only thing to
    delete. `blanco tequila` is unaffected -- Patrón Silver and Rooster Rojo
    Bianco remain, and they are the two her default rule already priced it from,
    so Tapatio was outside the pricing set before it was outside the cupboard.
    Del Famoso named it and no longer does.
  "Ron del Barrilito Three Stars": >-
    The free one of the three: no drink named it, so nothing changed but the
    count. Worth a line anyway, because the entry it replaced asserted the
    opposite -- "the misspelling stays as an alias because the drink that wrote
    it still does" -- and that had quietly stopped being true. Helen called the
    spelling "a bad typo from me" on 2026-09-04; if the bottle ever returns, so
    do the three aliases.
  "Lemon Hart 151": >-
    Clears the Demerara appellation and is out anyway. Helen, 2026-08-27: "I
    don't like Lemon Hart 151, never mind whether or not I could get hold of it
    if I wanted it." This is the case that settled what this file means -- it is
    what she would POUR, not what would be permitted. Port-au-Prince still names
    it as its `item`; the substitution it wants is Planteray OFTD, which crosses
    a category and therefore wants a note (#534).

# Suggestion strings that do not name a bottle (#457), listed so that
# test_every_suggested_bottle_resolves bites on the next one. Delete an entry
# when its string stops existing. Empty is a real state and the key must stay:
# test_unresolved_suggestions_has_no_stale_entries asserts it is present.
unresolved_suggestions: {}
