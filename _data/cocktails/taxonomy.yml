# Cocktail taxonomy: moods, the chaos dial and the ship scale (#292).
#
# There is no star axis and no spirit filter: cocktails do not browse by
# spirit. The spirit families in ingredients.yml exist for search and exclusion
# only (DECISIONS §9.3).
#
# Nothing reference-table-shaped belongs here either. The test for any addition
# is whether it gets Helen closer to the drink she wants (#441, #459).
#
# A mood's definition and a correction's `why:` are YAML values, not comments.

# A drink may carry several. Order is not significance -- a mood list is a set.
moods:
  strong brown drink: >-
    WHISKY LEADS; or another aged BASE spirit leads and you have not turned it
    into a sour. Either way nothing lengthens it and it is not crushed,
    swizzled or blended. Manhattan, Old Fashioned, Sazerac, Vieux Carré,
    Boulevardier, Brooklyn -- Helen: "you know, man spirits."
    REWRITTEN 2026-08-30 AGAINST HER OWN RULINGS, and the previous rule was
    wrong in both directions. It asked for 60% base spirit by volume with the
    aged ingredients outnumbering the clear, which let in a swizzle over
    crushed ice and a champagne drink while missing the Brooklyn (dry vermouth
    and maraschino cancelled the rye) and Fancy Free (one aged ingredient).
    THE LINE UNDER IT IS CITRUS, and Helen found it before the rule did:
    cognac-and-fernet is a brown drink, cognac-and-lemon is a sour. Art de
    Vivre and Legend are the first; the Sidecar, Accoutrement, Apple Cart,
    Champs Élysées and Ginger Snap are the second. She ruled on all of them --
    "can't tell you why but my heart is certain" -- and the rule now agrees
    with every one.
    THREE THINGS IT HAD TO GET RIGHT TO DO THAT. Water is excluded from the
    volume count, being a rinse or a dilution and never the drink -- that alone
    fixes the Sazerac, which used to need a hand-correction because its
    discarded 60 ml dragged the fraction to 44%. Volumes are compared by SPIRIT
    FAMILY, not by single ingredient, because the Sazerac pours equal 20 ml of
    cognac, rye and bourbon and "the biggest pour" was being decided by YAML
    key order -- 34 of the 114 drinks have such a tie. And whisky need only be
    LEVEL with the leading family, since Vieux Carré and Banana Boulevardier
    are equal-parts with vermouth.
    THE NON-WHISKY PATH REQUIRES A BASE SPIRIT. Sweet vermouth is aged and ties
    with the gin for the largest pour in a Negroni, which let it in until that
    was stated; `fortified`, `amaro` and `herbal` are modifiers. Helen: "thanks
    for knowing that Negroni is not (it's red anyway)."
  clear: >-
    GLASSY MOUTHFEEL, LOW COMPLEXITY, NOT FILLING. HAND-ASSIGNED.
    Helen, 2026-08-30: "Clear implies transparent (not strictly though) and
    does not imply colourless. It is about mouthfeel (glassy), complexity
    (low), how filling it is (not), that kind of thing."
    THIS SAID "TRANSPARENT... USUALLY FREE OF CITRUS" FOR THIRTEEN DAYS AND
    THAT WAS NEVER WHAT SHE MEANT. Written 2026-08-17 with the original
    vocabulary and never revised. The whole repository was searched on
    2026-08-30 for any record of the real meaning -- data, tests, handover, git
    history -- and there was none. She said "we've discussed this before", and
    she had. It left no trace.
    WHAT THE STALE DEFINITION NEARLY COST, recorded because the near-miss is
    the whole argument for writing this down. Reading it, I measured the tag
    against literal transparency, found 13 of the 16 tagged drinks are not
    transparent, called the rule broken, and proposed inverting it to "every
    ingredient is colourless". Confidently and completely wrong -- and every
    number in the analysis supporting it was correct. Same shape as #542: a
    plausible reading of an incomplete record.
    IT EXPLAINS WHAT TRANSPARENCY COULD NOT. Brooklyn is brown and IS clear;
    the Negroni is transparent and is NOT -- four stirred things that slip
    down, against something assertive and bitter. Espresso Martini is out for
    being filling, not for being black. And Aviation, Corpse Reviver #2 and El
    Mediterraneo all carry citrus and are all clear, so the "free of citrus"
    half was wrong too.
    Not the opposite of `strong brown drink` -- they are independent, and a
    drink can be neither, or both: six are.
  sharp: >-
    A base, a citrus and a sweetener, in five ingredients or fewer. Aviation,
    Bee's Knees, Sidecar, Champs Élysées, Tom Collins.
    WAS `short and sharp` UNTIL 2026-08-30, and losing the "short" is what
    freed it from the glass. The old rule required an UP glass, which is how a
    drink came to be excluded from the largest genre in the book for want of a
    word in a field: 15 drinks name no glass at all, and Biggles Sidecar --
    cognac, lemon, sugar syrup, unmistakably this -- was one of them.
    THE COUNT REPLACES THE GLASS, and it is Helen's own number: this
    definition said "three to five ingredients" from the day it was written.
    Without any bar at all the rule catches 72 of 114 drinks, which stops
    narrowing anything; at five it catches 41 and picks up Tom Collins and
    Daisy de Santiago, both of which previously answered no mood whatsoever.
    It also no longer depends on the glass data, which is a good property for a
    rule to have while that data is still being filled in (#491).
    BEING CHURNED INTO A SLUSHY DISQUALIFIES; BEING SERVED OVER CRUSHED ICE
    DOES NOT -- Helen, 2026-09-26, on the Moscow Mule: "Moscow Mule is sharp.
    The ginger beer probably supports this, as well as acting as a sweetener.
    This isn't an exception to the rule -- it is perfectly consistent with how
    I intend the rule to apply." Until then this mood shared `strong brown
    drink`'s disqualifier, which reads `serve.ice: crushed` and the words
    "crushed ice" -- so a mug packed with crushed ice was treated as a swizzle.
    The two moods want two different questions, exactly as `ice` and `churned`
    in `mood_step_words` already do: a big block of ice is how you serve a
    strong brown drink, and crushed ice is how you serve a long sharp one.
    See `mood_step_words.slushy`, which is this mood's own list.
  warming: >-
    For a cold night. Ginger, cinnamon, allspice, warm-spiced bitters.
    SPICE, NOT TEMPERATURE -- a Penicillin is warming and served cold, and the
    collection has exactly two drinks served hot, which is too thin to be a
    filter. Helen's word, and the right one: "warm spice" describes the
    bottles, "warming" describes what you want.
  aperitivo: >-
    The first one, before eating. An amaro or an aromatised wine, and not
    something that would flatten your appetite.
    THE MOOD IS THE OCCASION, NOT THE FLAVOUR, and that distinction is the
    reason this exists and `bitter` does not. Helen, 2026-08-30, on a proposed
    set of flavour tags: "they're flat descriptors... whereas I'd hoped for
    more evocative moods, you know, something I can offer beyond what one might
    guess from the ingredients list." A tag that means "contains Campari" is a
    worse copy of the HAS TO HAVE field; a tag that means "serve this before
    dinner" is something the ingredient list cannot say.
    `amaro` AND `herbal` ARE ALREADY FAMILIES, so the flavour roll-up this
    might have duplicated already exists for search and exclusion. What was
    missing was only a word: `bitter` now aliases to `amaro`, because a family
    nobody spells that way is a family nobody can reach (§9.3.3).
  fruity: >-
    Contains a non-citrus fruit: pineapple, passion fruit, berries, a crème de
    or a fruit liqueur. CITRUS DOES NOT COUNT. It is the sour component and
    nearly every drink has it; counting it made this cover half the collection.
    Deliberately NOT fused with sweetness -- a third of these drinks carry no
    sweetener and a third are actively sharp.
  sugar craving: >-
    Pudding flavours: coffee, cacao, amaretto, banana, menthe, coconut,
    vanilla, cola, chocolate bitters. About what the drink TASTES of, not how
    much sugar is in it -- "has a sweetener" covers 68% of the book and means
    nothing. HAND-ASSIGNED, WITH ONE SLICE DERIVED SINCE 2026-10-08: two tiki
    markers in a drink of 90 ml or more gets it by rule, which finds 16 of her
    46 and adds to them only. The rest stay hers to type.
  pudding in a glass: >-
    Rich and thick rather than merely sweet: cream, a whole egg, coconut cream.
    A White Russian, a flip, an Alexander. Declared as a spec, not an
    inventory, the same choice as declaring Plymouth and Genever gin while
    owning neither (#337). The index renders no button for a mood with no
    drinks: cocktails/index.html counts each mood's members and skips the empty
    ones, so the rule holds for whichever mood is empty next.
  tiki: >-
    Two or more tiki markers -- orgeat, falernum, passion fruit, pineapple,
    cinnamon syrup, grenadine, an overproof or pineapple rum -- AND complexity,
    measured two ways: six or more ingredients, OR two "loud" ingredients that
    each carry a flavour layer on their own.
    COMPLEXITY IS THE DEFINITION, not a filter on it. Helen: tiki is "a complex
    drink with lots of ingredients and lots of taste layers which is why it's
    not just a jar full of sugar". Ingredient COUNT alone got that wrong in
    both directions -- it dropped Jungle Bird, Better and Better ("only three
    ingredients, but they're bonkers") and Chartreuse Swizzle. Intensity
    recovers all three and drags in nothing.
    And it made the threshold FIRMER, which is counterintuitive: on markers
    alone, 25 drinks sat one ingredient from flipping in; with both bars, one
    does. Few drinks sit at two edges at once.
    THE RULE THAT RUNS TODAY IS SIMPLER THAN THE PARAGRAPHS ABOVE, which are
    the 2026-08-17 definition and are kept for the reasoning. Since #1187: two
    markers and four or more ingredients. Since 2026-10-08: OR one marker and
    eight or more -- Helen, on Three Dots and a Dash and the Difford's Fog
    Cutter: "absolutely tiki, so if we need to change the rules to rule them in
    then so be it." HAND-ASSIGNED AS WELL, so the rule only ever adds.
  nightcap: >-
    The last one. HAND-ASSIGNED.
  brunch: >-
    Defensible before noon. HAND-ASSIGNED.
  sunny terrace: >-
    Long, cold, and the glass sweats. Helen's name for it, and better than the
    "in the sun" it replaced: a place you can picture. HAND-ASSIGNED.
  festive: >-
    The once-a-year one. HAND-ASSIGNED.
  signature: >-
    What she makes without being asked. HAND-ASSIGNED.
    `signature` AND NOT `Helen signature`, which she also floated: every drink
    on this site is her judgement already, so putting her name on one tag
    quietly implies the others are somebody else's.
  so wrong it's right: >-
    A drink that has no business working and does. Hers, and the best tag
    anyone proposed. HAND-ASSIGNED.
    IT IS NOT `YOLO`, which is the obvious objection. The chaos dial is about
    RISK -- how likely this is to be bad, read off `meta.ship`. This is about a
    transgression that pays off, which is a different and much rarer thing: a
    drink you have never made is chaotic, a Jägerita is wrong and right.
    `stuff in a glass` WAS PROPOSED ALONGSIDE IT AND DROPPED, and the reasoning
    is worth keeping because both were good. That was her and Simon's phrase
    for the kitchen-sink drink -- the 18th Century Cocktail, arrack and cacao
    and Lillet, a heap that happens to be a respectable classic. Genuinely a
    different thing from this. But tagging both means deciding, per drink,
    which flavour of odd it is, and that is the friction that makes a tagging
    pass tiring. One tag, and it is the one that names a feeling.
  ice ice baby: >-
    Wants a lot of ice -- crushed, swizzled, blended, or a big block. Read
    inverted it is also the "I don't have much ice" constraint, which is the
    same flag from the other side.
    KNOWN SIMPLIFICATION: this fuses three different things. Frozen/blended (4
    drinks) needs a blender, swizzled (10) needs crushed ice, a block (5) needs
    planning -- and Helen specifically named wanting FROZEN drinks in summer as
    its own craving. Four drinks is too thin to split today; split it when the
    frozen set grows.
  I want to faff: >-
    Muddling, flaming, shells, blending, swizzling, or nine-plus ingredients.
    Named to pair against `no juicing` as its other end.
    Helen: "in the mood to faff" would be redundant -- the section IS mood.
    Helen's own caveat, worth keeping: she sometimes wants to make something
    complicated regardless of whether she wants the result -- so the faff can
    be the point rather than a cost the drink repays.
  no juicing: >-
    No citrus juice at all. Helen's own framing, and better than the earlier
    "can't be bothered to juice": it names "the urgh, juicing, urghh feeling
    when you want a single drink on a weeknight without using 47 pieces of
    equipment and making your worktops sticky". The low-effort end, 38 drinks.
  no measuring: >-
    ONE RECEPTACLE, WHOLE POURS OF IT. Every measured amount is a whole-number
    multiple of the smallest one, and the whole drink is eight of those pours
    or fewer -- 1/1/1, 2/1/1, 3/2/1. Whatever is to hand does it: a jigger, an
    egg cup, a shot glass. Helen, #1127: "for drinks I can make with just one
    receptacle, if that's all I have."
    THE CAP IS WHAT MAKES IT A FILTER. Without one the rule is 58% of the
    collection, which test_no_mood_covers_more_than_half_the_collection refuses
    outright -- the same bar that retired food's `one-pot` at 57%. Almost any
    set of amounts is whole multiples of SOMETHING: the Corpse Reviver #2 is
    integer-proportioned at 41 pours of 7.5 ml, which is not a drink anyone is
    making with an egg cup. Helen's own caveat named the same thing before the
    measurement did -- "some drinks may be like this but only if I make loads".
    At eight it is 28 drinks; at six, 23; at ten, 33. She chose eight on
    2026-09-19, over a printed list of what each catches, because eight is
    where Anita's Attitude Adjuster (seven equal pours) sits comfortably inside.
    NOT MEASURED, NOT COUNTED: dashes, drops, pinches, a `to top`, a `to taste`
    and half a lime are all ignored, because none of them has a volume to be in
    proportion to. Helen, #1127: "ignore ingredients in drops, dashes, pinches,
    etc." AND A 5 ML POUR, since 2026-09-26 (#1216), Helen: "if any amounts
    are 5 ml, this is just a bar spoon, and doesn't count as needing to be
    measured" -- so a bar spoon of syrup neither joins the ratio nor becomes
    the smallest measure everything else is divided by. Exactly 5 ml, not
    smaller: 2.5 and 7.5 are quarter- and half-jiggers. AND WATER, since
    2026-10-08, here and in every other rule -- Helen: "dilution water just
    isn't something I care about." A drink whose only measured line is one pour of spirit therefore
    qualifies, and that is right rather than a loophole -- the Caipirinha is
    45 ml of cachaça, half a lime and 20 g of palm sugar, and you measure
    exactly one of those things.
    A TOP IS AN AMOUNT, NOT AN INGREDIENT, and this is where it differs from
    `easy peasy`, which sets a mixer aside by what it IS. Helen, 2026-09-19:
    "No ingredient in the Aperol Spritz is a top." Its prosecco is 90 ml on the
    page and belongs to the 3:2:1 as much as the Aperol does; champagne written
    `to top` is a different thing and falls out on its own for having no volume.
    The cost of the distinction is Long Island Iced Tea and Lita Grey, both
    `easy peasy` and both carrying a measured 60 ml of cola or champagne -- and
    a measured 60 ml is exactly what this tag promises you will not have to do.
  on fire: >-
    Something is set alight. Two drinks, and narrow is the point: a two-drink
    answer to "something on fire" is a good answer, not a failed filter.
  easy peasy: >-
    Equal parts of everything but the top, or three pours with no juicing and
    nothing to make first. The far end of `I want to faff`, and a different
    axis from `no juicing`: a drink can want juicing and still be easy peasy if
    it is equal parts, which is how Long Island Iced Tea qualifies -- eight
    ingredients, every one of them 12.5 ml, and only the cola different.
    #845, Helen: "any cocktail with equal parts of all ingredients (bar maybe
    bitters) should get the tag 'easy peasy' once we've made it" -- so it is
    earned rather than derived, and an unmade drink does not get it however it
    is built. She widened it on 2026-09-08 to cover the short pour-and-stir
    drinks as well, which is what brings in the Negroni family.
    A TOP OR A MIXER IS SET ASIDE, along with dashes and drops. Topping a glass
    is not faff, and neither is opening a cola -- Julien Sorel and Anita's
    Attitude Adjuster are in on her ruling, and Anita's is seven equal pours.

# The ingredient sets the mood rules read. Only
# scripts/derive_cocktail_moods.py reads them, against generics and characters
# alike. A renamed generic left behind here matches nothing and raises nothing,
# so test_every_mood_ingredient_is_declared requires every member to be a
# declared generic or character.
#
# `clear`, `pudding_flavour`, `aperitivo` and `loud` are read by no rule: their
# moods are hand-assigned. They are kept as starting lists for a future rule.
mood_ingredients:

  # Aged and/or bitter-amaro. Read by `strong brown drink`.
  aged:
    - moderately aged Jamaican rum
    - caramel-forward Jamaican rum
    - aged Demerara rum
    - moderately aged rum
    - rhum agricole vieux
    - bourbon
    - rye
    - blended scotch whisky
    - single malt scotch whisky
    - Irish whiskey
    - Japanese whisky
    - cognac
    - armagnac
    - calvados
    - reposado tequila
    - añejo tequila
    - sweet vermouth
    - tawny port
    - ruby port
    - amontillado sherry
    - Campari
    - Aperol
    - Cynar
    - fernet
    - Amaro Nonino
    - Amaro Ciociaro
    - Bénédictine
    - demerara sugar syrup 2:1
    - molasses sugar
    - raw sugar

  # Clear spirits and modifiers. Not the opposite of `aged`: a drink can be
  # neither.
  clear:
    - lightly aged and filtered rum
    - clear blended multi-region rum
    - London dry gin
    - Plymouth gin
    - New Western dry gin
    - navy strength gin
    - vodka
    - blanco tequila
    - cachaça
    - Clairin Vaval
    - Clairin Casimir
    - Clairin Communal
    - Clairin Sajous
    - rhum agricole blanc
    - dry vermouth
    - blanc vermouth
    - maraschino liqueur
    - triple sec
    - prosecco
    - champagne

  # Tiki markers. The `tiki` definition above says how many a drink needs.
  tiki:
    - orgeat
    - falernum
    - passion fruit syrup
    - cinnamon syrup
    - pineapple juice
    - grenadine
    - pineapple-infused rum
    - coconut rum-based liqueur
    # A tiki marker as its rum-based sibling is, but not a pudding flavour
    # (#1379).
    - coconut rhum-based liqueur
    - blackstrap         # a rum CHARACTER, not a generic — #314
    - overproof Demerara rum, lightly aged
    - overproof Jamaican rum, unaged
    - passion fruit
    - pineapple

  # The sour component. NOT counted as fruit — see `fruity` above.
  citrus:
    - lime juice
    - lemon juice
    - grapefruit juice
    - ruby grapefruit juice
    - pink grapefruit juice
    - orange juice

  # Non-citrus fruit, plus orange juice: nobody builds a sour on orange juice,
  # so it counts as fruit. Grapefruit stays out (a Brown Derby is a sour). The
  # orange liqueurs stay out too: they are construction, not fruit.
  fruity:
    - pineapple juice
    - orange juice
    - blood orange juice
    - cranberry juice
    - cranberry juice drink
    - apple juice
    - passion fruit
    - pineapple
    - raspberries
    - blackberries
    - pear
    - calvados
    - apple schnapps
    # Fruit liqueurs and schnapps are `fruity`, not `pudding_flavour` (#1013).
    - peach schnapps
    - fruit purée
    - passion fruit syrup
    - pineapple syrup
    - crème de mûre
    - crème de myrtille
    - black raspberry liqueur
    - crème de cassis
    - crème de pêche
    - apricot liqueur
    - cherry liqueur
    # Beside `cherry liqueur` so a pour typed either way stays `fruity`.
    - cherry brandy
    - passion fruit liqueur
    - dried apricots

  # Pudding FLAVOURS. Deliberately excludes crème de violette (floral — it
  # wrongly pulled in the Aviation) and the fruit liqueurs, which are `fruity`.
  pudding_flavour:
    - coffee liqueur
    - brown crème de cacao
    - white crème de cacao
    - amaretto
    - crème de banane
    - crème de menthe
    - coconut cream
    - coconut rum-based liqueur
    - vanilla syrup
    - espresso
    - cola
    - chocolate bitters

  # Rich body, not sweetness: any one of these makes `pudding in a glass`.
  rich:
    - coconut cream
    - cream
    - milk
    - whole egg

  sweet:
    - cane sugar syrup 1:1
    - cane sugar syrup 2:1
    - demerara sugar syrup 2:1
    - turbinado sugar syrup 2:1
    - honey
    # Every honey water ratio is listed. A ratio missing here takes `sharp` off
    # a drink the moment its pour is retyped to that ratio.
    - honey water
    - honey water 1:1
    - honey water 2:1
    - honey water 3:1
    - orgeat
    - falernum
    - grenadine
    - agave syrup
    - white sugar
    - raw sugar
    - molasses sugar
    - sugar cube
    - palm sugar
    - vanilla syrup
    - cinnamon syrup
    - ginger syrup
    - pineapple syrup
    - hazelnut syrup
    - triple sec
    - orange Curaçao
    - maraschino liqueur
    - Grand Marnier

  # `warming`: warm spice, never temperature. Jägermeister, Strega and
  # Becherovka are here as warm-spiced liqueurs, not as herbal ones.
  warming:
    - ginger syrup
    - ginger liqueur
    - cinnamon syrup
    - ginger and lemongrass cordial
    - warm-spiced bitters
    - pimento bitters
    - Jägermeister
    - Strega
    - Becherovka

  # `aperitivo`: the amari and the aromatised wines.
  aperitivo:
    - Campari
    - Aperol
    - Cynar
    - fernet
    - Amaro Nonino
    - Amaro Ciociaro
    # No sweet vermouth. This list keys off generics, Punt e Mes is a bottle,
    # and the whole category would put the mood on every Manhattan.
    - quinquina
    - americano
    - gentian liqueur

  # What a drink is topped up with. Read by `strong brown drink`, which does
  # not survive being made long. Juices are not here; `juice` below has them.
  lengthener:
    - soda water
    - prosecco
    - champagne
    - cola
    - black tea
    - cider

  # Non-citrus juice. Only `strong brown drink` reads this: a whisky drink long
  # on pineapple juice is a lot of things and not a strong brown drink.
  juice:
    - apple juice
    - cranberry juice
    - cranberry juice drink
    - pineapple juice
    - orange juice
    - blood orange juice
    - grapefruit juice
    - ruby grapefruit juice
    - pink grapefruit juice

  # Ingredients that carry a whole flavour layer alone.
  loud:
    - overproof Demerara rum, lightly aged
    - overproof Jamaican rum, unaged
    - blended overproof rum
    - blackstrap          # a rum CHARACTER, not a generic — #314
    - Campari
    - Cynar
    - fernet
    - Aperol
    - Amaro Nonino
    - Amaro Ciociaro
    - falernum
    - absinthe
    - Chartreuse Verte
    - Chartreuse Jaune
    - Bénédictine
    - caramel-forward Jamaican rum
    - pimento bitters
    - tiki bitters
    - mastiha liqueur
    - gentian liqueur
    - Jägermeister
    - Strega
    - liqueur de sapin

# --- Helen's corrections, which beat the derivation --------------------------
# Each entry names the ONE mood it corrects and why, so every other mood on the
# drink stays derived and later rule changes still reach it.
# test_every_mood_correction_is_reachable_and_needed fails an entry that names
# no drink or changes nothing, so a correction a rule has caught up with is
# deleted. A mood in `moods_by_hand` needs no entry in either map: Helen adds
# and removes it in the drink file.
mood_include:
  18th-century-cocktail:
    moods: [sharp]
    why: >-
      she calls it sharp; the rule's five-poured-ingredient cap excludes it.
  accoutrement:
    moods: [sharp]
    why: >-
      she calls it sharp; the rule's five-poured-ingredient cap excludes it.
  apple-cart:
    moods: [warming]
    why: >-
      she calls it warming and it carries no declared warm spice.
  better-and-better:
    moods: [strong brown drink, warming]
    why: >-
      she calls it one; no aged BASE spirit leads it by volume; she calls it warming and it carries no declared warm spice.
  ace-of-clubs-daiquiri:
    moods: [pudding in a glass]
    why: >-
      she calls it one; its crème de cacao is not in the `rich` set, which is cream, whole egg and coconut cream.
  lemongrass-gimlet:
    moods: [sharp]
    why: >-
      she calls it sharp; its sweetener is a `QQ lemongrass syrup` that names no declared syrup.
  caribbean-sazerac:
    moods: [strong brown drink, warming]
    why: >-
      she calls it one; no aged BASE spirit leads it by volume; she calls it warming and it carries no declared warm spice.
  # caribbean-sazerac carries no `I want to faff` entry (#758): rinse aside it
  # is a shake and a strain. The plain sazerac below keeps its own.
  sazerac:
    moods: [I want to faff]
    why: >-
      it ices a glass, rinses it with absinthe and discards the contents, which the rule counts as ONE faff moment where it wants two. See the note on caribbean-sazerac directly above.
  sapins-swizzle:
    moods: [I want to faff]
    why: >-
      Helen, 2026-09-10: "A muddled Swizzle is faff." SHE LOST THIS DRINK'S MOOD BY ACCIDENT THE DAY BEFORE, and that is the whole story: her ruling that "swizzles are not faff" took `swizzle` and `churn` out of `mood_step_words.faff`, which was right about coffey-park-swizzle -- the drink she was looking at -- and took this one with it. It muddles AND swizzles, which was two faff moments and became one, and the threshold is two. So it lands on the rule's own existing line, the same one kill-devil-punch sits on: one muddle where the rule wants two. A CORRECTION RATHER THAN A LOWER THRESHOLD, because "one muddle is faff" would retag every drink that muddles anything, and she has ruled on this one.
  6th-street-swizzle:
    moods: [sharp]
    why: >-
      she calls it sharp (#843, 2026-09-08) and by every other measure it is one -- rhum agricole blanc, lime juice and cane sugar syrup, four ingredients. What excludes it is the rule's `not churned` clause: its `serve.ice` is `crushed`, and a swizzle is churned by definition. That clause is right in general -- a swizzle is a long drink over ice, not a short sharp one -- and wrong about this drink, which is exactly what a per-drink correction is for.
  mastiha-mojito:
    moods: [sharp]
    why: >-
      Helen, 2026-09-09, and she is the only one who can settle it: "it's totally sharp. Herbally sharp, but sharp nonetheless. I have tasted it and you haven't!!!!" THE SAME `not churned` CLAUSE AS 6th-street-swizzle DIRECTLY ABOVE -- its `serve.ice` is `crushed` and the method churns twice -- and there is a second reason it fails, which is worth naming because it is the more interesting one. The rule wants a base, a citrus and a SWEETENER: the base is the rum, the citrus is the lime, and the sweetener is the mastiha liqueur, which `mood_ingredients` files under `loud` and not under `sweet`. That is not obviously wrong -- mastiha IS a loud ingredient and it is the only drink that pours it -- so adding it to `sweet` to fix one drink would be a claim about the ingredient made to reach a conclusion about the recipe. A correction says the smaller, truer thing.
  carta-switchel:
    moods: [sharp]
    why: >-
      she calls it sharp; the rule's five-poured-ingredient cap excludes it.
  charleston:
    moods: [fruity]
    why: >-
      she calls it fruity and no ingredient in it is on the fruit list.
  coffey-park-swizzle:
    moods: [sharp]
    why: >-
      she calls it sharp; the rule's five-poured-ingredient cap excludes it.
  copenhagen-special:
    moods: [sharp]
    why: >-
      she calls it sharp; the rule's five-poured-ingredient cap excludes it.
  dons-mai-tai:
    moods: [fruity, sharp]
    why: >-
      she calls it fruity and no ingredient in it is on the fruit list; she calls it sharp; the rule's five-poured-ingredient cap excludes it.
  espresso-martini:
    moods: [pudding in a glass]
    why: >-
      she calls it rich; nothing in it is on the rich list.
  fish-house-punch:
    moods: [ice ice baby, sharp]
    why: >-
      Helen, 2026-09-18, asked directly because this and gunmetal-blue were the collection's only two `ice ice baby` corrections and the other one turned out to be wrong: "Fish House Punch: a) I call 'ice tea', and b) comes over lots and lots of ice." SO THIS ENTRY IS RIGHT AND STAYS, and the reason is now a fact about the drink rather than the vague "she calls it icy" it said before. `serve.ice` is `cubed`, which the rule deliberately does not count -- crushed, large cube, block and blended are the values that earn the mood -- and the thing the field cannot carry is QUANTITY. Lots and lots of cubed ice is an icy drink; one cube in a rocks glass is not, and both are spelled `cubed`. She calls it sharp; the rule's five-poured-ingredient cap excludes it.
  hurricane:
    moods: [I want to faff]
    why: >-
      Helen, 2026-09-17: "Hurricane gained faff because it has 50000 ingredients AND needs a blender, does that count?" Under the rule it does not, by one on each axis -- eight ingredients where nine is the threshold, and `blend` is one faff word where two hits are wanted -- so neither half reaches on its own and the drink derived nothing. Her judgement is that the two halves together do reach, which is precisely what this block is for. A PER-DRINK CORRECTION AND NOT A RULE CHANGE, measured before choosing: dropping the threshold to eight would hand the mood to six drinks and make the sazerac and pear-and-rosemary-bellini entries below spent (a test then demands their deletion), and counting a blend as two moments would give it to all five drinks that blend, including the four-ingredient frozen-fruit-daiquiri. Both are bigger claims than she made. Note she sits at exactly the same coordinates as sazerac and the bellini -- eight ingredients, a one-hit method -- and both of those needed an entry here too.
  kill-devil-punch:
    moods: [I want to faff]
    why: >-
      one muddle or one long prep, where the rule wants two.
  mai-tai:
    moods: [sharp]
    why: >-
      she calls it sharp; the rule's five-poured-ingredient cap excludes it.
  martinique-swizzle:
    moods: [sharp]
    why: >-
      she calls it sharp; the rule's five-poured-ingredient cap excludes it.
  north-sea-oil:
    moods: [strong brown drink]
    why: >-
      she calls it one; no aged BASE spirit leads it by volume.
  pear-and-rosemary-bellini:
    moods: [I want to faff]
    why: >-
      one muddle or one long prep, where the rule wants two.
  pic-a-de-crop-punch:
    moods: [sharp]
    why: >-
      she calls it sharp; the rule's five-poured-ingredient cap excludes it.
  porn-star-martini:
    moods: [I want to faff]
    why: >-
      Helen, 2026-10-02 (#1268): "Scooping out three passion fruit half-shells definitely counts." The rule scores it zero: six ingredients where nine is the threshold, and its method says "Scoop out the seeds and flesh from three passion fruit halves", which carries none of the faff words -- `shell` is in the list, but the word is in this drink's GARNISH, and the rule reads method steps. A PER-DRINK CORRECTION AND NOT A NEW FAFF WORD: `scoop` would be one hit where the rule wants two, so adding it would not reach this drink.
  smokestack-lightning:
    moods: [warming]
    why: >-
      she calls it warming and it carries no declared warm spice.
  ti-punch:
    moods: [sharp]
    why: >-
      she calls it sharp; the rule's five-poured-ingredient cap excludes it.
  south-sider:
    moods: [strong brown drink]
    why: >-
      Rum-led and lengthened with champagne, so it fails the rule twice over
      and Helen wants it anyway. Her reason, 2026-08-30: "it's the champagne
      cocktail I serve to people who like strong brown drinks, so I would like
      to give it honorary membership." That is a fact about who she pours it
      for, which is exactly the kind of thing no rule reads and an override
      exists to hold.
  all-jacked-up:
    moods: [strong brown drink]
    why: >-
      Helen, 2026-10-08: "All Jacked Up feel strong and brown -- is my feeling
      backed up in the data?" Mostly. It is stirred, served on a block, has no
      citrus and nothing lengthens it, and 60 of its 97.5 ml come from the
      `aged` list -- sweet vermouth, calvados and fernet. What the rule
      refuses is the LEAD: mezcal and vermouth tie at 30 ml, mezcal is not an
      aged spirit, and vermouth is a modifier, so no aged BASE leads. The same
      line north-sea-oil and better-and-better sit on.
  three-dots-and-a-dash:
    moods: [I want to faff]
    why: >-
      Helen, 2026-10-08: "Three Dots: yes yes, faff." Eight ingredients where
      nine is the threshold, and one `blend` where two faff words are wanted
      -- exactly the coordinates hurricane had when she ruled that
      one in, and a per-drink correction for the reasons given there.
  rosita:
    moods: [aperitivo, clear]
    why: >-
      2026-09-14, #984. Helen's first word was "definitely tag strong and
      brown"; the derivation disagreed and dropped it, and on seeing that she
      said "I was wrong" and asked for aperitivo and clear instead. Both are
      derived moods the rule does not currently produce for Rosita -- amaro,
      two vermouths and a bitters dash over tequila reads as more of an
      aperitivo mixed drink than the rule's own markers catch, and clear is
      the mouthfeel judgement the rule's own header says is Helen's to make
      per drink rather than by colour. `no juicing` needed no correction; the
      derivation already gives Rosita that one on its own.

mood_exclude:
  mastiha-mojito:
    moods: [ice ice baby]
    why: >-
      Fine-strained into an ice-filled glass and then churned twice, so the
      rule reads it as an icy drink and she does not. Her call on the
      2026-08-30 pass: the churning is technique here rather than the point.
      `I want to faff` WAS HERE FOR A FEW HOURS ON 2026-09-09 AND CAME BACK
      OUT, which is the entry doing what it said it would. It was added on
      Helen's ruling that "Mastiha Mojito absolutely isn't faff -- how could it
      be?", as a correction rather than a rule change, because `churn` earning
      faff was also true of coffey-park-swizzle and she had not ruled on that
      drink. It said in as many words: "if she later says a swizzle is not faff
      either, the rule is the better change and this entry comes out with it."
      She did, an hour later -- "Swizzles are not faff" -- so `swizzle` and
      `churn` left `mood_step_words.faff` and this line was no longer doing
      anything. A correction that has been overtaken by a rule is a correction
      that lies about why a drink is tagged, so it goes.
  jungle-bird:
    moods: [sugar craving]
    why: >-
      The one drink the 2026-10-08 `sugar craving` rule reaches that she did
      not tag on her own pass: pineapple juice and blackstrap are two tiki
      markers and it is over 90 ml, but the Campari is the point of it.
      Helen, the same day, on rules that add: "Don't add things I'll need to
      remove." So the rule is kept off the one drink where it is known to
      disagree with her, rather than loosened or dropped for the sixteen
      where it agrees.
  gunmetal-blue:
    moods: [warming]
    why: >-
      Helen, 2026-09-18: "I don't just want to call anything with cinnamon in
      it 'warming' (although I accept we will often do that)." The
      parenthesis is why this is a correction and not a rule change, and she
      was offered both: `cinnamon syrup` sits in `mood_ingredients.warming`
      and the rule is one-hit, so 7.5 ml of it in a 92.5 ml drink of mezcal,
      blue curacao and peach brandy reads as a warm drink. It is not one.
      MEASURED BEFORE CHOOSING, because the alternative was cheap enough to be
      tempting: exactly two drinks in the collection take `warming` from
      cinnamon ALONE -- this one and fake-id -- so deleting `cinnamon syrup`
      from the trigger list would have cost only those two. FAKE-ID KEEPS IT,
      which is what makes the rule change wrong: it is a strong brown drink
      that is also `nightcap` and `festive`, and cinnamon is doing real work
      there. Every other cinnamon-syrup drink (ginger-snap, cobras-fang) also
      carries ginger or warm-spiced bitters and would keep the mood either way.
      The drink is left on three moods, which Helen confirmed on sight: "fine
      with three moods".

# Words read from the METHOD steps rather than the ingredients. Same drift risk
# as the sets above, one field over: a step reworded stops matching and nothing
# says so. Matched case-insensitively as substrings, so `swizzle` catches
# "swizzling" and `dehydrat` catches both spellings.
mood_step_words:
  # Two or more of these makes `I want to faff` (or nine-plus ingredients).
  # `swizzle` and `churn` are absent on purpose: they say how a drink is
  # served, not how much work it is, and they are one technique, not two.
  faff:
    [muddle, alight, flame, shell, blend, rinse,
     dehydrat, infus, steep, clarif]
  # Any one of these techniques makes `ice ice baby`; `mood_serve_ice` below is
  # the other half of the rule. This half decides the drink whose `serve.ice`
  # is still absent, so it stays although it rarely decides one (#1147). No
  # phrase describing the ice belongs here: `serve.ice` records that.
  ice: [swizzle, churn, blend]
  # Disqualifies `strong brown drink`, together with `serve.ice` crushed or
  # blended. A big block of ice does not: that is how one is served.
  churned: ["crushed ice", "cracked ice", swizzle, churn, blend]
  # Disqualifies `sharp`, together with `serve.ice: blended`. It is the action
  # alone: a drink churned into a slushy is not sharp, and one served over
  # crushed ice still is (the Moscow Mule).
  slushy: [swizzle, churn, blend]
  # Any one makes `on fire`.
  fire: [alight, flame, burn]

# The `serve.ice` values that earn `ice ice baby`. serve.yml declares what the
# field may say; this says which of those are icy enough, and
# test_every_icy_serve_value_is_a_real_one holds each name to serve.yml.
# `cubed` is absent on purpose: the field cannot carry quantity, so a drink
# served over a lot of cubed ice takes a `mood_include` instead.
mood_serve_ice: [crushed, cracked, large cube, block, blended]

# One mood cancelling another (#853). LEFT wins; RIGHT is removed. Only a
# DERIVED mood is ever removed: Helen's hand-applied `easy peasy` beats the
# derived `I want to faff`, whose nine-ingredient count misreads a drink she
# has called easy.
mood_suppresses:
  easy peasy:
    - I want to faff

# Moods Helen assigns by hand: an occasion or a judgement, not a property of
# the liquid. The deriver keeps whatever a drink already carries for these, so
# a rule for one of them can only ADD and has to be precise rather than
# complete. Removing a name hands the mood back to the rules, and needs a rule
# to hand it back to.
moods_by_hand:
  # No rule: every candidate adds `clear` to drinks Helen did not tag.
  - clear
  - sugar craving
  # `tiki`, like `sugar craving` above and `on fire` below, also has a rule
  # that only adds.
  - tiki
  - aperitivo
  - nightcap
  - brunch
  - sunny terrace
  - festive
  - signature
  - so wrong it's right
  # Earned, not derived: Helen tags it once she has made the drink (#775).
  - easy peasy
  # The rule reads METHOD steps only. A flame in `to_serve`, or an optional
  # one Helen wants offered, is hand-assigned (#894).
  - on fire

# The index asks these as two separate questions and shows each list's buttons
# in the order written here (#966, #967): do not sort them. Every mood belongs
# to exactly one group; tests/test_cocktails.py fails a mood with none.
mood_groups:
  mood:
    - signature
    - tiki
    - sharp
    - clear
    - strong brown drink
    - fruity
    - so wrong it's right
    - aperitivo
    - nightcap
    - brunch
    - sunny terrace
    - sugar craving
    - pudding in a glass
    - warming
    - festive
  hassle:
    - no juicing
    # Beside `no juicing` on purpose (#1127): the two chips that name a piece
    # of equipment you will not have to get out.
    - no measuring
    - ice ice baby
    - on fire
    - easy peasy
    - I want to faff

# Appetite for chaos: how much risk tonight, read off `meta.ship` (#1413).
# Which ship values each narrowing YOLO button keeps; `I'm open to chaos`
# keeps every drink. A value in neither list (`sure`, `IOU`) shows only under
# `open`. cocktails/index.html stamps each card with the list it is in.
chaos:
  good: ["yes", "oh gods yes"]
  chaos: ["meh", "who knows"]

# Four rungs, lowest first (DECISIONS §9.4). Every value is quoted: YAML reads
# a bare `yes` as the boolean true, which silently fails every comparison
# against `meta.ship`.
ship_scale:
  - "meh"
  - "sure"
  - "yes"
  - "oh gods yes"

# The word a rung is shown as, on a card and on the drink page alike, where it
# is not the stored value. `meta.ship` keeps the stored words, which filters
# and URLs match on. A rung with no entry shows its own name. `²` is the
# character, not markup.
ship_words:
  "oh gods yes": "yes²"

# The two `meta.ship` values that are not rungs, and what the card and the
# drink page print for each. Neither is a rating, so neither may be a rung
# (DECISIONS §9.4). `who knows`: never made, so `made_before: false`. `IOU`:
# made and liked but never rated, so `made_before: true` (#1413). The include
# looks a value up here once `ship_scale` says it is not a rung.
ship_off_scale:
  "who knows": "???"
  "IOU": "IOU"

# Deliberately absent: `star_ingredients` (there is no star axis) and `co_tags`
# (no cocktail mood has met food's test for one).
