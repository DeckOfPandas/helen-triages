# =============================================================================
# COCKTAILS TAXONOMY — mood, and the chaos dial. Spec: GitHub issue #292.
# =============================================================================
# This file was a deliberately empty scaffold until 2026-08-17. Its own comment
# said the schema should "arrive the same way [as food's], from the real
# recipes rather than from general knowledge about cocktails". It did: every
# mood below was tested against all 117 drinks before it was written down, and
# three candidates were changed or dropped because the data said so.
#
# THE PRINCIPLE THIS WHOLE COLLECTION ANSWERS TO. Helen, 2026-08-23, settling
# the `character` question (#441):
#
#   "Take as a principle that everything we do is focused on the user (i.e.
#    me), and making sure the user gets the drink they want. Being an
#    encyclopaedia of drinks sounds like busywork and it's not for me."
#
# Recorded here at her request (#459) so it is citable rather than remembered.
# It is the deciding argument, not a sentiment: `character` (Gosling's
# blackstrap quality, say) is not a bottle-encyclopaedia fact, it is WHY THIS
# DRINK WANTS THIS BOTTLE -- so it belongs on the recipe, and the general
# bottle-reference table that would otherwise have held it was not built.
#
# APPLY IT FORWARD, to anything reference-table-shaped -- a bottle dictionary, a
# spirits glossary, anything describing a spirit in the abstract rather than in
# service of one recipe decision. The test is whether it gets Helen closer to
# the drink she wants, or whether it is collecting knowledge for its own sake.
#
# It is also the reason for the rule immediately below. An encyclopaedia sorts
# by spirit because that is how bottles are shelved; this does not, because that
# is not how anyone decides what to drink.
#
# THERE IS NO STAR AXIS, AND THAT IS DELIBERATE. Food browses by star
# ingredient; cocktails does not browse by spirit at all. Helen, 2026-08-17:
# "I get really bored of cocktail bars that have enormous bible-like menus
# sorted by spirit... I probably think browsing by spirit is basic." The spirit
# families in _data/cocktails/ingredients.yml exist for SEARCH and EXCLUSION
# only. Do not add a spirit filter to the index.
#
# WHAT WAS LEARNED BY TESTING EACH CANDIDATE, kept because each is a trap that
# would otherwise be re-entered:
#
#   - "fruity" first counted citrus juice and covered 51% of the collection --
#     the same too-broad failure that retired food's `one-pot` at 57%. Citrus
#     is the SOUR component, not the fruit. Excluding it gives 28%.
#   - "sugar craving" defined as "has any sweetener" was 68%. Nearly every
#     cocktail contains sugar; sweetening is construction, not craving. Narrowed
#     to pudding flavours it is 11%.
#   - The first pudding list wrongly included crème de violette and pulled in
#     Aviation, which is floral and sharp. Fruit liqueurs came out too -- they
#     belong to `fruity`.
#   - 30% of drinks matched NO mood, and they turned out to be one genre: the
#     classic short sour. That gap is what `short and sharp` exists to fill.
# =============================================================================

# A drink may carry several. Order is not significance -- a mood list is a set.
moods:
  strong brown drink: >-
    Spirit-forward and aged: at least 60% of the volume is a base spirit, and
    the aged/amaro ingredients outnumber the clear ones. ONE mood rather than
    `strong` and `brown` separately -- Helen's call, "strong brown drink" is a
    single feeling. The cost, accepted knowingly: 18 drinks that are strong but
    CLEAR (the Martini-shaped ones) carry no strength signal at all.
    KNOWN DERIVATION FLAW: the volume fraction counts ingredients the drink
    THROWS AWAY. The Sazerac -- the archetype of this mood -- scored 44%
    because its 60 ml of chilled water is part of the absinthe rinse and is
    discarded at method step 4. Its mood is set by hand. Any rinse-and-discard
    drink will do the same, and detecting it reliably needs the method parsed
    rather than pattern-matched, so it is recorded rather than fixed.
  clear: >-
    Transparent and, in Helen's definition, usually free of citrus. Not the
    opposite of `strong brown drink` -- they are independent, and a drink can
    be neither.
  short and sharp: >-
    The classic short sour: a base, a citrus, a sweetener, served up, three to
    five ingredients. Aviation, Bee's Knees, Sidecar, Champs Élysées. Named by
    Helen. It exists because this genre -- the largest in the book -- had no
    mood at all, leaving 30% of drinks unbrowsable.
  fruity: >-
    Contains a non-citrus fruit: pineapple, passion fruit, berries, a crème de
    or a fruit liqueur. CITRUS DOES NOT COUNT. It is the sour component and
    nearly every drink has it; counting it made this cover half the collection.
    Deliberately NOT fused with sweetness -- a third of these drinks carry no
    sweetener and a third are actively sharp.
  sugar craving: >-
    Pudding flavours: coffee, cacao, amaretto, banana, menthe, coconut,
    vanilla, cola, chocolate bitters. About what the drink TASTES of, not how
    much sugar is in it -- "has a sweetener" covers 68% of the book and means
    nothing.
  pudding in a glass: >-
    Rich and thick rather than merely sweet: cream, a whole egg, coconut cream.
    A White Russian, a flip, an Alexander. DECLARED WITH ZERO MEMBERS ON
    PURPOSE, the same choice as declaring Plymouth and Genever gin while owning
    neither -- this is a spec, not an inventory. The collection genuinely has
    none of these yet; see issue #337. The index must not render a button for a
    mood with no drinks — ENFORCED since 2026-08-26: cocktails/index.html counts
    each mood's members and skips the empty ones, rather than naming this one as
    an exception, so the rule holds for whichever mood is empty next.
  tiki: >-
    Two or more tiki markers -- orgeat, falernum, passion fruit, pineapple,
    cinnamon syrup, grenadine, an overproof or pineapple rum -- AND complexity,
    measured two ways: six or more ingredients, OR two "loud" ingredients that
    each carry a flavour layer on their own.
    COMPLEXITY IS THE DEFINITION, not a filter on it. Helen: tiki is "a complex
    drink with lots of ingredients and lots of taste layers which is why it's
    not just a jar full of sugar". Ingredient COUNT alone got that wrong in
    both directions -- it dropped Jungle Bird, Better and Better ("only three
    ingredients, but they're bonkers") and Chartreuse Swizzle. Intensity
    recovers all three and drags in nothing.
    And it made the threshold FIRMER, which is counterintuitive: on markers
    alone, 25 drinks sat one ingredient from flipping in; with both bars, one
    does. Few drinks sit at two edges at once.
  ice ice baby: >-
    Wants a lot of ice -- crushed, swizzled, blended, or a big block. Read
    inverted it is also the "I don't have much ice" constraint, which is the
    same flag from the other side.
    KNOWN SIMPLIFICATION: this fuses three different things. Frozen/blended (4
    drinks) needs a blender, swizzled (10) needs crushed ice, a block (5) needs
    planning -- and Helen specifically named wanting FROZEN drinks in summer as
    its own craving. Four drinks is too thin to split today; split it when the
    frozen set grows.
  I want to faff: >-
    Muddling, flaming, shells, blending, swizzling, or nine-plus ingredients.
    Named to pair against `no juicing` as its other end.
    Helen: "in the mood to faff" would be redundant -- the section IS mood.
    Helen's own caveat, worth keeping: she sometimes wants to make something
    complicated regardless of whether she wants the result -- so the faff can
    be the point rather than a cost the drink repays.
  no juicing: >-
    No citrus juice at all. Helen's own framing, and better than the earlier
    "can't be bothered to juice": it names "the urgh, juicing, urghh feeling
    when you want a single drink on a weeknight without using 47 pieces of
    equipment and making your worktops sticky". The low-effort end, 38 drinks.
  on fire: >-
    Something is set alight. Two drinks, and narrow is the point: a two-drink
    answer to "something on fire" is a good answer, not a failed filter.

# =============================================================================
# APPETITE FOR CHAOS — how much risk you want tonight
# =============================================================================
# Helen's own axis, and the one she actually starts from with company. Built
# from `meta.ship`, which was already in the spreadsheet.
#
# Two buckets, revised down from three, 2026-08-23: `meta.status` is
# retired (below) and its only job here was defining `haven't tried` --
# and a drink Helen hasn't tried never gets published anyway, since she
# keeps track of that herself rather than in the data, so the bucket had
# nothing left to hold. Duds still fold into `YOLO` -- remaking something
# you disliked IS a chaotic choice -- unchanged from the earlier
# three-from-four revision.
# =============================================================================
# THE TWO GROUPS THE INDEX ASKS AS SEPARATE QUESTIONS — Helen, 2026-08-27.
# =============================================================================
# Every mood above belongs to exactly one of these, and the index renders them
# under separate headings. `tests/test_cocktails.py` asserts the partition is
# total and non-overlapping, so a mood added above without a group here fails
# rather than silently vanishing from the page.
#
# WHY THE SPLIT. The index used to ask one question -- "what do you fancy?" --
# and offer ten answers belonging to three different questions. "No juicing" is
# not a flavour and "I want to faff" is not a mood; they answer *can I be
# bothered*, and sitting them in a row headed *what do you fancy* meant sorting
# them yourself before choosing. Helen: "I feel like I am doing work to
# understand what to click in order to maximise my chance of getting the drink
# I want."
#
# TASTE AND STYLE ARE **NOT** SPLIT, and that was tried. The first proposal had
# three groups -- taste, style, hassle. Helen: "honestly I think taste and
# style in those columns are the same, and should be called Mood. Splitting out
# Hassle though feels good." So the cut that earns its place is the one between
# what a drink IS and what it COSTS, and only that one.
#
# `pudding in a glass` is in `mood` and has zero members, which is deliberate
# -- see its own note above. The index renders no button for an empty mood, so
# it is grouped here for completeness rather than for display.
mood_groups:
  mood:
    - strong brown drink
    - clear
    - short and sharp
    - fruity
    - sugar craving
    - pudding in a glass
    - tiki
  hassle:
    - ice ice baby
    - I want to faff
    - no juicing
    - on fire

chaos:
  definitely good: "ship is yes or oh gods yes"
  YOLO: "everything else, including the five drinks rated `not really`"

# `who knows` is NOT on the ship scale -- Helen, 2026-08-17. It means "I have no
# idea", which is an absence of verdict rather than a low one, so it belongs
# with the unrated rather than as a low rung on the scale.
#
# `maybe` and `okay` collapsed into `meh`, 2026-08-23 -- Helen: the two only
# ever meant the same shrug, unlike `okay`/`sure`, which stayed distinct
# because `sure` is a genuinely more positive verdict.
#
# EVERY VALUE QUOTED, and `yes` is why. YAML 1.1 parses a bare `yes` as the
# BOOLEAN True, so this list came out as [..., 'sure', True, 'oh gods yes'] and
# would have silently failed every comparison against `meta.ship`, which is the
# string "yes" on 37 drinks. No error anywhere -- just a scale with a hole in
# it. The mirror image of food's own note on `meta:` booleans, where quoting
# `rewritten: true` would turn it into the STRING "true" and break every
# `is True` check in the suite.
ship_scale:
  - "not really"
  - "meh"
  - "sure"
  - "yes"
  - "oh gods yes"

# =============================================================================
# HOW THE SCALE IS DRAWN — the goodness mark's tint, as a percentage of the
# second accent. Settled with Helen on the design page, 2026-08-26.
# =============================================================================
# The mark on a cocktail card is a small square filled with this much accent
# and the rest paper. It lives HERE rather than in the stylesheet because the
# scale and how the scale is drawn are one decision, and splitting them across
# two files means a sixth rung could be added to `ship_scale` above and render
# as blank paper with nothing to say why.
#
# IT IS NOT A LINEAR RAMP AND MUST NOT BE MADE INTO ONE. `yes` and `oh gods
# yes` are BOTH 100, because both mean "make this" -- the difference between
# them is enthusiasm, not decision, and spacing them evenly would invent a
# distinction Helen's verdicts do not carry. The whole range is spent on the
# gap that matters: between "make this" and everything below it.
#
# `sure` and `meh` were 62 and 30 for one afternoon and are 42 and 16 now. At
# 62 a `sure` was near enough a `yes` to be mistaken for one at a glance, which
# is the one thing a scale exists to prevent.
#
# `who knows` IS NOT ON THE SHIP SCALE -- see the note above; it means "I have
# no idea", an absence of verdict rather than a low one. It draws the same
# empty mark as `not really` and is told apart by its label. That is also why
# the mark keeps its BORDER at every rung: an empty square reads as "rated, and
# rated low", where a square that vanished would read as "not rated", which is
# a different fact this scale already holds separately.
# =============================================================================
# WHAT A RUNG IS CALLED ON A CARD — the display map. Added 2026-08-30.
# =============================================================================
# THE SAME IDIOM `card_names` USES IN ingredients.yml, and for the same reason:
# a card name may be lossy where the real value may not. `meta.ship` keeps
# saying "oh gods yes" — Helen's own words, and §9.9 records that the vocabulary
# existed on 18 drinks before anyone asked for a rating — while the card says
# `yes²`.
#
# WHY THE CARD WANTS SHORTER. The mark is a ship pinned to the card's
# bottom-right with the word beside it, so the word's length decides where the
# ship sits. Helen: "the motivation is getting everything to the same number of
# words, i.e. one, so the cards look more stable." Three of the five were one
# word already; these two were not.
#
# `²` IS THE CHARACTER, NOT MARKUP. House style already prefers a real glyph to
# a synthetic one — §5 uses unicode fractions (½) rather than markup for exactly
# this — and it keeps HTML out of a data file, which is where it would have to
# be escaped or deliberately un-escaped in the template.
#
# A RUNG WITH NO ENTRY GETS NO WORD, which is what `QQ` and `who knows` want:
# they are deliberately off the scale (see the note below), they are 31 of 114
# drinks, and the card draws the ship without a label rather than inventing a
# sixth term for "not rated".
ship_card_names:
  "not really": "hmm"
  "oh gods yes": "yes²"

ship_tints:
  "not really": 0
  "meh": 16
  "sure": 42
  "yes": 100
  "oh gods yes": 100
  "who knows": 0

# =============================================================================
# DELIBERATELY ABSENT
# =============================================================================
# star_ingredients: there is no star axis. See the header.
# co_tags: food kept exactly one co-tag rule and the test for adding another is
#   strict -- sound when a ROLLUP or a real AFFORDANCE, unsound when
#   DEFINITIONAL. No cocktail mood has met it yet. `on fire` implies `worth the
#   faff` in practice, but that is definitional, so it is not encoded.
