# =============================================================================
# COCKTAILS TAXONOMY — mood, and the chaos dial. Spec: GitHub issue #292.
# =============================================================================
# This file was a deliberately empty scaffold until 2026-08-17. Its own comment
# said the schema should "arrive the same way [as food's], from the real
# recipes rather than from general knowledge about cocktails". It did: every
# mood below was tested against all 117 drinks before it was written down, and
# three candidates were changed or dropped because the data said so.
#
# THE PRINCIPLE THIS WHOLE COLLECTION ANSWERS TO. Helen, 2026-08-23, settling
# the `character` question (#441):
#
#   "Take as a principle that everything we do is focused on the user (i.e.
#    me), and making sure the user gets the drink they want. Being an
#    encyclopaedia of drinks sounds like busywork and it's not for me."
#
# Recorded here at her request (#459) so it is citable rather than remembered.
# It is the deciding argument, not a sentiment: `character` (Gosling's
# blackstrap quality, say) is not a bottle-encyclopaedia fact, it is WHY THIS
# DRINK WANTS THIS BOTTLE -- so it belongs on the recipe, and the general
# bottle-reference table that would otherwise have held it was not built.
#
# APPLY IT FORWARD, to anything reference-table-shaped -- a bottle dictionary, a
# spirits glossary, anything describing a spirit in the abstract rather than in
# service of one recipe decision. The test is whether it gets Helen closer to
# the drink she wants, or whether it is collecting knowledge for its own sake.
#
# It is also the reason for the rule immediately below. An encyclopaedia sorts
# by spirit because that is how bottles are shelved; this does not, because that
# is not how anyone decides what to drink.
#
# THERE IS NO STAR AXIS, AND THAT IS DELIBERATE. Food browses by star
# ingredient; cocktails does not browse by spirit at all. Helen, 2026-08-17:
# "I get really bored of cocktail bars that have enormous bible-like menus
# sorted by spirit... I probably think browsing by spirit is basic." The spirit
# families in _data/cocktails/ingredients.yml exist for SEARCH and EXCLUSION
# only. Do not add a spirit filter to the index.
#
# WHAT WAS LEARNED BY TESTING EACH CANDIDATE, kept because each is a trap that
# would otherwise be re-entered:
#
#   - "fruity" first counted citrus juice and covered 51% of the collection --
#     the same too-broad failure that retired food's `one-pot` at 57%. Citrus
#     is the SOUR component, not the fruit. Excluding it gives 28%.
#   - "sugar craving" defined as "has any sweetener" was 68%. Nearly every
#     cocktail contains sugar; sweetening is construction, not craving. Narrowed
#     to pudding flavours it is 11%.
#   - The first pudding list wrongly included crème de violette and pulled in
#     Aviation, which is floral and sharp. Fruit liqueurs came out too -- they
#     belong to `fruity`.
#   - 30% of drinks matched NO mood, and they turned out to be one genre: the
#     classic short sour. That gap is what `short and sharp` exists to fill.
# =============================================================================

# A drink may carry several. Order is not significance -- a mood list is a set.
moods:
  strong brown drink: >-
    WHISKY LEADS; or another aged BASE spirit leads and you have not turned it
    into a sour. Either way nothing lengthens it and it is not crushed,
    swizzled or blended. Manhattan, Old Fashioned, Sazerac, Vieux Carré,
    Boulevardier, Brooklyn -- Helen: "you know, man spirits."
    REWRITTEN 2026-08-30 AGAINST HER OWN RULINGS, and the previous rule was
    wrong in both directions. It asked for 60% base spirit by volume with the
    aged ingredients outnumbering the clear, which let in a swizzle over
    crushed ice and a champagne drink while missing the Brooklyn (dry vermouth
    and maraschino cancelled the rye) and Fancy Free (one aged ingredient).
    THE LINE UNDER IT IS CITRUS, and Helen found it before the rule did:
    cognac-and-fernet is a brown drink, cognac-and-lemon is a sour. Art de
    Vivre and Legend are the first; the Sidecar, Accoutrement, Apple Cart,
    Champs Élysées and Ginger Snap are the second. She ruled on all of them --
    "can't tell you why but my heart is certain" -- and the rule now agrees
    with every one.
    THREE THINGS IT HAD TO GET RIGHT TO DO THAT. Water is excluded from the
    volume count, being a rinse or a dilution and never the drink -- that alone
    fixes the Sazerac, which used to need a hand-correction because its
    discarded 60 ml dragged the fraction to 44%. Volumes are compared by SPIRIT
    FAMILY, not by single ingredient, because the Sazerac pours equal 20 ml of
    cognac, rye and bourbon and "the biggest pour" was being decided by YAML
    key order -- 34 of the 114 drinks have such a tie. And whisky need only be
    LEVEL with the leading family, since Vieux Carré and Banana Boulevardier
    are equal-parts with vermouth.
    THE NON-WHISKY PATH REQUIRES A BASE SPIRIT. Sweet vermouth is aged and ties
    with the gin for the largest pour in a Negroni, which let it in until that
    was stated; `fortified`, `amaro` and `herbal` are modifiers. Helen: "thanks
    for knowing that Negroni is not (it's red anyway)."
  clear: >-
    Transparent and, in Helen's definition, usually free of citrus. Not the
    opposite of `strong brown drink` -- they are independent, and a drink can
    be neither.
  sharp: >-
    A base, a citrus and a sweetener, in five ingredients or fewer. Aviation,
    Bee's Knees, Sidecar, Champs Élysées, Tom Collins.
    WAS `short and sharp` UNTIL 2026-08-30, and losing the "short" is what
    freed it from the glass. The old rule required an UP glass, which is how a
    drink came to be excluded from the largest genre in the book for want of a
    word in a field: 15 drinks name no glass at all, and Biggles Sidecar --
    cognac, lemon, sugar syrup, unmistakably this -- was one of them.
    THE COUNT REPLACES THE GLASS, and it is Helen's own number: this
    definition said "three to five ingredients" from the day it was written.
    Without any bar at all the rule catches 72 of 114 drinks, which stops
    narrowing anything; at five it catches 41 and picks up Tom Collins and
    Daisy de Santiago, both of which previously answered no mood whatsoever.
    It also no longer depends on the glass data, which is a good property for a
    rule to have while that data is still being filled in (#491).
  warming: >-
    For a cold night. Ginger, cinnamon, allspice, warm-spiced bitters.
    SPICE, NOT TEMPERATURE -- a Penicillin is warming and served cold, and the
    collection has exactly two drinks served hot, which is too thin to be a
    filter. Helen's word, and the right one: "warm spice" describes the
    bottles, "warming" describes what you want.
  up: >-
    No ice in the glass. Read straight off `glass:` — coupe, nick and nora,
    flute, sour, martini.
    HELEN IS NOT SOLD ON IT, 2026-08-30: "I'm not sold on up. Let's retain it,
    but with suspicion." Recorded rather than smoothed over, because the case
    for it is real and unproven: it pairs with `clear` to mean a Martini and
    with `strong brown drink` to mean a Manhattan, which is a distinction
    nothing else on the page makes. Whether anyone reaches for it is a
    different question, and if the answer is no it costs one line here and one
    in the deriver to remove.
    BUILT AFTER THE GLASSES AND NOT BEFORE. It is the only mood read entirely
    from `glass:`, and 15 of 114 drinks named none until #491 closed on
    2026-08-30 — deriving it earlier would have quietly answered "not up" for
    all fifteen.
  aperitivo: >-
    The first one, before eating. An amaro or an aromatised wine, and not
    something that would flatten your appetite.
    THE MOOD IS THE OCCASION, NOT THE FLAVOUR, and that distinction is the
    reason this exists and `bitter` does not. Helen, 2026-08-30, on a proposed
    set of flavour tags: "they're flat descriptors... whereas I'd hoped for
    more evocative moods, you know, something I can offer beyond what one might
    guess from the ingredients list." A tag that means "contains Campari" is a
    worse copy of the HAS TO HAVE field; a tag that means "serve this before
    dinner" is something the ingredient list cannot say.
    `amaro` AND `herbal` ARE ALREADY FAMILIES, so the flavour roll-up this
    might have duplicated already exists for search and exclusion. What was
    missing was only a word: `bitter` now aliases to `amaro`, because a family
    nobody spells that way is a family nobody can reach (§9.3.3).
  clear: >-
    Transparent and, in Helen's definition, usually free of citrus. Not the
    opposite of `strong brown drink` -- they are independent, and a drink can
    be neither.
  fruity: >-
    Contains a non-citrus fruit: pineapple, passion fruit, berries, a crème de
    or a fruit liqueur. CITRUS DOES NOT COUNT. It is the sour component and
    nearly every drink has it; counting it made this cover half the collection.
    Deliberately NOT fused with sweetness -- a third of these drinks carry no
    sweetener and a third are actively sharp.
  sugar craving: >-
    Pudding flavours: coffee, cacao, amaretto, banana, menthe, coconut,
    vanilla, cola, chocolate bitters. About what the drink TASTES of, not how
    much sugar is in it -- "has a sweetener" covers 68% of the book and means
    nothing.
  pudding in a glass: >-
    Rich and thick rather than merely sweet: cream, a whole egg, coconut cream.
    A White Russian, a flip, an Alexander. DECLARED WITH ZERO MEMBERS ON
    PURPOSE, the same choice as declaring Plymouth and Genever gin while owning
    neither -- this is a spec, not an inventory. The collection genuinely has
    none of these yet; see issue #337. The index must not render a button for a
    mood with no drinks — ENFORCED since 2026-08-26: cocktails/index.html counts
    each mood's members and skips the empty ones, rather than naming this one as
    an exception, so the rule holds for whichever mood is empty next.
  tiki: >-
    Two or more tiki markers -- orgeat, falernum, passion fruit, pineapple,
    cinnamon syrup, grenadine, an overproof or pineapple rum -- AND complexity,
    measured two ways: six or more ingredients, OR two "loud" ingredients that
    each carry a flavour layer on their own.
    COMPLEXITY IS THE DEFINITION, not a filter on it. Helen: tiki is "a complex
    drink with lots of ingredients and lots of taste layers which is why it's
    not just a jar full of sugar". Ingredient COUNT alone got that wrong in
    both directions -- it dropped Jungle Bird, Better and Better ("only three
    ingredients, but they're bonkers") and Chartreuse Swizzle. Intensity
    recovers all three and drags in nothing.
    And it made the threshold FIRMER, which is counterintuitive: on markers
    alone, 25 drinks sat one ingredient from flipping in; with both bars, one
    does. Few drinks sit at two edges at once.
  nightcap: >-
    The last one. HAND-ASSIGNED.
  brunch: >-
    Defensible before noon. HAND-ASSIGNED.
  sunny terrace: >-
    Long, cold, and the glass sweats. Helen's name for it, and better than the
    "in the sun" it replaced: a place you can picture. HAND-ASSIGNED.
  festive: >-
    The once-a-year one. HAND-ASSIGNED.
  signature: >-
    What she makes without being asked. HAND-ASSIGNED.
    `signature` AND NOT `Helen signature`, which she also floated: every drink
    on this site is her judgement already, so putting her name on one tag
    quietly implies the others are somebody else's.
  so wrong it's right: >-
    A drink that has no business working and does. Hers, and the best tag
    anyone proposed. HAND-ASSIGNED.
    IT IS NOT `YOLO`, which is the obvious objection. The chaos dial is about
    RISK -- how likely this is to be bad, read off `meta.ship`. This is about a
    transgression that pays off, which is a different and much rarer thing: a
    drink you have never made is chaotic, a Jägerita is wrong and right.
    `stuff in a glass` WAS PROPOSED ALONGSIDE IT AND DROPPED, and the reasoning
    is worth keeping because both were good. That was her and Simon's phrase
    for the kitchen-sink drink -- the 18th Century Cocktail, arrack and cacao
    and Lillet, a heap that happens to be a respectable classic. Genuinely a
    different thing from this. But tagging both means deciding, per drink,
    which flavour of odd it is, and that is the friction that makes a tagging
    pass tiring. One tag, and it is the one that names a feeling.
  ice ice baby: >-
    Wants a lot of ice -- crushed, swizzled, blended, or a big block. Read
    inverted it is also the "I don't have much ice" constraint, which is the
    same flag from the other side.
    KNOWN SIMPLIFICATION: this fuses three different things. Frozen/blended (4
    drinks) needs a blender, swizzled (10) needs crushed ice, a block (5) needs
    planning -- and Helen specifically named wanting FROZEN drinks in summer as
    its own craving. Four drinks is too thin to split today; split it when the
    frozen set grows.
  I want to faff: >-
    Muddling, flaming, shells, blending, swizzling, or nine-plus ingredients.
    Named to pair against `no juicing` as its other end.
    Helen: "in the mood to faff" would be redundant -- the section IS mood.
    Helen's own caveat, worth keeping: she sometimes wants to make something
    complicated regardless of whether she wants the result -- so the faff can
    be the point rather than a cost the drink repays.
  no juicing: >-
    No citrus juice at all. Helen's own framing, and better than the earlier
    "can't be bothered to juice": it names "the urgh, juicing, urghh feeling
    when you want a single drink on a weeknight without using 47 pieces of
    equipment and making your worktops sticky". The low-effort end, 38 drinks.
  on fire: >-
    Something is set alight. Two drinks, and narrow is the point: a two-drink
    answer to "something on fire" is a good answer, not a failed filter.

# =============================================================================
# WHAT THE DEFINITIONS ABOVE MEAN IN INGREDIENTS — the derivation's vocabulary
# =============================================================================
# Every mood above states a rule. These are the ingredient sets those rules
# read, and `scripts/derive_cocktail_moods.py` is the only thing that reads
# them.
#
# THEY LIVED IN A SCRIPT UNTIL 2026-08-30 AND THAT IS WHY THEY WENT WRONG.
# Moods were derived once, on 2026-08-17 (`d2c76dc` in the drafts repo), from
# nine hardcoded sets of generic names inside `ingest_from_csv.py`. The
# vocabulary then moved underneath them and nothing could see it:
#
#   #335 finished typing every generic — the derivation's own commit message
#        says "17 carry none, mostly blocked by untyped ingredients"
#   #314 reclassified the rums and moved `blackstrap` from generic to CHARACTER
#   #561 renamed ten generics, including every rum and both gins
#   #568 added five aromatised-wine generics
#        `sloe gin` split out; the Chartreuses took their French names
#
# **34 of the sets' strings named nothing at all** when this was measured.
# Nine of `_AGED`'s 29 — every rum and every whisky in it — so `strong brown
# drink` could no longer fire on a rum. Five of `_CLEAR`'s 17. Five of
# `_TIKI`'s 13. Nine of `_LOUD`'s 23, including both Chartreuses.
#
# A SET INTERSECTION AGAINST A RENAMED STRING RETURNS EMPTY. It does not raise,
# it does not warn, and the derivation had already been run and its output
# frozen into 114 files — so the drift was invisible from both ends. This is
# §9.12's bargain stated from the other side: duplicate live data only
# alongside the test that keeps the duplicate honest. There was no test,
# because the duplicate was in a private repo's script.
#
# So the sets are data now, and `test_every_mood_ingredient_is_declared`
# requires every member to be a declared generic or a declared character.
# A rename cannot silently empty one again.
#
# MATCHED AGAINST GENERICS **AND** CHARACTERS. `blackstrap` is a
# `rum_characters` value since #314, not a generic — it appears here in `tiki`
# and `loud` and would match nothing if only generics were read. That is one of
# the 34.
mood_ingredients:

  # Aged and/or bitter-amaro. Used by `strong brown drink`, which also needs
  # 60% of the volume to be a base spirit and more aged than clear.
  aged:
    - moderately aged Jamaican rum
    - caramel-forward Jamaican rum
    - aged Demerara rum
    - moderately aged rum
    - rhum agricole vieux
    - bourbon
    - rye
    - blended scotch whisky
    - single malt scotch whisky
    - Irish whiskey
    - Japanese whisky
    - cognac
    - armagnac
    - calvados
    - reposado tequila
    - añejo tequila
    - sweet vermouth
    - tawny port
    - amontillado sherry
    - Campari
    - Aperol
    - Cynar
    - fernet
    - Amaro Nonino
    - Amaro Ciociano
    - Bénédictine
    - demerara syrup
    - molasses sugar
    - raw sugar

  # Transparent. Not the opposite of `aged` — a drink can be neither.
  clear:
    - lightly aged and filtered rum
    - clear blended multi-region rum
    - London dry gin
    - Plymouth
    - New Western dry
    - navy strength gin
    - vodka
    - blanco tequila
    - cachaça
    - clairin
    - rhum agricole blanc
    - dry vermouth
    - blanc vermouth
    - maraschino liqueur
    - triple sec
    - prosecco
    - champagne

  # Tiki MARKERS. Two or more, plus complexity, makes a drink tiki.
  tiki:
    - orgeat
    - falernum
    - passion fruit syrup
    - cinnamon syrup
    - pineapple juice
    - grenadine
    - pineapple rum
    - coconut rum
    - blackstrap          # a rum CHARACTER, not a generic — #314
    - overproof Demerara rum
    - unaged overproof Jamaican rum
    - passion fruit
    - pineapple

  # The sour component. NOT counted as fruit — see `fruity` above.
  citrus:
    - lime juice
    - lemon juice
    - grapefruit juice
    - orange juice

  # Non-citrus fruit.
  fruity:
    - pineapple juice
    - cranberry juice
    - apple juice
    - passion fruit
    - pineapple
    - raspberries
    - blackberries
    - pear
    - fruit purée
    - passion fruit syrup
    - crème de mûre
    - crème de cassis
    - crème de pêche
    - crème de banane
    - apricot liqueur
    - cherry liqueur
    - passion fruit liqueur
    - dried apricots

  # Pudding FLAVOURS. Deliberately excludes crème de violette (floral — it
  # wrongly pulled in the Aviation) and the fruit liqueurs, which are `fruity`.
  pudding_flavour:
    - coffee liqueur
    - crème de cacao
    - amaretto
    - crème de banane
    - crème de menthe
    - coconut cream
    - coconut rum
    - vanilla syrup
    - espresso
    - cola
    - chocolate bitters

  # Rich BODY, not sweetness — `pudding in a glass`. Zero members in the
  # collection on purpose; see #337 and the mood's own note above.
  rich:
    - coconut cream
    - cream
    - milk
    - whole egg

  sweet:
    - sugar syrup 1:1
    - sugar syrup 2:1
    - demerara syrup
    - honey
    - honey water 1:1
    - honey water 2:1
    - orgeat
    - falernum
    - grenadine
    - agave syrup
    - white sugar
    - raw sugar
    - molasses sugar
    - sugar cube
    - palm sugar
    - vanilla syrup
    - cinnamon syrup
    - ginger syrup
    - triple sec
    - orange Curaçao
    - maraschino liqueur
    - Grand Marnier

  # `warming` -- warm spice, never temperature. See the mood's own note.
  #
  # THE TWO HERBAL LIQUEURS ARE HELEN'S ADDITION, 2026-08-30, spotted while
  # skimming the review table: "Jagermeister, Strega and Becherovka could hint
  # at warming too." Both are warm-spiced rather than merely herbal --
  # Jägermeister runs on star anise, cinnamon and ginger, Strega on saffron and
  # mint over a spiced base. Becherovka is the third and the collection has
  # none; add it here the day a drink does.
  warming:
    - ginger syrup
    - ginger liqueur
    - cinnamon syrup
    - ginger and lemongrass cordial
    - warm-spiced bitters
    - pimento bitters
    - Jägermeister
    - Strega

  # `aperitivo` -- what an appetite-opening drink is built on. The amari and
  # the aromatised wines; the mood then requires the drink not to be a
  # strong brown one, which is what keeps a Boulevardier out of it.
  aperitivo:
    - Campari
    - Aperol
    - Cynar
    - fernet
    - Amaro Nonino
    - Amaro Ciociano
    - Punt e Mes
    - quinquina
    - americano
    - gentian liqueur

  # Things you TOP A DRINK UP with. Read by `strong brown drink` and `sharp`,
  # neither of which survives being made long.
  #
  # THE JUICES ARE NOT HERE, and they were until they broke `sharp`. Orange,
  # grapefruit and pineapple juice lengthen a brown drink but they are simply
  # ingredients in a sour -- listing them cost Brown Derby (bourbon,
  # grapefruit, honey), Witches Daiquiri and Cactus Banger their mood, which is
  # the same shape of error as treating a pinch of salt as a sixth ingredient.
  # `strong brown drink` keeps them out by its own route: the non-whisky path
  # already refuses citrus, and `juice` below covers the rest.
  lengthener:
    - soda water
    - prosecco
    - champagne
    - cola
    - black tea
    - cider

  # Non-citrus juice. Only `strong brown drink` reads this: a whisky drink long
  # on pineapple juice is a lot of things and not a strong brown drink.
  juice:
    - apple juice
    - cranberry juice
    - pineapple juice
    - orange juice
    - grapefruit juice

  # LOUD: ingredients carrying a whole flavour layer alone. Helen's insight,
  # and the thing that rescues `tiki` from being a headcount — "Better and
  # Better is a tiki drink. Only three ingredients, but they're bonkers."
  loud:
    - overproof Demerara rum
    - unaged overproof Jamaican rum
    - blended overproof rum
    - blackstrap          # a rum CHARACTER, not a generic — #314
    - Campari
    - Cynar
    - fernet
    - Aperol
    - Amaro Nonino
    - Amaro Ciociano
    - falernum
    - absinthe
    - Chartreuse Verte
    - Chartreuse Jaune
    - Bénédictine
    - caramel-forward Jamaican rum
    - pimento bitters
    - tiki bitters
    - mastiha liqueur
    - gentian liqueur
    - Jägermeister
    - Strega
    - liqueur de sapin

# --- Helen's corrections, which beat the derivation --------------------------
# DERIVATION IS A STARTING POINT, NOT THE AUTHORITY. A drink she thinks is tiki
# is tiki whatever the ingredient count says.
#
# TWO NARROW HOOKS RATHER THAN ONE BLUNT ONE, and the reasoning is the original
# derivation's own: replacing a drink's whole mood list would FREEZE it against
# every later improvement to the rules, so a correction names the one mood it
# is about and leaves the rest derived. That mattered immediately — every drink
# below still gained moods from the 2026-08-30 re-derivation while keeping its
# correction.
#
# Ported here from `MOOD_INCLUDE`/`MOOD_EXCLUDE` in the drafts repo's
# `ingest_from_csv.py`, where they were invisible to this repo entirely.
mood_include:
  # THE SAZERAC'S ENTRY IS GONE, 2026-08-30, and that is the good outcome.
  # It read: "the archetype of the mood, and it derives at 44% base spirit
  # because its 60 ml of chilled water belongs to the absinthe rinse and is
  # thrown away at method step 4." The rewritten rule ignores water entirely
  # and compares by spirit family, so the Sazerac's 40 ml of whisky now leads
  # its 20 ml of cognac and it qualifies on its own. A correction retired by
  # fixing the rule is worth more than one that stands for ever.
  south-sider:
    moods: [strong brown drink]
    why: >-
      Rum-led and lengthened with champagne, so it fails the rule twice over
      and Helen wants it anyway. Her reason, 2026-08-30: "it's the champagne
      cocktail I serve to people who like strong brown drinks, so I would like
      to give it honorary membership." That is a fact about who she pours it
      for, which is exactly the kind of thing no rule reads and an override
      exists to hold.

# THE SWIZZLE'S `tiki` CORRECTION DIED WITH THE DRINK AND IS NOT REPLACED HERE,
# because reinstating it would be deciding something that is Helen's.
#
# `MOOD_INCLUDE = {"Swizzle": ["tiki"]}` existed because she said that drink was
# tiki. On 2026-08-30 the Swizzle became the **Martinique Swizzle** (`b42939b`)
# and the correction stayed behind, naming a drink that no longer exists —
# caught by `test_every_mood_correction_is_reachable_and_needed` on its first
# run, which is the whole reason that test is here.
#
# THE SUCCESSOR DERIVES NO `tiki` AND IT IS NOT OBVIOUS THAT IT SHOULD.
# Martinique Swizzle is agricole blanc, lemon, sugar syrup, absinthe and
# Angostura: **zero** tiki markers, where the rule wants two. But its `source`
# reads "Don the Beachcomber via Beachbum Berry", which is about as tiki a
# provenance as exists. So either the drink is not tiki after all, or the marker
# list is missing something a swizzle has — and that is a ruling, not a guess.
# Add it back here if she says tiki; leave it if she does not.

mood_exclude:
  blue-hawaiian:
    moods: [pudding in a glass]
    why: >-
      It has coconut cream, which is genuinely on the rich list. Helen,
      2026-08-17: "I'm not certain there will be zero puddings with coconut
      cream, so don't take it off the dessert list until it's failed us more
      than this." So the INGREDIENT keeps its meaning and this one drink is
      excepted — the narrower fix, and the reason these two hooks exist.

# Served UP — no ice in the glass. Read by the `up` mood. Glass names, not
# generics, so they are checked against glasses.yml rather than the generic
# vocabulary.
#
# BOTH SPELLINGS OF MARTINI, and the omission was costing drinks their mood.
# Two drinks write `martini glass` and one writes `martini`; only the second
# was listed, so the Porn Star Martini could not be served up. §9.11.1 leaves
# that pair out of `canonical_glasses` deliberately — Helen has not ruled on
# which spelling wins — which is exactly why a list that READS glass values has
# to carry both. The rule governs what is written; this governs what is read.
mood_up_glasses:
  - coupe
  - nick and nora
  - flute
  - sour
  - martini
  - martini glass

# Words read from the METHOD steps rather than the ingredients. Same drift risk
# as the sets above, one field over: a step reworded stops matching and nothing
# says so. Matched case-insensitively as substrings, so `swizzle` catches
# "swizzling" and `dehydrat` catches both spellings.
mood_step_words:
  # Two or more of these makes `I want to faff` (or nine-plus ingredients).
  faff:
    [muddle, alight, flame, shell, blend, swizzle, churn, rinse,
     dehydrat, infus, steep, clarif]
  # Any one makes `ice ice baby`.
  ice:
    ["crushed ice", swizzle, churn, blend, "large ice", "ice block",
     "block of ice"]
  # A NARROWER LIST, and it is not `ice` above. `strong brown drink` is
  # disqualified by being crushed, swizzled or blended -- but NOT by a big
  # block of ice, which is precisely how you serve one. Banana Boulevardier
  # says "strain into a glass over a large ice block" and lost the mood
  # outright while the two lists were the same list.
  churned: ["crushed ice", swizzle, churn, blend]
  # Any one makes `on fire`.
  fire: [alight, flame, burn]

# =============================================================================
# APPETITE FOR CHAOS — how much risk you want tonight
# =============================================================================
# Helen's own axis, and the one she actually starts from with company. Built
# from `meta.ship`, which was already in the spreadsheet.
#
# Two buckets, revised down from three, 2026-08-23: `meta.status` is
# retired (below) and its only job here was defining `haven't tried` --
# and a drink Helen hasn't tried never gets published anyway, since she
# keeps track of that herself rather than in the data, so the bucket had
# nothing left to hold. Duds still fold into `YOLO` -- remaking something
# you disliked IS a chaotic choice -- unchanged from the earlier
# three-from-four revision.
# =============================================================================
# THE TWO GROUPS THE INDEX ASKS AS SEPARATE QUESTIONS — Helen, 2026-08-27.
# =============================================================================
# Every mood above belongs to exactly one of these, and the index renders them
# under separate headings. `tests/test_cocktails.py` asserts the partition is
# total and non-overlapping, so a mood added above without a group here fails
# rather than silently vanishing from the page.
#
# WHY THE SPLIT. The index used to ask one question -- "what do you fancy?" --
# and offer ten answers belonging to three different questions. "No juicing" is
# not a flavour and "I want to faff" is not a mood; they answer *can I be
# bothered*, and sitting them in a row headed *what do you fancy* meant sorting
# them yourself before choosing. Helen: "I feel like I am doing work to
# understand what to click in order to maximise my chance of getting the drink
# I want."
#
# TASTE AND STYLE ARE **NOT** SPLIT, and that was tried. The first proposal had
# three groups -- taste, style, hassle. Helen: "honestly I think taste and
# style in those columns are the same, and should be called Mood. Splitting out
# Hassle though feels good." So the cut that earns its place is the one between
# what a drink IS and what it COSTS, and only that one.
#
# `pudding in a glass` is in `mood` and has zero members, which is deliberate
# -- see its own note above. The index renders no button for an empty mood, so
# it is grouped here for completeness rather than for display.
# =============================================================================
# MOODS ONLY HELEN ASSIGNS — no rule derives these, and none ever should
# =============================================================================
# Every mood above this list is computed from ingredients, method and glass.
# These are not, because they name an OCCASION or a judgement rather than a
# property of the liquid, and that is precisely what makes them worth having.
#
# HELEN, 2026-08-30, ON A SET OF PROPOSED FLAVOUR TAGS -- `bitter`, `smoky`,
# `herbal`, `vegetal` -- ALL OF WHICH WERE DROPPED BECAUSE OF THIS:
#
#   "they're flat descriptors, which is fine in moderation, whereas I'd hoped
#    for more evocative moods, you know, something I can offer beyond what one
#    might guess from the ingredients list."
#
# That is the sharper test and it is the one to apply to any future mood: a tag
# meaning "contains one of these bottles" is a worse copy of the HAS TO HAVE
# field, which already does exactly that and does it better.
#
# WHAT THIS COSTS, AND WHY IT IS WORTH IT. `test_every_drinks_moods_match_the
# _derivation` exists so stored moods cannot drift from the rules that made
# them -- that drift is what left 23 drinks unbrowsable. A mood no rule
# produces would fail it on every drink. So these are named here, the deriver
# never emits one, and the check preserves whatever a drink already carries for
# them rather than asking where it came from. The guarantee stays exactly as
# strong for the moods it applies to.
#
# ADDING A NAME HERE IS WHAT MAKES A MOOD HERS. Removing one hands it back to
# the rules, and needs a rule to hand it back TO.
moods_by_hand:
  - nightcap
  - brunch
  - sunny terrace
  - festive
  - signature
  - so wrong it's right

mood_groups:
  mood:
    - strong brown drink
    - clear
    - sharp
    - fruity
    - sugar craving
    - pudding in a glass
    - tiki
    - warming
    - aperitivo
    - up
    - nightcap
    - brunch
    - sunny terrace
    - festive
    - signature
    - so wrong it's right
  hassle:
    - ice ice baby
    - I want to faff
    - no juicing
    - on fire

chaos:
  definitely good: "ship is yes or oh gods yes"
  YOLO: "everything else, including the five drinks rated `not really`"

# `who knows` is NOT on the ship scale -- Helen, 2026-08-17. It means "I have no
# idea", which is an absence of verdict rather than a low one, so it belongs
# with the unrated rather than as a low rung on the scale.
#
# `maybe` and `okay` collapsed into `meh`, 2026-08-23 -- Helen: the two only
# ever meant the same shrug, unlike `okay`/`sure`, which stayed distinct
# because `sure` is a genuinely more positive verdict.
#
# EVERY VALUE QUOTED, and `yes` is why. YAML 1.1 parses a bare `yes` as the
# BOOLEAN True, so this list came out as [..., 'sure', True, 'oh gods yes'] and
# would have silently failed every comparison against `meta.ship`, which is the
# string "yes" on 37 drinks. No error anywhere -- just a scale with a hole in
# it. The mirror image of food's own note on `meta:` booleans, where quoting
# `rewritten: true` would turn it into the STRING "true" and break every
# `is True` check in the suite.
ship_scale:
  - "not really"
  - "meh"
  - "sure"
  - "yes"
  - "oh gods yes"

# =============================================================================
# HOW THE SCALE IS DRAWN — the goodness mark's tint, as a percentage of the
# second accent. Settled with Helen on the design page, 2026-08-26.
# =============================================================================
# The mark on a cocktail card is a small square filled with this much accent
# and the rest paper. It lives HERE rather than in the stylesheet because the
# scale and how the scale is drawn are one decision, and splitting them across
# two files means a sixth rung could be added to `ship_scale` above and render
# as blank paper with nothing to say why.
#
# IT IS NOT A LINEAR RAMP AND MUST NOT BE MADE INTO ONE. `yes` and `oh gods
# yes` are BOTH 100, because both mean "make this" -- the difference between
# them is enthusiasm, not decision, and spacing them evenly would invent a
# distinction Helen's verdicts do not carry. The whole range is spent on the
# gap that matters: between "make this" and everything below it.
#
# `sure` and `meh` were 62 and 30 for one afternoon and are 42 and 16 now. At
# 62 a `sure` was near enough a `yes` to be mistaken for one at a glance, which
# is the one thing a scale exists to prevent.
#
# `who knows` IS NOT ON THE SHIP SCALE -- see the note above; it means "I have
# no idea", an absence of verdict rather than a low one. It draws the same
# empty mark as `not really` and is told apart by its label. That is also why
# the mark keeps its BORDER at every rung: an empty square reads as "rated, and
# rated low", where a square that vanished would read as "not rated", which is
# a different fact this scale already holds separately.
ship_tints:
  "not really": 0
  "meh": 16
  "sure": 42
  "yes": 100
  "oh gods yes": 100
  "who knows": 0

# =============================================================================
# DELIBERATELY ABSENT
# =============================================================================
# star_ingredients: there is no star axis. See the header.
# co_tags: food kept exactly one co-tag rule and the test for adding another is
#   strict -- sound when a ROLLUP or a real AFFORDANCE, unsound when
#   DEFINITIONAL. No cocktail mood has met it yet. `on fire` implies `worth the
#   faff` in practice, but that is definitional, so it is not encoded.
