  # Havana Club 7 in Three Dots and a Dash ("Yes"), and Havana Club Añejo
  # Especial in Fay Wray -- parked as #1335 and answered there on 2026-10-08:
  # "Moderately Aged Rum".
  "Aged rum (6-10yr)": "moderately aged rum"
  "Blended light 3-5yo rum": "moderately aged rum"

  "Kummel liqueur": "kümmel"
  "Crème de myrtille liqueur": "crème de myrtille"
  # Offered `yoghurt`: "natural yoghurt".
  "Yoghurt (natural)": "natural yoghurt"

  # --- Difford's, the plain ones ------------------------------------------------
