# What a source calls a category -> what Helen calls it. Read by
# scripts/resolve_pours.py after the two dictionaries: a pour whose `generic`
# is `QQ <words>` and whose words, folded for case, accents and spacing, are a
# key below is typed as the value. tests/test_resolve_pours.py holds every
# value to the declared vocabulary.
#
# Helen's rulings only (DECISIONS §9.3.1): never a reading an ingest made by
# itself, however obvious. Not here: a bottle (an `aliases:` entry in
# bottles.yml), a wording that already is a declared generic (a test refuses
# it), a ruling about one drink, or an answer that is a list of generics.
#
# Keys are written as the source prints them; where an ingest trims the
# source's bracket into the pour's note, the trimmed form is a key too.

wordings:

  # --- Difford's Guide ---------------------------------------------------------

  "Light white rum (charcoal-filtered 1-4 years old)": "lightly aged and filtered rum"
  "Light white rum": "lightly aged and filtered rum"

  "Agricole blanc/cane juice rhum (unaged)": "rhum agricole blanc"
  # A character (`hogo`) is not this file's to write.
  "Overproof white rum (unaged Jamaican/funky)": "overproof Jamaican rum, unaged"

  "Rosso vermouth": "sweet vermouth"
  "Bianco vermouth": "blanc vermouth"

  "Green Chartreuse": "Chartreuse Verte"
  "Green Chartreuse (or alternative herbal liqueur)": "Chartreuse Verte"

  "Swedish Punsch liqueur": "Swedish flaggpunsch"
  "Swedish Punsch": "Swedish flaggpunsch"
  "Dry Curaçao liqueur": "dry orange Curaçao"

  # The bottle the source names stays in the pour's note.
