  # these is one of her generics with a word or a bracket added that says
  # nothing new -- "liqueur" after a liqueur, "(freshly squeezed)" after a
  # juice. The claude.ai session typed them on its own reading for the batch of
  # 73, which is a near-miss by the standalone document's rule and would arrive
