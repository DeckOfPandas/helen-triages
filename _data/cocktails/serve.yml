# =============================================================================
# HOW A DRINK IS SERVED — the ice, and the rim.
# =============================================================================
# WHY THIS EXISTS, and it is the shortest version of a long diagnosis. A drink
# has a BUILD and a SERVE. The build had `method`. The serve had `glass` for
# the vessel, `garnish` for the garnish and `to_serve` for the serveware —
# and NOTHING for the ice that goes in the glass.
#
# Having no field, the ice rode in the last method step, in free prose. So
# "strain" was written SEVENTEEN ways across 124 drinks:
#
#   Strain into a chilled glass.        Strain over a giant ice cube.
#   Fine strain into a chilled glass.   Strain over two giant ice cubes.
#   Strain into an ice-filled glass.    Strain over ice, preferably a large cube.
#   Strain over crushed ice.            Strain into a snifter filled with crushed ice.
#   Fine-strain into pre-chilled.       ... and eight more
#
# Two of those are truncated sentences — "Fine strain into a chilled." and
# "Fine-strain into pre-chilled." — which had been sitting in the collection
# unnoticed, because prose that varies is prose nobody can check. A sweep for
# the same shape afterwards found one more, Chartreuse Swizzle's "Add to the.",
# vestigial from "Add to the [glass]".
#
# Moving the ice into a field collapsed 94 uses of 31 spellings into FIVE
# techniques: Strain, Fine strain, Double strain, Pour, Dump. That is
# methods.yml's own argument, applied one layer out — a shape that changes
# every time has to be RE-READ; an identical repeated one becomes something you
# RECOGNISE. Helen's reason for wanting that, from #290: people in the house,
# and thirsty.
#
# IT DID NOT REPLACE `to_serve`, WHICH IS THE SERVEWARE FIELD AND STAYS.
# Cobra's Fang: "Plastic giraffes, paper umbrella, teeny flamingos." The
# swizzles: "Straw." The punches: "Ladle and punch glasses." Blue Hawaiian had
# put its cocktail umbrella in `garnish` instead, and Gin Sour had put ICE
# information into `to_serve` ("Without ice."). Both moved to the field that
# owns them. Helen, 2026-09-05, on precisely this: "things to serve with (like
# a paper umbrella) aren't written or laid out the same way."
#
# THERE IS NO `chill` FIELD, AND THERE WAS FOR ABOUT AN HOUR. It held `chilled`
# on 21 drinks until Helen ruled it out: "I think it's implied that glasses
# should be chilled (except hot drinks obviously). I am the user after all."
# Its other three values — `frozen` once, `rinsed` three times — were each
# already a method step in their own right ("Rinse a frozen glass with the
# overproof rum", "Rinse the glasses with Campari"), so the whole field went
# rather than just the one value, and nothing it held was lost. Worth recording
# because a field that is redundant with a default is exactly the kind of thing
# that gets re-proposed.
#
# ABSENT MEANS NOBODY HAS DECIDED. `ice: "none"` MEANS SERVED UP.
# The same distinction `garnish` draws between `[]` and `["no garnish"]`, and
# it is load-bearing rather than tidy: Pic-a-de-Crop Punch strains into a small
# punch bowl and its method never says whether ice goes in, while both its
# sibling punches say a large block. That is a real question for Helen, not a
# blank to fill with a default.
# =============================================================================

# --- `ice` -------------------------------------------------------------------
# THE ICE IN THE GLASS, NEVER THE ICE IN THE SHAKER. That distinction is the
# whole job: of 156 mentions of ice in the collection's method steps, 86 were
# the shaker's. "Shake all ingredients with ice" says nothing about how the
# drink is served, and a rule that cannot tell the two apart gets 109 drinks
# wrong out of 124.
ice:
  none: >-
    Served up, in an empty glass. 79 drinks, the commonest answer by a wide
    margin — which is a true fact about what Helen makes, and the same fact
    that killed the `up` mood for covering half the collection.
  cubed: >-
    Ordinary cubes, an ice-filled glass. The drink is long or it is meant to
    keep diluting.
  crushed: >-
    Crushed or pebble ice. Every swizzle, and it is the technique as much as
    the serve — a swizzle is stirred against the crushed ice, so the method
    keeps its "Fill with crushed ice" step and this field does not replace it.
  large cube: >-
    One big rock. Helen, 2026-09-04: "I really do want 'giant ice cube' for
    e.g. strong brown drinks over ice." Deliberately NOT a disqualifier for
    `strong brown drink` the way `crushed` is — a big block is precisely how
    you serve one.
  block: >-
    A large block, in a punch bowl or a pitcher. Five drinks, all punches.
    Distinct from `large cube` because it is a different object and a different
    amount of planning.
  blended: >-
    The ice is IN the drink, not under it. The four frozen drinks. Reads as
    "you need a blender", which is the constraint that matters when choosing —
    and it is why the value exists even though it PRINTS NOTHING (see below).

# --- how the page says it ----------------------------------------------------
# THE ICE IS A CLAUSE ON THE STRAIN STEP, not a line of its own. It rode on the
# glass line in the metadata panel first ("hurricane, blended" — nonsense), then
# as its own line under "To serve", and Helen moved it a third time to where it
# actually belongs: "ice pedantry will be more likely to be seen at the point in
# the make where it happens", and then "I'd like to name the glass too where it
# appears."
#
# So `_layouts/cocktail.html` composes the final strain step from three fields —
# the technique, the glass's `serving` phrase from glasses.yml, and this clause:
#
#     "Strain."  +  "an old fashioned glass"  +  ", over a large ice cube"
#         ->  "Strain into an old fashioned glass, over a large ice cube."
#     "Fine strain."  +  "a coupe"  +  ""
#         ->  "Fine strain into a coupe."
#     "Strain."  +  "a highball"  +  " filled with crushed ice"
#         ->  "Strain into a highball filled with crushed ice."
#
# NOTE THE TWO SHAPES. Ice you pour the drink ONTO takes a comma and "over";
# ice the glass is already FULL of takes "filled with" and no comma. That is
# not decoration — it is the difference between building on a rock and
# straining into a packed glass, and Helen's own examples use both.
#
# GENERATED, NEVER STORED, and that is the whole point. Storing these sentences
# is exactly what produced seventeen spellings of "strain" and two truncated
# ones. Each fact is written once, in the field that owns it, and the sentence
# is assembled at render time — so a drink that changes glass gets a corrected
# method for free and no copy can go stale.
#
# `none` AND `blended` HAVE NO CLAUSE. A drink served up needs no words added
# ("Fine strain into a coupe." is complete), and a blended drink has no strain
# step to attach one to.
in_the_glass:
  cubed: " filled with ice"
  crushed: " filled with crushed ice"
  large cube: ", over a large ice cube"
  block: ", over a large block of ice"

# --- `rim` -------------------------------------------------------------------
# FREE TEXT, deliberately. Two drinks rim today and a closed vocabulary for two
# members would be inventing structure ahead of the data — the mistake
# taxonomy.yml's own notes record three times over. If rimming becomes common,
# this becomes a list like the one above.
#
# A rim is done to the glass BEFORE the drink is built, which is why it is here
# and not in `garnish`, where Apple Cart's "half-rim of sugar" had been sitting.
# Dapper Sap's "lime wedge on rim" stays a GARNISH: that is a garnish with a
# placement, and garnish.yml already rules that "lime wedge on rim says where to
# put it" is information worth keeping.
#
# IT PRINTS IN THE "TO SERVE" BLOCK AND NOT ONLY ON THE GLASS LINE. Helen,
# 2026-09-05: "things like half-rim should be repeated in the method or serve or
# wherever, because it's easily missed just on the glass mark in the metadata."
# A rim is an ACTION, and an action filed only as metadata is an action that
# does not happen.
rim: "free text"
