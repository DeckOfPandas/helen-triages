# How a drink is served: the ice in the glass, how full, the rim, and the
# serveware. A drink's `serve` block takes its values from here
# (test_serve_block_uses_only_declared_keys_and_values).
#
# The ice has a field so that no method step restates it: the page composes
# the strain sentence from fields (see `in_the_glass`). There is no `chill`
# field, because a chilled glass is implied (DECISIONS §9.10a).
#
# Absent means nobody has decided; `ice: "none"` means served up.

# --- `ice` -------------------------------------------------------------------
# The ice in the GLASS, never the ice in the shaker. Each value's note opens
# with the sentence that defines it: scripts/build_ingest_vocab.py prints that
# first sentence in the ingest document.
ice:
  none: >-
    Served up, in an empty glass. 79 drinks, the commonest answer by a wide
    margin — which is a true fact about what Helen makes, and the same fact
    that killed the `up` mood for covering half the collection.
  cubed: >-
    Ordinary cubes, an ice-filled glass. The drink is long or it is meant to
    keep diluting.
  crushed: >-
    Crushed or pebble ice. Every swizzle, and it is the technique as much as
    the serve — a swizzle is stirred against the crushed ice, so the method
    keeps its "Fill with crushed ice" step and this field does not replace it.
  large cube: >-
    One big rock. Helen, 2026-09-04: "I really do want 'giant ice cube' for
    e.g. strong brown drinks over ice." Deliberately NOT a disqualifier for
    `strong brown drink` the way `crushed` is — a big block is precisely how
    you serve one.
  block: >-
    A large block, in a punch bowl or a pitcher. Five drinks, all punches.
    Distinct from `large cube` because it is a different object and a different
    amount of planning.
  blended: >-
    The ice is IN the drink, not under it. The four frozen drinks. Reads as
    "you need a blender", which is the constraint that matters when choosing —
    and it is why the value exists even though it PRINTS NOTHING (see below).

# --- how the page says it ----------------------------------------------------
# The ice is a clause on the strain step. `_layouts/cocktail.html` composes
# the technique, the glass's `serving` phrase from glasses.yml and this
# clause: "Strain." + "an old fashioned glass" + ", over a large ice cube".
# Ice the drink is poured ONTO takes a comma and "over"; ice the glass is FULL
# of takes "filled with" and no comma. `none` and `blended` have no clause.
in_the_glass:
  cubed: " filled with ice"
  crushed: " filled with crushed ice"
  large cube: ", over a large ice cube"
  block: ", over a large block of ice"

# --- `fill` -------------------------------------------------------------------
# How full, which `ice` does not say. The value replaces the word `filled` in
# the clause above (" half-filled with crushed ice"), so it means something
# only for `cubed` and `crushed`; test_a_fill_has_something_to_fill refuses
# any other pairing. Absent means full. A separate field, not another `ice`
# value: scripts/derive_cocktail_moods.py and taxonomy.yml `mood_serve_ice`
# read `serve.ice` by its exact values.
fill:
  half: "half-filled"

# --- `rim` -------------------------------------------------------------------
# Free text. A rim is done to the glass before the drink is built, which is
# why it is here and not in `garnish`; a garnish placed on the rim (`lime
# wedge on rim`) stays a garnish. The page says it on the strain step, after
# "with a", or under "To serve" when no strain step carries it; so the value
# is a noun phrase holding the word "rim" ("salt rim", "sugar half-rim"),
# never the bare ingredient. DECISIONS §9.10a.
rim: "free text"

# --- `to_serve` --------------------------------------------------------------
# The field is one string. It is split on full stops and commas, and each
# piece, lowercased, must be an item below
# (test_every_to_serve_item_is_declared, #1256). `fire` holds flourishes only:
# rum a drink calls for is an ingredient line with `as: "shell"`, and the
# method lights it. Not here: the ice, a garnish, or a pour. Adding an item is
# Helen's.
to_serve:
  serveware:
    - "straw"
    - "two straws"
    - "straws"
    - "stirrer"
    - "ladle and punch glasses"
  decorations:
    - "plastic giraffes"
    - "paper umbrella"
    - "teeny flamingos"
    - "zero umbrellas"
  fire:
    - "more fire"
    - "more cinnamon sparkles"
    - "optional fire if tiki mug"
  on_the_side:
    - "lime and sugar on the side"
    - "assemblage au choix"
