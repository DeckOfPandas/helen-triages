# =============================================================================
# COCKTAIL INGREDIENT VOCABULARY. Spec: GitHub issue #322. Rum half: #314.
# Index design that consumes this: #292.
# =============================================================================
# TWO LAYERS, AND THE DISTINCTION IS THE WHOLE DESIGN.
#
#   `generic`  the precise ingredient category, on each `ingredients:` entry.
#              Campari, Aperol, Cynar and Fernet are FOUR generics -- they
#              taste nothing alike and are not substitutable.
#   `family`   the roll-up, for SEARCH and EXCLUSION only. All four are
#              `amaro`. See the families block below for why this is not a
#              browse axis.
#
# ONLY BASES HAVE A FAMILY. `lime juice` has none and should not -- nobody
# excludes "all juices". `family_of` maps the bases and nothing else, and
# `family_less` records the bases that deliberately have none.
#
# `generic` IS STORED, NEVER DERIVED. 61 distinct ingredients in this
# collection are named only by brand -- Campari, Cointreau, Cynar, Kahlua,
# Carpano Antica, Rittenhouse, Roots Mastiha, Swedish Flaggpunsch -- affecting
# 56 of the 109 drinks that have ingredients. No rule gets "rye whiskey" out of
# "Ritthenhouse".
#
# A PREFERRED BOTTLE IS A `suggestion`, NEVER A `generic`. Helen, 2026-08-17,
# on Cherry Heering: "I'd note my preference as the example not the category."
# So Velvet Falernum -> falernum, Luxardo -> maraschino liqueur, Carpano Antica
# -> sweet vermouth, with the bottle in `suggestion`. The only exceptions are
# the brand names #314 permits AS generics, because nothing generalises them:
# planteray stiggins' fancy, planteray o.f.t.d. overproof, malibu, blackstrap.
# =============================================================================

# --- spirit families: FOR SEARCH AND EXCLUSION, NOT A BROWSE AXIS ------------
# THIS IS NOT A "SORTED BY SPIRIT" MENU, and that is deliberate. Helen,
# 2026-08-17: "I get really bored of cocktail bars that have enormous
# bible-like menus sorted by spirit... I probably think browsing by spirit is
# basic." Do not put a spirit filter on the index.
#
# The families exist to serve two things in her actual index design:
#   1. the ingredient search's `(all)` buttons -- typing toward "rum" offers
#      "rum (all)" alongside "Havana Club Anejo 3 Anos", the same shape food's
#      ingredient search already has;
#   2. exclusion. "I don't like Scotch" is a family-level operation, and so is
#      "no whisky tonight".
#
# FOOD'S FAMILY MECHANISM CANNOT DERIVE THESE. On the food site an `(all)`
# button forms when entries share a head word after normalisation -- "cheese
# (all)" from cheddar/feta/comte. These styles share NO common word:
# "Jamaican, moderately aged" and "Demerara, aged" have nothing in common
# textually. So the family has to be DECLARED, which is what `family_of` is.
#
# `fortified` exists because 19 drinks have no spirit at all -- Bamboo,
# Brooklyn, Toronto, Aperol Spritz, Lucien Gaudin, the Bellini, mulled wine --
# and without it they cannot be excluded or searched as a group. `herbal`
# exists because Chartreuse is the BASE of Chartreuse Swizzle, not merely a
# modifier in it.
families:
  - rum
  - gin
  - whisky
  - brandy
  - agave
  - vodka
  - amaro
  - fortified
  - aquavit
  - herbal

# =============================================================================
# BASE SPIRITS -- one style list per family, the pattern #314 set for rum
# =============================================================================
# Styles Helen does not currently own are declared anyway. This is a spec, not
# an inventory: she chose that explicitly for gin, where Plymouth, New Western
# and Genever are all absent from the collection.

# GitHub issue #314. `light`, `gold` and `dark` are RETIRED -- see the bottom.
rum_styles:
  - "Jamaican, moderately aged"
  - "Jamaican, caramel forward"
  - "lightly aged and filtered"
  - "moderately aged"
  - "Demerara, aged"
  - "Demerara, overproof"
  - "Jamaican, overproof, unaged"
  - "cane juice (agricole) rum, unaged"
  - "cane juice (agricole) rum, aged"
  # Added to #314 after the first transcription. Haitian cane-juice spirit; a
  # category like cachaca or mezcal, so lowercase under the proper-noun rule.
  - "clairin"
  - "blended multi-region rum, clear"

# Permitted WITHOUT a style per #314, because nothing generalises them.
#
# BLACKSTRAP USED TO BE HERE AND IS NOT ANY MORE. Helen closed the question on
# #314, 2026-08-24: "blackstrap is only ever given as a character for another
# rum, like this: Moderately aged (character: blackstrap)". It is in
# rum_characters below, in retired_rum_styles at the bottom, and nowhere else.
rum_untyped:
  - "Planteray Stiggins' Fancy"
  - "Planteray O.F.T.D. Overproof"
  - "Malibu"

# CHARACTER: a separate, optional field, not `generic`. Some rums have a
# `generic` style (or none decided yet) but also carry a distinctive flavour
# marker worth recording on its own -- e.g. Ron del Barrito is "moderately
# aged" generically, but its defining trait is a sherry-cask, Spanish-style
# tradition rather than a Jamaican or Demerara profile.
#
# THESE ARE NOT GENERICS AND MUST NEVER BE USED AS ONE. This list read as a
# declared generic vocabulary until 2026-08-26, because tests/test_cocktails.py
# derives the permitted generics from every top-level LIST in this file and
# excluded only `families`. So `sherry` and `Spanish-style` silently passed as
# generics on any ingredient, and Helen's #314 decision below could not be
# enforced at all -- dropping `blackstrap` from rum_untyped would have changed
# nothing while this list still declared it. `NOT_GENERIC_LISTS` now names this
# group too. The whole point of #441 was to separate these two fields; the
# guard was quietly merging them back.
rum_characters:
  - "blackstrap"
  - "sherry"
  - "Spanish-style"

# THE CARD NAME FOR EACH RUM CATEGORY. Issue #501, Helen 2026-08-27: "set a
# display name for each rum category, to be used as a short name on cocktail
# cards. The recipe page can then display the full category name."
#
# WHAT THIS REPLACES IS NOT A LONG NAME, IT IS AN AMBIGUOUS ONE. The card used
# to render `item` -- the source's own words -- and eight of those strings each
# named two or three DIFFERENT rums across the collection:
#
#   `Overproof Navy rum`  -> Demerara aged / Jamaican moderately aged / O.F.T.D.
#   `Light aged rum`      -> Demerara aged / blended clear / lightly aged filtered
#   `Demerara rum`        -> Demerara aged / Demerara overproof
#   `White rum`           -> agricole unaged / lightly aged and filtered
#   `Gold rum`, `Navy rum`, `Light rum`, `Lightly aged rum` -> two each
#
# So the colour words #314 retired were not merely unfashionable on the index,
# they were the one thing on the card that could not be trusted. Measured, not
# assumed: the substitution also SHORTENS the card line in every case (median
# 98 -> 92 chars, Caribbean Sazerac -87, Mai Tai -69, worst case -1).
#
# THE NAMES MUST STAY DISTINCT FROM EACH OTHER, which is the whole point and is
# what test_rum_card_names_are_distinct enforces. Two rums reading the same on a
# card would rebuild the exact fault this map exists to fix -- UNLESS the
# collapse is deliberate, in which case it goes in
# `rum_card_names_may_collide` below with its reason, the same shape
# `family_less` uses. No drink in the collection shows the same card name twice
# either way, which test_no_drink_shows_the_same_card_name_twice holds
# separately: that is the failure a reader would actually SEE.
#
# EVERY RUM-FAMILY GENERIC HAS ONE, including the four that need no shortening
# (clairin, Malibu, cachaça, Batavia arrack) and the three brand-generics. The
# map is complete rather than exceptional so the card rule is "substitute when
# the generic has a card name", with no second question about which rums count.
#
# RUM ONLY, deliberately. Four non-rum generics are also over twenty characters
# (`Full-strength clear fruit brandy`, `ginger and lemongrass cordial`,
# `Lavender-forward bitters`, `passion fruit liqueur`) and none of them is
# AMBIGUOUS on a card, which is the problem this solves. Extend it when one is.
#
# HELEN'S NAMES, 2026-08-27, tweaked from a first cut. Her edits went one way:
# the spirit word is SAID rather than implied wherever the style name alone
# would not read as a rum -- `filtered rum` became `lightly aged rum`,
# `clear blend` became `clear blended rum`, and both overproofs gained a
# trailing "rum". Two of them are consequently LONGER than the generic they
# stand for, which is fine: this map's job is a name you can read at card
# distance, and brevity was only ever the means.
rum_display_names:
  "Jamaican, moderately aged": "Jamaican rum"
  # DELIBERATELY THE SAME as the moderately aged one above -- see
  # rum_card_names_may_collide. Declared in rum_styles and used by NO DRINK as
  # of 2026-08-27; named here anyway, so the map covers the vocabulary rather
  # than today's data.
  "Jamaican, caramel forward": "Jamaican rum"
  "Jamaican, overproof, unaged": "Jamaican overproof rum"
  "Demerara, aged": "Demerara rum"
  "Demerara, overproof": "Demerara overproof rum"
  # The honest name for what everyone else calls white rum.
  "lightly aged and filtered": "lightly aged rum"
  # The weakest name in this map, and flagged as such: it is the residual
  # category -- a rum with no region and no other distinguishing trait -- so
  # there is nothing to name it AFTER. "aged rum" beside "Demerara rum" reads
  # faintly as though the Demerara were not also aged.
  "moderately aged": "aged rum"
  "blended multi-region rum, clear": "clear blended rum"
  # The real category words, and shorter than the description of them.
  "cane juice (agricole) rum, unaged": "agricole blanc"
  "cane juice (agricole) rum, aged": "agricole vieux"
  "clairin": "clairin"
  # The brand-generics #314 permits because nothing generalises them. O.F.T.D.
  # earns its place: its item strings are `Overproof Navy rum` and `Navy rum
  # (float)`, both of which name other rums elsewhere in the collection.
  "Planteray Stiggins' Fancy": "Stiggins' Fancy"
  "Planteray O.F.T.D. Overproof": "O.F.T.D."
  "Malibu": "Malibu"
  "cachaça": "cachaça"
  "Batavia arrack": "Batavia arrack"

# CARD NAMES THAT ARE ALLOWED TO BE THE SAME, with the reason attached -- the
# idiom `family_less` above and tests/test_reference_data.py's
# NO_TEMPERATURE_BECAUSE both use, so "why do two rums read alike?" is answered
# in the repo rather than in someone's memory.
#
# Listing a name here is what makes the collapse permitted; an undeclared
# duplicate still fails. A collapse is a real loss of information on the index,
# so it should cost a sentence.
rum_card_names_may_collide:
  "Jamaican rum": >-
    Helen's call, 2026-08-27, offered the alternative and choosing this:
    `Jamaican, moderately aged` and `Jamaican, caramel forward` both read
    `Jamaican rum` on a card. The funk is the shared trait and it is what you
    are choosing the drink for at that distance; the caramel is a nuance of the
    same rum rather than a different strength or a different drink, which is the
    line the other pairs fall the other side of -- both Demeraras and both
    agricoles keep their own names, because proof and age genuinely change what
    you are making. Costs nothing today: `Jamaican, caramel forward` is declared
    in rum_styles and used by no drink, and no drink calls for both Jamaicans.
    The full category names are on the drink page either way.

# Helen's own list, 2026-08-26, given in full when `flavoured` was queried:
# "London Dry, Old Tom, Plymouth, Navy strength, Genever and speciality, where
# speciality should always carry a character field." Written lowercase here at
# her direction -- the file's commodity-lowercasing rule wins over the way a
# style gets capitalised in prose, so `blended Scotch` and `Demerara, aged`
# keep their shape too.
gin_styles:
  - "London dry"
  - "Old Tom"
  - "Plymouth"
  - "New Western dry"
  - "genever"
  - "navy strength"
  # REPLACES `flavoured`, which is retired -- see retired_gin_styles. A gin
  # whose point is a botanical other than juniper: Hendrick's cucumber and
  # rose, Malfy's lemon, a rhubarb gin. The style name alone says nothing
  # useful, which is why Helen's rule is that this generic ALWAYS carries a
  # `character` naming what the gin actually pushes. Enforced by
  # tests/test_cocktails.py::test_speciality_gin_declares_a_character.
  #
  # Character is FREE TEXT here, unlike rum's -- Helen's call, 2026-08-26. A
  # rum's character comes from a handful of production traits and closes into a
  # list; a gin's is whatever went in the still, and closing that list would
  # mean a vocabulary edit for every new bottle.
  - "speciality"
  # Helen's own parenthesis: "not a gin though". Sloe gin lives here rather
  # than hiding inside london dry. Deliberately NOT one of the styles above --
  # her 2026-08-26 list is types of GIN, and this is not one; it sits in this
  # group so that `family_of` can still roll it up to gin for exclusion.
  - "gin liqueur"

whisky_styles:
  - "rye"
  - "bourbon"
  - "peated Scotch"
  - "blended Scotch"
  - "Irish"
  - "Japanese"

agave_styles:
  - "blanco tequila"
  - "reposado tequila"
  - "añejo tequila"
  - "mezcal"

brandy_styles:
  - "cognac"
  - "armagnac"
  - "calvados"
  - "pisco"
  - "grappa"
  # The category term rather than one country's word for it, so a slivovitz or
  # a framboise has somewhere to go. Cherry eau de vie is the live example.
  - "eau de vie"
  # Helen, 2026-08-22, on Bali Hai's Aguardiente brandy, "for now" -- this
  # may turn out to just be `eau de vie` once revisited; kept separate
  # rather than assumed identical.
  - "full-strength clear fruit brandy"

# Cane and palm spirits that are NOT rum. #314: "cachaca is its own generic" --
# same raw material as an agricole rhum, completely different product. Batavia
# arrack is a cane-and-rice spirit and Helen's call is that it stars as `rum`.
# Ceylon arrack is coconut flower sap and shares only the name.
cane_and_palm_spirits:
  - "cachaça"
  - "Batavia arrack"
  - "Ceylon arrack"

other_base_spirits:
  - "vodka"
  - "flavoured vodka"
  - "absinthe"
  - "pastis"
  - "aquavit"

# =============================================================================
# MODIFIERS
# =============================================================================

liqueurs:
  # Orange, four ways -- Helen's call. Grand Marnier stays apart because its
  # cognac base genuinely changes a drink.
  #
  # CURAÇAO KEEPS ITS CAPITAL, Helen's call 2026-08-17, and it is a deliberate
  # exception to the lowercase-the-commodity rule that keeps cognac, champagne
  # and calvados lowercase. The distinction that justifies it: those three are
  # protected appellations that have become common nouns in English, whereas
  # curaçao is not protected and still reads as the island's name. Her own data
  # writes it capitalised throughout, which is the stronger argument.
  - "triple sec"
  - "orange Curaçao"
  - "dry orange Curaçao"
  - "Grand Marnier"
  - "blue Curaçao"
  # Rhum Clément Créole Shrubb. A rhum-based ORANGE LIQUEUR, and filed here
  # rather than under rum on Helen's question, 2026-08-17. The deciding case is
  # exclusion: under `rum` it would make "no rum tonight" wrongly drop Ginger
  # Snap and Accoutrement, whose only rum-derived element is 15 ml of this.
  # Stiggins' Fancy sits under rum because it genuinely IS rum; a shrubb is a
  # sweetened orange liqueur that happens to be rhum-based.
  - "Créole Shrubb"
  - "maraschino liqueur"
  # Each by flavour, deliberately: precision chosen over collapsing.
  - "crème de mûre"
  - "crème de cassis"
  - "crème de pêche"
  - "crème de banane"
  - "crème de violette"
  - "crème de cacao"
  - "crème de menthe"
  # Cherry: the distinction Helen believes in. A liqueur is sweetened, an eau
  # de vie is not, and her own note says "Don't use plain kirsch". The eau de
  # vie itself lives under brandy_styles.
  - "cherry liqueur"
  - "apricot liqueur"
  - "coffee liqueur"
  - "ginger liqueur"
  - "passion fruit liqueur"
  - "gentian liqueur"
  - "apple schnapps"
  - "mastiha liqueur"
  - "tomato liqueur"
  - "amaretto"

# Own generics, family = `herbal`. Chartreuse is the BASE of Chartreuse
# Swizzle, which is why these are not filed as mere modifiers.
herbal_liqueurs:
  - "green Chartreuse"
  - "yellow Chartreuse"
  - "Bénédictine"
  - "Galliano"
  - "Strega"
  - "Jägermeister"
  - "liqueur de sapin"
  - "Swedish flaggpunsch"

# Separate generics, one family. Not substitutable for each other -- swapping
# Campari for Fernet is a different drink, not a variation.
amari:
  - "Campari"
  - "Aperol"
  - "Cynar"
  - "fernet"
  - "Amaro Nonino"
  - "Amaro Ciociano"

fortified_and_aromatised:
  - "sweet vermouth"
  - "dry vermouth"
  - "blanc vermouth"
  # A vermouth-amaro hybrid; swapping it for sweet vermouth is audible.
  - "Punt e Mes"
  # Aperitif wines, not vermouths: Lillet, Cocchi Americano.
  - "quinquina"
  - "amontillado sherry"
  - "oloroso sherry"
  - "tawny port"

wine_and_sparkling:
  - "champagne"
  - "prosecco"
  - "red wine"
  - "cider"

# Every flavour by name, Helen's call -- consistent with crème de X.
#
# LOWERCASED 2026-08-26. `Lavender-forward` and `Warm-spiced` were the only
# two capitalised descriptive bitters, sitting among nine lowercase ones. Same
# rule Helen applied to the gin styles the same day: a proper noun keeps its
# capital (Creole does), a description does not.
#
# TWO LAVENDERS, DELIBERATELY, and this partly reverses #451's recorded
# resolution -- Helen, 2026-08-26: "lavender bitters is fine". #451 had merged
# Bee's Knees' plain lavender bitters into `lavender-forward bitters`, but the
# reason it gave for keeping the SUGGESTIONS apart is the reason to keep the
# generics apart too: Bob's Margarita bitters "is very much its own thing and
# putting it in a Bee's Knees isn't right, because it adds mint and liquorice".
# Not substitutable, so not one category -- the same test that makes Campari,
# Aperol, Cynar and fernet four generics rather than one amaro.
bitters:
  - "aromatic bitters"
  - "orange bitters"
  - "Creole bitters"
  - "chocolate bitters"
  - "tiki bitters"
  - "lavender bitters"
  - "lavender-forward bitters"
  - "peppermint bitters"
  - "wood smoke bitters"
  - "warm-spiced bitters"
  - "margarita bitters"
  - "pimento bitters"

# =============================================================================
# SWEETENERS, JUICES, FRUIT
# =============================================================================

# 1:1 AND 2:1 ARE SEPARATE GENERICS. "Simple syrup" means 1:1. Only 2 of 27
# entries state a ratio, and syrup-to-citrus volume CANNOT tell them apart -- a
# declared 1:1 (Daisy de Santiago) and a declared 2:1 (Long Island) both sit at
# 0.50, because Helen adjusts sugar deliberately. See HANDOVER §9.4.1: the site
# is canon and she deviates in the kitchen.
syrups:
  - "sugar syrup 1:1"
  - "sugar syrup 2:1"
  - "demerara syrup"
  - "grenadine"
  - "ginger syrup"
  - "passion fruit syrup"
  - "cinnamon syrup"
  - "agave syrup"
  - "vanilla syrup"
  - "orgeat"
  - "falernum"
  - "lime cordial"
  - "ginger and lemongrass cordial"

# `honey water` is what other people call honey syrup. Helen makes no syrup, so
# the word does not appear. Clover is a suggestion in a note, not a generic.
#
# THE RATIO IS ALWAYS STATED, exactly as the syrups above -- Helen, 2026-08-26,
# asked directly. There is deliberately no bare `honey water` to fall back on:
# a diluted honey and a twice-as-concentrated one are used at different volumes
# for the same sweetness, which is the whole reason `sugar syrup 1:1` and
# `sugar syrup 2:1` are two generics rather than one.
#
# `acacia honey` IS GONE, folded into plain `honey` with acacia as a
# `suggestion` -- Helen, 2026-08-26. It was a varietal preference wearing a
# category's clothes, which is precisely what this file's own rule forbids
# ("a preferred bottle is a suggestion, never a generic"). The distinction
# worth keeping is neat honey versus honey diluted with water; acacia versus
# clover is a bottle on the shelf.
honeys:
  - "honey"
  - "honey water 1:1"
  - "honey water 2:1"

# DELIBERATELY MIXES FORM WITH TYPE, and the reasoning is a browsing one rather
# than a purity one -- Helen: "if I don't have a sugar cube I won't make a
# Classic Champagne Cocktail". A cube can also be brown; Arrack Punch uses 16
# demerara cubes. So form and type really are orthogonal here.
# Her revisit clause: "if having this many turns out to feel mad once I'm using
# the site, then we can revisit."
sugars:
  - "white sugar"
  - "raw sugar"
  # Added 2026-08-26. The Pear/Apricot Bellini was typed `molasses sugar`,
  # which is nearly muscovado -- a long way from a light unrefined caster, and
  # it would have coloured a pale fruit syrup wrong. Helen's call was its own
  # generic rather than folding it into `raw sugar`, which is consistent with
  # this list's stated willingness to mix form with type.
  - "golden caster sugar"
  - "molasses sugar"
  - "palm sugar"
  - "sugar cube"

# "FRESH" IS NOT PART OF THE GENERIC. Freshly squeezed is implied for every
