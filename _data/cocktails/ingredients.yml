# Cocktail ingredient vocabulary (#322; the rum half is #314). A closed
# vocabulary, and every entry is Helen's ruling: DECISIONS §9.3.1.
#
# Two layers. `generic` is the precise category on each `ingredients:` entry:
# Campari, Aperol, Cynar and fernet are four generics, not substitutable.
# `family` is the roll-up, for search and exclusion only, and only bases have
# one: `family_of` maps them and `family_less` records the deliberate gaps.
#
# `generic` is stored, never derived: no rule gets `rye` out of "Rittenhouse".
# A preferred bottle is a `suggestion`, never a generic, unless no category
# name would help Helen choose: then the bottle is the category (Créole
# Shrubb, Campari, Chartreuse Verte, Strega, Bénédictine).
#
# A top-level LIST here is read as generic values unless its key ends
# `_characters` or NOT_GENERIC_LISTS in tests/test_cocktails.py names it.

# --- how an `amount` becomes a number ----------------------------------------
# An ingredient carries one quantity, the display string `amount`; there is no
# `ml:` key (#571). Every amount must read through this block:
# test_every_amount_is_readable_as_a_quantity fails on one that does not.
# The conversions are decisions, not arithmetic: 1 oz is 30 ml, bar-standard
# rounding, not 29.5735.
measures:
  per_ml:
    ml: 1
    cl: 10
    oz: 30
    tsp: 5

  # Units that count or weigh something, never a volume. An amount in one of
  # these has no millilitre figure and is not missing one, so a consumer
  # checks whether a figure came back.
  non_volumetric:
    - dash
    - dashes
    - drop
    - drops
    - cube
    - cubes
    - pinch
    # A two-word unit: the amount is the only field that can say "small".
    - small pinch
    - each
    - leaf
    - leaves
    - sprig
    - sprigs
    - strip
    # A cut of fruit you pick up, like `half` below.
    - wedge
    - wedges
    # A coin of citrus zest expressed into the build: `1 disc` of grapefruit zest.
    - disc
    # A two-word unit, as in `2.5 cm log` of cucumber: length and shape
    # together, in centimetres because the house writes no imperial measure.
    - cm log
    # A cut, like `strip` and `wedge`: `1 thick coin` of `lime zest with flesh`.
    - thick coin
    - g

    # A whole fruit is counted, never measured. `half` is a unit with no number
    # in front of it, read by whole-string lookup as `(top)` is; `whole` is its
    # partner for the counts the scaler produces (half doubled is `1 whole`).
    - half
    - whole

    # Actions, not counts (#1217): an ingredient the method adds rather than
    # measures names the action as a bracketed noun where the number would be.
    # The cost and units plugins and scripts/abv_worklist.py compare `(top)`
    # as a literal, so a respelling that misses one does not error: it stops
    # matching, and a topped drink costs nothing and counts no units. Dropping
    # the old string from this list is what makes every unmigrated file fail
    # test_every_amount_is_readable_as_a_quantity.
    - (top)
    - (rinse)
    # Not a small `(top)`: a top fills the room left in the glass, a splash is
    # a deliberate small amount that does not. `(float)` is for a float given
    # no millilitre figure.
    - (splash)
    - (float)
    # For a seasoning nobody measures. A measured line names its use in `as:`
    # instead: see `ingredient_as`.
    - (sprinkle)
    # The drinker decides how much (#752), so cost and units skip it. Not
    # bracketed: the bracketed ones name what the maker does, and this is an
    # instruction to whoever holds the glass.
    - to taste

  # Words that may sit between the number and its unit without changing either.
  ignored_words:
    - heaping

# --- how much juice one fruit gives ------------------------------------------
# For the shopping list (#546). A range, not an average: the list prints a
# span of whole fruits. The fewest is the total over the largest yield and the
# most is the total over the smallest, both rounded up.
# An entry is a claim that you squeeze this yourself: the carton juices in
# `juices:` are absent on purpose. The key is the generic as a drink writes it.
juice_yields:
  lemon juice:
    fruit: lemon
    ml_min: 30
    ml_max: 45
  lime juice:
    fruit: lime
    ml_min: 20
    ml_max: 30
  # A medium orange: a large one is nearer a small grapefruit.
  orange juice:
    fruit: orange
    ml_min: 60
    ml_max: 80
  # A blood orange is priced and yielded as an orange: only the variety differs.
  blood orange juice:
    fruit: orange
    ml_min: 60
    ml_max: 80
  grapefruit juice:
    fruit: grapefruit
    ml_min: 180
    ml_max: 240
  # Same fruit and the same yield -- only the variety differs.
  ruby grapefruit juice:
    fruit: grapefruit
    ml_min: 180
    ml_max: 240
  pink grapefruit juice:
    fruit: grapefruit
    ml_min: 180
    ml_max: 240

# --- what the index's ingredient pickers do with all this --------------------
# How much typing earns a pool of candidates is a question about this
# vocabulary, so the numbers live here and assets/js/cocktail-search.js writes
# neither down: test_the_cocktail_search_thresholds_are_not_hardcoded.
# The pickers answer from the first character and no pool is capped (#1219).
search:
  min_query_chars: 1
  family_button_min_chars: 3

  # A `suggestion` is free text, and some of it is a sentence rather than a
  # bottle, which means nothing as a filter chip. One containing any of these
  # words or marks is not offered (#585). Suggestions only: a declared generic
  # is never dropped. `and`, `the` and `that` are absent on purpose: `Wray and
  # Nephew` and `The Botanist` are bottles.
  prose_words:
    - a
    - an
    - or
    - if
    - you
    - your
    - need
    - needs
    - best
    - better
    - prefer
    - other
    - instead
    - sub
    - fine
    - use
    - using
    - when
    - with
    - for
    - unless
    - though
    - is

  # A comma catches two bottles in one string; `>` catches `Jack Daniels >
  # Bulleit`. A bottle that legitimately carries one is simply not offered.
  prose_marks: ["--", "—", "?", "!", ">", ","]

  # Search-only `(all)` buttons over a declared set of generics (#1376),
  # offered and matched as a family's button is, but no family: exclusion by
  # `family_of` and the cards never see one. `names` are other words that
  # offer it. `then_offer` chips are listed straight after the chips whose
  # names begin with the label, whenever the button is on offer.
  # test_search_umbrellas_name_declared_generics.
  umbrellas:
    - label: "rhum agricole"
      names: ["agricole"]
      covers: ["rhum agricole blanc", "rhum agricole vieux"]
      then_offer: ["Clairin Vaval", "Clairin Casimir", "Clairin Communal", "Clairin Sajous"]

# --- things a card never mentions --------------------------------------------
# Never on a card and never in the search pool (#580, #691): each is a making
# fact, not a choosing one. EXACT matches only, never substrings: bare `water`
# is here, while `soda water` and `honey water` are choosing facts and stay.
# So the bare sugars, the salt and the zest, and no syrup.
not_on_cards:
  - water
  - salt
  # A sprinkle is seasoning, as `salt` is.
  - ground cinnamon
  - white sugar
  - raw sugar
  - golden caster sugar
  - molasses sugar
  - palm sugar
  - sugar cube
  - honey
  - lemon zest

# --- how an ingredient is used, not what it is (#754) ------------------------
# A closed vocabulary, held by test_ingredient_as_is_declared; adding a member
# is Helen's decision. `float`, `rinse` and `shell` sort last on a card: each
# is added outside the main build. `muddle` reorders nothing, and is declared
# because it is a true fact the drink page may want.
# A `shell` is the overproof rum in a lit fruit half-shell: always a measured
# line, 25 ml unless Helen says otherwise (#1256). It is not a float.
ingredient_as:
  - "float"
  - "rinse"
  - "muddle"
  - "shell"

# --- other names for a family ------------------------------------------------
# A family is reached by its name, so these are the other spellings people
# type. The button always carries the family's canonical name: typing `scotch`
# offers the whisky family, which also holds bourbon and rye.
# Families only: an ingredient reached by two names is a `card_names` question.
family_aliases:
  whiskey: whisky
  scotch: whisky
  tequila: agave
  rhum: rum
  ron: rum
  # Nobody browsing for a bitter drink types "amaro" first.
  bitter: amaro
  amari: amaro

# --- what the (all) button says ----------------------------------------------
# A label, not a rename of the family: `whisky_characters` is keyed off the
# family's name. Either spelling alone on the button would read as excluding
# half the family (DECISIONS §9.3.3). A family with no entry shows its name.
family_labels:
  whisky: "whisk(e)y"

# --- spirit families: for search and exclusion, not a browse axis ------------
# Do not put a spirit filter on the index. The families serve the ingredient
# search's `(all)` buttons and exclusion ("no whisky tonight"). They are
# declared because the styles share no head word a rule could group on.
# `fortified` is for the drinks with no spirit at all; `herbal` is here
# because Chartreuse is the base of a Chartreuse Swizzle.
families:
  - rum
  - gin
  - whisky
  - brandy
  - agave
  - vodka
  - amaro
  - fortified
  - aquavit
  - herbal

# === BASE SPIRITS: one style list per family, the pattern #314 set for rum ===
# A spec, not an inventory: a style is declared whether or not a drink or a
# bottle of Helen's uses it, and an unused one is not a gap to fill.

# --- generics only Helen may put on a drink ----------------------------------
# Applying one of these is her judgement about what she reaches for, never an
# inference from a source's words (#542). A line here switches on
# test_no_drink_uses_a_generic_that_is_helens_to_apply; removing one is how
# she grants it, in the same commit as the drink that earns it.
hers_to_apply:
  "caramel-forward Jamaican rum": >-
    Blackwell and Myers are declared bottles for this style and no drink uses
    it. Helen has said twice that she never reaches for Blackwell in the
    drinks it kept being applied to; a session put cobra-effect into it from
    item text anyway, and she reverted that on 2026-08-30, ruling the drink
    `moderately aged Jamaican rum` with no suggestion at all. MANUAL 9.3.2
    already said "it is hers to apply: never retype a drink into it from item
    text", in prose, and prose did not hold.
  # The flat generic is the default for a honey drink whose ratio does not
  # matter (see `honeys`). The ratioed ones are ordinary generics, not reserved.
  "honey water": >-
    Acacia honey is a declared bottle for it and no drink pours it -- every
    honey-water drink today carries a ratio. Kept as the default for a drink
    where the ratio does not matter, and so that the bottle has a category.
    Helen, 2026-09-25 (#1186): keep. Hers to apply, never a session's guess
    at which honey water a source meant.

# #314. `light`, `gold` and `dark` are retired: see `retired_rum_styles`.
rum_styles:
  - "moderately aged Jamaican rum"
  - "caramel-forward Jamaican rum"
  - "lightly aged and filtered rum"
  - "moderately aged rum"
  - "aged Demerara rum"
  - "overproof Demerara rum, lightly aged"
  - "overproof Jamaican rum, unaged"
  - "rhum agricole blanc"
  - "rhum agricole vieux"
  # One generic per clairin (#1108): they are not interchangeable. Capitalised
  # because each is a product's name, as `Chartreuse Jaune` is.
  - "Clairin Vaval"
  - "Clairin Casimir"
  - "Clairin Communal"
  - "Clairin Sajous"
  - "clear blended multi-region rum"
  # `blended overproof rum` is Guyana, Jamaica and Barbados at 69%: a home
  # `moderately aged rum` cannot give, since it says nothing about strength.
  - "pineapple-infused rum"
  - "blended overproof rum"

# How the styles group on the rum reference page (#529), in Helen's names. Not
# a second vocabulary: every `rum_styles` entry appears exactly once
# (test_rum_groups_partition_the_styles). Not `family_of` either: cachaça is
# in the rum family and on no rum shelf. "Other molasses rum" is in age order.
# `combined` prints several styles as one row listing them under `origin`: the
# four clairins, no two interchangeable, read as one category (#1379).
# `origin_notes` puts Helen's words after a country label in one row.
rum_groups:
  - name: "Jamaican rum"
    styles:
      - "moderately aged Jamaican rum"
      - "caramel-forward Jamaican rum"
      - "overproof Jamaican rum, unaged"
  - name: "Demerara rum (Guyana)"
    styles:
      - "aged Demerara rum"
      - "overproof Demerara rum, lightly aged"
  - name: "Other molasses rum"
    styles:
      - "clear blended multi-region rum"
      - "lightly aged and filtered rum"
      - "moderately aged rum"
      - "blended overproof rum"
  # Pressed cane juice fermented fresh; the other groups are molasses.
  - name: "Cane juice"
    styles:
      - "rhum agricole blanc"
      - "rhum agricole vieux"
      - "Clairin Vaval"
      - "Clairin Casimir"
      - "Clairin Communal"
      - "Clairin Sajous"
    combined:
      - row: "clairin"
        origin: "Haiti"
        styles:
          - "Clairin Vaval"
          - "Clairin Casimir"
          - "Clairin Communal"
          - "Clairin Sajous"
    origin_notes:
      "rhum agricole vieux":
        "Haiti": "(not strictly agricoles)"
  - name: "Flavoured"
    styles:
      - "pineapple-infused rum"

# The rum page's shelf after Flavoured (#1379): liqueurs, so not rum styles and
# not in `rum_groups`. A row prints its `label` where Helen gave one, else its
# generic. Créole Shrubb keeps its own generic and reads "fruit rum liqueur"
# here only. Every rum or rhum liqueur belongs here and in `family_reach`:
# test_every_rum_based_liqueur_is_reached_by_rum.
rum_liqueur_shelf:
  name: "Rum-based liqueurs"
  rows:
    - generic: "coconut rum-based liqueur"
    - generic: "coconut rhum-based liqueur"
    - generic: "Créole Shrubb"
      label: "fruit rum liqueur"

# Helen's words after a bottle's name, on the rum page only (#1379).
rum_page_bottle_notes:
  "Gosling's Black Seal": "(blended in Bermuda)"
  "Rhum Clément Créole Shrubb": "(rhum-based)"

# The rum page renders its rum-adjacent block immediately before the shelf
# named here (#919). Declared so that renaming the shelf cannot silently move
# the block: test_rum_adjacent_before_names_a_real_group.
rum_adjacent_before: "Flavoured"

# Empty: every rum has a style in `rum_styles`, and the bottle names that
# stood here as generics are in `retired_rum_styles`.
rum_untyped: []

# A character is a separate, optional field beside `generic` (#441): a flavour
# marker orthogonal to the style. Never a generic. A closed list, held by
# test_a_declared_character_vocabulary_is_enforced.
rum_characters:
  - "blackstrap"
  - "sherry"
  - "Spanish-style"
  # The ester-heavy, high-funk note. Orthogonal to style: an unaged overproof
  # Jamaican and a moderately aged one can both have it, so "Jamaican" cannot
  # carry it.
  - "hogo"
  # The raw-cane-sugar (panela) note of a Panamanian silver rum (#1108).
  - "raspadura"

# Helen's words after a character on the rum page, printed verbatim (#1379).
rum_character_notes:
  "Spanish-style": "(is here because it means something a recipe can request, even though it's not something I'll sort my bottles by)"

# Peat is orthogonal to single-malt-versus-blended, so it is a character and
# not a style. A closed list, like rum's; a gin's character is free text.
whisky_characters:
  - "peated"

# There is no `fortified_characters` list: a character names a flavour trait,
# and "either works" is a list `generic` on the drink (DECISIONS §9.3.1).

# === WHERE A BOTTLE IS FROM (#591) ===
# `origin` goes on the bottle, in bottles.yml, so a recipe cannot require one.
# Origin is in the generic where it changes the category (the Jamaicans, the
# Demeraras, the clairins) and on the bottle where it changes the flavour.
# A closed list of the values in use, held by test_bottle_origin_is_declared,
# and named in NOT_GENERIC_LISTS so that these do not become generics.
# The page prints a row's countries in this order. The molasses countries
# (#1379) are alphabetical, and a blend of several countries' rums comes last.
bottle_origins:
  - "Martinique"
  - "Guadeloupe"
  - "Haiti"
  - "Brazil"
  - "Barbados"
  - "Cuba"
  - "Guyana"
  - "Nicaragua"
  - "Panama"
  - "St Lucia"
  - "Trinidad & Tobago"
  - "US Virgin Islands"
  - "multi-country origin"

# The name each generic shows on a card (#501, DECISIONS §9.10). The drink
# page does not read this map: it prints `generic` verbatim, so a ratio or a
# long style name is on the page where you make the drink and off the card
# where you choose it. Every rum-family generic has a row; any other generic
# needs one only where its card name differs. A card name says the spirit
# word out loud. Two generics may share one only if `card_names_may_collide`
# lists it: test_rum_card_names_are_distinct.
card_names:
  "moderately aged Jamaican rum": "Jamaican rum"
  # Deliberately the same as the one above: see `card_names_may_collide`. The
  # style is in `hers_to_apply`.
  "caramel-forward Jamaican rum": "Jamaican rum"
  "overproof Jamaican rum, unaged": "overproof Jamaican rum"
  "aged Demerara rum": "Demerara rum"
  "overproof Demerara rum, lightly aged": "overproof Demerara rum"
  # The honest name for what everyone else calls white rum.
  "lightly aged and filtered rum": "lightly aged rum"
  # The residual category, a rum with no region, so there is nothing to name
  # it after.
  "moderately aged rum": "aged rum"
  "clear blended multi-region rum": "clear blended rum"
  # The spirit word stays: `agricole blanc` alone asks the reader to know that
  # agricole is a rum.
  "rhum agricole blanc": "rhum agricole blanc"
  "rhum agricole vieux": "rhum agricole vieux"
  "Clairin Vaval": "Clairin Vaval"
  "Clairin Casimir": "Clairin Casimir"
  "Clairin Communal": "Clairin Communal"
  "Clairin Sajous": "Clairin Sajous"
  "pineapple-infused rum": "pineapple rum"
  # Distinct from the two single-origin overproofs above.
  "blended overproof rum": "blended overproof rum"
  "cachaça": "cachaça"
  "Batavia arrack": "Batavia arrack"
  # Not a rum and in no family (see `family_less`); it has a row so that the
  # map covers every cane and palm spirit.
  "coconut-flower arrack": "coconut-flower arrack"

  # --- beyond rum -------------------------------------------------------------
  # The card shows the shortest name that tells you what the drink is like:
  # "gin", because London dry versus Plymouth does not change your evening. A
  # generic that already reads well on a card needs no row.
  "London dry gin": "gin"
  # Not collapsed to "gin": collapse where the difference is a nuance, keep it
  # where it changes the strength or the drink.
  "navy strength gin": "navy strength gin"
  "genever": "genever"
  "blended scotch whisky": "scotch"
  # Not `single malt` (#844): a card names one ingredient at a time, and that
  # is an adjective with nothing after it.
  "single malt scotch whisky": "single malt whisky"
  # Bonded stays its own word: a category, not a strength.
  "bonded rye": "bonded rye"
  # The ratio is a making fact, not a card fact: both read the same, a
  # collapse declared in `card_names_may_collide`.
  "cane sugar syrup 1:1": "sugar syrup"
  "cane sugar syrup 2:1": "sugar syrup"
  # At card distance `demerara` is the whole fact.
  "demerara sugar syrup 2:1": "demerara syrup"
  # One card name for every ratio; the flat `honey water` needs no row.
  "honey water 1:1": "honey water"
  "honey water 2:1": "honey water"
  "honey water 3:1": "honey water"

# How a list `generic` (either would do, #441) reads on a card where the
# default " or " join of the two card names reads badly. Keyed on the default
# join. An explicit map, because collapsing a shared word is a judgement about
# two specific names. Every key must be a join some drink produces:
# test_every_card_name_join_is_reachable, which skips while this is empty.
card_name_joins: {}

# Card names that are allowed to be the same, each with its reason. An
# undeclared duplicate fails test_rum_card_names_are_distinct.
card_names_may_collide:
  "sugar syrup": >-
    `cane sugar syrup 1:1` and `cane sugar syrup 2:1` both read `sugar syrup` on
    a card. Helen, 2026-08-27, asked what she would expect to see: "On the card
    I would expect to see sugar syrup, and on the recipe ingredient line cane
    sugar syrup, 2:1." The ratio changes how much you pour, which is a thing you
    need while MAKING the drink and not while choosing it -- so this is a
    collapse that loses real information on purpose, at the distance where the
    information is not being used. It now drops the SUGAR as well as the ratio,
    since the generics were renamed on 2026-09-04, and her sentence covers that
    too: the card said `sugar syrup` when the generic did, and still does.
    Nine drinks carry both a syrup and something else sweet; none carries both
    ratios at once.
  "honey water": >-
    `honey water 1:1` and `honey water 2:1` both read `honey water` on a card,
    which is also what the flat `honey water` generic reads. Exactly the sugar
    syrups' collapse and for exactly the same reason -- Helen, 2026-08-27: "On
    the card I would expect to see sugar syrup, and on the recipe ingredient
    line cane sugar syrup, 2:1." The ratio is a thing you need while MAKING the
    drink and not while choosing it. The flat generic is the DEFAULT, for a
    drink where the ratio does not matter; a card cannot tell the three apart
    and does not need to. One drink carries a ratio today (the Bee's Knees, at
    2:1) and no drink carries two honey waters at once.
  "Jamaican rum": >-
    Helen's call, 2026-08-27, offered the alternative and choosing this:
    `Jamaican, moderately aged` and `Jamaican, caramel forward` both read
    `Jamaican rum` on a card. The funk is the shared trait and it is what you
    are choosing the drink for at that distance; the caramel is a nuance of the
    same rum rather than a different strength or a different drink, which is the
    line the other pairs fall the other side of -- both Demeraras and both
    agricoles keep their own names, because proof and age genuinely change what
    you are making. Costs nothing today: `Jamaican, caramel forward` is declared
    in rum_styles and used by no drink, and no drink calls for both Jamaicans.
    The full category names are on the drink page either way.

# Lowercase where the word is a commodity, whatever capitals a style takes in
# prose.
gin_styles:
  - "London dry gin"
  # The spirit word is on the end so each line skims as a gin; the bare
  # names are in `retired_gin_styles`.
  - "Old Tom gin"
  - "Plymouth gin"
  - "New Western dry gin"
  - "genever"
  - "navy strength gin"
  # A gin whose point is a botanical other than juniper. The name alone says
  # nothing, so it always carries a `character` naming what the gin pushes:
  # test_speciality_gin_declares_a_character. Free text, unlike rum's: a gin's
  # character is whatever went in the still.
  - "speciality"
  # Not a gin: filed here so that `family_of` can roll it up to gin for
  # exclusion. The catch-all for a gin liqueur that is not sloe.
  - "gin liqueur"
  # Its own generic, not a `gin liqueur` with a character: a standard named
  # category, and a character never reaches the card.
  - "sloe gin"

# Scotch and Japanese take `whisky`; Irish and American take `whiskey`. `rye`
# and `bourbon` stay bare: the test is the name you would say out loud.
# `scotch` is lowercase as `cognac` and `champagne` are; the demonyms keep
# their capitals.
whisky_styles:
  - "rye"
  # Bottled-in-bond: 100 proof, one distillery, one season, four years
  # minimum. A category, not a strength, so never collapsed into `rye`.
  - "bonded rye"
  - "bourbon"
  - "blended scotch whisky"
  - "single malt scotch whisky"
  - "Irish whiskey"
  - "Japanese whisky"

agave_styles:
  - "blanco tequila"
  - "reposado tequila"
  - "añejo tequila"
  - "mezcal"

brandy_styles:
  - "cognac"
  - "armagnac"
  - "calvados"
  - "pisco"
  - "grappa"
  # A Greek pomace brandy, so it sits beside the grappa.
  - "tsipouro"
  # Named after the fruit, not a country, so an applejack and an English apple
  # brandy share it. Not `calvados`, which is a French appellation.
  - "apple brandy"
  # The category term rather than one country's word for it, so a slivovitz or
  # a framboise has somewhere to go. Cherry eau de vie is the live example.
  - "eau de vie"
  # Both are generics, not bottles. A drink that takes either says so with a
  # list `generic` (#441).
  - "aguardiente"
  - "kirschwasser"
  # Distilled peach wine, about 35%. Not `crème de pêche` (a sweetened
  # infusion, about 20%) and not a peach eau de vie (unaged, about 45%).
  - "peach brandy"

# Cane and palm spirits that are not rum styles. Cachaça is its own generic
# (#314). Batavia arrack is cane and rice, and its family is `rum`.
# Coconut-flower arrack is coconut flower sap and shares only the name (#796).
cane_and_palm_spirits:
  - "cachaça"
  - "Batavia arrack"
  - "coconut-flower arrack"

retired_cane_and_palm_spirits:
  "Ceylon arrack": >-
    Renamed `coconut-flower arrack`, 2026-09-14 (#796). Helen: "the name of the
    bottle is 'Ceylon Arrack', and the generic is 'coconut flower-arrack'" --
    Ceylon is where the bottle comes from, coconut flower sap is what the
    category is. The bottle keeps its name. Re-type as `coconut-flower arrack`;
    Arrack Christmas Punch was the one drink that poured it.

other_base_spirits:
  - "vodka"
  # Named by flavour, one generic each: flavoured vodkas are not substitutable
  # for one another.
  - "vanilla vodka"
  - "pineapple vodka"
  - "lemon vodka"
  - "absinthe"
  - "aquavit"

# `pastis` is not declared: no drink takes one. The day one does, it goes
# back in `other_base_spirits`.
retired_other_base_spirits:
  "flavoured vodka": >-
    covered a vanilla vodka and a pineapple one, which are not substitutable
    for each other -- Helen, 2026-09-04: "'flavoured vodka' is not a useful
    generic because members aren't substitutable. I suggest 'pineapple vodka'
    and 'vanilla vodka' or whatever." Both are declared in
    `other_base_spirits` above. Same call as `flavoured` gin, 2026-08-26.

# === MODIFIERS ===

liqueurs:
  # The orange liqueurs. Grand Marnier stays apart because its cognac base
  # changes a drink. Curaçao keeps its capital: unlike cognac or champagne it
  # is not an appellation turned common noun, and reads as the island's name.
  - "triple sec"
  - "orange Curaçao"
  - "dry orange Curaçao"
  - "Grand Marnier"
  - "blue Curaçao"
  # A rhum-based orange liqueur, filed here and not under rum: there, "no rum
  # tonight" would drop drinks whose only rum is a little of this.
  - "Créole Shrubb"
  - "maraschino liqueur"
  # Each by flavour: precision over collapsing.
  - "crème de mûre"
  - "crème de cassis"
  - "crème de pêche"
  - "crème de banane"
  - "crème de violette"
  # Two generics, by colour (#838). The unqualified word is not a generic: a
  # source that does not say which is a question for Helen.
  - "brown crème de cacao"
  - "white crème de cacao"
  # Coconut by base (#1379), filed here for the reason `Créole Shrubb` is: a
  # rhum-based one is not a rum-based one.
  - "coconut rum-based liqueur"
  - "coconut rhum-based liqueur"
  - "crème de menthe"
  # A liqueur is sweetened and an eau de vie is not: the eau de vie is under
  # `brandy_styles`.
  - "cherry liqueur"
  # A sweetened liqueur on a brandy base, not an eau de vie, so it sits here
  # and not under `brandy_styles`. Not interchangeable with `cherry liqueur`.
  - "cherry brandy"
  - "apricot liqueur"
  - "coffee liqueur"
  - "ginger liqueur"
  - "passion fruit liqueur"
  - "gentian liqueur"
  - "apple schnapps"
  # Not `peach brandy` (a distilled spirit) and not `apple schnapps` (#1013).
  - "peach schnapps"
  - "mastiha liqueur"
  - "allspice dram"
  # Raspberry: not `crème de mûre` above, which is blackberry.
  - "black raspberry liqueur"
  # Bilberry, named like the other crèmes. Not a myrtle (mirto) liqueur.
  - "crème de myrtille"
  - "kümmel"
  - "tomato liqueur"
  - "amaretto"

# Own generics, family `herbal`. None is substitutable for another, so each is
# a proper noun and the group is a filing drawer, never a category a drink is
# described by. The Chartreuses take the names on their labels, never green
# and yellow.
herbal_liqueurs:
  - "Chartreuse Verte"
  - "Chartreuse Jaune"
  - "Bénédictine"
  - "Galliano"
  - "Strega"
  - "Jägermeister"
  - "liqueur de sapin"
  - "Swedish flaggpunsch"
  - "Becherovka"

# Separate generics, one family. Not substitutable for each other -- swapping
# Campari for Fernet is a different drink, not a variation.
amari:
  - "Campari"
  - "Aperol"
  - "Cynar"
  - "fernet"
  - "Amaro Nonino"
  # Ciociaro, not Ciociano (#701).
  - "Amaro Ciociaro"

# There is no "aromatised wine" generic (#568): each kind is its own, and the
# roll-up is the `fortified` family. A quinquina and an americano are
# quinine-led rather than wormwood-led, so they sit beside the vermouths, not
# under them.
fortified_and_aromatised:
  - "sweet vermouth"
  - "dry vermouth"
  - "blanc vermouth"
  # Lillet Blanc, Dubonnet, Byrrh.
  - "quinquina"
  # Cocchi Americano Bianco.
  - "americano"
  - "amontillado sherry"
  - "oloroso sherry"
  - "tawny port"
  - "ruby port"

wine_and_sparkling:
  - "champagne"
  - "prosecco"
  - "red wine"
  - "white wine"
  # One generic for sake; a source's style stays in the ingredient's note.
  - "sake"
  - "cider"

# Every flavour by name, as the crèmes are. A description is lowercase and a
# proper noun keeps its capital (Créole). One lavender generic: a plain
# lavender bitters is a bottle under `lavender-forward bitters`.
bitters:
  - "aromatic bitters"
  - "orange bitters"
  # A bottle name is unique across bottles.yml and `Angostura` is the aromatic
  # one, so Angostura's orange bitters has this generic of its own.
  - "orange-forward bitters"
  - "Créole bitters"
  - "chocolate bitters"
  - "tiki bitters"
  - "lavender-forward bitters"
  - "peppermint bitters"
  # `daiquiri bitters` is named for the drink it is made for, as `margarita
  # bitters` is; the other two are named by flavour.
  - "daiquiri bitters"
  - "grapefruit bitters"
  - "peach bitters"
  - "wood smoke bitters"
  - "warm-spiced bitters"
  - "margarita bitters"
  - "pimento bitters"

# === SWEETENERS, JUICES, FRUIT ===

# A sugar syrup is named by its sugar and its ratio (#594); the card name
# drops both (`card_names`). 1:1 and 2:1 are separate generics, and "simple
# syrup" means 1:1. Syrup-to-citrus volume cannot tell the two apart, because
# Helen adjusts sugar deliberately (MANUAL §9.4.1).
syrups:
  - "cane sugar syrup 1:1"
  - "cane sugar syrup 2:1"
  - "demerara sugar syrup 2:1"
  - "turbinado sugar syrup 2:1"
  - "grenadine"
  - "ginger syrup"
  - "passion fruit syrup"
  - "cinnamon syrup"
  - "pineapple syrup"
  - "hazelnut syrup"
  - "agave syrup"
  - "vanilla syrup"
  - "raspberry syrup"
  - "orgeat"
  - "falernum"
  - "lime cordial"
  - "ginger and lemongrass cordial"

# `honey water` is the default, for a drink whose ratio does not matter, and
# is in `hers_to_apply`; the ratioed ones are for a drink where it does. All
# of them read `honey water` on a card. Bare `honey` is the raw thing you cook
# with. Acacia versus clover is a bottle, so a `suggestion`.
honeys:
  - "honey"
  - "honey water"
  - "honey water 1:1"
  - "honey water 2:1"
  - "honey water 3:1"

# Deliberately mixes form with type: a cube can also be brown, and a drink can
# depend on having a cube at all.
sugars:
  - "white sugar"
  - "raw sugar"
  # Its own generic, not folded into `raw sugar`: a light unrefined caster, a
  # long way from `molasses sugar`.
  - "golden caster sugar"
  - "molasses sugar"
  - "palm sugar"
  - "sugar cube"
  # Measured by the spoon, as a dry sugar (`1 tsp`), never in millilitres.
  - "powdered sugar"

# "Fresh" is not part of the generic: freshly squeezed is implied for every
# juice, and `lime cordial` being named separately is what makes that safe.
juices:
  - "lime juice"
  - "lemon juice"
  - "orange juice"
  # A variety earns a name when it changes what you are making.
  - "blood orange juice"
  - "pineapple juice"
  - "grapefruit juice"
  # Sweeter and much less bitter than white, so a second generic. The cost is
  # that the index filters and excludes each grapefruit separately.
  - "ruby grapefruit juice"
  - "pink grapefruit juice"
  - "cranberry juice"
  # The sweetened, diluted carton. Not a substitute for `cranberry juice`,
  # which is unsweetened, in a drink that counts on the sugar.
  - "cranberry juice drink"
  - "apple juice"

# The drink page prefixes these with "fresh " (#707); a card does not. A
# subset of `juices:`, declaring nothing new, so it is named in
# NOT_GENERIC_LISTS. Widening it is Helen's call: the other squeezed juices
# are left out on purpose.
always_fresh:
  - "lime juice"
  - "lemon juice"
  - "orange juice"
  - "grapefruit juice"

# A standing note (#707): the drink page prints it on every line of this
# generic, after the drink's own note if it has one. A mapping keyed by
# existing generics, so it declares none.
standing_notes:
  "pineapple juice": "Don't use fresh."

# Fruit is not juice. You muddle one and pour the other, and a Caipirinha made
# with lime juice is a different drink.
fruit_and_herbs:
  - "lime"
  - "pineapple"
  - "passion fruit"
  - "raspberries"
  - "blackberries"
  - "pear"
  - "dried apricots"
  - "lemon zest"
  # The flesh is in the name because it is what makes this not a twist.
  - "lime zest with flesh"
  - "mint"
  - "basil"
  - "rosemary"
  - "fruit purée"
  # Muddled as ingredients, not garnishes. A muddled slice names its fruit
  # (#1079): citrus fruits are not interchangeable.
  - "maraschino cherry"
  - "orange slice"
  # `kaffir lime leaves` is not a variety of `lime`: the leaf is an aromatic,
  # and excluding one must not drop drinks built on the other.
  - "cucumber"
  - "kaffir lime leaves"

other:
  - "soda water"
  # Its own thing, not a ginger syrup or liqueur. A top, like `soda water`.
  - "ginger beer"
  # Measured, not a top, so it shelves in the larder.
  - "coconut water"
  - "birch water"
  - "natural yoghurt"
  - "water"
  - "black tea"
  - "espresso"
  - "cola"
  - "coconut cream"
  # A made mix: Coco Lopez (sweetened cream of coconut) loosened with coconut
  # milk, three to one. Not `coconut cream`, the unsweetened tin. How it is
  # made is a note on the drink (DECISIONS §9.3.1), and every drink that asks
  # for it reuses this line word for word:
  #     - amount: "<n> ml"
  #       generic: "Coco mix"
  #       note: "3:1 Coco Lopez to coconut milk."
  - "Coco mix"
  - "egg white"
  - "orange flower water"
  - "vanilla extract"
  - "salt"
  # Sprinkled onto a flame, so an ingredient with the amount `(sprinkle)` and
  # not a garnish. Filed as `salt` is: the larder shelf and `not_on_cards`.
  - "ground cinnamon"
  - "cider vinegar"
  # A measured ingredient, not a garnish: `other` holds what is neither juice,
  # syrup nor alcohol.
  - "olive oil"
  # With `coconut cream`, what `mood_ingredients.rich` in taxonomy.yml is made
  # of. `egg white` is not a substitute: it gives foam, not richness.
  - "cream"
  - "milk"
  - "whole egg"

