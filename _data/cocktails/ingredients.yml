# Bases with NO family, deliberately. Same idea as
# tests/test_reference_data.py's NO_TEMPERATURE_BECAUSE: a decision with its
# reason attached, so "why is this not groupable?" is answered in the repo
# rather than in someone's memory.
family_less:
  "Ceylon arrack": >-
    Coconut flower sap, sharing only a name with Batavia arrack. Used once, in
    Arrack Christmas Punch, where rum dominates by volume. Helen, 2026-08-17:
    "no idea what to do about Ceylon arrack, but I don't recall a drink where
    it's the star so maybe unimportant."
  "absinthe": >-
    Used in dashes and rinses throughout this collection, never as a base. If a
    drink ever builds on it, give absinthe a family then.
  "pastis": >-
    Same role as absinthe above -- Swizzle uses 6 drops of Pernod or absinthe,
    never as a base. Same reasoning: give it a family if a drink ever builds
    on it.

# =============================================================================
# RETIRED -- removed actively, not merely deprecated
# =============================================================================
# Same treatment _data/food/taxonomy.yml gives retired_star_ingredients, and
# for the same reason: a value that used to mean something silently blends into
# the "not declared" pile unless something names it.
#
# EVERY `retired_*` MAPPING IN THIS FILE IS READ, not just the rum one.
# tests/test_cocktails.py used to name `retired_rum_styles` literally, so this
# second block would have been invisible to it and a drink still saying
# `flavoured` would have failed as "undeclared generic" -- exactly the silent
# blending-in that these blocks exist to prevent, arriving through the test
# rather than the data. The tests now derive the set from the `retired_`
# prefix, the same way `_declared_generics` derives from the file's shape.
retired_rum_styles:
  "Planteray Stiggins' Fancy": >-
    was permitted as a generic because nothing generalised it. Something does:
    `pineapple rum`. The bottle is a `suggestion` now -- #314's amendment,
    Helen 2026-08-29.
  "Planteray O.F.T.D. Overproof": >-
    as Stiggins'. Now `blended overproof rum`, which is what it IS: Guyana,
    Jamaica and Barbados at 69%.
  "Malibu": >-
    as Stiggins'. Now `coconut rum` -- and both drinks using it already said
    "Coconut rum" in their `item`, so the data had answered this before the
    vocabulary did. Helen: "to me coconut rum means Malibu for now."
  light: >-
    describes colour, not production, and colour is routinely adjusted with
    caramel. Re-type against rum_styles — issue #314.
  gold: >-
    same reason as `light`. Almost always either "lightly aged and filtered rum"
    or "moderately aged rum"; which one is Helen's call per drink.
  dark: >-
    same reason again, and the most misleading of the three: a dark rum may be
    Jamaican caramel-forward, Demerara aged, or a blackstrap. Issue #314.
  blackstrap: >-
    NOT retired as a word -- MOVED, from `generic` to `character`. Helen,
    #314, 2026-08-24: "blackstrap is only ever given as a character for
    another rum, like this: Moderately aged (character: blackstrap)". So the
    rum still needs a real style of its own, and blackstrap rides alongside
    it. Don's Own Grog and Georgetown Punch already have this shape.

retired_honeys:
  "honey water": >-
    the ratio is now always stated, as it always was for sugar syrup. A bare
    `honey water` cannot say whether it is used at 22.5 ml or 15 ml for the
    same sweetness. Re-type as `honey water 1:1` or `honey water 2:1`. Helen,
    2026-08-26.
  "Honey water 2:1": >-
    capitalisation only -- it is `honey water 2:1` now, matching `sugar syrup
    2:1` and every other lowercase commodity in this file. It sat two lines
    below a lowercase `honey water` meaning very nearly the same thing, and
    test_no_two_generics_differ_only_by_case_or_accent could not see the
    collision because the `2:1` made them differ by more than case.
  "acacia honey": >-
    a varietal, not a category. Folded into `honey`, with acacia carried as a
    `suggestion` -- the file's own rule that a preferred bottle is a
    suggestion and never a generic. Helen, 2026-08-26.

# Renamed 2026-08-27 for correctness (Helen: "apply correctness rather than the
# fudge of dropping the word"). All three were used by ZERO drinks, so nothing
# broke and nothing here will ever fire -- kept anyway, because a name that used
# to mean something must not blend into the not-declared pile, and the next
# reader should find out these were renamed rather than invented.
retired_whisky_styles:
  "peated Scotch": >-
    peat is ORTHOGONAL to single-malt-versus-blended -- a peated single malt is
    both -- so it was one field carrying two facts. It is a `character` now,
    beside a real style, exactly as blackstrap is for rum (#441, #314). Both
    drinks that used it proved the point: their items read "Peated single malt
    whisky" and "Peated Scotch whisky".
  "blended Scotch": >-
    said neither whisky nor whiskey. Scotch takes WHISKY. Now `blended scotch
    whisky`, lowercase for the same reason cognac and champagne are.
  "Irish": >-
    a demonym on its own is not an ingredient. Now `Irish whiskey` -- Irish
    takes the E.
  "Japanese": >-
    same as `Irish`. Now `Japanese whisky` -- Japanese takes no E.

retired_gin_styles:
  flavoured: >-
    covered everything from sloe to rhubarb to cucumber, which are not
    substitutable for each other, so as a filter button it read simply
    "flavoured" and told you nothing. Replaced by `speciality`, which carries a
    `character` naming the actual botanical. Helen, 2026-08-26.
