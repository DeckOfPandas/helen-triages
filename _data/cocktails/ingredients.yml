# That is this file's own two-layer rule, applied by her rather than to her: the
# GENERIC is the precise thing a recipe says, and the roll-up belongs in
# `family`, which is "for SEARCH and EXCLUSION only, never a browse axis". The
# family already exists and is `fortified`. So the abstraction she declined to
# write is available to exclude by and appears on no recipe line, and nothing
# needed building.
