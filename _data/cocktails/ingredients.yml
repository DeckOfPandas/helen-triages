# Own generics, family = `herbal`. Chartreuse is the BASE of Chartreuse
# Swizzle, which is why these are not filed as mere modifiers.
#
# THE FRENCH NAMES, AND THIS IS THE SECOND TIME THE DECISION HAS BEEN MADE.
# Helen, 2026-08-29, on seeing `green chartreuse` in the picker: "an earlier
# Claude and I agreed that names were chartreuse verte and jaune". The agreement
# was real and was written down NOWHERE -- not here, not in the handover, not in
# either repo's history, checked before asking her to repeat herself. So it was
# made, never applied, and had no way of surviving the session it happened in.
# That is HANDOVER §11.2's failure in its purest form, and the note is the fix:
# a decision that lives only in a conversation gets made again.
#
# They are what the bottles say on their labels. `Chartreuse Verte` also stops
# the colour reading as a modifier of a generic "chartreuse" -- these are two
# different liqueurs, not one in two shades, which is the same distinction #314
# drew for the rums.
herbal_liqueurs:
  - "Chartreuse Verte"
  - "Chartreuse Jaune"
  - "Bénédictine"
  - "Galliano"
  - "Strega"
  - "Jägermeister"
  - "liqueur de sapin"
  - "Swedish flaggpunsch"
  # P-Five Punch pours two ounces of it, which is too much of the drink to
  # leave as a QQ. Helen, 2026-08-31, worried that filing it here would read as
  # a claim it swaps for the rest: "'Herbal liqueur (Becherovka)' would be
  # misleading. This will come up over and over."
  #
  # IT NEVER RENDERS THAT WAY, AND THAT IS WHAT THIS GROUP IS FOR. Every member
  # above is already a proper noun, for exactly her reason -- nothing
  # generalises them and none is substitutable for another. So the group is a
  # filing drawer, not a category a drink is described by: a recipe line shows
  # the GENERIC, which is `Becherovka`. `herbal` is the family, and a family is
  # only ever a search and exclusion roll-up, never a browse axis. Same shape as
  # the amari, where Campari, Aperol, Cynar and fernet are four generics rather
  # than one "amaro" for precisely this reason.
  #
  # WHERE HER ACTUAL FACT GOES. "I'd reach for Becherovka if a recipe wanted
  # something cinnamon- or ginger-forward" is a statement about a drink's use of
  # a bottle, not about the bottle in the abstract -- so it is a per-ingredient
  # `note` on the drink that wants it, which is what #457 built that key for.
  - "Becherovka"

