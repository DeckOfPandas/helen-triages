# =============================================================================
# COCKTAIL INGREDIENT VOCABULARY. Spec: GitHub issue #322. Rum half: #314.
# Index design that consumes this: #292.
# =============================================================================
# TWO LAYERS, AND THE DISTINCTION IS THE WHOLE DESIGN.
#
#   `generic`  the precise ingredient category, on each `ingredients:` entry.
#              Campari, Aperol, Cynar and Fernet are FOUR generics -- they
#              taste nothing alike and are not substitutable.
#   `family`   the roll-up, for SEARCH and EXCLUSION only. All four are
#              `amaro`. See the families block below for why this is not a
#              browse axis.
#
# ONLY BASES HAVE A FAMILY. `lime juice` has none and should not -- nobody
# excludes "all juices". `family_of` maps the bases and nothing else, and
# `family_less` records the bases that deliberately have none.
#
# `generic` IS STORED, NEVER DERIVED. 61 distinct ingredients in this
# collection are named only by brand -- Campari, Cointreau, Cynar, Kahlua,
# Carpano Antica, Rittenhouse, Roots Mastiha, Swedish Flaggpunsch -- affecting
# 56 of the 109 drinks that have ingredients. No rule gets "rye whiskey" out of
# "Ritthenhouse".
#
# A PREFERRED BOTTLE IS A `suggestion`, NEVER A `generic`. Helen, 2026-08-17,
# on Cherry Heering: "I'd note my preference as the example not the category."
# So Velvet Falernum -> falernum, Luxardo -> maraschino liqueur, Carpano Antica
# -> sweet vermouth, with the bottle in `suggestion`.
#
# THE EXCEPTION, AND THE TEST FOR IT: "IS THERE A CATEGORY NAME THAT WOULD HELP
# HELEN CHOOSE?" If yes, name the category and the bottle is a `suggestion`. If
# no, THE BOTTLE IS THE CATEGORY and that is correct, not a compromise.
#
#   Créole Shrubb, Campari, Chartreuse Verte, Strega, Bénédictine -- all stay as
#   they are. Helen, 2026-09-05: Créole Shrubb "should appear on lists with gin
#   and cognac -- it's not replaceable, and calling it a type of rhum agricole
#   isn't at all useful". A category name nobody would reach for is not a
#   category, it is a paraphrase.
#
#   `pineapple rum`, `coconut rum` and `blended overproof rum` went the other
#   way, because a useful name DID exist for each -- #314's 2026-08-29
#   amendment. Their bottles (Stiggins' Fancy, Malibu, O.F.T.D.) are
#   `suggestion`s now and are in `retired_rum_styles` below.
#
# This is taxonomy.yml's governing principle applied to the vocabulary: does it
# get Helen closer to the drink she wants, or is it knowledge for its own sake.
#
# WRITTEN DOWN 2026-09-05 BECAUSE THE ABSENCE COST REAL TIME. Until today these
# three lines named "planteray stiggins' fancy, planteray o.f.t.d. overproof,
# malibu, blackstrap" as the only permitted brand-generics -- a list retired on
# 2026-08-29 and recorded as retired 1,470 lines below, in this same file. The
# header and the data disagreed for a week, and an audit read the header first
# and reported Créole Shrubb as a rule violation on the strength of it. Helen,
# on the wider pattern: "some of this has gone round and round and round." A
# rule stated once and never restated is how that happens; the fix is that the
# rule now describes a TEST rather than enumerating a list, so it cannot go
# stale the next time a bottle changes sides.
# =============================================================================

# --- how an `amount` becomes a number ----------------------------------------
# THIS REPLACES THE `ml:` KEY, WHICH IS GONE -- #571, 2026-08-30. Every
# ingredient used to carry its quantity twice: `amount: "25 ml"` beside
# `ml: 25`. Helen: "Food YAML has this structure, and I'd like cocktails to
# match" -- one quantity field, a display string, as a food recipe has.
#
# MEASURED BEFORE DELETING, because the pair was justified (HANDOVER 9.3) on
# the grounds that "the string carries units a number cannot". True of
# "0.5 oz" and "3 dashes". False of "25 ml", which was 376 of the 619 entries.
# Across the whole collection 521 entries carried both and ALL 521 derive
# exactly from the table below; the other 98 are non-volumetric and not one of
# them carried an `ml` at all. So the data already obeyed this rule and was
# writing the answer down anyway.
#
# WHAT `ml:` WAS ACTUALLY BUYING was not the number but the GUARANTEE that a
# number exists -- which #545 (scaler), #294/#297 (units of alcohol) and #547
# (cost) all need. A hand-maintained duplicate cannot promise that: it can
# simply be absent, and it was, on all 19 unitless amounts. The guarantee lives
# in `test_every_amount_is_readable_as_a_quantity` now, which is stronger,
# because it fails on an amount nothing can read rather than shrugging.
#
# THE CONVERSIONS ARE A DECISION, NOT ARITHMETIC. 1 oz is 30 ml here and not
# 29.5735 -- bar-standard rounding, which keeps ratios clean. Recorded in
# HANDOVER 9.4 as a decision and written down nowhere executable until now.
measures:
  per_ml:
    ml: 1
    cl: 10
    oz: 30
    tsp: 5

  # Units that count or weigh something, never a volume. An amount in one of
  # these has no millilitre figure and is not missing one -- HANDOVER 9.3: "a
  # dash is not 0.8 ml in any way worth writing down". A consumer checks
  # whether a figure came back rather than assuming one did.
  non_volumetric:
    - dash
    - dashes
    - drop
    - drops
    - cube
    - cubes
    - pinch
    # `1 small pinch`, on man-o-war's salt. Declared beside `pinch` rather than
    # collapsed into it because the drink says small and the amount is the only
    # field that can carry it -- the `item` that used to say "Tiny pinch of
    # salt" was deleted the same day for restating the quantity.
    - small pinch
    - each
    - leaf
    - leaves
    - sprig
    - strip
    - g

    # HALF A LIME -- Helen's ruling, 2026-09-04, on caipirinha's `amount: "0.5"`
    # and its QQ note: yes to `amount: "half"`, with `half` and `whole` as
    # units. A WHOLE FRUIT IS COUNTED, NEVER MEASURED. The drink says half a
    # lime because that is what you pick up and cut, not because anyone has
    # decided it is 12 ml of anything -- and the juice a lime gives is a range
    # (`juice_yields` below says 20-30 ml), so a millilitre figure here would be
    # inventing precision the fruit does not have.
    #
    # `half` IS A UNIT WITH NO NUMBER IN FRONT OF IT, which is why it is
    # declared rather than written `0.5 whole`: it reads by the same path `to
    # top` and `to rinse` read by (a whole-string lookup in this list), and
    # "half" is the word Helen writes. `whole` is its partner for the counts the
    # scaler produces from it -- half a lime doubled is `1 whole` -- and for the
    # day a drink wants a whole one to start with.
    - half
    - whole

    # ACTIONS, NOT COUNTS -- Helen's ruling, 2026-09-02. Every ingredient has an
    # amount, and for an ingredient the method ADDS rather than measures, the
    # amount is a verb phrase: the list reads "champagne, to top" and "absinthe,
    # to rinse". Eleven entries carried no `amount` at all before this and no
    # test noticed.
    #
    # THEY ARE DECLARED HERE AND NOWHERE ELSE, which is the point. A unit is
    # readable because `measures:` says so -- that is the bargain
    # test_every_amount_is_readable_as_a_quantity strikes with every other unit
    # in this block, and special-casing two strings inside the test would have
    # put the vocabulary in the guard instead of in the data.
    #
    # The matching method step is what actually pours it: `Top with champagne.`
    # / `Top with soda water.` / `Rinse the glass with absinthe and dump.` in
    # methods.yml. The amount says how much (all of it, none of it), the step
    # says when.
    - to top
    - to rinse

  # Words that may sit between the number and its unit without changing either.
  # One entry, and it is real: "1 heaping oz" on Kill Devil Punch.
  ignored_words:
    - heaping

# --- how much juice one fruit gives ------------------------------------------
# GitHub issue #546's shopping list. Helen, 2026-09-04: "Lemons give about 30-45
# ml of juice. Limes 20-30 ml. Medium oranges about 60-80 ml. Grapefruit 180-240
# ml. Please give the range of whole fruits needed."
#
# A RANGE, NOT AN AVERAGE, and that is the whole point of the feature. A single
# figure would print "375 ml lemon juice (10 lemons)" and be wrong in the shop
# roughly half the time. The honest answer to "how many lemons" is a span,
# because a lemon is not a unit of volume, and the list says so: "375 ml lemon
# juice (9 to 13 lemons)".
#
# THE ARITHMETIC RUNS THE OTHER WAY ROUND FROM THE INSTINCT: the FEWEST fruits
# is the total divided by the LARGEST yield, and the most is the total divided
# by the smallest. Both are rounded UP -- three quarters of a lemon is a lemon
# you have to have bought.
#
# ONLY THE FOUR THAT ARE SQUEEZED. `juices:` below also lists pineapple,
# cranberry and apple, and they are absent on purpose rather than forgotten:
# those arrive in a carton, so "how many whole fruits" is not a question anyone
# is asking in the shop. An entry here is a claim that you juice this yourself.
#
# The KEY is the generic exactly as a drink writes it, so nothing has to map
# between two spellings -- all four are single, settled strings across the
# collection (58 lime, 34 lemon, 10 orange, 6 grapefruit).
juice_yields:
  lemon juice:
    fruit: lemon
    ml_min: 30
    ml_max: 45
  lime juice:
    fruit: lime
    ml_min: 20
    ml_max: 30
  # "Medium oranges", Helen's word, and the size that matters: a large one is
  # nearer a small grapefruit and would make this range a fiction.
  orange juice:
    fruit: orange
    ml_min: 60
    ml_max: 80
  grapefruit juice:
    fruit: grapefruit
    ml_min: 180
    ml_max: 240

# --- what the index's ingredient pickers do with all this --------------------
# THREE NUMBERS, HERE RATHER THAN IN THE SCRIPT, and for the reason food's
# `search: family_button_min_chars` is in _data/food/ingredient_words.yml: how
# much typing earns a pool of candidates is a question about this vocabulary,
# not about the algorithm that reads it. assets/js/cocktail-search.js writes
# none of them down and test_the_cocktail_search_config_is_not_hardcoded keeps
# it that way.
#
# `min_query_chars` WAS ISSUE #584, and it is 3 as of 2026-08-31 on Helen's
# instruction to settle it. It sat at 2 only because that is what the page did
# before the search moved into a tested module, which was the right reason then
# and stopped being one once the numbers existed.
#
# RE-MEASURED THE DAY IT CHANGED, because the figures in #584 were taken over
# 240 pool terms and #603 has since dropped prose and collapsed aliases -- so
# the issue's own evidence was two changes stale. Swept over every prefix the
# chips' own words actually produce, across 150 chips and 124 drinks:
#
#            queries   median candidates   over the cap of 8
#   2 chars    132            6             41  (31%)
#   3 chars    250            2              7  (3%)
#   4 chars    257            1              2  (1%)
#
# THE MEASUREMENT HAS TO LIFT THE MINIMUM IT IS MEASURING. Run with the live
# config, the two-character row reports a tidy zero candidates -- because the
# change under test is what produced it. That is a check measuring itself, and
# it read as a clean result.
#
# AT TWO CHARACTERS THE PICKER IS MOSTLY A PROMISE THAT THERE IS MORE: more
# than a quarter of two-letter queries overflow the cap, so what you get is
# eight arbitrary chips and "+21 more -- keep typing". At three it is nearly
# always the answer. The step from 3 to 4 buys 2% and costs a keystroke on
# every search, so it is not taken.
#
# FOOD HAS NO MINIMUM AT ALL and that stays true: its picker sits above a list
# that remains on screen, so a wide pool is noise beside the answer rather than
# instead of it. This one replaces the page's whole result area.
#
# Changing it needs no code touched, and `test_the_cocktail_search_config_is_
# not_hardcoded` keeps it that way.
#
# `pool_cap` is how many candidates are shown at once. The remainder is always
# COUNTED and said out loud ("+16 more -- keep typing"), never silently
# dropped: a pool that stops at eight looks like a complete answer, and the one
# you wanted may be the ninth.
search:
  min_query_chars: 3
  family_button_min_chars: 3
  pool_cap: 8

  # --- PROSE IS NOT A BOTTLE NAME -------------------------------------------
  # A `suggestion` is free text typed while transcribing a recipe, and some of
  # it is a sentence rather than a bottle. As a filter chip a sentence means
  # nothing -- clicking `ED3 or Havana 3` asks for drinks whose ingredient list
  # contains that literal string.
  #
  # WHY A RULE AND NOT A LIST. Helen met four of these one at a time -- the
  # Havana disjunction, `Tesco Finest`, `Avallen -- a round, fresh taste if you
  # need to sub`, then `Jack Daniels > Bulleit` -- and naming them one by one is
  # how the fifth arrives. #585 is still the backlog of FIXING the data; this is
  # what keeps them out of the picker meanwhile.
  #
  # MEASURED AGAINST ALL 87 SUGGESTIONS BEFORE IT WAS TRUSTED, 2026-08-29: it
  # flags 17, every one of them genuinely prose, and catches no bottle name. The
  # clean 70 include every awkward shape the collection has -- `Smith & Cross`,
  # `Gosling's Black Seal`, `Appleton 8-year`, `La Favourite L'Authentique
  # Ambré`, `Pierre Ferrand ambre`, `acacia honey`.
  #
  # THESE APPLY TO SUGGESTIONS ONLY. A declared generic is a name Helen chose
  # and is never dropped, which is why `ginger and lemongrass cordial` survives
  # -- and it is why `and` is deliberately absent below, since `Wray and Nephew`
  # is one bottle.
  #
  # `the` AND `that` WERE IN A FIRST DRAFT AND CAME OUT: a bottle can carry them
  # ("The Botanist") and neither flagged anything.
  prose_words:
    - a
    - an
    - or
    - if
    - you
    - your
    - need
    - needs
    - best
    - better
    - prefer
    - other
    - instead
    - sub
    - fine
    - use
    - using
    - when
    - with
    - for
    - unless
    - though
    - is

  # A comma catches the three two-bottles-in-one-string entries (`Havana 7,
  # Appleton 8`) and nothing else in the real 87 -- checked, not assumed. `>`
  # catches `Jack Daniels > Bulleit`, which was a shape nobody had predicted.
  # The failure mode if a bottle ever legitimately carries one is mild and
  # visible: it is not offered as a chip, and it is one line to fix here.
  prose_marks: ["--", "—", "?", "!", ">", ","]

# --- things a card never mentions --------------------------------------------
# #580. Helen: "never write 'water' on a cocktail card and never return it in a
# search. This is bare 'water', and does not apply to 'honey water' or
# 'sparkling water' or any such thing."
#
# A card answers "what is this drink LIKE", and the answer is never water. It is
# on the recipe because 60 ml of it is how a Sazerac gets diluted, and that is a
# MAKING fact -- the same distinction §9.10.1 draws when it collapses both syrup
# ratios to `sugar syrup`: a ratio matters while you pour and not while you
# choose. Water is that argument at its limit.
#
# EXACT MATCHES ONLY, and that is the whole of Helen's caveat. `soda water` is
# a real choosing fact -- it is what makes a drink long -- so nothing here may
# be treated as a substring. The picker was matching `water` against `honey
# water` by substring until 2026-08-29 and the fix for THAT is upstream in
# cocktail-search.js; this list is a different rule and must not lean on the old
# bug's shape. (`honey water` was the other example until 2026-09-04, when
# Helen flattened both ratios into `honey water`; the rule it illustrated is
# unchanged, and `soda water` still illustrates it.)
#
# ONE ENTRY TODAY, and a list rather than a special case in the template because
# the next one will not be water: `ice` is the obvious candidate the day a drink
# writes it down.
not_on_cards:
  - water

# --- other names for a family ------------------------------------------------
# A FAMILY IS REACHED BY ITS NAME, so a family nobody spells that way is a
# family nobody can reach. Helen, 2026-08-29: "'whiskey (all)' should return all
# whisky and bourbon and rye, and the same for 'whisky'." The family already
# HELD all three; it was the spelling that found nothing.
#
# The button always carries the family's CANONICAL name, so typing `scotch`
# offers `whisky (all)` rather than a second umbrella claiming to be scotch.
# That matters most for the one alias that is genuinely wider than the word
# typed: `whisky (all)` includes bourbon and rye, and saying `whisky` on the
# button is what stops it looking like a scotch filter that has gone wrong.
# Helen was shown that trade and asked for it anyway.
#
# `agave` is the family that most needed this: it is named after the plant
# because it holds mezcal as well, so nobody types it. `rhum` and `ron` are the
# spellings that appear in our own ingredient names -- `rhum agricole blanc`,
# `Ron del Barrito`.
#
# NOT A SYNONYM LAYER FOR INGREDIENTS. These name FAMILIES and nothing else; an
# ingredient reached by two names is a `card_names` question, below.
family_aliases:
  whiskey: whisky
  scotch: whisky
  tequila: agave
  rhum: rum
  ron: rum
  # `bitter` AND `amari` REACH THE AMARO FAMILY, added 2026-08-30. Nobody
  # browsing for a bitter drink types "amaro" first, and the family held
  # Campari, Aperol, Cynar, fernet and both Amari while the word found nothing
  # -- precisely the failure that put `whiskey` and `scotch` in this list.
  #
  # This is what was left of a proposal to add `bitter` as a MOOD. Helen:
  # "do we need families -- thinking of bitter and herbal? Why? They're not
  # browsable or searchable." She was right twice over: `amaro` and `herbal`
  # already exist as families, so there was nothing to build, and a mood that
  # means "contains one of these bottles" is a worse copy of HAS TO HAVE. What
  # was genuinely missing was two words.
  bitter: amaro
  amari: amaro

# --- what the (all) button SAYS ----------------------------------------------
# Helen, 2026-08-29, on the whisky umbrella: "I think that chip should be
# 'whisk(e)y (all)', even though it's clunky, to avoid ever having to split or
# claim they combine."
#
# The clunkiness IS the point. Either spelling on the button is a claim about
# which drinks are in it -- `whisky (all)` reads as excluding the Irish and the
# bourbon, `whiskey (all)` as excluding the scotch -- and the family holds all
# of them. A name that refuses to choose is the only one that describes it.
#
# A LABEL, NOT A RENAME OF THE FAMILY, and the reason is mechanical rather than
# aesthetic: `whisky_characters` is keyed off the family's name --
# test_a_declared_character_vocabulary_is_enforced strips the `_characters`
# suffix to find it -- so renaming the family would drag `whisk(e)y_characters`
# along with it and put parentheses into a key three tests derive by string
# surgery. Same separation `card_names` already draws for generics: matching
# runs on the key, the button shows the name.
#
# A family with no entry here keeps its own name, which is right for all nine
# others: nobody spells `gin` two ways.
family_labels:
  whisky: "whisk(e)y"

# --- spirit families: FOR SEARCH AND EXCLUSION, NOT A BROWSE AXIS ------------
# THIS IS NOT A "SORTED BY SPIRIT" MENU, and that is deliberate. Helen,
# 2026-08-17: "I get really bored of cocktail bars that have enormous
# bible-like menus sorted by spirit... I probably think browsing by spirit is
# basic." Do not put a spirit filter on the index.
#
# The families exist to serve two things in her actual index design:
#   1. the ingredient search's `(all)` buttons -- typing toward "rum" offers
#      "rum (all)" alongside "Havana Club Anejo 3 Anos", the same shape food's
#      ingredient search already has;
#   2. exclusion. "I don't like Scotch" is a family-level operation, and so is
#      "no whisky tonight".
#
# FOOD'S FAMILY MECHANISM CANNOT DERIVE THESE. On the food site an `(all)`
# button forms when entries share a head word after normalisation -- "cheese
# (all)" from cheddar/feta/comte. These styles share NO common word:
# "moderately aged Jamaican rum" and "aged Demerara rum" have nothing in common
# textually. So the family has to be DECLARED, which is what `family_of` is.
#
# `fortified` exists because 19 drinks have no spirit at all -- Bamboo,
# Brooklyn, Toronto, Aperol Spritz, Lucien Gaudin, the Bellini, mulled wine --
# and without it they cannot be excluded or searched as a group. `herbal`
# exists because Chartreuse is the BASE of Chartreuse Swizzle, not merely a
# modifier in it.
families:
  - rum
  - gin
  - whisky
  - brandy
  - agave
  - vodka
  - amaro
  - fortified
  - aquavit
  - herbal

# =============================================================================
# BASE SPIRITS -- one style list per family, the pattern #314 set for rum
# =============================================================================
# Styles Helen does not currently own are declared anyway. This is a spec, not
# an inventory: she chose that explicitly for gin, where Plymouth, New Western
# and Genever are all absent from the collection.

# --- generics only Helen may put on a drink ----------------------------------
# A DECLARED STYLE WITH NO USER IS NOT A GAP TO FILL. These are real categories
# with real bottles behind them, and applying one to a drink is her judgement
# about what she reaches for -- never an inference from what the source
# happened to call the rum.
#
# THIS EXISTS BECAUSE IT HAPPENED TWICE AND SHE SAID SO TWICE. #542, and
# Helen on 2026-08-30: "I remain annoyed about this. I have discussed this at
# least twice... If I have to deal with this again I will simply delete those
# recipes." That issue diagnosed its own invisibility exactly -- "a
# wrong-but-declared value with no contradicting evidence is invisible to every
# guard in the suite" -- and then nothing was built, so the next session had
# nothing to stop it.
#
# It is the repo's own repeated conclusion, from the two hooks in .claude/ and
# from `meta.awaiting_fix` and `meta.proofread` before them: a rule that gets
# read and broken needs a mechanism, not firmer wording. Adding a line here is
# what switches enforcement on -- test_no_drink_uses_a_generic_that_is_helens
# _to_apply -- and REMOVING one is how she grants it, in the same commit as
# the drink that earns it.
hers_to_apply:
  "caramel-forward Jamaican rum": >-
    Blackwell and Myers are declared bottles for this style and no drink uses
    it. Helen has said twice that she never reaches for Blackwell in the
    drinks it kept being applied to; a session put cobra-effect into it from
    item text anyway, and she reverted that on 2026-08-30, ruling the drink
    `moderately aged Jamaican rum` with no suggestion at all. HANDOVER 9.3.2
    already said "it is hers to apply: never retype a drink into it from item
    text", in prose, and prose did not hold.

# GitHub issue #314. `light`, `gold` and `dark` are RETIRED -- see the bottom.
rum_styles:
  - "moderately aged Jamaican rum"
  - "caramel-forward Jamaican rum"
  - "lightly aged and filtered rum"
  - "moderately aged rum"
  - "aged Demerara rum"
  - "overproof Demerara rum"
  - "unaged overproof Jamaican rum"
  - "rhum agricole blanc"
  - "rhum agricole vieux"
  # Added to #314 after the first transcription. Haitian cane-juice spirit; a
  # category like cachaca or mezcal, so lowercase under the proper-noun rule.
  - "clairin"
  - "clear blended multi-region rum"
  # #314's amendment, 2026-08-29 -- were brand-generics in `rum_untyped`.
  # `blended overproof rum` is Guyana/Jamaica/Barbados at 69%, and it also gives
  # Pusser's 151 the home `moderately aged rum` could not: that generic says
  # nothing about strength.
  - "pineapple rum"
  - "blended overproof rum"
  - "coconut rum"

# Permitted WITHOUT a style per #314, because nothing generalises them.
#
# BLACKSTRAP USED TO BE HERE AND IS NOT ANY MORE. Helen closed the question on
# #314, 2026-08-24: "blackstrap is only ever given as a character for another
# rum, like this: Moderately aged (character: blackstrap)". It is in
# rum_characters below, in retired_rum_styles at the bottom, and nowhere else.
# RETIRED AS A GROUP, 2026-08-29 -- #314's amendment. The premise was "nothing
# generalises them"; all three have now been generalised, so the exception has
# lost its reason and the bottles go back to being `suggestion`s, which is this
# file's primary rule. `pineapple rum`, `blended overproof rum` and `coconut rum`
# are in rum_styles. Kept as an empty declaration rather than deleted, so the
# next reader finds out the group existed and why it went.
rum_untyped: []

# CHARACTER: a separate, optional field, not `generic`. Some rums have a
# `generic` style (or none decided yet) but also carry a distinctive flavour
# marker worth recording on its own -- e.g. Ron del Barrito is "moderately
# aged" generically, but its defining trait is a sherry-cask, Spanish-style
# tradition rather than a Jamaican or Demerara profile.
#
# THESE ARE NOT GENERICS AND MUST NEVER BE USED AS ONE. This list read as a
# declared generic vocabulary until 2026-08-26, because tests/test_cocktails.py
# derives the permitted generics from every top-level LIST in this file and
# excluded only `families`. So `sherry` and `Spanish-style` silently passed as
# generics on any ingredient, and Helen's #314 decision below could not be
# enforced at all -- dropping `blackstrap` from rum_untyped would have changed
# nothing while this list still declared it. `NOT_GENERIC_LISTS` now names this
# group too. The whole point of #441 was to separate these two fields; the
# guard was quietly merging them back.
rum_characters:
  - "blackstrap"
  - "sherry"
  - "Spanish-style"

# PEAT IS A CHARACTER, NOT A STYLE -- Helen, 2026-08-27, working it out aloud:
# "so single malt whisky, character: peated ???" Yes, and for the reason #441
# settled for blackstrap: peat is ORTHOGONAL to single-malt-versus-blended, so a
# peated single malt is both and one field cannot hold it.
#
# The collection was already straining against this. The two drinks typed
# `peated Scotch` have items reading "Peated single malt whisky" and "Peated
# Scotch whisky" -- one of them was saying style and character through the same
# slot because there was nowhere else to put the second half.
#
# CLOSED VOCABULARY, LIKE RUM'S AND UNLIKE GIN'S. Helen's call, 2026-08-26: a
# rum's character comes from a handful of production traits and closes into a
# list, while a gin's is whatever went in the still. Whisky is rum-shaped --
# peat, sherry cask, bonded -- so it gets a list and a guard.
#
# `peated Scotch` IS STILL IN whisky_styles and is not retired yet: two drinks
# use it, and retyping them needs the drafts repo. Retire it in the same pass
# that retypes them, not before.
whisky_characters:
  - "peated"

# THE CARD NAME FOR EACH RUM CATEGORY. Issue #501, Helen 2026-08-27: "set a
# display name for each rum category, to be used as a short name on cocktail
# cards. The recipe page can then display the full category name."
#
# ONE SURFACE READS THIS MAP, AND IT IS THE CARD -- `cocktails/index.html`.
# `_layouts/cocktail.html` prints `generic` VERBATIM and does not look anything
# up here, which is Helen's second sentence above and her ruling again on
# 2026-09-04: "Let's display the full name in the ingredients list please, just
# the short name on the card." So a drink page reads `cane sugar syrup 2:1` and
# `honey water 2:1` while its card reads `sugar syrup` and `honey water`. That
# split is what makes a long, precise generic free: the ratio and the sugar are
# on the page where you are POURING, and off the card where you are CHOOSING.
#
# WHAT THIS REPLACES IS NOT A LONG NAME, IT IS AN AMBIGUOUS ONE. The card used
# to render `item` -- the source's own words -- and eight of those strings each
# named two or three DIFFERENT rums across the collection:
#
#   `Overproof Navy rum`  -> Demerara aged / Jamaican moderately aged / O.F.T.D.
#   `Light aged rum`      -> Demerara aged / blended clear / lightly aged filtered
#   `Demerara rum`        -> Demerara aged / Demerara overproof
#   `White rum`           -> agricole unaged / lightly aged and filtered
#   `Gold rum`, `Navy rum`, `Light rum`, `Lightly aged rum` -> two each
#
# So the colour words #314 retired were not merely unfashionable on the index,
# they were the one thing on the card that could not be trusted. Measured, not
# assumed: the substitution also SHORTENS the card line in every case (median
# 98 -> 92 chars, Caribbean Sazerac -87, Mai Tai -69, worst case -1).
#
# THE NAMES MUST STAY DISTINCT FROM EACH OTHER, which is the whole point and is
# what test_rum_card_names_are_distinct enforces. Two rums reading the same on a
# card would rebuild the exact fault this map exists to fix -- UNLESS the
# collapse is deliberate, in which case it goes in
# `card_names_may_collide` below with its reason, the same shape
# `family_less` uses. No drink in the collection shows the same card name twice
# either way, which test_no_drink_shows_the_same_card_name_twice holds
# separately: that is the failure a reader would actually SEE.
#
# EVERY RUM-FAMILY GENERIC HAS ONE, including the four that need no shortening
# (clairin, Malibu, cachaça, Batavia arrack) and the three brand-generics. The
# map is complete rather than exceptional so the card rule is "substitute when
# the generic has a card name", with no second question about which rums count.
#
# RUM ONLY, deliberately. Four non-rum generics are also over twenty characters
# (`Full-strength clear fruit brandy`, `ginger and lemongrass cordial`,
# `Lavender-forward bitters`, `passion fruit liqueur`) and none of them is
# AMBIGUOUS on a card, which is the problem this solves. Extend it when one is.
#
# HELEN'S NAMES, 2026-08-27, tweaked from a first cut. Her edits went one way:
# the spirit word is SAID rather than implied wherever the style name alone
# would not read as a rum -- `filtered rum` became `lightly aged rum`,
# `clear blend` became `clear blended rum`, and both overproofs gained a
# trailing "rum". Two of them are consequently LONGER than the generic they
# stand for, which is fine: this map's job is a name you can read at card
# distance, and brevity was only ever the means.
card_names:
  "moderately aged Jamaican rum": "Jamaican rum"
  # DELIBERATELY THE SAME as the moderately aged one above -- see
  # card_names_may_collide. Declared in rum_styles and used by NO DRINK as
  # of 2026-08-27; named here anyway, so the map covers the vocabulary rather
  # than today's data.
  #
  # HELEN APPLIES THIS ONE HERSELF and it is not a gap to be filled in by
  # inference, 2026-08-27: "needs to be applied by me where I need it, for
  # example where I usually reach for Blackwell or Myers." Those two bottles are
  # the marker -- a drink whose Jamaican is reached for because it is dark and
  # molasses-sweet rather than funky. Do not retype a drink into this style
  # from the item text; `Pot-still dark Jamaican rum` and `Dark aged rum` look
  # like candidates and are hers to call.
  "caramel-forward Jamaican rum": "Jamaican rum"
  "unaged overproof Jamaican rum": "Jamaican overproof rum"
  "aged Demerara rum": "Demerara rum"
  "overproof Demerara rum": "Demerara overproof rum"
  # The honest name for what everyone else calls white rum.
  "lightly aged and filtered rum": "lightly aged rum"
  # The weakest name in this map, and flagged as such: it is the residual
  # category -- a rum with no region and no other distinguishing trait -- so
  # there is nothing to name it AFTER. "aged rum" beside "Demerara rum" reads
  # faintly as though the Demerara were not also aged.
  "moderately aged rum": "aged rum"
  "clear blended multi-region rum": "clear blended rum"
  # THE SPIRIT WORD STAYS, and these two lost it by accident. Helen, 2026-08-29,
  # looking at `agricole blanc` and `rhum agricole blanc` offered as two separate
  # chips in HAS TO HAVE: "'agricole' and 'rhum agricole' should both be 'rhum
  # agricole'."
  #
  # This is her own #561 rule -- "her names say the spirit word out loud", which
  # is what turned `filtered rum` into `lightly aged rum` and `clear blend` into
  # `clear blended rum` -- and it simply was not applied here. `agricole blanc`
  # among `gin`, `cognac` and `sugar syrup` asks the reader to already know that
  # agricole is a rum. Two of the three names in that pass got LONGER for exactly
  # this reason: brevity was the means, legibility was the point.
  #
  # Now identical to the generic, which is a legitimate entry in this map and
  # already the case for eight others (`clairin`, `coconut rum`, `cachaça`...).
  "rhum agricole blanc": "rhum agricole blanc"
  "rhum agricole vieux": "rhum agricole vieux"
  "clairin": "clairin"
  # The brand-generics #314 permits because nothing generalises them. O.F.T.D.
  # earns its place: its item strings are `Overproof Navy rum` and `Navy rum
  # (float)`, both of which name other rums elsewhere in the collection.
  # THE THREE BRAND-GENERICS GET DESCRIPTIVE CARD NAMES -- Helen, 2026-08-29.
  # #314 permits these three as generics because nothing generalises the BOTTLE;
  # that ruling is untouched. What changes is only the card LABEL, which is what
  # card names are for -- and these were the only three brands on any card, so
  # a reader met `O.F.T.D.` among `gin`, `cognac` and `sugar syrup` and learned
  # nothing from it (#556's worry, exactly).
  #
  # LOWERCASING IS WHAT SURFACED IT. `o.f.t.d.` and `stiggins' fancy` read badly
  # in a lowercase line in a way the capitalised forms hid.
  #
  # Real estate goes the other way for two of the three and that is fine: this
  # buys legibility, not width. O.F.T.D. 8 -> 17 chars, Malibu 6 -> 11,
  # Stiggins' Fancy 15 -> 13.
  "pineapple rum": "pineapple rum"
  # Guyana/Jamaica/Barbados at 69%, so "blended overproof" is what it IS rather
  # than a summary of it. Distinct from `Demerara overproof rum` and
  # `Jamaican overproof rum`, which are the single-origin overproofs.
  "blended overproof rum": "blended overproof rum"
  "coconut rum": "coconut rum"
  "cachaça": "cachaça"
  "Batavia arrack": "Batavia arrack"
  # THE FIRST NON-RUM ENTRY, and it is deliberate. Helen, 2026-08-27, on Ceylon
  # arrack: "is that a rum? Doesn't matter, the category list should eventually
  # contain everything, so let's add it now." It has no `family` and should not
  # get one -- it is coconut flower sap, and `family_less` above carries the
  # reason -- so it is outside the rum machinery entirely, which is precisely
  # why its card would otherwise fall back to the raw item text.
  #
  # THE KEY NAME IS NOW HALF A LIE and that is a known debt, not an oversight:
  # `cocktails/index.html` reads this map by name and is off-limits this
  # session (another agent). Rename it to `card_names` the next time that file
  # is open. Nothing else needs to change -- the template only ever looks a
  # generic up in it.
  "Ceylon arrack": "Ceylon arrack"

  # --- BEYOND RUM, 2026-08-29 -------------------------------------------------
  # Helen's model, from her own worked examples: the card shows the shortest
  # name that tells you what the drink is LIKE -- not the family, not the style,
  # but whichever of those actually matters. "gin", because London dry versus
  # Plymouth does not change your evening. "bourbon" and "blanco tequila",
  # because bourbon versus rye and blanco versus anejo absolutely do.
  #
  # ONLY WHERE THE CARD NAME DIFFERS FROM THE GENERIC. A generic that already
  # reads well on a card (`cognac`, `Campari`, `lime juice`) needs no entry;
  # adding one would be 140 rows of the same string twice.
  "London dry gin": "gin"
  # NOT collapsed to "gin", deliberately, and the line is Helen's own rum rule:
  # collapse where the difference is a nuance, keep it where it changes the
  # STRENGTH or the drink. Navy strength does; genever is a different drink
  # altogether. Old Tom, Plymouth, New Western dry and speciality are the
  # genuinely open ones -- see the note in the issue rather than guessing here.
  "navy strength gin": "navy strength gin"
  "genever": "genever"
  "blended scotch whisky": "scotch"
  "single malt scotch whisky": "single malt"
  # Bonded stays its own word. Helen, 2026-08-27: "bonded rye is a different
  # thing, like overproof demerara rum" -- and five of seven rye entries in the
  # collection are bonded, so collapsing it to `rye` would hide the majority
  # case behind the exception.
  "bonded rye": "bonded rye"
  # THE RATIO IS A RECIPE FACT, NOT A CARD FACT. Helen, 2026-08-27: "On the card
  # I would expect to see sugar syrup, and on the recipe ingredient line cane
  # sugar syrup, 2:1." Both ratios therefore read the same on a card, which is a
  # declared collapse below -- it loses real information and it is meant to.
  #
  # HER SENTENCE ALREADY SAID `cane sugar syrup` ON THE RECIPE LINE, a week
  # before the generics were renamed to match it on 2026-09-04. That is the
  # whole of this pair: the card keeps the short name she asked for and the
  # generic is now the long one she was already writing.
  "cane sugar syrup 1:1": "sugar syrup"
  "cane sugar syrup 2:1": "sugar syrup"
  # THE SUGAR IS THE POINT AND THE WORD "sugar" IS NOT -- the card said
  # `demerara syrup` before the rename and says it after, because at card
  # distance `demerara` is the whole fact. Helen, 2026-09-04: "Sometimes I say
  # 'demerara sugar syrup' when I mean that." The recipe line gets her full
  # phrase; the card does not need it.
  "demerara sugar syrup": "demerara syrup"
  # THE TWO HONEY WATERS CAME OFF ON 2026-09-04 with the generics they named,
  # and went back on the same evening with them. Helen: "Bee's Knees needs to
  # say honey water 2:1. I'm sorry if I said the wrong thing about this before,
  # but I really do need that generic here." So there are three honey-water
  # generics and ONE card name for all of them -- the flat `honey water` needs
  # no row, because this map only ever carries a generic whose card name DIFFERS
  # from it, and the two ratios need one for exactly the reason the sugar syrups
  # do: a ratio is a MAKING fact, not a CHOOSING fact.
  "honey water 1:1": "honey water"
  "honey water 2:1": "honey water"

# HOW A DISJUNCTIVE RUM READS ON A CARD, where the default join reads badly.
#
# A list `generic` on ONE ingredient means "either would do" (#441), and the
# card joins the two card names with " or ". Seven distinct pairs occur and six
# of them read fine -- `lightly aged rum or agricole blanc` is exactly the
# choice `White rum` used to conceal. The seventh repeats its own head word:
# `Demerara overproof rum or Demerara rum`.
#
# KEYED ON THE DEFAULT JOIN, so the left-hand side is the string this replaces
# and you can read the before and after together. AN EXPLICIT MAP RATHER THAN A
# RULE, Helen 2026-08-27: "not perfect, but we can try. I expect we'll need an
# explicit mapping of cases like this." Collapsing a shared word is a judgement
# about two specific names -- her form drops `Demerara` AND `rum` from the
# second option and reorders the pair -- and no rule recovers that.
#
# THIS IS NOT THE "TWO POURS OF THE SAME RUM" CASE, which is a different thing
# and needs nothing: two separate ingredient entries each render their own card
# name, so a drink genuinely wanting two Demeraras prints the name twice, which
# is correct. Helen, same conversation: "where a recipe wants more than one kind
# of the same rum we obviously should write the display name twice."
#
# Every key must still be a join some drink actually produces --
# test_every_card_name_join_is_reachable -- the same bargain
# `methods.yml`'s proposals strike: a replacement whose work is already done
# reads as outstanding, and one whose left-hand side has drifted does nothing
# while looking live.
# EMPTY SINCE 2026-08-30, and the mechanism stays. Its one entry replaced the
# Swizzle's `Demerara overproof rum or Demerara rum` with Helen's own
# `Demerara rum or overproof`; that drink was rewritten the same day into the
# Martinique Swizzle -- 60 ml of unaged agricole, no Demerara anywhere -- so the
# pair it fixed is no longer produced by any drink.
#
# `test_every_card_name_join_is_reachable` is what said so, refusing to let a
# replacement sit there matching nothing, and it SKIPS on an empty map rather
# than passing. So this block currently checks nothing, which is worth knowing
# rather than discovering: the day a disjunctive pair reads badly again, the
# entry goes back here and the guard wakes up with it.
card_name_joins: {}

# CARD NAMES THAT ARE ALLOWED TO BE THE SAME, with the reason attached -- the
# idiom `family_less` above and tests/test_reference_data.py's
# NO_TEMPERATURE_BECAUSE both use, so "why do two rums read alike?" is answered
# in the repo rather than in someone's memory.
#
# Listing a name here is what makes the collapse permitted; an undeclared
# duplicate still fails. A collapse is a real loss of information on the index,
# so it should cost a sentence.
card_names_may_collide:
  "sugar syrup": >-
    `cane sugar syrup 1:1` and `cane sugar syrup 2:1` both read `sugar syrup` on
    a card. Helen, 2026-08-27, asked what she would expect to see: "On the card
    I would expect to see sugar syrup, and on the recipe ingredient line cane
    sugar syrup, 2:1." The ratio changes how much you pour, which is a thing you
    need while MAKING the drink and not while choosing it -- so this is a
    collapse that loses real information on purpose, at the distance where the
    information is not being used. It now drops the SUGAR as well as the ratio,
    since the generics were renamed on 2026-09-04, and her sentence covers that
    too: the card said `sugar syrup` when the generic did, and still does.
    Nine drinks carry both a syrup and something else sweet; none carries both
    ratios at once.
  # `honey water` CAME OFF ON 2026-09-04 with the pair it permitted and went
  # back on the same evening with them -- Helen needed `honey water 2:1` on the
  # Bee's Knees. In between, leaving it here would have failed
  # test_rum_card_names_are_distinct's staleness half, which is the guard doing
  # its job -- a permission whose names have diverged silently blesses the next
  # accidental duplicate on the same string.
  "honey water": >-
    `honey water 1:1` and `honey water 2:1` both read `honey water` on a card,
    which is also what the flat `honey water` generic reads. Exactly the sugar
    syrups' collapse and for exactly the same reason -- Helen, 2026-08-27: "On
    the card I would expect to see sugar syrup, and on the recipe ingredient
    line cane sugar syrup, 2:1." The ratio is a thing you need while MAKING the
    drink and not while choosing it. The flat generic is the DEFAULT, for a
    drink where the ratio does not matter; a card cannot tell the three apart
    and does not need to. One drink carries a ratio today (the Bee's Knees, at
    2:1) and no drink carries two honey waters at once.
  "Jamaican rum": >-
    Helen's call, 2026-08-27, offered the alternative and choosing this:
    `Jamaican, moderately aged` and `Jamaican, caramel forward` both read
    `Jamaican rum` on a card. The funk is the shared trait and it is what you
    are choosing the drink for at that distance; the caramel is a nuance of the
    same rum rather than a different strength or a different drink, which is the
    line the other pairs fall the other side of -- both Demeraras and both
    agricoles keep their own names, because proof and age genuinely change what
    you are making. Costs nothing today: `Jamaican, caramel forward` is declared
    in rum_styles and used by no drink, and no drink calls for both Jamaicans.
    The full category names are on the drink page either way.

# Helen's own list, 2026-08-26, given in full when `flavoured` was queried:
# "London Dry, Old Tom, Plymouth, Navy strength, Genever and speciality, where
# speciality should always carry a character field." Written lowercase here at
# her direction -- the file's commodity-lowercasing rule wins over the way a
# style gets capitalised in prose, so `blended Scotch` and `Demerara, aged`
# keep their shape too.
gin_styles:
  - "London dry gin"
  - "Old Tom"
  - "Plymouth"
  - "New Western dry"
  - "genever"
  - "navy strength gin"
  # REPLACES `flavoured`, which is retired -- see retired_gin_styles. A gin
  # whose point is a botanical other than juniper: Hendrick's cucumber and
  # rose, Malfy's lemon, a rhubarb gin. The style name alone says nothing
  # useful, which is why Helen's rule is that this generic ALWAYS carries a
  # `character` naming what the gin actually pushes. Enforced by
  # tests/test_cocktails.py::test_speciality_gin_declares_a_character.
  #
  # Character is FREE TEXT here, unlike rum's -- Helen's call, 2026-08-26. A
  # rum's character comes from a handful of production traits and closes into a
  # list; a gin's is whatever went in the still, and closing that list would
  # mean a vocabulary edit for every new bottle.
  - "speciality"
  # Helen's own parenthesis: "not a gin though". Deliberately NOT one of the
  # styles above -- her 2026-08-26 list is types of GIN, and this is not one; it
  # sits in this group so that `family_of` can still roll it up to gin for
  # exclusion.
  #
  # NO DRINK USES IT AS OF 2026-08-30, and that is the intended state rather
  # than a gap: it is the catch-all for the next gin liqueur that is not sloe.
  # See `sloe gin` immediately below for why the two are not one.
  - "gin liqueur"
  # SPLIT OUT OF `gin liqueur` ON 2026-08-30, and it is the `flavoured` mistake
  # caught a second time. Helen, looking at the Cobra Effect's card: "specialty
  # gins and gin liqueurs got recoded and it looks like this one got squashed,
  # suggesting our taxonomy isn't right here."
  #
  # She was right, and `retired_gin_styles` above already argues her case in her
  # own words: `flavoured` was retired for "covering everything from sloe to
  # rhubarb to cucumber, which are not substitutable for each other", and it was
  # replaced by `speciality` CARRYING A CHARACTER. Both sloe gins were recoded
  # to `gin liqueur` instead -- a name with the identical fault and, unlike
  # `speciality`, no character requirement to say which botanical. The category
  # meant "sloe gin" for both of its members while claiming to mean any gin
  # liqueur.
  #
  # A GENERIC RATHER THAN A CHARACTER, Helen's call when shown both: sloe gin is
  # a standard named category with a legal definition, not one distiller's
  # botanical, and `character` is recipe-only (#441) so it would have left the
  # card still reading `gin liqueur` -- which is the thing she was looking at
  # when she spotted this. Same reasoning the eleven rum styles get: when the
  # difference changes what you are making, it earns a name.
  - "sloe gin"

# NAME THEM CORRECTLY RATHER THAN DODGING THE SPELLING -- Helen, 2026-08-27:
# "please apply correctness rather than the fudge of dropping the word." Scotch
# and Japanese take WHISKY; Irish and American take WHISKEY. `blended Scotch`,
# `Irish` and `Japanese` said neither, which looked tidy and was really an
# unmade decision.
#
# `rye` and `bourbon` stay BARE, and that is not an inconsistency. Helen's own
# test is the name you would say out loud: nobody says "bourbon whiskey", and
# nobody says just "Irish". The word goes in where the style alone is not an
# ingredient.
#
# `scotch` is lowercase for the same reason `cognac`, `champagne` and `calvados`
# are -- a protected appellation that has become a common noun in English. The
# demonyms keep their capitals.
whisky_styles:
  - "rye"
  # Bottled-in-bond: 100 proof, one distillery, one season, four years minimum.
  # A CATEGORY, NOT A STRENGTH -- Helen, 2026-08-27: "bonded rye is a different
  # thing, like overproof demerara rum." Which is the right comparison, and the
  # data agrees emphatically: five of the seven rye entries in the collection
  # already say bonded or 100 proof in their item text (Rittenhouse 100 x3,
  # "straight bottled-in-bond rye whiskey", "Rye whiskey (100% proof)"). Bonded
  # is what she actually pours; plain `rye` was the exception wearing the
  # default's clothes.
  #
  # ASKED AGAIN AND ANSWERED THE SAME WAY, 2026-09-04: "Bonded rye and rye are
  # different generics." Recorded here so that the next reader counting five
  # bonded entries against two plain ones does not propose collapsing them.
  - "bonded rye"
  - "bourbon"
  # PENDING RETIREMENT, and deliberately untouched today. Peat is orthogonal to
  # single-malt-versus-blended -- a peated single malt is both -- so it belongs
  # in `character` beside the style, exactly as blackstrap does for rum (#441,
  # #314). Both drinks using it prove the point: their items read "Peated single
  # malt whisky" and "Peated Scotch whisky", so one of them was already trying
  # to say two things through one field.
  #
  # NOT DONE YET BECAUSE THE GUARD HAS TO MOVE FIRST. A `whisky_characters` list
  # added here would silently become a list of permitted GENERICS --
  # tests/test_cocktails.py derives them from every top-level list and excludes
  # only the names in NOT_GENERIC_LISTS. That is the precise hole this file
  # already documents for `rum_characters`, which passed `sherry` and
  # `Spanish-style` as generics for four days. Vocabulary and guard move
  # together or not at all.
  - "blended scotch whisky"
  - "single malt scotch whisky"
  - "Irish whiskey"
  - "Japanese whisky"

agave_styles:
  - "blanco tequila"
  - "reposado tequila"
  - "añejo tequila"
  - "mezcal"

brandy_styles:
  - "cognac"
  - "armagnac"
  - "calvados"
  - "pisco"
  - "grappa"
  # Helen, 2026-08-31, on Pink Lady's Laird's Bonded: applejack's generic is
  # `apple brandy`. It is NOT `calvados`, which names a French appellation --
  # the same distinction the two Demeraras turn on, where the category is a
  # checkable fact about the bottle rather than an argument from the glass.
  # Naming it after the fruit rather than the country is what lets an American
  # applejack and a Spanish or English apple brandy share it honestly.
  - "apple brandy"
  # The category term rather than one country's word for it, so a slivovitz or
  # a framboise has somewhere to go. Cherry eau de vie is the live example.
  - "eau de vie"
  # BOTH ARE GENERICS, Helen 2026-09-04, revisiting the "for now" the line
  # below used to carry: asked whether `aguardiente` and `kirschwasser` were
  # bottles or categories, "both are generics." So Bali Hai's suggestions --
  # which repeated its own item text rather than naming anything on a shelf --
  # become the thing the recipe actually asks for, as a list `generic` meaning
  # either would do (#441).
  #
  # `full-strength clear fruit brandy` WENT WITH THEM, see retired_brandy_styles
  # at the bottom: it was invented for Bali Hai in 2026-08-22 and Bali Hai was
  # its only user, so naming the two spirits leaves it describing nothing.
  - "aguardiente"
  - "kirschwasser"
  # Added 2026-08-29. Distilled peach wine, ~35%, clear or aged -- and NOT the
  # same thing as crème de pêche (an infusion of fresh peaches with lots of
  # sugar, ~20%) or a peach eau de vie (clear, unaged, from whole fruit, ~45%).
  #
  # NOT PEDANTRY: the collection already had a drink wrong because this was
  # missing. Gunmetal Blue asks for "Peach brandy" and is typed
  # `crème de pêche`, so a 20% sweetened infusion is standing in for a 35%
  # distillate. Same axis the cherry pair is already split on -- Helen's own
  # note there is "a liqueur is sweetened, an eau de vie is not".
  - "peach brandy"

# Cane and palm spirits that are NOT rum. #314: "cachaca is its own generic" --
# same raw material as an agricole rhum, completely different product. Batavia
# arrack is a cane-and-rice spirit and Helen's call is that it stars as `rum`.
# Ceylon arrack is coconut flower sap and shares only the name.
cane_and_palm_spirits:
  - "cachaça"
  - "Batavia arrack"
  - "Ceylon arrack"

other_base_spirits:
  - "vodka"
  # `flavoured vodka` RETIRED 2026-09-04, and it goes for the reason this file
  # keeps giving: Helen, "'flavoured vodka' is not a useful generic because
  # members aren't substitutable. I suggest 'pineapple vodka' and 'vanilla
  # vodka' or whatever." The same test that makes Campari, Aperol, Cynar and
  # fernet four generics rather than one amaro, and the same one that retired
  # `flavoured` from the gin styles on 2026-08-26 -- a filter button reading
  # "flavoured" tells you nothing, and swapping a pineapple vodka into a Porn
  # Star Martini is a different drink rather than a variation.
  #
  # NAMED BY FLAVOUR, consistent with crème de X and with the bitters. Two
  # today because two drinks use them; "or whatever" is her invitation to add
  # the next one the same way rather than a licence to guess at a range.
  - "vanilla vodka"
  - "pineapple vodka"
  - "absinthe"
  - "aquavit"

# `pastis` RETIRED 2026-08-30, and it is worth saying that this was a
# CONSEQUENCE rather than a judgement about pastis.
#
# Its `family_less` entry gave one reason for existing -- "Swizzle uses 6 drops
# of Pernod or absinthe" -- and that drink was rewritten the same day into the
# Martinique Swizzle, which takes 1 dash of absinthe. So the only drink cited
# stopped citing it.
#
# The other thread was Don's Mai Tai suggesting `Pernod` against `absinthe`,
# which looked like a pastis-for-absinthe substitution and was carrying a note
# saying so. It was not: "Pernod" names two bottles, and Helen owns the 68%
# absinthe, which is also what the source asks for. So the substitution was an
# artefact of a brand name written without its product, and it took the note
# with it.
#
# A pastis is still a real thing -- Ricard, Henri Bardouin -- and nothing here
# says otherwise. The day a drink wants one, put this line back.
#
# THE MAPPING BELOW WAS EMPTY UNTIL 2026-09-04 and now carries one entry, which
# is the shape every other `retired_*` block already has: a name that used to
# mean something must not blend into the not-declared pile.
retired_other_base_spirits:
  "flavoured vodka": >-
    covered a vanilla vodka and a pineapple one, which are not substitutable
    for each other -- Helen, 2026-09-04: "'flavoured vodka' is not a useful
    generic because members aren't substitutable. I suggest 'pineapple vodka'
    and 'vanilla vodka' or whatever." Both are declared in
    `other_base_spirits` above. Same call as `flavoured` gin, 2026-08-26.

