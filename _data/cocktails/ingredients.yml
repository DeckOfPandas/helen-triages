  - "wood smoke bitters"
  - "warm-spiced bitters"
  - "margarita bitters"
  - "pimento bitters"

# =============================================================================
# SWEETENERS, JUICES, FRUIT
# =============================================================================

# 1:1 AND 2:1 ARE SEPARATE GENERICS. "Simple syrup" means 1:1. Only 2 of 27
# entries state a ratio, and syrup-to-citrus volume CANNOT tell them apart -- a
# declared 1:1 (Daisy de Santiago) and a declared 2:1 (Long Island) both sit at
# 0.50, because Helen adjusts sugar deliberately. See HANDOVER §9.4.1: the site
# is canon and she deviates in the kitchen.
syrups:
  - "sugar syrup 1:1"
  - "sugar syrup 2:1"
  - "demerara syrup"
  - "grenadine"
  - "ginger syrup"
  - "passion fruit syrup"
  - "cinnamon syrup"
  - "agave syrup"
  - "vanilla syrup"
  - "orgeat"
  - "falernum"
  - "lime cordial"
  - "ginger and lemongrass cordial"

# `honey water` is what other people call honey syrup. Helen makes no syrup, so
# the word does not appear. Clover is a suggestion in a note, not a generic.
#
# THE RATIO IS ALWAYS STATED, exactly as the syrups above -- Helen, 2026-08-26,
# asked directly. There is deliberately no bare `honey water` to fall back on:
# a diluted honey and a twice-as-concentrated one are used at different volumes
# for the same sweetness, which is the whole reason `sugar syrup 1:1` and
# `sugar syrup 2:1` are two generics rather than one.
#
# `acacia honey` IS GONE, folded into plain `honey` with acacia as a
# `suggestion` -- Helen, 2026-08-26. It was a varietal preference wearing a
# category's clothes, which is precisely what this file's own rule forbids
# ("a preferred bottle is a suggestion, never a generic"). The distinction
# worth keeping is neat honey versus honey diluted with water; acacia versus
# clover is a bottle on the shelf.
honeys:
  - "honey"
  - "honey water 1:1"
  - "honey water 2:1"

# DELIBERATELY MIXES FORM WITH TYPE, and the reasoning is a browsing one rather
# than a purity one -- Helen: "if I don't have a sugar cube I won't make a
# Classic Champagne Cocktail". A cube can also be brown; Arrack Punch uses 16
# demerara cubes. So form and type really are orthogonal here.
# Her revisit clause: "if having this many turns out to feel mad once I'm using
# the site, then we can revisit."
sugars:
  - "white sugar"
  - "raw sugar"
  # Added 2026-08-26. The Pear/Apricot Bellini was typed `molasses sugar`,
  # which is nearly muscovado -- a long way from a light unrefined caster, and
  # it would have coloured a pale fruit syrup wrong. Helen's call was its own
  # generic rather than folding it into `raw sugar`, which is consistent with
  # this list's stated willingness to mix form with type.
  - "golden caster sugar"
  - "molasses sugar"
  - "palm sugar"
  - "sugar cube"

# "FRESH" IS NOT PART OF THE GENERIC. Freshly squeezed is implied for every
# juice, and `lime cordial` being named separately is what makes the
# implication safe. Helen is writing this up on an About page.
juices:
  - "lime juice"
  - "lemon juice"
  - "orange juice"
  - "pineapple juice"
  - "grapefruit juice"
  - "cranberry juice"
  - "apple juice"

# FRUIT IS NOT JUICE. You muddle one and pour the other, and a Caipirinha made
# with lime juice is a different drink.
fruit_and_herbs:
  - "lime"
  - "pineapple"
  - "passion fruit"
  - "raspberries"
  - "blackberries"
  - "pear"
  - "dried apricots"
  - "lemon zest"
  - "mint"
  - "basil"
  - "rosemary"
  - "fruit purée"
  # Both from East River Underground, which muddles them and then garnishes
  # with them again. Helen, 2026-08-31: "Cucumber and kaffir lime leaves will
  # need to go in the dictionary naked" -- bare, no qualifier, because neither
  # is a form of anything already here.
  #
  # `kaffir lime leaves` is NOT a variety of `lime`, which is the fruit you
  # muddle. The leaf is an aromatic and tastes nothing like the fruit, so the
  # two must not collapse -- excluding one would otherwise silently drop drinks
  # built on the other.
  - "cucumber"
  - "kaffir lime leaves"

other:
  - "soda water"
  - "water"
  - "black tea"
  - "espresso"
  - "cola"
  - "coconut cream"
  - "egg white"
  - "salt"
  - "cider vinegar"
  # THE THREE BELOW HAVE NO DRINK, ON PURPOSE, and they are declared for the
  # reason this file already declares Plymouth, New Western dry and genever
  # while owning none of them: it is a SPEC, not an inventory.
  #
  # They are what `pudding in a glass` is made of -- taxonomy.yml's
  # `mood_ingredients.rich` -- and that mood is likewise declared with zero
  # members, pending the whole flips-and-Alexanders family in #337. Until
  # 2026-08-30 the derivation named all three and the vocabulary declared none,
  # so the mood could not have fired even once a drink arrived, and nothing
  # anywhere would have said why.
  #
  # `egg white` above is a different ingredient and not a substitute: it does
  # FOAM, not richness, which is why the Gin Sour is not a pudding.
  - "cream"
  - "milk"
  - "whole egg"

