# A QUINQUINA AND AN AMERICANO ARE NOT VERMOUTHS. Both are quinine-led rather
# than wormwood-led, which is why they sit beside the vermouths here rather than
# under them.
#
# `americano` IS NEW, and the line below it used to do both jobs -- its comment
# read "Aperitif wines, not vermouths: Lillet, Cocchi Americano", filing a
# quinquina and an americano under one word. That is the conflation #568 is
# about, one level down. THREE DRINKS CURRENTLY SAY `quinquina` and at least one
# of them may mean the other: #569 asks for Corpse Reviver No. 2 to accept
# either, which only became expressible now. north-sea-oil and
