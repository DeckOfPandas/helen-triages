# ONE FLAT `honey water` SINCE 2026-09-04, and the ratio is gone from the name.
# Helen: "Honey: one flat honey syrup please, because I don't think I'll often
# request a specific type. Acacia is a bit special." -- and then, an hour
# later, on seeing `honey syrup` and `honey water` side by side: "I actually
# prefer water and should have said so earlier." So the WORD stays as the
# collection always had it and only the ratio goes.
#
# THIS REVERSES 2026-08-26, WHICH IS WORTH SAYING PLAINLY. That day the ratio
# was ruled always-stated, on the argument that a diluted honey and a
# twice-concentrated one are poured at different volumes for the same
# sweetness -- the same argument that keeps `sugar syrup 1:1` and `sugar syrup
# 2:1` apart, and it is still true of the sugar syrups. What changed is her
# answer to how often she will ASK for one rather than the other: not often. So
# the distinction went to where the collection was already keeping it -- the
# `item` line and the drink's own note, which is where island-of-martinique's
# "Honey water 2:1 (clover)" has said it all along.
#
# THE RATIOS CAME BACK THE NEXT DAY, 2026-09-04 evening, AND THE FLAT ONE
# STAYED. Helen, on the Bee's Knees: "Bee's Knees needs to say honey water 2:1.
# I'm sorry if I said the wrong thing about this before, but I really do need
# that generic here." So this is not a reversal of the paragraph above -- it is
# the paragraph above plus a case it did not cover. THREE GENERICS:
#
#   `honey water`      THE DEFAULT, for a drink where the ratio does not
#                      matter -- which is most of them, and is exactly what she
#                      ruled in the afternoon. Six of the seven honey drinks
#                      keep it.
#   `honey water 1:1`  for a drink where the ratio DOES matter and is 1:1.
#   `honey water 2:1`  the same, at 2:1. The Bee's Knees is the one that asked.
#
# ONE CARD NAME, `honey water`, FOR ALL THREE, so the card is unaffected either
# way -- §9.10.1's rule, that a ratio is a MAKING fact and not a CHOOSING fact,
# is what makes three generics cost the index nothing. Both `card_names` rows
# are back and so is the `card_names_may_collide` permission that covers them.
#
# ONLY THE BEE'S KNEES WAS RETYPED. The other six honey drinks stay flat: she
# named one drink, and retyping the rest into a ratio nobody stated would be
# inventing the very fact the flat generic exists to not claim.
#
# BARE `honey` SURVIVES AND IS NOT THE SAME THING -- Helen, same conversation,
# on the pear Bellini: it "really does use plain honey, cooked into a syrup on
# the stove with the fruit". So `honey` is the raw thing you cook WITH (the
# Bellini's pear, honey and thyme syrup, weighed in grams) and `honey water` is
# the ready-made pour. Acacia versus clover remains a bottle on the shelf and
# therefore a `suggestion`, which is the 2026-08-26 half that stands: the
# bottle dictionary declares `Acacia honey` and the drinks point at it.
honeys:
  - "honey"
  - "honey water"
  - "honey water 1:1"
  - "honey water 2:1"

