# =============================================================================
# COCKTAIL INGREDIENT VOCABULARY. Spec: GitHub issue #322. Rum half: #314.
# Index design that consumes this: #292.
# =============================================================================
# TWO LAYERS, AND THE DISTINCTION IS THE WHOLE DESIGN.
#
#   `generic`  the precise ingredient category, on each `ingredients:` entry.
#              Campari, Aperol, Cynar and Fernet are FOUR generics -- they
#              taste nothing alike and are not substitutable.
#   `family`   the roll-up, for SEARCH and EXCLUSION only. All four are
#              `amaro`. See the families block below for why this is not a
#              browse axis.
#
# ONLY BASES HAVE A FAMILY. `lime juice` has none and should not -- nobody
# excludes "all juices". `family_of` maps the bases and nothing else, and
# `family_less` records the bases that deliberately have none.
#
# `generic` IS STORED, NEVER DERIVED. 61 distinct ingredients in this
# collection are named only by brand -- Campari, Cointreau, Cynar, Kahlua,
# Carpano Antica, Rittenhouse, Roots Mastiha, Swedish Flaggpunsch -- affecting
# 56 of the 109 drinks that have ingredients. No rule gets "rye whiskey" out of
# "Ritthenhouse".
#
# A PREFERRED BOTTLE IS A `suggestion`, NEVER A `generic`. Helen, 2026-08-17,
# on Cherry Heering: "I'd note my preference as the example not the category."
# So Velvet Falernum -> falernum, Luxardo -> maraschino liqueur, Carpano Antica
# -> sweet vermouth, with the bottle in `suggestion`. The only exceptions are
# the brand names #314 permits AS generics, because nothing generalises them:
# planteray stiggins' fancy, planteray o.f.t.d. overproof, malibu, blackstrap.
# =============================================================================

# --- spirit families: FOR SEARCH AND EXCLUSION, NOT A BROWSE AXIS ------------
# THIS IS NOT A "SORTED BY SPIRIT" MENU, and that is deliberate. Helen,
# 2026-08-17: "I get really bored of cocktail bars that have enormous
# bible-like menus sorted by spirit... I probably think browsing by spirit is
# basic." Do not put a spirit filter on the index.
#
# The families exist to serve two things in her actual index design:
#   1. the ingredient search's `(all)` buttons -- typing toward "rum" offers
#      "rum (all)" alongside "Havana Club Anejo 3 Anos", the same shape food's
#      ingredient search already has;
#   2. exclusion. "I don't like Scotch" is a family-level operation, and so is
#      "no whisky tonight".
#
# FOOD'S FAMILY MECHANISM CANNOT DERIVE THESE. On the food site an `(all)`
# button forms when entries share a head word after normalisation -- "cheese
# (all)" from cheddar/feta/comte. These styles share NO common word:
# "Jamaican, moderately aged" and "Demerara, aged" have nothing in common
# textually. So the family has to be DECLARED, which is what `family_of` is.
#
# `fortified` exists because 19 drinks have no spirit at all -- Bamboo,
# Brooklyn, Toronto, Aperol Spritz, Lucien Gaudin, the Bellini, mulled wine --
# and without it they cannot be excluded or searched as a group. `herbal`
# exists because Chartreuse is the BASE of Chartreuse Swizzle, not merely a
# modifier in it.
families:
  - rum
  - gin
  - whisky
  - brandy
  - agave
  - vodka
  - amaro
  - fortified
  - aquavit
  - herbal

# =============================================================================
# BASE SPIRITS -- one style list per family, the pattern #314 set for rum
# =============================================================================
# Styles Helen does not currently own are declared anyway. This is a spec, not
# an inventory: she chose that explicitly for gin, where Plymouth, New Western
# and Genever are all absent from the collection.

# GitHub issue #314. `light`, `gold` and `dark` are RETIRED -- see the bottom.
rum_styles:
  - "Jamaican, moderately aged"
  - "Jamaican, caramel forward"
  - "lightly aged and filtered"
  - "moderately aged"
  - "Demerara, aged"
  - "Demerara, overproof"
  - "Jamaican, overproof, unaged"
  - "cane juice (agricole) rum, unaged"
  - "cane juice (agricole) rum, aged"
  # Added to #314 after the first transcription. Haitian cane-juice spirit; a
  # category like cachaca or mezcal, so lowercase under the proper-noun rule.
  - "clairin"
  - "blended multi-region rum, clear"

# Permitted WITHOUT a style per #314, because nothing generalises them.
# Blackstrap sits here rather than among the ten for a stated reason -- Helen:
# "treated more as a flavour modifier" -- not something you browse a drink by,
# but a spoonful you add.
rum_untyped:
  - "Planteray Stiggins' Fancy"
  - "Planteray O.F.T.D. Overproof"
  - "Malibu"
  - "blackstrap"

# CHARACTER: a separate, optional field, not `generic`. Some rums have a
# `generic` style (or none decided yet) but also carry a distinctive flavour
# marker worth recording on its own -- e.g. Ron del Barrito is "moderately
# aged" generically, but its defining trait is a sherry-cask, Spanish-style
# tradition rather than a Jamaican or Demerara profile. `blackstrap` can be
# EITHER a `generic` (per rum_untyped above, when that's all a rum is) OR a
# `character` alongside another rum's own generic style -- the two fields
# aren't mutually exclusive.
rum_characters:
  - "blackstrap"
  - "sherry"
  - "Spanish-style"

gin_styles:
  - "London dry"
  - "Plymouth"
  - "New Western dry"
  - "genever"
  - "flavoured"
  # Helen's own parenthesis: "not a gin though". Sloe gin lives here rather
  # than hiding inside london dry.
  - "gin liqueur"
  - "navy strength"

whisky_styles:
  - "rye"
  - "bourbon"
  - "peated Scotch"
  - "blended Scotch"
  - "Irish"
  - "Japanese"

agave_styles:
  - "blanco tequila"
  - "reposado tequila"
  - "añejo tequila"
  - "mezcal"

brandy_styles:
  - "cognac"
  - "armagnac"
  - "calvados"
  - "pisco"
  - "grappa"
  # The category term rather than one country's word for it, so a slivovitz or
  # a framboise has somewhere to go. Cherry eau de vie is the live example.
  - "eau de vie"

# Cane and palm spirits that are NOT rum. #314: "cachaca is its own generic" --
# same raw material as an agricole rhum, completely different product. Batavia
# arrack is a cane-and-rice spirit and Helen's call is that it stars as `rum`.
# Ceylon arrack is coconut flower sap and shares only the name.
cane_and_palm_spirits:
  - "cachaça"
  - "Batavia arrack"
  - "Ceylon arrack"

other_base_spirits:
  - "vodka"
  - "flavoured vodka"
  - "absinthe"
  - "aquavit"

# =============================================================================
# MODIFIERS
# =============================================================================

liqueurs:
  # Orange, four ways -- Helen's call. Grand Marnier stays apart because its
  # cognac base genuinely changes a drink.
  #
  # CURAÇAO KEEPS ITS CAPITAL, Helen's call 2026-08-17, and it is a deliberate
  # exception to the lowercase-the-commodity rule that keeps cognac, champagne
  # and calvados lowercase. The distinction that justifies it: those three are
  # protected appellations that have become common nouns in English, whereas
  # curaçao is not protected and still reads as the island's name. Her own data
  # writes it capitalised throughout, which is the stronger argument.
  - "triple sec"
  - "orange Curaçao"
  - "dry orange Curaçao"
  - "Grand Marnier"
  - "blue Curaçao"
  # Rhum Clément Créole Shrubb. A rhum-based ORANGE LIQUEUR, and filed here
  # rather than under rum on Helen's question, 2026-08-17. The deciding case is
  # exclusion: under `rum` it would make "no rum tonight" wrongly drop Ginger
  # Snap and Accoutrement, whose only rum-derived element is 15 ml of this.
  # Stiggins' Fancy sits under rum because it genuinely IS rum; a shrubb is a
  # sweetened orange liqueur that happens to be rhum-based.
  - "Créole Shrubb"
  - "maraschino liqueur"
  # Each by flavour, deliberately: precision chosen over collapsing.
  - "crème de mûre"
  - "crème de cassis"
  - "crème de pêche"
  - "crème de banane"
  - "crème de violette"
  - "crème de cacao"
  - "crème de menthe"
  # Cherry: the distinction Helen believes in. A liqueur is sweetened, an eau
  # de vie is not, and her own note says "Don't use plain kirsch". The eau de
  # vie itself lives under brandy_styles.
  - "cherry liqueur"
  - "apricot liqueur"
  - "coffee liqueur"
  - "ginger liqueur"
  - "passion fruit liqueur"
  - "gentian liqueur"
  - "mastiha liqueur"
  - "tomato liqueur"
  - "amaretto"

# Own generics, family = `herbal`. Chartreuse is the BASE of Chartreuse
# Swizzle, which is why these are not filed as mere modifiers.
herbal_liqueurs:
  - "green Chartreuse"
  - "yellow Chartreuse"
  - "Bénédictine"
  - "Strega"
  - "Jägermeister"
  - "liqueur de sapin"
  - "Swedish flaggpunsch"

# Separate generics, one family. Not substitutable for each other -- swapping
# Campari for Fernet is a different drink, not a variation.
amari:
  - "Campari"
  - "Aperol"
  - "Cynar"
  - "fernet"
  - "Amaro Nonino"
  - "Amaro Ciociano"

fortified_and_aromatised:
  - "sweet vermouth"
  - "dry vermouth"
  - "blanc vermouth"
  # A vermouth-amaro hybrid; swapping it for sweet vermouth is audible.
  - "Punt e Mes"
  # Aperitif wines, not vermouths: Lillet, Cocchi Americano.
  - "quinquina"
  - "amontillado sherry"
  - "tawny port"

wine_and_sparkling:
  - "champagne"
  - "prosecco"
  - "red wine"
  - "cider"

# Every flavour by name, Helen's call -- consistent with crème de X.
bitters:
  - "aromatic bitters"
  - "orange bitters"
  - "Creole bitters"
  - "chocolate bitters"
  - "tiki bitters"
  - "lavender bitters"
  - "Lavender-forward bitters"
  - "peppermint bitters"
  - "wood smoke bitters"
  - "spiced bitters"
  - "Warm-spiced bitters"
  - "margarita bitters"
  - "pimento bitters"

# =============================================================================
# SWEETENERS, JUICES, FRUIT
# =============================================================================

# 1:1 AND 2:1 ARE SEPARATE GENERICS. "Simple syrup" means 1:1. Only 2 of 27
# entries state a ratio, and syrup-to-citrus volume CANNOT tell them apart -- a
# declared 1:1 (Daisy de Santiago) and a declared 2:1 (Long Island) both sit at
# 0.50, because Helen adjusts sugar deliberately. See HANDOVER §9.4.1: the site
# is canon and she deviates in the kitchen.
syrups:
  - "sugar syrup 1:1"
  - "sugar syrup 2:1"
  - "demerara syrup"
  - "grenadine"
  - "ginger syrup"
  - "passion fruit syrup"
  - "cinnamon syrup"
  - "agave syrup"
  - "vanilla syrup"
  - "orgeat"
  - "falernum"
  - "lime cordial"
  - "ginger and lemongrass cordial"

# `honey water` is what other people call honey syrup. Helen makes no syrup, so
# the word does not appear. Clover is a suggestion in a note, not a generic.
honeys:
  - "honey"
  - "honey water"
  - "acacia honey"

# DELIBERATELY MIXES FORM WITH TYPE, and the reasoning is a browsing one rather
# than a purity one -- Helen: "if I don't have a sugar cube I won't make a
# Classic Champagne Cocktail". A cube can also be brown; Arrack Punch uses 16
# demerara cubes. So form and type really are orthogonal here.
# Her revisit clause: "if having this many turns out to feel mad once I'm using
# the site, then we can revisit."
sugars:
  - "white sugar"
  - "raw sugar"
  - "molasses sugar"
  - "palm sugar"
  - "sugar cube"

# "FRESH" IS NOT PART OF THE GENERIC. Freshly squeezed is implied for every
# juice, and `lime cordial` being named separately is what makes the
# implication safe. Helen is writing this up on an About page.
juices:
  - "lime juice"
  - "lemon juice"
  - "orange juice"
  - "pineapple juice"
  - "grapefruit juice"
  - "cranberry juice"
  - "apple juice"

# FRUIT IS NOT JUICE. You muddle one and pour the other, and a Caipirinha made
# with lime juice is a different drink.
fruit_and_herbs:
  - "lime"
  - "pineapple"
  - "passion fruit"
  - "raspberries"
  - "blackberries"
  - "pear"
  - "dried apricots"
  - "lemon zest"
  - "mint"
  - "basil"
  - "rosemary"
  - "fruit purée"

other:
  - "soda water"
  - "water"
  - "black tea"
  - "espresso"
  - "cola"
  - "coconut cream"
  - "egg white"
  - "salt"
  - "cider vinegar"

# =============================================================================
# GENERIC -> FAMILY. Bases only.
# =============================================================================
# A generic absent from here has no family, which is correct for lime juice and
# every other modifier -- nobody excludes "all juices". A BASE absent from here
# is a gap, and `family_less` records a deliberate one with its reason.
family_of:
  "Jamaican, moderately aged": rum
  "Jamaican, caramel forward": rum
  "lightly aged and filtered": rum
  "moderately aged": rum
  "Demerara, aged": rum
  "Demerara, overproof": rum
  "Jamaican, overproof, unaged": rum
  "cane juice (agricole) rum, unaged": rum
  "cane juice (agricole) rum, aged": rum
  "clairin": rum
  "blended multi-region rum, clear": rum
  "Planteray Stiggins' Fancy": rum
  "Planteray O.F.T.D. Overproof": rum
  "Malibu": rum
  "blackstrap": rum
  "cachaça": rum
  "Batavia arrack": rum
  "London dry": gin
  "Plymouth": gin
  "New Western dry": gin
  "genever": gin
  "flavoured": gin
  "gin liqueur": gin
  "navy strength": gin
  "rye": whisky
  "bourbon": whisky
  "peated Scotch": whisky
  "blended Scotch": whisky
  "Irish": whisky
  "Japanese": whisky
  "cognac": brandy
  "armagnac": brandy
  "calvados": brandy
  "pisco": brandy
  "grappa": brandy
  "eau de vie": brandy
  "blanco tequila": agave
  "reposado tequila": agave
  "añejo tequila": agave
  "mezcal": agave
  "vodka": vodka
  "flavoured vodka": vodka
  "Campari": amaro
  "Aperol": amaro
  "Cynar": amaro
  "fernet": amaro
  "Amaro Nonino": amaro
  "Amaro Ciociano": amaro
  "sweet vermouth": fortified
  "dry vermouth": fortified
  "blanc vermouth": fortified
  "Punt e Mes": fortified
  "quinquina": fortified
