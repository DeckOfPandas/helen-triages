#
# HER OWN BATCH HAD ALREADY WRITTEN IT. "Cane sugar syrup 2:1" appears five
# times in the drinks she typed the same day, which is the collection saying
# what the vocabulary had not: the word was never optional, it was implied, and
# an implied word is one a reader has to already know.
