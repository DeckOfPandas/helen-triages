# =============================================================================
# RETIRED -- removed actively, not merely deprecated
# =============================================================================
# Same treatment _data/food/taxonomy.yml gives retired_star_ingredients, and
# for the same reason: a value that used to mean something silently blends into
# the "not declared" pile unless something names it.
#
# EVERY `retired_*` MAPPING IN THIS FILE IS READ, not just the rum one.
# tests/test_cocktails.py used to name `retired_rum_styles` literally, so this
# second block would have been invisible to it and a drink still saying
# `flavoured` would have failed as "undeclared generic" -- exactly the silent
# blending-in that these blocks exist to prevent, arriving through the test
# rather than the data. The tests now derive the set from the `retired_`
# prefix, the same way `_declared_generics` derives from the file's shape.
retired_rum_styles:
  "Planteray Stiggins' Fancy": >-
    was permitted as a generic because nothing generalised it. Something does:
    `pineapple rum`. The bottle is a `suggestion` now -- #314's amendment,
    Helen 2026-08-29.
  "Planteray O.F.T.D. Overproof": >-
    as Stiggins'. Now `blended overproof rum`, which is what it IS: Guyana,
    Jamaica and Barbados at 69%.
  "Malibu": >-
    as Stiggins'. Now `coconut rum` -- and both drinks using it already said
    "Coconut rum" in their `item`, so the data had answered this before the
    vocabulary did. Helen: "to me coconut rum means Malibu for now."
  light: >-
    describes colour, not production, and colour is routinely adjusted with
    caramel. Re-type against rum_styles — issue #314.
  gold: >-
    same reason as `light`. Almost always either "lightly aged and filtered rum"
    or "moderately aged rum"; which one is Helen's call per drink.
  dark: >-
    same reason again, and the most misleading of the three: a dark rum may be
    Jamaican caramel-forward, Demerara aged, or a blackstrap. Issue #314.
  # --- ADDED 2026-09-05. THESE HAD NO RETIREMENT ENTRY AND SO NOTHING CAUGHT
  # THEM. #314 says navy "has been split out case by case and should not be
  # re-admitted", and its closing comment confirms "no `navy` anywhere in the
  # file" -- which was true of the STYLE LIST and false of the collection: six
  # pours still say "Navy rum" or "Overproof Navy rum" in `item`. A term ruled
  # out of existence with no retirement entry cannot fail loudly, because there
  # is nothing for it to fail against. Helen, 2026-09-05: "there is no such
  # thing as navy rum or overproof navy rum" and "there's no such thing as black
  # rum, even though it will often be requested by other people's recipes."
  #
  # THE LAST CLAUSE IS WHY THESE STAY FOREVER. Unlike `light`/`gold`/`dark`,
  # which were once OUR vocabulary, these are other people's and will keep
  # arriving in every ingested source. The entry is not a tombstone, it is a
  # permanent inbound filter.
  navy: >-
    not a category. It describes strength and a naval-rations heritage, not
    production, and the bottles wearing the word land in three different real
    categories -- Pusser's Blue Label and Gunpowder are `moderately aged rum`,
    Wood's is `aged Demerara rum`, O.F.T.D. is `blended overproof rum`. Helen's
    2026-08-27 rulings on #314 settled each by bottle. RESOLVE FROM THE BOTTLE:
    where the source names one, bottles.yml gives the category outright, and
    that reproduced all 13 existing hand-made calls exactly when checked on
    2026-09-05. Where it names none, this is Helen's call and nobody else's.
  "overproof navy": >-
    as `navy`, and no more resolvable for the extra word: Gunpowder at 54.5% is
    `moderately aged rum` while O.F.T.D. at 69% is `blended overproof rum`. The
    strength is a fact about the BOTTLE, never about the category -- which is
    the same reason #314 gives for Pusser's 151 having had no home under
    `moderately aged`: "moderately aged says nothing about strength."
  black: >-
    not a category, and the one most often demanded by other people's recipes.
    Sometimes it means an aged Jamaican, sometimes a blackstrap character on
    another rum -- #314's own note. The blackstrap reading takes the shape
    Helen ruled on 2026-08-24: `moderately aged rum` + `character: blackstrap`
    + Gosling's, which is what Don's Own Grog and Georgetown Punch already do.
    Distinct from `dark` above only in spelling; both retire for one reason.
  blackstrap: >-
    NOT retired as a word -- MOVED, from `generic` to `character`. Helen,
    #314, 2026-08-24: "blackstrap is only ever given as a character for
    another rum, like this: Moderately aged (character: blackstrap)". So the
    rum still needs a real style of its own, and blackstrap rides alongside
    it. Don's Own Grog and Georgetown Punch already have this shape.

retired_honeys:
  # `honey water` (bare) sat here from 2026-08-26 -- "the ratio is now always
  # stated, as it always was for sugar syrup" -- and came OFF this list on
  # 2026-09-04 when Helen retired the ratios instead (see the `honeys` block
  # above). A generic cannot be both live and retired, and the guard that
  # reads this list said so within the hour.
  "Honey water 2:1": >-
    capitalisation only -- it is `honey water 2:1` now, matching `sugar syrup
    2:1` and every other lowercase commodity in this file. It sat two lines
    below a lowercase `honey water` meaning very nearly the same thing, and
    test_no_two_generics_differ_only_by_case_or_accent could not see the
    collision because the `2:1` made them differ by more than case.
  "acacia honey": >-
    a varietal, not a category. Folded into `honey`, with acacia carried as a
    `suggestion` -- the file's own rule that a preferred bottle is a
    suggestion and never a generic. Helen, 2026-08-26.
  # `honey water 1:1` AND `honey water 2:1` SAT HERE FOR ONE AFTERNOON, retired
  # on 2026-09-04 in favour of a flat `honey water`, and came OFF again the same
  # evening. Helen, on the Bee's Knees: "Bee's Knees needs to say honey water
  # 2:1. I'm sorry if I said the wrong thing about this before, but I really do
  # need that generic here." Both are live generics in `honeys` above, BESIDE
  # the flat one, which is the default for a drink where the ratio does not
  # matter. A generic cannot be both live and retired, so they cannot stay here.

# NEW BLOCK 2026-09-04. A SUGAR SYRUP IS NAMED BY ITS SUGAR -- Helen: "Most
# 'sugar syrup' means 'cane sugar syrup', possibly all. Sometimes I say
# 'demerara sugar syrup' when I mean that. Let's standardise this please."
#
# All three names had users -- 43 ingredient lines across 43 drinks -- so unlike
# the three whisky renames this block WILL fire if a drink is missed, which is
# the point of writing it rather than trusting the pass. The full reasoning is
# on `syrups` above.
retired_syrups:
  "sugar syrup 1:1": >-
    the sugar is in the name now. It is `cane sugar syrup 1:1` -- Helen,
    2026-09-04, standardising after her own batch wrote "Cane sugar syrup 2:1"
    five times: "Most 'sugar syrup' means 'cane sugar syrup', possibly all."
    The card name is unchanged and is still `sugar syrup`.
  "sugar syrup 2:1": >-
    as `sugar syrup 1:1`. It is `cane sugar syrup 2:1` now, which is the string
    Helen's own recipe-line wording used a week before the generic did ("on the
    recipe ingredient line cane sugar syrup, 2:1", 2026-08-27).
  "demerara syrup": >-
    said the sugar and not the thing. It is `demerara sugar syrup` now --
    Helen, 2026-09-04: "Sometimes I say 'demerara sugar syrup' when I mean
    that." The CARD still reads `demerara syrup`, because at card distance
    `demerara` is the whole fact; the long form is the recipe line's.

# NEW BLOCK 2026-09-04, and it exists for the same reason as every other one:
# `full-strength clear fruit brandy` meant something for thirteen days and must
# not blend into the not-declared pile now that it does not.
retired_brandy_styles:
  "full-strength clear fruit brandy": >-
    invented for Bali Hai on 2026-08-22 "for now", against the day someone
    decided whether it was really just an `eau de vie`. Helen decided
    otherwise on 2026-09-04, asked about the two bottles Bali Hai suggested:
    "both are generics." So the drink says `[aguardiente, kirschwasser]` --
    either would do, the #441 list shape -- and this style, which had exactly
    one user, is describing nothing. Both new names are in `brandy_styles`.

# NEW BLOCK 2026-09-04. One lavender, not two -- see the comment on `bitters`.
retired_bitters:
  "lavender bitters": >-
    Helen, 2026-09-04: "the generic should be 'lavender-forward bitters', and
    Bob's Margarita bitters is an example of this I reach for. I don't own
    'lavender bitters' but I expect I will at some point, and they would be an
    example of 'lavender-forward bitters' too." So the plain one is not a
    second category but a bottle she does not yet own, and a bottle is a
    `suggestion`. Re-type as `lavender-forward bitters`; the Bee's Knees was
    its only user.

# Renamed 2026-08-27 for correctness (Helen: "apply correctness rather than the
# fudge of dropping the word"). All three were used by ZERO drinks, so nothing
# broke and nothing here will ever fire -- kept anyway, because a name that used
# to mean something must not blend into the not-declared pile, and the next
# reader should find out these were renamed rather than invented.
retired_whisky_styles:
  "peated Scotch": >-
    peat is ORTHOGONAL to single-malt-versus-blended -- a peated single malt is
    both -- so it was one field carrying two facts. It is a `character` now,
    beside a real style, exactly as blackstrap is for rum (#441, #314). Both
    drinks that used it proved the point: their items read "Peated single malt
    whisky" and "Peated Scotch whisky".
  "blended Scotch": >-
    said neither whisky nor whiskey. Scotch takes WHISKY. Now `blended scotch
    whisky`, lowercase for the same reason cognac and champagne are.
  "Irish": >-
    a demonym on its own is not an ingredient. Now `Irish whiskey` -- Irish
    takes the E.
  "Japanese": >-
    same as `Irish`. Now `Japanese whisky` -- Japanese takes no E.

retired_gin_styles:
  flavoured: >-
    covered everything from sloe to rhubarb to cucumber, which are not
    substitutable for each other, so as a filter button it read simply
    "flavoured" and told you nothing. Replaced by `speciality`, which carries a
    `character` naming the actual botanical. Helen, 2026-08-26.
