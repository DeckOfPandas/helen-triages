# FIVE AROMATISED-WINE GENERICS, AND "AROMATISED WINE" IS NOT ONE OF THEM.
# Helen, 2026-08-30, settling #568: "I would never write 'aromatised wine' as a
# cocktail ingredient or generic, because it suggests some equivalence between
# the types where none or very little exists. So I decided to jump down a level
# of abstraction, and make the generics three vermouths, americano and
# quinquina, because those are what I'd actually write on a recipe."
#
# That is this file's own two-layer rule, applied by her rather than to her: the
# GENERIC is the precise thing a recipe says, and the roll-up belongs in
# `family`, which is "for SEARCH and EXCLUSION only, never a browse axis". The
# family already exists and is `fortified`. So the abstraction she declined to
# write is available to exclude by and appears on no recipe line, and nothing
# needed building.
