# made, never applied, and had no way of surviving the session it happened in.
# That is HANDOVER §11.2's failure in its purest form, and the note is the fix:
# a decision that lives only in a conversation gets made again.
#
# They are what the bottles say on their labels. `Chartreuse Verte` also stops
