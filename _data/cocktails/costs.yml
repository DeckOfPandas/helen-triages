# =============================================================================
# WHAT A DRINK COSTS, APPROXIMATELY. Spec: this file. Prices checked 2026-09-05.
# =============================================================================
# HELEN IS CATERING FOR FAMILY, NOT RUNNING A BAR, and that one sentence decides
# most of what is NOT here. Asked on 2026-09-05 which of dashes, garnishes,
# muddled fruit and ice/salt/sugar should count, she answered: "None of these
# come into the estimated cost." So the rule is mechanical and lives in
# `excluded_units` below -- a pour counts only if its amount is a VOLUME.
# 585 of the collection's 685 pours are; 99 are dashes, drops, leaves, cubes,
# pinches and rinses, and they are free.
#
# NARROWED ON 2026-09-06 (#748), BUILT 2026-09-24: "Price whole fruit and
# weighed solids." A solid that IS the drink -- the pear and four apricots the
# Bellini consists of, the palm sugar the Caipirinha is muddled on -- is not a
# garnish. So the rule now reads: a pour counts if its unit is a VOLUME, or a
# COUNT of a fruit priced in `fruit_prices`, or a WEIGHT priced in
# `weight_prices`; a dash, a leaf, a garnish and ice never count, and a count
# or weight with no row stays free, as it always was. The two blocks are the
# whole of the change; `excluded_units` is untouched.
#
# THE ONE EXCEPTION SHE ASKED FOR IS `to top`. It is a counted unit, so the rule
# above would drop it -- but a splash of champagne is the DEAREST thing in the
# seven glasses that take one, which is noise in no sense at all. Helen,
# 2026-09-05: "We can calculate top volumes, well, slightly, can't we -- I'd
# like that to be captured actually so it can be added into the shopping list
# feature." So `top_up_ml` below is a declared RANGE, and it does double duty:
# it prices the champagne AND it is what lets shopping-list.js report a volume.
# Both halves are live as of 2026-09-08 (#746): three topped sodas read
# "300–450 ml" on the list, where they read "to top (x3)" before. See its own
# note.
#
# IT IS THE ONE BLOCK IN THIS FILE THAT IS NOT A PRICE, and so the one that is
# emitted to the deployed site: cocktails/index.html sends it UNGATED while
# everything else here rides behind `site.show_costs`. A volume is not a price,
# and "300–450 ml of soda water" is what the live shopping list should say too.
#
# WHY A SEPARATE FILE FROM bottles.yml. A price is a different KIND of fact from
# everything in that file. `generic`, `aliases` and the appellation rulings are
# invariant -- Appleton 12 is a moderately-aged Jamaican for as long as the
# bottle exists. A price is true on a day, in a shop, and goes stale on its own
# without anybody editing anything. Putting it beside the rulings would date the
# rulings by association and would bury 130 numbers in 933 lines of prose that
# must not be disturbed to reprice a bottle. `checked:` is this file's honesty,
# and it is the field to distrust first when a total looks wrong.
#
# TWO LAYERS, AND A POUR TAKES THE FIRST THAT ANSWERS.
#   1. the pour NAMES A BOTTLE -> that bottle's price. 247 of 685 pours.
#   2. it names a generic only -> `generics:` below. 438 of 685.
# Layer 2 is not a nicety: the four most-poured things in the collection are
# lime juice (58 pours), lemon juice (34), cane sugar syrup 2:1 (32) and
# pineapple juice (15), and not one of them will ever be a bottle.
#
# THE PAGE SHOWS A RANGE, and the range is not decoration. Helen chose it over a
# single figure on 2026-09-05, and it falls out of the data rather than being
# invented: a generic with several bottles under it spans them. `London dry gin`
# is Beefeater at GBP 18 and Rutte at GBP 26, and a Martini made with either is
# the same drink. A pour that names its bottle is a point, so a drink that names
# every bottle prints one figure -- which is correct, not a bug.
#
# (That example named Anchor Junipiero at GBP 38 as the top until 2026-09-05,
# when Helen removed the bottle. Two things then narrowed the same category on
# the same day: losing Junipiero, and her `default_bottles` ruling settling gin
# on Tanqueray, which now decides it outright. Left corrected rather than
# rewritten, because the POINT the example makes is unchanged.)
#
# CONFIDENCE IS PER ROW AND IT MEANS SOMETHING:
#   high    a UK retail price read off a search result on 2026-09-05.
#   medium  within about 20% for this category; fine for an approximation.
#   low     a genuine guess. OVERWRITE THESE FIRST.
# Master of Malt is the source Helen prefers and it returns HTTP 429 to every
# automated request, so the high rows come from The Whisky Exchange, Tesco,
# Trolley and PriceRunner instead. She is filling the rest in from MoM by hand,
# which is why the sizes are already correct and only `gbp` needs her.
#
# PROMOTIONS ARE DELIBERATELY IGNORED. Appleton Signature was GBP 27 shelf and
# GBP 20 on a Clubcard the day this was written. The shelf price is the one that
# is true in a fortnight.
# =============================================================================

# The day the `high` rows were read. Everything here decays from this date.
checked: "2026-09-05"

# A pour counts only if its unit is a volume. These are the units that mean
# "counted or weighed", straight out of ingredients.yml's `non_volumetric`, and
# a pour measured in one of them contributes NOTHING. Helen's ruling, above.
# `to top` is the exception and is handled by `top_up_ml`, not here.
excluded_units:
  - dash
  - dashes
  - drop
  - drops
  - cube
  - cubes
  - pinch
  - small pinch
  - each
  - leaf
  - leaves
  - sprig
  - strip
  - g
  - half
  - whole
  - to rinse

