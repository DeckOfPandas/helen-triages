# --- fresh fruit, priced per fruit and NOT per litre --------------------------
# THIS BLOCK EXISTS SO THAT #546 IS NOT RETYPED. `juice_yields:` in
# ingredients.yml already carries Helen's own figures -- "Lemons give about 30-45
# ml of juice. Limes 20-30 ml. Medium oranges about 60-80 ml. Grapefruit 180-240
# ml" -- and cocktail-index.js already hands them to the shopping list. A
# per-litre price for lime juice would be a SECOND place those yields are
# implied, and the two would drift the first time she revised one.
#
# So a juice costs `price of one fruit / what one fruit yields`, and the range
# falls out of the two ranges honestly: the cheap end is the cheapest fruit
# giving its best yield, the dear end the dearest fruit giving its worst. Limes
# come out GBP 6.00-15.00 a litre, which is a wide span and a true one.
#
# LIME IS THE MOST-POURED INGREDIENT IN THE WHOLE COLLECTION -- 58 pours, 1473
# ml -- so this block moves the numbers more than any bottle does.
# Prices read 2026-09-05: Tesco loose limes GBP 0.23, Aldi GBP 0.18, lemons from
# GBP 0.22. The top of each range allows for a bad week and for organic.
#
# AND SINCE 2026-09-24 IT PRICES THE FRUIT ITSELF, COUNTED -- #748, Helen's
# ruling of 2026-09-06: "Price whole fruit and weighed solids." A pour written
# `1 whole`, `4 whole`, `1.5 each`, `9 each`, `5 cubes` or `half` of a generic
# with a row here costs that many times the row (half a lime is half a lime's
# price). A counted pour of anything WITHOUT a row here stays a flourish and is
# free, exactly as before: a dozen sugar cubes in a punch is still about 7p and
# still does not spoil a total. The rule the plugin applies is therefore: a pour
# counts if its unit is a volume, OR a count of a fruit priced here, OR a
# weight priced in `weight_prices:` below -- and a dash, a leaf, a garnish and
# ice never count.
#
# THE KEY IS THE GENERIC EXACTLY AS A DRINK WRITES IT. For the four citrus
# fruits that is also what `juice_yields` names, which is how a squeezed juice
# finds its fruit; the rest are only ever counted.
#
# A `basis` says what the figure is PER, where a row is not simply "one fruit":
# blackberries and raspberries are sold by the punnet and poured by the berry,
# cucumber is poured by the wheel and pineapple by the cube, so those rows are
# a punnet or a fruit divided by how many pieces it gives. Those are the rows
# to overwrite first; the derivation is shown so it can be argued with.
fruit_prices:
  lime:       { gbp_min: 0.18, gbp_max: 0.30, confidence: high }
  lemon:      { gbp_min: 0.22, gbp_max: 0.35, confidence: high }
  orange:     { gbp_min: 0.35, gbp_max: 0.55, confidence: medium }
  grapefruit: { gbp_min: 0.80, gbp_max: 1.20, confidence: medium }
  # --- counted whole, #748 (estimates, 2026-09-24; UK supermarket loose/pack) --
  pear:           { gbp_min: 0.40, gbp_max: 0.70, confidence: medium }
  passion fruit:  { gbp_min: 0.40, gbp_max: 0.70, confidence: medium }
  dried apricots: { gbp_min: 0.08, gbp_max: 0.15, basis: "GBP 2-3 / 250 g bag of about 30", confidence: medium }
  blackberries:   { gbp_min: 0.06, gbp_max: 0.12, basis: "GBP 2-3 / 150 g punnet of about 25-30 berries", confidence: medium }
  raspberries:    { gbp_min: 0.05, gbp_max: 0.10, basis: "GBP 2-3 / 150 g punnet of about 30-40 berries", confidence: medium }
  cucumber:       { gbp_min: 0.03, gbp_max: 0.05, basis: "per wheel: GBP 0.60-0.90 a cucumber, about 20 wheels", confidence: low }
  pineapple:      { gbp_min: 0.03, gbp_max: 0.05, basis: "per cube: GBP 1.00-1.50 a pineapple, about 30-40 cubes", confidence: low }

# --- weighed solids, priced per kilogram ---------------------------------------
# THE OTHER HALF OF HELEN'S 2026-09-06 RULING (#748): "Price whole fruit and
# weighed solids." A pour written `N g` of a generic with a row here costs
# N/1000 of the row; a weight with no row here is a flourish and free, as every
# `g` pour was until 2026-09-24. `g` STAYS IN `excluded_units` because that list
# is what the strength and volume arithmetic read, and a spoon of sugar is still
# not a millilitre of anything.
#
# THE SUGARS ARE HERE BECAUSE THEY ARE WEIGHED SOLIDS AND THE RULING SAYS
# "weighed solids". Helen's earlier word (2026-09-05, "None of these come into
# the estimated cost") was about ice, salt and the sugar CUBE dropped in a
# punch, and the cube is still free. 20 g of palm sugar is the Caipirinha's
# second ingredient and costs about 10p, which is the same order as the lime
# beside it. If she would rather sugar by weight stayed free, delete the three
# sugar rows and the drink goes back to withholding its figure.
#
# `gbp_per_kg`, unrounded ranges, and a `basis` naming the shop price so the
# derived figure can be checked against the shelf rather than trusted.
weight_prices:
  honey:               { gbp_per_kg_min: 9.00, gbp_per_kg_max: 18.00, basis: "GBP 3-6 / 340 g jar (supermarket clear honey to Acacia)", confidence: medium }
  golden caster sugar: { gbp_per_kg_min: 1.50, gbp_per_kg_max: 2.50, basis: "GBP 1.50-2.50 / kg", confidence: medium }
  palm sugar:          { gbp_per_kg_min: 4.00, gbp_per_kg_max: 8.00, basis: "GBP 2-4 / 500 g block", confidence: low }

# --- how much a `to top` actually pours ---------------------------------------
# HELEN ASKED FOR THIS DIRECTLY, 2026-09-05: "We can calculate top volumes,
# well, slightly, can't we -- I'd like that to be captured actually so it can be
# added into the shopping list feature."
#
# IT IS A RANGE BECAUSE TOPPING IS NOT MEASURING. You pour until the glass looks
# right, and the glass differs -- a flute takes less than a collins. A single
# figure here would be the same false precision `juice_yields` refuses, so this
# follows that file's shape deliberately.
#
# WHY IT OVERRIDES THE `excluded_units` RULE. `to top` is a non-volumetric unit,
# so the family-not-a-bar rule would drop it -- and it is the only excluded unit
# where that would be wrong. Seven drinks top with champagne or prosecco, and in
# those seven the topper is the DEAREST thing in the glass. Airmail, Bali Hai,
# Drunken Skull, Green Flash, Julien Sorel, Arrack Christmas Punch and Anita's
# Attitude Adjuster all depend on this block for a total worth reading.
#
# THE OTHER CONSUMER IS shopping-list.js, which is the half Helen asked for.
# Today it reports an unquantified pour as "to top (x3)" and says so in its own
# header -- "multiplying by the scaler multiplies the drinks, which is the only
# honest reading" -- because nothing had told it a volume. This tells it one, and
# it is a DECLARED range rather than a conversion the file invented, which is
# the distinction that header was protecting.
top_up_ml:
  champagne:  { ml_min: 75,  ml_max: 100 }
  prosecco:   { ml_min: 75,  ml_max: 100 }
  soda water: { ml_min: 100, ml_max: 150 }

# --- which bottles a category is PRICED from ----------------------------------
# HELEN'S DEFAULTS, given 2026-09-05, with an explicit instruction about where
# they may and may not go: "Don't name these on the recipes, but you can note
# them as inputs to the default prices."
#
# SO THIS IS A PRICING FACT AND NOT A SUGGESTION, and the distinction is the
# whole reason the block exists rather than 40 new `suggestion:` lines across
# the drinks. A `suggestion` is a claim about THIS DRINK -- it says the recipe
# wants this bottle -- and #441 settled that the reason belongs to the recipe.
# "Gin means Tanqueray unless I say otherwise" is not a fact about any one
# drink; it is a fact about her shelf, and putting it on 5 recipes would say
# something she has just declined to say, five times.
#
# WHAT IT CHANGES. Without it, a generic is priced across EVERY bottle declared
# under it, which spans bottles she would not actually pour: `London dry gin`
# ran GBP 18-38, Beefeater to Anchor Junipiero, for a category she says is
# Tanqueray. (Junipiero left the collection hours later, so that span is now
# GBP 18-26 -- but the block is what DECIDES the category, not the accident of
# which bottles remain.) With it, the range is the bottles named here alone --
# so a default of one bottle gives a point price, which is the honest output
# when she has told us there is one answer.
#
# A CATEGORY NOT LISTED HERE IS UNCHANGED and still spans all its bottles. That
# is the right default for a category she has not ruled on: breadth is an
# admission of not knowing, and it should stay until she narrows it.
#
# TWO OF HER RULINGS CANNOT BE WRITTEN HERE YET -- see the note under
# `reposado tequila` below. Every name in this block must be a bottle
# bottles.yml declares, and `test_default_bottles_are_declared_and_priced`
# holds that; adding a bottle to her dictionary on inference is not this
# file's business.
default_bottles:
  # "London dry gin let's say the default is tanqueray, and going forward if I
  # want to commit to something else I'll name it." The other five gins stay
  # declared in bottles.yml -- she owns them -- they are simply not what an
  # unqualified `London dry gin` costs.
  London dry gin: ["Tanqueray"]

  # "orgeat is always Monin". Already the only orgeat declared, so this changes
  # no number today. It is written down anyway because "always" is a RULING and
  # the next orgeat added to bottles.yml would silently widen five drinks
  # without it.
  orgeat: ["Monin Orgeat"]

  # "Mezcal is always Del Maguey Vida unless I discover I need to downgrade!!!!"
  # Same case as orgeat: sole bottle today, ruling recorded for tomorrow.
  mezcal: ["Del Maguey Vida"]

  # "Bianco tequila is Rooster when it doesn't matter loads, Patron Silver if it
  # really does." A two-bottle default is a REAL range rather than an
  # uncertainty: both ends are bottles she pours, chosen by how much the drink
  # cares. Tapatio drops out of the pricing set and stays in the dictionary.
  blanco tequila: ["Rooster Rojo Bianco", "Patrón Silver"]

  # "Cognac is Pierre Ferrand Ambre when it matters more, Hine/Corvoisier/
  # Hennessey when less (not that they're really less expensive, just harsher)."
  # Courvoisier is the only one of that trio bottles.yml declares, so it carries
  # the cheap end. HER PARENTHESIS IS WORTH KEEPING: the cheap end here is not
  # cheaper by much, and the range narrows rather than widens because of it.
  # Pierre Ferrand 1840 is unmentioned and so is not a pricing input.
  cognac: ["Courvoisier", "Pierre Ferrand Ambré"]

  # "Lightly aged and filtered rum will be one of Havana 3 or El Dorado 3 99% of
  # the time." Flor de Caña Extra Dry is the 1% and stays declared. The two are
  # within 50p of each other, so this is nearly a point price -- which is what
  # "99% of the time" ought to produce.
  lightly aged and filtered rum: ["Havana Club 3 year old", "El Dorado 3 Year Old"]

  # "Same for Reposado and Anejo actually" -- the other two thirds of the
  # tequila rule, unwritable on 2026-09-05 morning because three of the four
  # bottles were undeclared. Helen supplied them ("all need diacritics") and
  # they are in bottles.yml now, so the rule reads the same shape as the
  # blanco above: Rooster for when it does not matter, Patrón for when it does.
  reposado tequila: ["Rooster Rojo Tequila Reposado", "Patrón Reposado"]
  añejo tequila: ["Rooster Rojo Tequila Añejo", "Patrón Añejo"]

  # --- the no-mode categories, 2026-09-14 (#1016) ------------------------------
  # WHY THESE SEVEN, AND WHY NOW. #1016 made an unbottled pour's STRENGTH the
  # mode of the bottles declared under its generic ("more meaningful than mean
  # or median"). Measured that day, seven categories had no mode at all -- every
  # bottle a different strength -- so the rule had no answer for them. Asked
  # what should happen, Helen chose "name a default bottle" over the highest,
  # the mean or the median, and named each one in the same sitting.
  #
  # A DEFAULT HERE SETS THE PRICE TOO, and she was told so before choosing: an
  # unbottled bourbon pour now costs a Woodford's rather than the four-bourbon
  # range. That is the rule this block has always had; these are simply the
  # first defaults that arrived for the strength's sake rather than the price's.
  #
  # test_every_bottled_generic_resolves_to_one_strength is what makes the next
  # one arrive the same way: a new bottle that leaves a category with no mode
  # and no default fails the build, naming the category.
  bourbon: ["Woodford's Reserve"]
  absinthe: ["Vieux Pontarlier"]
  cachaça: ["Sagatiba"]
  amontillado sherry: ["Lustau Amontillado"]
  # "Gabriel Boudier Liqueur de Gingembre (18%)" over King's Ginger (41%).
  ginger liqueur: ["Gabriel Boudier Liqueur de Gingembre"]
  maraschino liqueur: ["Luxardo Maraschino"]
  # "If cherry liqueur then Briottet, if cherry brandy then Cherry Heering." The
  # answer split one category into two (bottles.yml): each now has exactly one
  # bottle, so neither default changes a number today. Both are recorded
  # because "if cherry liqueur then Briottet" is a RULING, and the next cherry
  # liqueur added would otherwise silently become a two-bottle mode question --
  # the orgeat argument above.
  cherry liqueur: ["Briottet Crème de Cerise"]
  cherry brandy: ["Cherry Heering"]

  # "Ceylon Arrack: £35 (default coconut flower arrack)" -- Helen, 2026-09-14
  # (#747). The only bottle under the category today, so this changes no
  # number; recorded because "default" is a ruling, as orgeat's is above.
  coconut-flower arrack: ["Ceylon Arrack"]

# --- generics with no bottle behind them --------------------------------------
# 438 of 685 pours name a generic and no bottle, and this is what prices them.
# A generic that DOES have bottles is deliberately absent: its range is computed
# from those bottles, so writing a figure here too would be a second truth.
#
# THREE KINDS OF ROW, AND HELEN DREW THE LINE HERSELF on 2026-09-05: "Campari is
# just Campari, as is chartreuse. They have prices."
#
#   ONE PRODUCT   The generic names a single thing that has one price. min ==
#                 max, and that is not a missing range -- there is nothing to
#                 range over. Campari, both Chartreuses, Aperol, Cynar,
#                 Jagermeister, Becherovka, Grand Marnier.
#   A CATEGORY    Genuinely several bottles wide, none of them declared yet.
#                 champagne, sloe gin, pisco. The range is the span.
#   MADE, NOT BOUGHT  A syrup you cook. Priced from what goes into it, with the
#                 arithmetic shown in `basis` so it can be argued with.
#
# `gbp_per_litre`, NOT a bottle price, because half of these are not sold in
# bottles at all -- a syrup is made, an espresso is pulled, a tea is brewed.
# One unit across all three kinds is what lets the code stay simple.
generics:

  # --- one product, one price (min == max) ------------------------------------
  # GBP per litre = bottle price / bottle size. `basis` shows the shop price so
  # Helen can check that rather than the derived figure.
  Campari:            { gbp_per_litre_min: 29.89, gbp_per_litre_max: 29.89, basis: "GBP 20.92 / 70cl", confidence: high }
  Aperol:             { gbp_per_litre_min: 21.51, gbp_per_litre_max: 21.51, basis: "GBP 15.06 / 70cl", confidence: high }
  Chartreuse Verte:   { gbp_per_litre_min: 68.21, gbp_per_litre_max: 68.21, basis: "GBP 47.75 / 70cl", confidence: high }
  Chartreuse Jaune:   { gbp_per_litre_min: 64.29, gbp_per_litre_max: 64.29, basis: "GBP 45 / 70cl", confidence: medium }
  Grand Marnier:      { gbp_per_litre_min: 40.00, gbp_per_litre_max: 40.00, basis: "GBP 28 / 70cl", confidence: medium }
  Cynar:              { gbp_per_litre_min: 28.57, gbp_per_litre_max: 28.57, basis: "GBP 20 / 70cl", confidence: medium }
  Jägermeister:       { gbp_per_litre_min: 28.57, gbp_per_litre_max: 28.57, basis: "GBP 20 / 70cl", confidence: medium }
  Becherovka:         { gbp_per_litre_min: 31.43, gbp_per_litre_max: 31.43, basis: "GBP 22 / 70cl", confidence: medium }
  Amaro Nonino:       { gbp_per_litre_min: 60.00, gbp_per_litre_max: 60.00, basis: "GBP 42 / 70cl", confidence: medium }
  # HELEN'S OWN PRICE, 2026-09-07: "Amaro Ciociano is GBP 36" -- so 51.43 a
  # litre, up from a guessed 42.86, and `low` becomes `high`. It was one of
  # the few `low` rows left in the file.
  Amaro Ciociaro:     { gbp_per_litre_min: 51.43, gbp_per_litre_max: 51.43, basis: "GBP 36 / 70cl", confidence: high }
  # `liqueur de sapin` and `tomato liqueur` MOVED TO BOTTLES 2026-09-14 (#1012):
  # Briottet Liqueur de Sapin and La Tomato Liqueur, above, at the same prices.
  # HELEN'S OWN FIGURE, 2026-09-14 (#747): "Carlshamns Flaggpunsch: £21
  # (default)". Still a category row rather than a bottle, because bottles.yml
  # declares no Carlshamns and a bottle nobody pours is a different decision;
  # the basis names the bottle so the row can become one when she wants it.
  Swedish flaggpunsch: { gbp_per_litre_min: 30.00, gbp_per_litre_max: 30.00, basis: "Carlshamns Flaggpunsch, GBP 21 / 70cl", confidence: high }
  Plymouth:           { gbp_per_litre_min: 37.14, gbp_per_litre_max: 37.14, basis: "GBP 26 / 70cl", confidence: medium }
  # `coconut-flower arrack` HAD A ROW HERE UNTIL 2026-09-24 (GBP 28 / 75cl,
  # low). It is gone: the Ceylon Arrack bottle prices the category and is its
  # default since Helen's "(default coconut flower arrack)" on 2026-09-14
  # (#747), so a figure here would be a second answer -- see the block header.
  lime cordial:       { gbp_per_litre_min: 7.14,  gbp_per_litre_max: 7.14,  basis: "Rose's, GBP 5 / 70cl", confidence: medium }
  coconut cream:      { gbp_per_litre_min: 5.00,  gbp_per_litre_max: 7.50,  basis: "GBP 2-3 / 400ml tin", confidence: medium }
  # HELEN'S OWN FIGURE, 2026-09-26: "18% ABV, £22" for Clément Mahina Coconut
  # Rhum Liqueur, declared in bottles.yml the same day. The category keeps a
  # row rather than handing everything to the bottle -- the `pineapple vodka`
  # shape rather than the `liqueur de sapin` one -- because ingredients.yml
  # still has Helen reviewing whether `coconut rhum` is the right generic, and
  # a category she may yet rename is not the moment to empty its row.
  # The placeholder this replaces guessed GBP 30-45 and was close.
  coconut rhum:       { gbp_per_litre_min: 31.43, gbp_per_litre_max: 31.43, basis: "GBP 22 / 70cl", confidence: high }
  # HELEN'S OWN FIGURE, 2026-09-14 (#1014): "Use £4.50/litre for both sites."
  # Only this site prices anything -- food's shopping list counts and does not
  # cost (_plugins/food_shopping.rb) -- so this is the one place it can go.
  # The Grasshopper (#984) is the first drink to pour cream by volume.
  cream:              { gbp_per_litre_min: 4.50,  gbp_per_litre_max: 4.50,  basis: "GBP 4.50 / litre", confidence: high }

  # --- a real category: the range is the span of what you might buy ------------
  # `overproof Demerara rum, lightly aged` JOINED THIS BLOCK ON 2026-09-05,
  # when El Dorado 151 went to bottles.yml's `not_reached_for` -- Helen: "I don't own it, I just
  # wanted to, but it looks like it's hard to get." It was the only bottle in
  # the category, so the category lost its price with it, and two drinks still
  # pour it (pic-a-de-crop-punch's 360 ml, zombie-intoxica's 15 ml).
  #
  # PRICING A CATEGORY SHE CANNOT CURRENTLY BUY IS THE CONSISTENT ANSWER, not a
  # contradiction. 78 of the 154 categories in use have no bottle behind them
  # and every one of them is priced here; champagne two lines down is no more
  # "on the shelf" than this is. The fallback answers "what would a litre of
  # this cost", which has an answer whether or not a bottle is open. The RANGE
  # is wide and deliberately so: scarcity is exactly what she ran into.
  overproof Demerara rum, lightly aged: { gbp_per_litre_min: 57.14, gbp_per_litre_max: 85.71, basis: "GBP 40-60 / 70cl, scarce in the UK", confidence: low }
  # `tawny port` JOINED FOR THE SAME REASON, hours later. Ottoman 10 Year Tawny
  # was the only one declared and Helen removed it -- "the three Lows I skipped,
  # let's remove them from the collection please" -- leaving Port Authority's
  # 22.5 ml with nothing to price it from. A 10-year tawny is not scarce the way
  # an overproof Demerara is, so this range is ordinary rather than punitive.
  tawny port:         { gbp_per_litre_min: 20.00, gbp_per_litre_max: 40.00, basis: "GBP 15-30 / 75cl", confidence: low }
  # HELEN'S OWN FIGURE, 2026-09-05: "Let's say champage is GBP 20 -- I buy
  # crates of Heidsieck Blue Top on sale at Christmas!!!!!" A POINT PRICE, not a
  # range, because she buys ONE THING at ONE PRICE rather than shopping the
  # category -- which is the same reason Campari is a point price, arrived at
  # from the opposite direction.
  #
  # IT REPLACES MY GBP 22-40 GUESS, the single widest source of spread left in
  # the collection: six of the ten widest-ranging drinks -- Bali Hai, Green
  # Flash, Airmail, Drunken Skull, Julien Sorel, Arrack Christmas Punch -- were
  # wide ONLY because of this row.
  #
  # HEIDSIECK BLUE TOP IS NOT DECLARED AS A BOTTLE, deliberately. She named it as
  # the reason for the number rather than as a suggestion, and `champagne` is a
  # category she buys one of on offer, not a bottle she reaches for by name. If
  # it should be a bottle that is a two-line change, and this comment is where
  # the question was left.
  champagne:          { gbp_per_litre_min: 26.67, gbp_per_litre_max: 26.67, basis: "Heidsieck Blue Top, GBP 20 / 75cl", confidence: high }
  prosecco:           { gbp_per_litre_min: 10.67, gbp_per_litre_max: 18.67, basis: "GBP 8-14 / 75cl", confidence: medium }
  red wine:           { gbp_per_litre_min: 9.33,  gbp_per_litre_max: 16.00, basis: "GBP 7-12 / 75cl", confidence: medium }
  white wine:         { gbp_per_litre_min: 9.33,  gbp_per_litre_max: 16.00, basis: "GBP 7-12 / 75cl, same range as red wine, not separately checked", confidence: low }
  sloe gin:           { gbp_per_litre_min: 32.00, gbp_per_litre_max: 44.00, basis: "GBP 16-22 / 50cl", confidence: medium }
  aquavit:            { gbp_per_litre_min: 37.14, gbp_per_litre_max: 48.57, basis: "GBP 26-34 / 70cl", confidence: medium }
  pisco:              { gbp_per_litre_min: 34.29, gbp_per_litre_max: 45.71, basis: "GBP 24-32 / 70cl", confidence: medium }
  apple brandy:       { gbp_per_litre_min: 40.00, gbp_per_litre_max: 57.14, basis: "GBP 28-40 / 70cl", confidence: medium }
  navy strength gin:  { gbp_per_litre_min: 42.86, gbp_per_litre_max: 57.14, basis: "GBP 30-40 / 70cl", confidence: medium }
  apple schnapps:     { gbp_per_litre_min: 22.86, gbp_per_litre_max: 31.43, basis: "GBP 16-22 / 70cl", confidence: low }
  # NEW 2026-09-14 (#1013). HELEN'S OWN FIGURE, "£12"; 70cl assumed, the size
  # every schnapps row here uses. A point price rather than a range, the
  # pineapple-vodka case: she named the thing she buys.
  peach schnapps:     { gbp_per_litre_min: 17.14, gbp_per_litre_max: 17.14, basis: "GBP 12 / 70cl", confidence: high }
  crème de cassis:    { gbp_per_litre_min: 22.86, gbp_per_litre_max: 34.29, basis: "GBP 16-24 / 70cl", confidence: medium }
  # HELEN'S OWN FIGURE, 2026-09-09: "I have Ciroc, GBP 31, 37.5%." My guess was
  # GBP 20-26, so the range was about 20% under. 70cl assumed -- the size she
  # did not state and the one every other row here uses.
  pineapple vodka:    { gbp_per_litre_min: 44.29, gbp_per_litre_max: 44.29, basis: "GBP 31 / 70cl", confidence: high }
  aguardiente:        { gbp_per_litre_min: 25.71, gbp_per_litre_max: 37.14, basis: "GBP 18-26 / 70cl", confidence: low }
  kirschwasser:       { gbp_per_litre_min: 42.86, gbp_per_litre_max: 62.86, basis: "GBP 30-44 / 70cl", confidence: low }
  # NEW 2026-09-18, with Gunmetal Blue's first pour of the generic. Helen ruled
  # the drink is peach brandy and dropped its Briottet suggestion -- "that's
  # what I had at the time" -- so the pour has no bottle behind it and this row
  # is the only thing that can price it.
  #
  # `low`, AND THE RANGE IS SAT BETWEEN ITS TWO DECLARED SIBLINGS rather than
  # read off a shelf: apple brandy is GBP 28-40 and kirschwasser GBP 30-44, and
  # a peach brandy is scarcer in the UK than either, so the top is a little
  # above both. NOT CHECKED IN A SHOP -- that is exactly what `low` says here,
  # and it is the row to correct first if Helen ever buys one.
  peach brandy:       { gbp_per_litre_min: 40.00, gbp_per_litre_max: 60.00, basis: "GBP 28-42 / 70cl, sat between apple brandy and kirschwasser, not shop-checked", confidence: low }

  # --- made, not bought -------------------------------------------------------
  # THE ARITHMETIC IS IN `basis` ON PURPOSE. A syrup's price is the only kind
  # here that can be checked without a shop: sugar at about GBP 1/kg dissolves
  # into roughly 1.6 litres at 1:1 and 2.2 at 2:1, so a litre of 2:1 costs about
  # 90p. If that looks wrong the sum is right there to correct.
  cane sugar syrup 1:1: { gbp_per_litre_min: 0.60, gbp_per_litre_max: 1.00, basis: "1kg sugar @ GBP 1 + 1L water -> ~1.6L", confidence: medium }
  cane sugar syrup 2:1: { gbp_per_litre_min: 0.90, gbp_per_litre_max: 1.40, basis: "2kg sugar @ GBP 1 + 1L water -> ~2.2L", confidence: medium }
  # THE `2:1` IN THE BASIS WAS ALREADY HERE before the generic said it --
  # this row priced demerara at 2:1 while the generic carried no ratio at
  # all, which is how #594 found the gap. Helen ruled 2:1 on 2026-09-06 and
  # the costing needed no change, only the name.
  demerara sugar syrup 2:1: { gbp_per_litre_min: 1.50, gbp_per_litre_max: 2.20, basis: "demerara @ GBP 1.80/kg, 2:1", confidence: medium }
  # Turbinado is a raw cane sugar and sits between white and demerara on the
  # shelf; priced against demerara because that is the nearer neighbour.
  turbinado sugar syrup 2:1: { gbp_per_litre_min: 1.50, gbp_per_litre_max: 2.30, basis: "turbinado @ GBP 1.90/kg, 2:1", confidence: medium }
  # 1:1 IS THE CHEAPER OF THE TWO, because the ratio is honey:water and so 2:1
  # carries more honey. 2:1 is two thirds honey; 1:1 is one half. Honey is all
  # of the cost and water is none of it, so 1:1 is priced at three quarters of
  # 2:1 exactly: 13.00 -> 9.75 and 18.00 -> 13.50.
  #
  # Arrived 2026-09-07 with chartreuse-daiquiri, the first drink to use 1:1 --
  # its own note says "Honey water is equal parts honey and water", which is
  # what settled its ratio when the other four went to 2:1 on Helen's word.
  honey water 1:1:    { gbp_per_litre_min: 9.75, gbp_per_litre_max: 13.50, basis: "honey @ GBP 17.60/kg, 1:1", confidence: medium }
  honey water 2:1:    { gbp_per_litre_min: 13.00, gbp_per_litre_max: 18.00, basis: "honey @ GBP 17.60/kg, 2:1", confidence: medium }
  # NEW 2026-09-25 (#1108), Helen's generic for Fanny Chu's Piña Colada: three
  # parts Coco Lopez to one part coconut milk. NOT priced off `coconut cream`
  # above -- Coco Lopez is sweetened cream of coconut, a different tin -- and
  # neither tin price is shop-checked, which is what `low` says. The sum: Coco
  # Lopez GBP 3-4 / 425 ml (7.05-9.40/L) x 3, coconut milk GBP 1-1.60 / 400 ml
  # (2.50-4.00/L) x 1, over 4 -> GBP 5.90-8.05/L. Overwrite when she prices it.
  "Coco mix (3:1, Coco Lopez to coconut milk)": { gbp_per_litre_min: 5.90, gbp_per_litre_max: 8.05, basis: "(3 x Coco Lopez @ GBP 7.05-9.40/L + 1 x coconut milk @ GBP 2.50-4.00/L) / 4, tin prices guessed", confidence: low }
  agave syrup:        { gbp_per_litre_min: 8.00,  gbp_per_litre_max: 14.00, basis: "GBP 3.50 / 350g", confidence: medium }
  vanilla syrup:      { gbp_per_litre_min: 8.00,  gbp_per_litre_max: 14.00, basis: "Monin GBP 8 / 70cl, or made", confidence: medium }
  grenadine:          { gbp_per_litre_min: 8.00,  gbp_per_litre_max: 14.00, basis: "Monin GBP 8 / 70cl, or made", confidence: medium }
  espresso:           { gbp_per_litre_min: 8.00,  gbp_per_litre_max: 18.00, basis: "18g @ GBP 15-25/kg -> ~30ml", confidence: medium }
  black tea:          { gbp_per_litre_min: 0.30,  gbp_per_litre_max: 0.80, basis: "one bag per ~250ml", confidence: medium }
  fruit purée:        { gbp_per_litre_min: 8.00,  gbp_per_litre_max: 14.00, basis: "GBP 4-7 / 500ml", confidence: low }
  egg white:          { gbp_per_litre_min: 8.00,  gbp_per_litre_max: 12.00, basis: "GBP 0.30 per egg, ~30ml white", confidence: medium }

  # --- bought, and barely worth counting, but counted anyway ------------------
  # These are here so that a total never silently omits something. Under a
  # pound a litre they change nothing, and that is the point of checking.
  soda water:         { gbp_per_litre_min: 0.35, gbp_per_litre_max: 1.20, basis: "GBP 0.25-0.85 / 75cl", confidence: medium }
  cola:               { gbp_per_litre_min: 1.20, gbp_per_litre_max: 2.00, basis: "supermarket", confidence: medium }
  # TWO PLACEHOLDERS, 2026-09-20, added so that typing a pour does not fail
  # the price test -- NOT SHOP-CHECKED, and Helen has not seen these figures.
  # `ginger beer` came in with the Moscow Mule and Dark 'n' Stormy, `milk` with
  # Rum Cow. Both are a supermarket-shelf range and nothing more precise; replace
  # them with a real price and raise the confidence.
  ginger beer:        { gbp_per_litre_min: 1.00, gbp_per_litre_max: 2.50, basis: "PLACEHOLDER, supermarket range, not shop-checked", confidence: low }
  milk:               { gbp_per_litre_min: 1.00, gbp_per_litre_max: 1.60, basis: "PLACEHOLDER, supermarket range, not shop-checked", confidence: low }
  pineapple juice:    { gbp_per_litre_min: 1.20, gbp_per_litre_max: 2.00, basis: "carton", confidence: medium }
  apple juice:        { gbp_per_litre_min: 1.00, gbp_per_litre_max: 1.80, basis: "carton", confidence: medium }
  cider vinegar:      { gbp_per_litre_min: 3.00, gbp_per_litre_max: 6.00, basis: "supermarket", confidence: medium }

  # --- free -------------------------------------------------------------------
  # `water` is already kept off cards and out of the shopping list by
  # ingredients.yml's `not_on_cards`. It is declared here too so that a reader
  # of THIS file does not have to wonder whether it was forgotten.
  water:              { gbp_per_litre_min: 0, gbp_per_litre_max: 0, basis: "tap", confidence: high }

  # THE SUGARS ARE ZERO ON PURPOSE, AND ZERO IS NOT THE SAME AS ABSENT. Helen
  # excluded sugar from the estimate outright (2026-09-05), and almost every
  # sugar pour is already gone because it is weighed or counted -- `75 g`,
  # `12 cubes`. Zombie Intoxica is the one that gets through: `5 ml` of
  # `raw sugar` or `molasses sugar`, a spoon measure of a dry solid, which is a
  # volume and so passes the `excluded_units` gate.
  #
  # Left undeclared it was the collection's ONLY unpriced pour, and an unpriced
  # pour is indistinguishable from a vocabulary the file has not caught up with
  # -- which is the thing `test_every_priceable_pour_has_a_price` exists to
  # catch. Declaring it zero says "counted, and it costs nothing", so the test
  # can demand a price for everything without that one drink forcing an
  # exception into the test itself. Sixteen cubes of sugar is about 7p; the
  # rounding on any drink here is wider than that.
  raw sugar:          { gbp_per_litre_min: 0, gbp_per_litre_max: 0, basis: "excluded by Helen's ruling", confidence: high }
  molasses sugar:     { gbp_per_litre_min: 0, gbp_per_litre_max: 0, basis: "excluded by Helen's ruling", confidence: high }
  white sugar:        { gbp_per_litre_min: 0, gbp_per_litre_max: 0, basis: "excluded by Helen's ruling", confidence: high }
  golden caster sugar: { gbp_per_litre_min: 0, gbp_per_litre_max: 0, basis: "excluded by Helen's ruling", confidence: high }
  palm sugar:         { gbp_per_litre_min: 0, gbp_per_litre_max: 0, basis: "excluded by Helen's ruling", confidence: high }
  sugar cube:         { gbp_per_litre_min: 0, gbp_per_litre_max: 0, basis: "excluded by Helen's ruling", confidence: high }
  salt:               { gbp_per_litre_min: 0, gbp_per_litre_max: 0, basis: "excluded by Helen's ruling", confidence: high }

  # --- squeezed, so priced from `fruit_prices` and `juice_yields` -------------
  # NO FIGURE HERE ON PURPOSE. `from_fruit` names the entry in `juice_yields:`
  # to divide the fruit price by; see the `fruit_prices` note above for why the
  # yields are not restated.
  lime juice:         { from_fruit: lime juice }
  lemon juice:        { from_fruit: lemon juice }
  orange juice:       { from_fruit: orange juice }
  grapefruit juice:   { from_fruit: grapefruit juice }
  # Priced off the same fruit: a ruby grapefruit is not dearer than a white one
  # and the yield is identical. The generic is separate because the FLAVOUR
  # differs, not the cost.
  ruby grapefruit juice: { from_fruit: grapefruit juice }
