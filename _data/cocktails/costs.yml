# --- fresh fruit, priced per piece and not per litre ---
# A squeezed juice costs the fruit's price divided by its yield, and the
# yields live only in `juice_yields` in ingredients.yml (#546): a per-litre
# juice price here would be a second place they are implied.
# A counted pour (`1 whole`, `9 each`, `5 cubes`, `half`) of a generic with a
# row here costs that many times the row (#748). The key is the generic
# exactly as a drink writes it. A `basis` says what the figure is per, where a
# row is not simply one fruit.
fruit_prices:
  lime:       { gbp_min: 0.18, gbp_max: 0.30, confidence: high }
  lemon:      { gbp_min: 0.22, gbp_max: 0.35, confidence: high }
  orange:     { gbp_min: 0.35, gbp_max: 0.55, confidence: medium }
  grapefruit: { gbp_min: 0.80, gbp_max: 1.20, confidence: medium }
  # --- counted whole (#748): estimates ---
  pear:           { gbp_min: 0.40, gbp_max: 0.70, confidence: medium }
  passion fruit:  { gbp_min: 0.40, gbp_max: 0.70, confidence: medium }
  dried apricots: { gbp_min: 0.08, gbp_max: 0.15, basis: "GBP 2-3 / 250 g bag of about 30", confidence: medium }
  blackberries:   { gbp_min: 0.06, gbp_max: 0.12, basis: "GBP 2-3 / 150 g punnet of about 25-30 berries", confidence: medium }
  raspberries:    { gbp_min: 0.05, gbp_max: 0.10, basis: "GBP 2-3 / 150 g punnet of about 30-40 berries", confidence: medium }
  cucumber:       { gbp_min: 0.03, gbp_max: 0.05, basis: "per wheel: GBP 0.60-0.90 a cucumber, about 20 wheels", confidence: low }
  pineapple:      { gbp_min: 0.03, gbp_max: 0.05, basis: "per cube: GBP 1.00-1.50 a pineapple, about 30-40 cubes", confidence: low }
  # Estimates (#1302): the slice is the `orange` row divided by eight.
  orange slice:      { gbp_min: 0.04, gbp_max: 0.07, basis: "per slice: GBP 0.35-0.55 an orange, about 8 slices", confidence: low }
  maraschino cherry: { gbp_min: 0.05, gbp_max: 0.25, basis: "per cherry: GBP 2 / jar of about 40 to GBP 10-12 / 400 g Luxardo jar of about 50", confidence: low }

# --- weighed solids, priced per kilogram ---
# A pour written `N g` of a generic with a row here costs N/1000 of the row
# (#748). `g` stays in `excluded_units`, which the strength and volume
# arithmetic read. `basis` names the shop price the figure derives from.
#
# Sugar by weight costs nothing (#1371). Its rows are zero, not absent: a
# weighed generic with no row makes the drink withhold its whole figure.
weight_prices:
  honey:               { gbp_per_kg_min: 9.00, gbp_per_kg_max: 18.00, basis: "GBP 3-6 / 340 g jar (supermarket clear honey to Acacia)", confidence: medium }
  golden caster sugar: { gbp_per_kg_min: 0, gbp_per_kg_max: 0, basis: "excluded by Helen's ruling", confidence: high }
  palm sugar:          { gbp_per_kg_min: 0, gbp_per_kg_max: 0, basis: "excluded by Helen's ruling", confidence: high }

# --- how much a `(top)` pours ---
# A declared range, because topping is not measuring (DECISIONS §9.3.5). It
# prices the topper, which is the dearest thing in a champagne-topped glass,
# and gives the shopping list a volume. The one block here that is not a
# price: cocktails/index.html emits it ungated, to the deployed site too.
# Every `(top)` pour's generic needs a row
# (test_top_up_volumes_cover_every_to_top_pour).
top_up_ml:
  champagne:  { ml_min: 75,  ml_max: 100 }
  prosecco:   { ml_min: 75,  ml_max: 100 }
  soda water: { ml_min: 100, ml_max: 150 }

# --- which bottles a category is priced from ---
# Helen's defaults: pricing inputs, never named on a recipe (DECISIONS
# §9.3.5). A generic listed here is priced from these bottles alone, so one
# bottle gives a point price; an unlisted generic spans every bottle declared
# under it. A default also supplies the strength where the category's bottles
# have no mode (#1016). Each name must be a priced bottle that bottles.yml
# declares under that generic.
# test_default_bottles_are_declared_priced_and_in_the_right_category
default_bottles:
  # The other gins stay declared; they are not what an unqualified `London dry
  # gin` costs.
  London dry gin: ["Tanqueray"]

  # Orgeat and mezcal each have one answer, on Helen's ruling. Recorded so
  # that the next bottle declared under either does not widen the range.
  orgeat: ["Monin Orgeat"]

  mezcal: ["Del Maguey Vida"]

  # A two-bottle default is a real range: Rooster when it matters little,
  # Patrón when it matters. Reposado and añejo below follow the same rule.
  blanco tequila: ["Rooster Rojo Bianco", "Patrón Silver"]

  # Pierre Ferrand 1840 is declared and is not a pricing input.
  cognac: ["Courvoisier", "Pierre Ferrand Ambré"]

  # The other bottles under this generic stay declared and are not inputs.
  lightly aged and filtered rum: ["Havana Club 3 year old", "El Dorado 3 Year Old"]

  # What Helen pours in a sociable, many-layered drink with normal guests. The
  # opinionated bottles, Gosling's for blackstrap and the Pusser's for bite are
  # each a recipe's `suggestion`, not the category's price (DECISIONS §9.3.5).
  moderately aged rum: ["Planteray 5 Year Old Barbados", "Havana Club 7 year old"]

  # Gabriel Boudier's is a 50cl bottle at nearly half as much again per
  # litre, and a drink that wants it names it.
  triple sec: ["Cointreau", "L'Original Combier Triple Sec"]

  reposado tequila: ["Rooster Rojo Tequila Reposado", "Patrón Reposado"]
  añejo tequila: ["Rooster Rojo Tequila Añejo", "Patrón Añejo"]

  # --- named for the strength's sake (#1016) ---
  # Each of these categories has bottles with no modal strength.
  # test_every_bottled_generic_resolves_to_one_strength fails a category with
  # neither a mode nor a default.
  bourbon: ["Woodford's Reserve"]
  absinthe: ["Vieux Pontarlier"]
  cachaça: ["Sagatiba"]
  amontillado sherry: ["Lustau Amontillado"]
