# What a drink costs, approximately (#547, DECISIONS §9.3.5). Shown on local
# builds only, behind `site.show_costs`.
#
# A pour counts if its amount is a volume, a count of a fruit in
# `fruit_prices`, or a weight in `weight_prices`. Dashes, garnishes and ice
# never count; `(top)` does, through `top_up_ml`.
#
# A pour that names a bottle takes that bottle's price. Otherwise its generic
# is a range across the bottles declared under it (narrowed by
# `default_bottles`) and any row in `generics:`.
#
# `confidence` per row: high is a shelf price read on the `checked` date or
# Helen's own figure; medium is within about 20% for the category; low is a
# guess, and the first to overwrite. Shelf prices, never promotions.

# The day the prices were read. A test fails once it is two years old (#749);
# the fix is re-reading the prices, never moving the date alone.
checked: "2026-09-05"

# Units that are counted or weighed: a pour in one adds no volume. Each must
# be a unit ingredients.yml declares. `(top)` is deliberately absent: it
# costs, through `top_up_ml`. The strength and volume arithmetic read this
# list too.
excluded_units:
  - dash
  - dashes
  - drop
  - drops
  - cube
  - cubes
  - pinch
  - small pinch
  - each
  - large
  - leaf
  - leaves
  - sprig
  - strip
  - g
  - half
  - whole
  - (rinse)
  - (sprinkle)

