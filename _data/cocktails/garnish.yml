# Cocktail garnishes: a closed vocabulary, so one garnish is written one way
# on every drink. Not a filter: the index has no garnish filter.
# test_every_garnish_is_declared requires each garnish on each drink to appear
# under `canonical`.
#
# Strings whose extra words carry information stay apart: `lime wedge on rim`
# says where it goes, `(discarded)` and `(floated)` say how it is handled,
# `Luxardo maraschino cherry` names a different object. A count stays only
# where the count is the spec (`three coffee beans`).

# The decision, not a garnish: `["no garnish"]` means this drink takes none,
# `[]` means nobody has filled it in. It may only appear alone
# (test_no_garnish_is_stated_as_no_garnish_and_nothing_else). The layout
# prints the stored word, which is why it is not `none`.
no_garnish: "no garnish"

# "Either of these, maker's choice" is ONE string with the "or" inside it
# (`orange or lemon twist`; three options take commas and a final "or"). A
# `garnish:` list is conjunctive, so two entries would ask for both. Declared
# under `canonical` in the first-named option's group.

# --- THE VOCABULARY ----------------------------------------------------------
# Group name -> list, so every garnish sits in exactly one group
# (test_every_declared_garnish_has_exactly_one_group). An entry stays a plain
# string. scripts/build_ingest_vocab.py prints each group key as a heading in
# the ingest document, so renaming a group or moving a garnish changes that
# document. A garnish no drink uses is deleted, not kept (#1186).
canonical:

  # A twist is a strip of zest, so the name is `lemon twist`, never `lemon zest
  # twist`. `twist` in a garnish makes the layout add an "Express the twist"
  # step; a coin, a spiral or a length of peel is a different cut and gets
  # none.
  citrus_peel:
    - "lemon twist"
    - "lemon twist (discarded)"
    - "orange twist"
    - "orange twist (discarded)"
    - "orange or lemon twist"
    - "grapefruit twist"
    - "flamed orange zest coin"
    # Not a twist: the source never says to express it.
    - "length of lime peel"
    - "lime twist"
    - "lime twist (discarded)"
    # A twist, not the coin above.
    - "flamed orange twist"
    # A spiral is not a twist: the word keeps the express step off.
    - "lemon spiral"
    # Maker's choice, one string.
    - "lemon spiral or mint bouquet"
    # Worded to complete "Garnish with ...", so it is in `no_article` below.
    - "orange peel over the rim (cut to look like a beak)"

  citrus_cut:
    - "lime wedge"
    - "lime wedge on rim"
    - "lime wheel"
    # Maker's choice, one string.
    - "lime wheel or wedge"
    - "lemon wheel"
    - "lemon slice"
    - "orange slice"
    - "orange wheel"
    - "grapefruit crescents"
    - "citrus wheel"
    - "dehydrated lime slice wheel"
    # `empty` is what makes it a garnish: the lime is juiced into the drink
    # and the husk is left. It brings its own article.
    - "half an empty lime shell"
    - "grapefruit wedge"
    - "dehydrated blood orange slice wheel"
    # One garnish you build, not two to split: the sail is the point.
    - "lemon wheel and skewered maraschino cherry (like a sail)"

  fruit:
    - "pineapple wedge"
    - "pineapple wedge (cut to resemble a bird's plumage)"
    # `on rim` says where to put it.
    - "pineapple wedge on rim"
    - "apricot wedge on rim"
    # A quarter of a wheel in its source; the quarter is not recorded.
    - "pineapple wheel"
    - "blackberry"
    - "dried apple slice"
    # Not a second spelling of the dried one.
    - "apple slice"
    - "banana chip"
    # One on a pick, not the scatter `raspberries` below names.
    - "skewered raspberry"
    # No article in the string: the garnish step adds its own.
    - "skewered blueberry"
    # The count is the spec: the cherries are the dots, the frond the dash.
    # Spelled out because a garnish opening with a digit reads as a pour to
    # test_a_garnish_is_not_an_ingredient_or_a_rim.
    - "three skewered maraschino cherries and a pineapple frond"
    # No count: a count stays only where it is the spec.
    - "raspberries"
    # Deliberately unspecific: it names the shape and leaves the fruit to the
    # maker. A known exception, not a precedent for another vague garnish.
    - "fruit wedges"
    - "half an empty passion fruit shell"

  # The qualified cherries stay apart: a Luxardo is a different object from a
  # cocktail cherry, and `skewered` says how it is served.
  cherries:
    - "brandied cherry"
    - "maraschino cherry"
    - "Luxardo maraschino cherry"
    - "skewered maraschino cherry"
    # Singular, and no count, like `skewered maraschino cherry`.
    - "skewered brandied cherry"
    - "fruit stick (skewered pineapple cubes and a maraschino cherry)"
    # A second fruit stick, kept apart from the one above on Helen's word.
    - "fruit stick (skewered pineapple cube, raspberry and Luxardo maraschino cherry)"
    # Fresh, as against the preserved cherries above.
    - "fresh cherries"

  herbs_and_leaves:
    - "mint sprig"
    - "mint bouquet"
    - "rosemary sprig"
    - "pineapple frond"
    - "kaffir lime leaves"
    - "cucumber wheels"
    - "edible violet"
    - "edible orchid"
    # The Grasshopper wears this with a mint sprig and grated nutmeg, all
    # three at once.
    - "mint leaf"
    - "thyme sprig"
    # A floated garnish carries `(floated)` as a tail, as `(discarded)` does on
    # a twist: the head stays the thing.
    - "basil leaf (floated)"
    # Not `cucumber wheels` above, which sit on the rim of a long drink.
    - "thin cucumber slice (floated)"
    # Named to match `length of lime peel`; never expressed.
    - "length of cucumber peel"

  spice_and_other:
    - "grated nutmeg"
    - "grated chocolate"
    # A garnish here, not a pour: dashed over the top with no count.
    - "Angostura bitters"
    # A mass noun, so it is in `no_article` below.
    - "whipped cream"
    - "cinnamon stick"
    # Different objects: a wheel off a raw root, and a slice of stem ginger
    # out of its syrup. Another cut of ginger gets its own entry.
    - "ginger wheel"
    - "stem ginger slice"
    - "skewered crystallised ginger"
    # A mass noun, so it is in `no_article` below.
    - "desiccated coconut"
    - "star anise (floated)"
    # The colour is the garnish.
    - "skewered green olive"
    - "skewered black olives"
    # The breed is in the garnish; the drink's note carries the speech.
    - "small stuffed dead Norwegian Blue"
    # The count is the spec: three coffee beans is the Espresso Martini.
    - "three coffee beans"

# LEFT: the string exactly as a drink says it today. RIGHT: what it might
# become, or `QQ` where a judgement is needed. A row is resolved by deleting
# it, one way or the other. The key stays when empty: a missing key switches
# test_every_garnish_proposal_still_matches_a_real_string off.
proposals: {}

# Garnishes the generated "Garnish with ..." step must not put an article in
# front of. `_layouts/cocktail.html` picks `a` or `an` from the first letter
# and drops the article before a final `s` (#1143), so this needs only what
# that cannot reach: a mass noun, or a phrase that brings its own article.
# The plurals listed are from before #1143 and are harmless.
no_article:
  - grapefruit crescents
  - raspberries
  - kaffir lime leaves
  - cucumber wheels
  - grated nutmeg
  - grated chocolate
  - whipped cream                       # a mass noun
  - desiccated coconut                  # a mass noun
  - three coffee beans
  - three skewered maraschino cherries and a pineapple frond
  - orange peel over the rim (cut to look like a beak)
  - half an empty lime shell            # brings its own "half an"
  - half an empty passion fruit shell   # brings its own "half an"
  - no garnish                          # never rendered as a step anyway
