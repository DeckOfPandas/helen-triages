# =============================================================================
# COCKTAIL GARNISHES. Requested by Helen, 2026-08-31.
# =============================================================================
# WHY THIS EXISTS, AND IT IS NOT SO ANYTHING CAN BE FILTERED. There is no
# garnish filter on the index and this file is not a step towards one -- the
# same ruling taxonomy.yml makes about glasses and spirits. It exists for
# #290's reason, the one that earned methods.yml: a shape that changes every
# time has to be RE-READ, where an identical repeated one becomes something you
# RECOGNISE. That matters most in the situation Helen named for the method
# steps -- people in the house, and thirsty.
#
# THE CENSUS THAT PRODUCED IT, 2026-08-31: 130 garnish entries across 123
# drinks, in 65 distinct strings, for perhaps 35 actual garnishes. `mint sprig`
# / `mint sprigs` / `mint bouquet` / `mint sprigs bouquet` was one garnish
# wearing four faces; so were `brandied cherry` / `brandied cherries`, both
# wheel pairs, and `lime wedge` / `one lime wedge`. Collapsing only the
# unambiguous drift -- singulars, plurals, a stray article -- took 65 to 55
# without losing a word that carried information.
#
# THEN 55 TO 49, working the proposals through with Helen the next day: the
# four zest-twist pairs collapsed to their short form, three compound strings
# split into the two garnishes they each named, and one incidental count came
# off. 65 to 49 in total, with every rejection recorded in place rather than
# as an absence.
#
# WHAT IS DELIBERATELY NOT COLLAPSED. `lime wedge on rim` says where to put it.
# `orange zest twist (discarded)` says it does not stay in the drink.
# `luxardo maraschino cherry` names a bottle that genuinely differs from a
# bright red cocktail cherry. Applying methods.yml's own test -- does the
# phrasing carry information? -- keeps all three apart.
#
# HOW IT IS ENFORCED. `test_every_garnish_is_declared` requires each garnish on
# each drink to appear below. The list starts as the collection's real
# vocabulary, undeclared values and all, so it is a RATCHET: it cannot fail on
# what is already here and it bites on the next new spelling. That is the same
# bargain glasses.yml's canonical map and the `<family>_characters` lists
# strike -- declaring a value is what switches enforcement on.
#
# NOTHING HERE REWRITES A DRINK. `proposals` holds the strings that still want
# a judgement, left beside what they might become, exactly as methods.yml does.
# Helen, on that file: "Prefer both, leaving my original too, then I delete
# whatever I don't want." Deleting a row is how a suggestion is rejected.
# =============================================================================

# THE DECISION, NOT A GARNISH. `["no garnish"]` means this drink takes one;
# `[]` means nobody has filled it in yet. It may only ever appear ALONE, which
# is what stops it becoming a fake member of the vocabulary below --
# test_no_garnish_is_stated_as_no_garnish_and_nothing_else owns that rule.
#
# IT WAS `none` UNTIL 2026-08-31 AND THE RENAME IS ABOUT THE PAGE. The layout
# joins this list straight into the drink page, so the stored word is the word
# a reader sees. Helen: "'no garnish' actually, because none might read like
# 'not filled in' even though you and I know that's not the case."
no_garnish: "no garnish"

# --- THE VOCABULARY ----------------------------------------------------------
# Grouped for reading only. tests/test_cocktails.py flattens every list under
# `canonical`, so a group added tomorrow is covered tomorrow -- the same shape
# methods.yml and ingredients.yml both use.
canonical:

  # Peel. The commonest garnish in the collection by a distance.
  #
  # A TWIST IS A STRIP OF ZEST, so `lemon zest twist` and `lemon twist` were one
  # garnish written two ways. Helen collapsed all four pairs to the short form
  # on 2026-08-31 -- the shortest name that says what it is, which is the rule
  # she already applied to card names. Ten strings became eight, and eleven
  # drinks were retyped.
  #
  # THE TAILS SURVIVE THE COLLAPSE because they carry information the head does
  # not: `(discarded)` says the peel does not stay in the drink, and `after
  # expressing over cocktail` says the opposite. Only the head form was
  # normalised. `flamed orange zest coin` keeps its `zest` -- a coin is a
  # different cut from a twist, not a longer name for one.
  citrus_peel:
    - "lemon twist"
    - "lemon twist (discarded)"
    - "lemon twist after expressing over cocktail"
    - "orange twist"
    - "orange twist (discarded)"
    - "orange or lemon twist"
    - "grapefruit twist"
    - "flamed orange zest coin"

  citrus_cut:
    - "lime wedge"
    - "lime wedge on rim"
    - "lime wheel"
    - "lemon wheel"
    - "lemon slice"
    - "orange slice"
    - "orange crescent"
    - "grapefruit crescents"
    - "citrus wheel"
    - "dehydrated lime slice wheel"
    - "half lime shell"

  fruit:
    - "pineapple wedge"
    - "pineapple wedge (cut to resemble a bird's plumage)"
    - "pineapple wheel"
    - "blackberry"
    - "dried apple slice"
    - "banana chip"
    # `12 raspberries` until 2026-08-31. A COUNT STAYS ONLY WHERE THE COUNT IS
    # THE SPEC -- Helen's rule, settling this and `three coffee beans` together.
    # Twelve is how many that punch happened to want; three coffee beans is the
    # drink. See spice_and_other.
    - "raspberries"
    - "half an empty passion fruit shell"
    - "passion fruit shell filled with overproof rum"
    - "pineapple and brandied cherry"

  # THE THREE QUALIFIED CHERRIES ALL STAY, ruled 2026-08-31. A Luxardo really is
  # a different object from a bright red cocktail cherry, `skewered` says how it
  # is served, and a fruit stick is one thing you build rather than two garnishes
  # to split. Each was proposed for collapsing and each was rejected.
  #
  # `Luxardo` gained its capital in the same pass -- it is a proper noun and was
  # lowercased, which is a typo whichever way the collapse question had gone.
  cherries:
    - "brandied cherry"
    - "maraschino cherry"
    - "Luxardo maraschino cherry"
    - "skewered maraschino cherry"
    - "cherry flag"
    - "fruit stick (skewered pineapple cubes and a maraschino cherry)"

  herbs_and_leaves:
    - "mint sprig"
    - "mint bouquet"
    - "rosemary sprig"
    - "kaffir lime leaves"
    - "cucumber wheels"
    - "edible violet"

  spice_and_other:
    - "grated nutmeg"
    - "cinnamon stick"
    # THE COUNT IS THE SPEC HERE, which is why it survives where `12
    # raspberries` did not. Three coffee beans is the Espresso Martini, not an
    # arbitrary number of beans.
    - "three coffee beans"
    - "half-rim of sugar"
    - "cocktail umbrella"
    - "3 dashes red creole-style bitters"
    - "5 drops of olive oil"

# =============================================================================
# PROPOSALS -- both halves kept, so the choice is Helen's and not mine
# =============================================================================
# LEFT: the string exactly as a drink says it today.
# RIGHT: what it might become, or `QQ` where there is no clean answer and a
#        judgement is needed. `QQ` means unfinished, not absent -- the same
#        thing it means on an ingredient.
#
# THE COMPOUNDS ARE THE REAL WORK HERE. `garnish:` is a LIST, so a drink
# wanting two garnishes should carry two entries rather than one string with
# "and" in it. Splitting them is a data edit to somebody else's drink, though,
# and a count or a construction can be part of the garnish rather than noise --
# so every one is proposed and none is applied.
# EIGHT OF THE TEN ORIGINAL ROWS ARE GONE, worked through with Helen on
# 2026-08-31, the day after they were written. Three splits were applied
# (singapore-sling, carta-switchel, pic-a-de-crop-punch); `12 raspberries`
# became `raspberries`; and four were REJECTED, which is what deleting a row
# means -- `three coffee beans`, the fruit stick, and the skewered and Luxardo
# cherries all keep their words, because each carries a fact a shorter string
# would lose. What is left is what genuinely still needs her.
proposals:

  # --- two garnishes, but the first is too vague to split confidently --------
  # port-au-prince. "pineapple" alone is a wedge on some drinks and a wheel on
  # others, and this one does not say which. Splitting it needs Helen, and
  # guessing would put a garnish on her drink that she did not choose.
  "pineapple and brandied cherry": "QQ"

  # --- a disjunction, which no single entry can express ----------------------
  # fake-id. THE BLOCKER IS STRUCTURAL rather than a matter of wording: a
  # `garnish:` list means "all of these", so it cannot say "either of these".
  # `generic` solved the identical shape with a list meaning "any of these would
  # do" (#441), but that convention does not exist for garnishes and inventing
  # it on the strength of one drink would be the wrong way round.
  "orange or lemon twist": "QQ"
