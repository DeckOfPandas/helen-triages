# Cocktail method steps (#290): a closed vocabulary for the mechanical spine,
# free text for the rest. A step belongs here only if its phrasing carries no
# information: "with ice" versus "over ice" carries none, "other than the
# champagne" carries all of it. The informative tail is never canonicalised.
#
# A change to a drink's step is proposed in `proposals:` and never applied
# directly (DECISIONS §9.12).

# --- THE SPINE ---------------------------------------------------------------
# tests/test_cocktails.py flattens every group, so a new group is covered at
# once. scripts/build_ingest_vocab.py prints each group key as a heading in
# the ingest document, so renaming a group renames a heading there.
canonical:

  shake:
    - "Shake all ingredients with ice."
    - "Shake all ingredients hard with ice."
    # What is already in the shaker, after an earlier build step. Not a
    # variant of the lines above: do not propose collapsing it.
    - "Shake with ice."
    # After a rinse: some of the spirit went into the glass and was discarded.
    - "Shake the remaining ingredients with ice."
    # The champagne exclusion is frequent enough to be a literal. Any other
    # excluded ingredient is a `shapes.exclusion` sentence below.
    - "Shake all ingredients other than the champagne with ice."

  # "with three ice cubes" IS the technique: three cubes is what makes a shake
  # short. The three forms mirror `shake:`.
  short_shake:
    - "Short shake all ingredients with three ice cubes."
    - "Short shake the remaining ingredients with three ice cubes."
    - "Short shake with three ice cubes."

  # No ice, the egg-white technique. Not a variant of `shake:`.
  dry_shake:
    - "Dry shake all ingredients."

  stir:
    - "Stir all ingredients with ice."
    - "Stir the remaining ingredients with ice."   # after a rinse -- see shake
    - "Stir all ingredients other than the champagne with ice."
    - "Stir until cold."
    - "Stir."
    # Built in the glass and stirred before any ice goes in, so not "with ice".
    - "Stir all ingredients together."

  blend_and_swizzle:
    - "Blend all ingredients until smooth."
    - "Swizzle until the glass frosts."
    - "Add the bitters then swizzle them into the top."

  # A strain step names the technique only. Where the drink lands is composed
  # by the layout from `glass:` and `serve.ice`, and
  # test_serve_ice_is_not_restated_in_the_method refuses a strain step that
  # describes the serve.
  strain:
    - "Strain."
    - "Double strain."
    - "Fine strain."
    - "Dump."
    - "Pour."

  build:
    # The glass is in `glass:`, so the opener does not name it. A pitcher is
    # not the glass and is information: "in a pitcher" steps stay free text.
    - "Add all ingredients."
    - "Add the remaining ingredients."
    - "Fill the pitcher half full with ice cubes."
    # A different amount of ice is information.
    - "Fill the pitcher three-quarters full with ice cubes."
    - "Fill with crushed ice."
    # How full is the information: this leaves room for what comes next.
    - "Half-fill with crushed ice."
    - "Two-thirds fill with crushed ice."
    - "Top with champagne."
    # Soda water, never club soda (DECISIONS §9.3).
    - "Top with soda water."
    - "Top with more crushed ice."
    # The ice stands above the rim, where "Fill with crushed ice." says only
    # that the glass is full.
    - "Heap crushed ice on top."

  # An ingredient whose amount is `to rinse` is poured by one of these steps
  # and by nothing else. A rinse worded for one drink (a frozen glass, a named
  # rum) stays free text. `glasses` is plural for a batch, which is
  # information.
  rinse_and_rim:
    - "Rinse the glass with absinthe and dump."
    - "Rinse the glasses with Campari."
    # The rim step. A drink whose leading spirit is not tequila writes the same
    # sentence with its own spirit, as free text: `canonical` holds literal
    # strings and every consumer compares whole strings (DECISIONS §9.3).
    - "Dip only half the rim in water (or tequila) then coarse salt."

  # Emitted by `_layouts/cocktail.html` for a garnish of any citrus twist. No
  # drink writes it, and test_no_method_step_opens_with_express refuses one
  # that does. ORDER IS LOAD-BEARING: the layout indexes this list, [0] the
  # drop-in form and [1] the discard form, chosen by whether the garnish says
  # "discard".
  express:
    - "Express the twist over the drink then drop it in."
    - "Express the twist over the drink then discard it."

  # A flaming shell's last two steps, in this order, after its `shapes.shell`
  # sentence (#1256). test_a_shell_pour_is_written_one_way holds all three.
  fire:
    - "Set alight."
    - "Sprinkle the flame with cinnamon."

# A canonical sentence with exactly ONE slot, `<X>`, which the drink fills with
# an ingredient as the recipe names it. tests/test_cocktails.py treats a
# literal and a filled shape alike. A step needing two slots is free text:
# that rule keeps this from growing into a grammar (#705).
shapes:
  exclusion:
    - "Shake all ingredients other than the <X> with ice."
    - "Stir all ingredients other than the <X> with ice."
    - "Short shake all ingredients other than the <X> with three ice cubes."
    - "Dry shake all ingredients other than the <X>."
    - "Add all ingredients other than the <X>."
    - "Add the remaining ingredients other than the <X>."
  top:
    - "Top with <X>."
  float:
    - "Float the <X> on top."
    - "Drop the <X> on top."
    # One spirit poured twice (#1294): this, and `shell`'s "second" line. No
    # millilitres in the sentence, because the scaler does not rewrite a
    # method.
    - "Float the first <X>."
  # `<X>` is the rum, the ingredient carrying `as: "shell"` (#1256). One
  # sentence per fruit rather than a second slot.
  shell:
    - "Fill the passion fruit shell with the <X> and set on top of the drink."
    # Above the plain lime line on purpose: the plain sentence also matches
    # this one, and test_a_shell_pour_is_written_one_way reads the rum's name
    # out of the first match.
    - "Fill the lime shell with the second <X> and set on top of the drink."
    - "Fill the lime shell with the <X> and set on top of the drink."

# The glass generator (#1214). LEFT is the canonical step as a drink writes
# it; RIGHT is the sentence the page composes, `<glass>` filled from
# glasses.yml `serving`. Only the FIRST such step in a drink is composed, so
# the glass is named once; a step that always follows one is absent for that
# reason. `<glass>` is filled by the page and `<X>` by the drink, hence two
# spellings. `_layouts/cocktail.html` applies this to drafts only
# (DECISIONS §9.10a).
in_the_glass:
  "Add all ingredients.": "Add all ingredients to <glass>."
  "Fill with crushed ice.": "Fill <glass> with crushed ice."
  "Half-fill with crushed ice.": "Half-fill <glass> with crushed ice."
  "Two-thirds fill with crushed ice.": "Two-thirds fill <glass> with crushed ice."
  "Rinse the glass with absinthe and dump.": "Rinse <glass> with absinthe and dump."

# LEFT: a step exactly as a drink writes it today. RIGHT: the canonical form
# it would become, or `QQ` where a judgement is needed. Deleting a row rejects
# it; applying one deletes it in the same commit, because
# test_every_proposal_still_matches_a_real_step fails a row no drink says.
# A short form ("Shake with ice.") is decided by the step ABOVE it in the
# drink, never by its shape. The key stays when nothing is proposed: a missing
# key switches that test off.
proposals:
