# =============================================================================
# COCKTAIL METHOD STEPS. Spec: GitHub issue #290.
# =============================================================================
# A CLOSED VOCABULARY FOR THE MECHANICAL SPINE, FREE TEXT FOR THE REST. The
# argument for it is not tidiness, it is #290's own: the same one §13.1 makes
# about the punched-tape mark beating the watercolour washes. A shape that
# changes every time has to be RE-READ; an identical repeated one becomes
# something you RECOGNISE. That is exactly the difference between a canonical
# "Shake all ingredients with ice." and thirteen near-variants of it, and it
# matters most in the situation Helen named -- people in the house, and thirsty.
#
# THE TEST FOR WHETHER A STEP BELONGS HERE: does its phrasing carry
# information? "with ice" versus "over ice" carries none. "other than the
# champagne" carries all of it. So the tail is deliberately NOT canonicalised
# and never will be -- "Muddle the lime chunks hard with the sugar in the
# bottom of a shaker until the sugar has dissolved" cannot be collapsed
# without losing the drink.
#
# WHAT THE DATA LOOKED LIKE WHEN THIS WAS WRITTEN, 2026-08-26: 277 steps
# across 105 drinks, 144 of them distinct. One instruction accounted for 42
# uses written three ways, and Strain alone had eleven forms.
#
# THIS FILE DOES NOT REWRITE ANY DRINK, and nothing here is enforced against
# the collection. Helen, 2026-08-26, asked for the choice to be recorded
# rather than taken: "Prefer both, leaving my original too, then I delete
# whatever I don't want." So `proposals` below holds HER EXACT EXISTING STRING
# on the left and the suggested canonical form on the right. Deleting a row is
# how a suggestion gets rejected. Nothing touches a recipe until the map has
# been pruned -- and a later pass applies only what survives.
# =============================================================================

# --- THE SPINE ---------------------------------------------------------------
# Grouped by verb for reading only. tests/test_cocktails.py derives the flat
# set from this mapping's shape, so a group added tomorrow is covered
# tomorrow -- the same reasoning `_declared_generics` uses on ingredients.yml.
canonical:

  shake:
    - "Shake all ingredients with ice."
    - "Shake all ingredients hard with ice."
    # SHAKE WHAT IS IN THE SHAKER, after an earlier build step. Helen's ruling,
    # 2026-09-01, on sapins-swizzle: "should retain 'shake with ice'". It is
    # not drift -- it says something the line above does not, so by this file's
    # own test (does the phrasing carry information?) it belongs here. Declared
    # rather than left in the tail so the next census does not re-propose
    # collapsing it: a settled question left looking unsettled gets asked again.
    - "Shake with ice."
    # AFTER A RINSE, and the rinse is the reason it is not "all ingredients":
    # some of the spirit went into the glass and was discarded. Three drinks
    # rinse, and tailspin and sazerac-death-and-co already said "the remaining
    # ingredients" while caribbean-sazerac said "the rest" -- Helen's ruling,
    # 2026-09-01, was to match the two. Both verbs are declared because the
    # stir form has two live users and the shake form one; this is NOT the
    # asymmetry noted under `proposals`, where the second form has no user.
    - "Shake the remaining ingredients with ice."
    # The champagne exclusion is standardised because it is frequent -- eight
    # uses across shake and stir. The rest of the exclusion tail (Prosecco,
    # soda, bitters, a named rum) is open-ended and stays free text, which is
    # why there is no attempt at a general form here.
    - "Shake all ingredients other than the champagne with ice."

  stir:
    - "Stir all ingredients with ice."
    - "Stir the remaining ingredients with ice."   # after a rinse -- see shake
    - "Stir all ingredients other than the champagne with ice."
    - "Stir until cold."
    - "Stir."

  blend_and_swizzle:
    - "Blend all ingredients until smooth."
    - "Swizzle until the glass frosts."

  # STRAIN IS WHERE THE SPRAWL WAS -- eleven distinct forms for what is really
  # four decisions: how fine, and into what. Note that NAMING THE GLASS is
  # duplication, not information: the glass is already in the drink's `glass:`
  # field and renders as an icon. "Fine strain into a chilled coupe" says
  # coupe twice.
  strain:
    - "Strain."
    - "Double strain."
    - "Fine strain."
    - "Strain into a chilled glass."
    - "Double strain into a chilled glass."
    - "Fine strain into a chilled glass."
    - "Strain into an ice-filled glass."
    - "Fine strain into an ice-filled glass."
    - "Strain over ice."
    - "Fine strain over ice."
    - "Strain over crushed ice."

  build:
    - "Add the remaining ingredients."
    - "Fill the pitcher half full with ice cubes."
    - "Fill with crushed ice."
    - "Top with champagne."
    # SODA WATER, NEVER CLUB SODA -- Helen's ruling, 2026-09-02: she is not in
    # the US and doubts the difference is more than marketing. Eight drinks said
    # club soda in a step or an `item` and were normalised the same day; the one
    # remaining mention sits inside a QQ note on la-fee-noir-punch, which is a
    # record of what a source said and is not rewritten.
    - "Top with soda water."
    - "Top with more crushed ice."

  # RINSE AND RIM -- added 2026-09-02 with the amount ruling that needed them.
  # An ingredient whose amount is `to rinse` is poured by one of these steps and
  # by nothing else, so the two halves are declared together or neither is
  # legible. Both strings are the drinks' own, unchanged: sazerac-death-and-co
  # says the first, tailspin the second. `glasses` plural on the second is
  # tailspin's own wording for a batch and is left alone -- this file collapses
  # variance that carries no information, and how many glasses are being made is
  # information.
  #
  # THE THIRD RINSE IS DELIBERATELY NOT HERE. caribbean-sazerac says "Rinse a
  # frozen glass with the overproof rum, then discard the excess." -- the frozen
  # glass and the rum are both facts about that drink, so by this file's own
  # test the phrasing carries information and the step stays in the free-text
  # tail.
  rinse_and_rim:
    - "Rinse the glass with absinthe and dump."
    - "Rinse the glasses with Campari."
    # HELEN'S EXACT WORDING, 2026-09-02, preferred over "Salt half the rim of
    # the glass". Its one live user says something else today
    # (margarita-classic), so it is PROPOSED below rather than applied -- this
    # file never rewrites a drink, and a canonical form arriving with a proposal
    # attached is the shape #290 asks for. It is not the "form with no user"
    # case the note at the foot of this file warns against: the user exists and
    # is named.
    - "Salt a half-rim of the glass."

# =============================================================================
# PROPOSALS -- both halves kept, so the choice is Helen's and not mine
# =============================================================================
# LEFT: the string exactly as it appears in a drink today.
# RIGHT: the canonical form it would become, or `QQ` where there isn't a clean
#        one and a judgement is needed.
#
# `QQ` here means the SAME thing it means on an ingredient: unfinished, not
# absent. A QQ row is a step whose variance might be real, so it is listed
# rather than quietly collapsed.
#
# THE DANGEROUS ONES ARE THE SHORT ONES, and they are all QQ for one reason:
# "Shake with ice.", "Shake the rest with ice." and "Stir with ice." follow an
# earlier build step, so they mean shake WHAT IS IN THE SHAKER, not shake all
# ingredients. Collapsing them into the plain canonical form would silently
# change the drink. This is the trap that makes a fuzzy matcher the wrong tool
# here and an explicit map the right one.
# THE TWENTY MECHANICAL ROWS WERE APPLIED AND DELETED ON 2026-09-01, #630 --
# 62 steps across 61 drinks, by tmp/apply_method_proposals.py, as text edits.
# They were the "with" vs "over" pairs, a missing article, the glass named
# twice, and two spellings of one exclusion word. Every one had sat here since
# 2026-08-26 for Helen to reject, and none was.
#
# DELETING THEM IS HOW THIS FILE RECORDS THAT, and it is not optional: the
# moment a drink stops saying the left-hand string,
# test_every_proposal_still_matches_a_real_step goes red. Apply and prune are
# one commit or the suite is broken between them. The two straw rows went the
# same way on 2026-08-30 (#573), and the note at the bottom of this file
# records that they were RESOLVED rather than rejected -- the same distinction
# applies here.
proposals:

  # EMPTY, 2026-09-01, and the key stays. An empty mapping says "nothing
  # outstanding"; a missing one says nothing at all, and would switch off
  # test_every_proposal_still_matches_a_real_step for whatever is proposed
  # next. Same reasoning as garnish.yml's own empty block, and the same
  # reasoning that keeps GLASSSLESS_ON_2026_08_27 asserted rather than deleted.
  #
  # THIS IS A WORKLIST, NOT A RATCHET. It empties and it will refill, so the
  # guard asserts the KEY exists and never that the map is non-empty -- getting
  # that backwards on garnish.yml made finishing the work a test failure, for
  # one day, on 2026-08-31.
  #
  # REFILLED 2026-09-02 with one row, which is what a worklist doing its job
  # looks like. Helen gave the rim wording while ruling on man-o-war's salt, and
  # the drink it applies to is not the drink that prompted it: man-o-war's salt
  # goes IN the drink and gets no rim step at all. So the wording is canonical
  # above and margarita-classic is proposed for it here, to be accepted or
  # deleted like every other row -- propose, never apply.
  "Dip only half the rim in salt.": "Salt a half-rim of the glass."

# =============================================================================
# HOW THE FOUR QQ ROWS WERE ANSWERED, 2026-09-01 -- the reasoning, not the rows
# =============================================================================
# Worth keeping because it is what a future short-form step needs, and because
# the reason originally given for parking them was WRONG for two of the four.
#
# The comment used to say all four "follow an earlier build step, so they mean
# shake WHAT IS IN THE SHAKER". That was reasoned from the STRING -- exactly
# the mistake a fuzzy matcher would make, made by hand instead. Read per
# instance, with the step above each one:
#
#   north-sea-oil "Stir with ice."     IT WAS THE FIRST STEP. Nothing had been
#                                      built, so it did mean all ingredients.
#                                      -> "Stir all ingredients with ice."
#
#   sapins-swizzle "Shake with ice."   follows "Add the remaining ingredients",
#                                      so everything IS in the shaker by then.
#                                      Helen: "should retain 'shake with ice'".
#                                      -> UNCHANGED, and now canonical.
#
#   caribbean-sazerac "Shake the       follows a rinse. tailspin and
#   rest with ice."                    sazerac-death-and-co already said "the
#                                      remaining ingredients"; Helen: "match
#                                      please." -> that form, now canonical.
#
#   smokestack-lightning "Fine         MEANINGLESS AS WRITTEN, and Helen named
#   strain with ice."                  it: "I bet I meant 'fine strain over
#                                      ice'." The drink said `coupe`, which
#                                      holds no ice -- so the GLASS was the
#                                      wrong field, not the step. Now
#                                      `old fashioned` and "Fine strain over
#                                      ice.", which is canonical beside the
#                                      existing "Strain over ice."
#
# TWO THINGS GENERALISE, and they pull in opposite directions:
#
#   THE PRECEDING STEP IS THE WHOLE QUESTION for any short verb form. Two
#   identical-looking rows went opposite ways on nothing but the line above
#   them. Never decide one from its shape.
#
#   WHEN A STEP IS INCOHERENT, ASK WHICH FIELD IS WRONG. Smokestack's step
#   read as a transcription fault for as long as the glass was assumed right.
#   `glass:`, `garnish:` and the method all describe one serve, so an
#   impossible instruction may be a correct instruction beside a wrong glass.
#
# "Stir with ice." IS DELIBERATELY NOT DECLARED, though its shake twin is: no
# drink stirs after a build today. A future one should say it and be declared
# then. That is a form with no user yet, not drift, and adding it now would be
# machinery for a case that does not exist.

  # THE TWO STRAW PROPOSALS ARE GONE, 2026-08-30, #573 -- resolved rather than
  # rejected. They sat here as QQ because moving them to `to_serve` was "a
  # wording decision rather than a relocation", and Helen made it: "Serve with
  # a straw." is now `to_serve: "Straw."` on Mai Tai and Coney Park Swizzle,
  # and "Serve with two straws." is "Two straws." on Pic-a-de-Crop Punch --
  # matching the terse noun phrase the three existing values already use.
  #
  # Deleting the rows is how this file records that, and
  # test_every_proposal_still_matches_a_real_step is what forced it: the moment
  # the last drink stopped saying the string, the proposal went red. That is
  # the bargain this file strikes working exactly as intended.
  #
  # It cannot happen again -- test_no_method_step_restates_to_serve_or_garnish
  # now refuses a step opening with "Serve" or "Garnish" outright.
