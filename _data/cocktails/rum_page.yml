# =============================================================================
# THE RUM CATEGORIES PAGE'S OWN LINES -- Helen's copy, and nothing else.
# =============================================================================
# cocktails/reference/rum-categories.html (#529) lists, under "Not categories",
# every lowercase word in `retired_rum_styles` (ingredients.yml): the words other
# people's recipes use for a rum that name no category here. Until 2026-09-10
# the page printed each word's RETIREMENT REASON beneath it -- text written for
# the next Claude, citing issue numbers and YAML keys -- because Helen had said
# she would copyedit them in place (#784). She ruled otherwise instead: "my main
# wish is to get rid of most of the copy, to be honest! I just need to write a
# line or two under each rum label we aren't using."
#
# SO THIS FILE HOLDS THOSE LINES AND ONLY THOSE. One key per word, in her voice
# (§13.12: an agent ships a placeholder, never a sentence). An EMPTY value
# renders nothing -- the word stands alone -- so the page is never wearing
# agent prose while she gets to it. The ingest-facing reasons stay in
# `retired_rum_styles`, untouched; this is the reader's half, that is the
# ingester's, and the two want different words.
#
# A word here that is not a lowercase key of `retired_rum_styles` is a typo and
# renders nowhere; a retired word missing here simply prints without a line.
# The page reads this map by the word as written in ingredients.yml, spaces
# and all ("overproof navy").
retired_words:
  light: ""
  gold: ""
  dark: ""
  navy: ""
  overproof navy: ""
  black: ""
  blackstrap: ""
