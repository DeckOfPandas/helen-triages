# =============================================================================
# GLASS → ICON. The vocabulary layer for cocktail glassware.
# =============================================================================
# `_layouts/cocktail.html` renders the icon for a drink's `glass:` value by
# looking it up here and inlining `_includes/icons/glasses/<icon>.svg`. Adding
# a glass is a YAML edit, never a template edit — the same contract
# _data/food/taxonomy.yml has.
#
# ABSENT MEANS NO ICON, not a broken one. A glass with no entry here (or an
# entry pointing at a file that does not exist) renders no icon at all rather
# than a 404 or an empty box — the same absent-means-nothing convention
# `reference_links` already uses in _data/sites.yml. (It used to cite
# `footer_svg` and `about_url`; both were retired by issue #374, when the header
# and footer stopped being per-site configuration. The convention is unchanged.)
#
# KEYS ARE THE GLASS STRING AS WRITTEN IN A DRINK'S FRONT MATTER, lowercased.
# The spreadsheet spells several glasses more than one way and those spellings
# are carried through the ingest verbatim rather than silently unified, so the
# aliases are handled HERE, where the variance is visible, instead of being
# tidied away in the data. If the drinks are ever normalised to one spelling
# each, these alias lines are what to delete.
# =============================================================================

icons:
  # --- one spelling, one icon ------------------------------------------------
  # Coupe is the collection's commonest glass by a wide margin -- 37 drinks
  # across the book. Helen drew it 2026-08-16; before that it was the one big
  # gap here and every coupe drink rendered iconless.
  coupe: coupe
  # Helen's spreadsheet also spells the coupe this way.
  #
  # "champage saucer" (sic) WAS HERE TOO AND IS GONE — issue #677, 2026-09-05.
  # It was her own typo, carried through the ingest verbatim rather than
  # silently corrected, and that was the right call while a drink still said it.
  # None does now, and since #671 both this map and `canonical_glasses` below
  # are GENERATED into `INGEST_ONE_COCKTAIL.md` -- so the typo had become a
  # spelling the document taught a repo-less reader to expect from a source.
  #
  # REMOVING IT FROM `canonical_glasses` ALONE WOULD HAVE MADE IT WORSE, which
  # is worth knowing before anyone retires another alias: the generator prints
  # every `icons:` key that `canonical_glasses` does NOT correct, so dropping
  # the correction promotes the typo from the wrong-spellings table into the
  # list of spellings to use. It had to leave both, and it did.
  champagne saucer: coupe
  sour: sour
  collins: collins
  flute: flute
  highball: highball
  hurricane: hurricane
  nick and nora: nick-and-nora
  punch bowl: punch-bowl
  tiki mug: tiki-mug

  # --- one drawing, two mugs -------------------------------------------------
  # `mule-mug.svg` was renamed `mug.svg` on 2026-08-26 and both spellings point
  # at it. The drawing is a plain tapered mug with a handle; the only thing that
  # ever made it a MULE mug is that a real one is copper, which a monochrome
  # line icon cannot say. Nothing was using it, and Apple and Ginger Mulled Wine
  # wanted precisely this shape -- Helen, asked whether to draw a new one: "I
  # actually use a mug for this like I do for tea!"
  #
  # `mule mug` is kept as an alias rather than dropped, because a Moscow Mule
  # will want it one day and will get the same correct drawing.
  mug: mug
  mule mug: mug

  # --- SIX DRINKS THAT WERE RENDERING NO ICON FOR NO REASON -------------------
  # Found 2026-08-17 by checking every `glass:` value in the collection against
  # this map, rather than by noticing a blank space on a page. Two shapes of
  # miss, and both are silent by design -- "absent means no icon" is the right
  # default and it cannot tell a deliberate gap from a forgotten one:
  #
  #   - martini and wine: the ARTWORK existed all along and simply had no key.
  #   - pilsner: the artwork did not exist until today (#303).
  #
  # This is why tests/test_cocktails.py now asserts the map and the icon
  # directory agree in both directions. A missing key costs an icon; a key
  # naming a missing file is worse, because `glass_icon = ""` once sent
  # `icons/glasses/.svg` to {% include %} and took the whole build down.
  martini: martini
  martini glass: martini
  wine: wine
  pilsner: pilsner
  sling: sling

  # --- icons added 2026-08-17, ahead of any drink asking for them -------------
  # Spec, not inventory -- the same principle as declaring Plymouth and Genever
  # gin while owning neither. Helen has tiki recipes not yet ingested.
  absinthe: absinthe
  goblet: goblet
  chalice: goblet
  pineapple: pineapple
  hollowed pineapple: pineapple
  # NO DRINK USES THIS YET -- added 2026-08-31 with the drawing (#528), because
  # Helen drew one to see whether it earns a place: "we might not use it, but
  # why not try". An icon with no drink is the normal state for this file
  # (nine others are in it), and declaring the spelling now is what lets a
  # future drink simply say `glass: [coconut]` and render.
  coconut: coconut
  coconut shell: coconut

  # --- four spellings of one glass, all live in the data -----------------------
  # `rocks` used to point at a genuinely different (panelled) drawing -- see
  # the retirement note below. It is an alias now, matching the canonical
  # vocabulary rule ("old fashioned, not rocks") for real rather than in name
  # only.
  old-fashioned: old-fashioned
  old fashioned: old-fashioned
  old-fashioned glass: old-fashioned
  rocks: old-fashioned

  # `old-fashioned-double` redrawn 2026-08-26 to match the new single glass --
  # see the RESOLVED note below. Re-mapped now that the artwork exists.
  double rocks: old-fashioned-double
  double old fashioned: old-fashioned-double
  double old-fashioned: old-fashioned-double

  # --- judgement calls, worth checking by eye before trusting -----------------
  # `brandy glass` is the CANONICAL name and `snifter` is the alias, which is
  # the opposite of the usual convention -- snifter is the commoner word behind
  # a bar. Helen's call, 2026-08-17, and the reason is that she dislikes the
  # word itself on synaesthetic grounds. Recorded because nobody would ever
  # rediscover it, and a future tidy-up would otherwise "correct" it straight
  # back to snifter.
  brandy glass: brandy
  snifter: brandy

# =============================================================================
# GLASSES IN THE DATA WITH NO ICON — deliberately unmapped, not forgotten.
# =============================================================================
# Listed rather than silently absent so the gap is a fact in the repo instead
# of something to rediscover. Nothing reads this list; it is documentation.
#
#   any      NOT A GLASS AND MUST NEVER BE MAPPED. It is a real member of a
#            drink's `glass:` list meaning "no requirement" -- Daisy de
#            Santiago is "anything, but preferably a Collins". The layout
#            takes the first entry that HAS an icon, so `[collins, any]`
#            draws a Collins and `[any]` alone draws nothing, which is right.
#
# ALL THREE OF THIS SECTION'S OWN QQs WERE RESOLVED ON 2026-08-26, by asking
# Helen with the drink in front of her rather than reasoning about the word:
#
#   todo   Coney Park Swizzle, and it was literally the word "todo". Now
#          `highball`, along with every other swizzle — Helen: "Please swap
#          all my Swizzles into highball glasses." Each carries a QQ note to
#          check by eye.
#   mug    Apple and Ginger Mulled Wine, and the answer was neither of the two
#          candidates guessed at here. See the mug/mule-mug entry above: one
#          drawing, renamed, serving both.
#   long   Long Island Iced Tea. It did read as a serve rather than a glass,
#          and Helen's call was `highball`. `long` is NOT kept as an alias —
#          it is not a glass name, and mapping it would make it look like one.
#
# UNUSED ICONS, the other side of the same ledger: julep-cup, margarita,
# pina-colada, sherry, shot, plus the three added ahead of demand (absinthe,
# goblet, pineapple). Several will find a glass once the non-rum drinks are
# ingested — margarita and julep-cup especially — so an unused icon is not
# evidence of a mistake. `hot-toddy` left this list on 2026-08-26 only in the
# sense that it was CONSIDERED for the mulled wine and rejected: the drawing is
# a footed handled glass, not a mug.
#
# `any` IS RETIRED, 2026-08-27, and this note used to say it must stay
# permanently — so the reversal is worth the space. It meant "no requirement",
# and exactly one drink ever used it: Daisy de Santiago, as [collins, any].
#
# Helen: "when someone tells me to use an old fashioned glass I always
# automatically assume I can use any glass I like, so there's no need to have
# 'any' as a glass type." The freedom it encoded is one she applies to EVERY
# glass spec, so recording it on one drink said nothing true about that drink
# and something false about the other 113. Daisy now reads [collins], which is
# what "anything, but preferably a Collins" always meant.
#
# THERE IS NOW NO UNMAPPED VALUE. Every glass a drink names must appear in
# `icons:` above — see #491, and test_every_glass_value_is_in_the_vocabulary,
# which no longer carries an exemption set.
#
# =============================================================================
# THE CANONICAL VOCABULARY — Helen, 2026-08-17, ENFORCED from 2026-08-26
# =============================================================================
# When two words mean one glass, these are the ones to use in a drink.
#
#   coupe                 not "champagne saucer"
#   old fashioned         not "rocks"
#   double old fashioned  not "double rocks"
#   brandy glass          not "snifter"
#
# THIS USED TO BE A PREFERENCE AND IS NOW A RULE. The line here read "the
# aliases above stay live regardless: the point of this file is that a drink is
# never wrong for using the other word." Helen retired that on 2026-08-26 —
# "I decided to go with old fashioned rather than rocks as the canonical name,
# so recipes that still have rocks are fine to break a test." So
# `canonical_glasses` below is enforced by
# tests/test_cocktails.py::test_drinks_use_the_canonical_glass_spelling, and 17
# drinks were retyped in the same commit rather than left failing.
#
# WHY IT WAS SAFE TO RETYPE ALL SEVENTEEN AT ONCE: `rocks` has been a plain
# ALIAS to `old-fashioned` since #347 was resolved — one drawing, not two — so
# the change carries no meaning whatsoever, only spelling. Every one of those
# drinks rendered the same icon before and after. That would NOT have been true
# before #347, when the two names pointed at genuinely different artwork.
#
# THE ALIASES IN `icons:` STAY LIVE, and that is not a contradiction. They do
# two jobs a rule cannot: they keep a drink rendering if one slips through, and
# they absorb the spreadsheet's spellings on ingest, where the variance is real
# and arrives whether or not this file disapproves. The rule governs what is
# WRITTEN into a drink; the alias map governs what can be READ.
#
# `martini` vs `martini glass` is deliberately NOT here — see the note on
# `canonical_glasses`.

# ALIAS (as it may appear in a drink) -> the spelling a drink must use.
# The test derives its whole vocabulary from this map, so adding a pair here is
# what makes it enforced; there is no second list to keep in step.
canonical_glasses:
  "rocks": "old fashioned"
  "old-fashioned": "old fashioned"
  "old-fashioned glass": "old fashioned"
  "double rocks": "double old fashioned"
  "double old-fashioned": "double old fashioned"
  "champagne saucer": "coupe"
  "snifter": "brandy glass"
  "martini glass": "martini"
  "pineapple": "hollowed pineapple"
  "coconut": "coconut shell"

# THE THREE THAT WERE "NOT IN THE MAP, ON PURPOSE" ARE NOW DECIDED — issue
# #676, Helen, 2026-09-05: "hollowed pineapple, coconut shell". `martini glass`
# resolves to `martini` in the same pass.
#
# WHAT MADE THEM A PROBLEM was not the drinks — it was the DOCUMENT. Since #671
# the glass list in `INGEST_ONE_COCKTAIL.md` is generated as "every `icons:` key
# that `canonical_glasses` does not correct", so all six spellings printed side
# by side and a repo-less reader had to guess between four near-duplicates.
# Silence meant "undecided" to the test and "either is fine" to the reader.
#
# TWO OF THE THREE COST NOTHING: no drink says `pineapple` or `coconut` today,
# so those lines decide a question before it is ever asked in anger. `martini
# glass` retyped two drinks (espresso-martini, porn-star-martini) onto the
# spelling tomato-martini already used; all three rendered the same icon before
# and after, so the change carries spelling and no meaning — the same argument
# that made retyping seventeen `rocks` drinks safe above.
#
# `champage saucer` (sic) LEFT THE MAP in the same pass — issue #677. It was
# only ever here because a drink once spelled it that way; none does now, and
# #671's generated table had turned it into a typo the document actively taught
# as a spelling a source might use. A typo is not a source's spelling.
#
# An alias absent from the map is still permitted in a drink. That remains the
# honest default: this map records DECISIONS, and silence means the question has
# not been asked rather than that either form is blessed.
#
# =============================================================================
# RESOLVED 2026-08-25 — the four-tumbler-icon problem this section used to
# document.
# =============================================================================
# Choosing `old fashioned` over `rocks` as the canonical word left the ARTWORK
# unresolved for a while: four tumbler icons (plain old-fashioned, its double,
# panelled rocks, panelled rocks-tall) against two canonical names, with
# `rocks` and `old fashioned` pointing at two different drawings — invisible
# on any single page, real the moment you looked at the whole set together
# (`_dev/glasses.html`, built for exactly this).
#
# Helen's call, having looked: none of the three options originally floated
# here (panelled wins / plain wins / keep both as different named glasses).
# Instead, `old-fashioned.svg` itself got a fresh redraw, and `rocks.svg` /
# `rocks-tall.svg` / the old `old-fashioned-double.svg` are all retired.
# `rocks` is now a plain alias to `old-fashioned` (see the canonical-vocabulary
# mapping above) rather than its own drawing.
#
# The double variant followed on 2026-08-26: `old-fashioned-double.svg`
# redrawn to match the new single glass (same body, uniformly scaled up,
# same four facet lines) rather than as an independent drawing. `double
# rocks` / `double old fashioned` / `double old-fashioned` are mapped to it
# now — Fancy-Free, Vieux Carré and Ti Punch get an icon again.
# =============================================================================

# =============================================================================
# EVERY ICON FILE, and yes this duplicates the directory listing on purpose.
# =============================================================================
# Liquid cannot read a directory. `_includes/` is not copied to the site, so it
# is not in `site.static_files` either, which means a template has NO way to ask
# "what icons exist?" — it can only look up the ones a key already names. That
# makes the most interesting question invisible to the swatch page: which
# artwork is UNREACHABLE, drawn and normalised and pointed at by nothing.
#
# So the inventory is written down, and tests/test_cocktails.py asserts it
# matches the directory exactly, in both directions. The duplication is real but
# it cannot drift: the test fails the moment an icon is added or removed without
# this list following. Without the test this would be a lie waiting to happen,
# which is the whole reason the assertion comes with it rather than after it.
# =============================================================================
# REAL-WORLD HEIGHTS IN MILLIMETRES — PROVISIONAL, AND HELEN'S TO CORRECT.
# =============================================================================
# THESE ARE NOT MEASURED. They are typical heights for each glass type, written
# by Claude on 2026-08-18 so that the relative-scale view on /dev/glasses/ has
# something honest to size from. Issue #295 is the real version of this list --
# the glasses Helen actually owns, with their volumes -- and it SUPERSEDES every
# number here the moment it exists.
#
# WHY THIS IS NOT THE viewBox HEIGHT, which is the obvious thing to use and is
# wrong. A viewBox records how the artwork was DRAWN, not how big the glass IS,
# and the two disagree badly: `shot` is drawn 77 units tall against `rocks` at
# 68, so at viewBox scale a shot glass stands TALLER than a rocks glass. It is
# about 60mm against 85mm in the real world. Same for `hot-toddy`, drawn
# shortest of everything at 60 units and actually one of the taller vessels.
# Helen, 2026-08-18: "Old fashioned glass needs to be smaller, and shot glass
# much smaller".
#
# Separating the two also means the ARTWORK NEVER HAS TO BE REDRAWN to fix a
# proportion: a wrong size is a number here, not an Inkscape session. That
# matters because redrawing is how you lose a glass's character by accident.
#
# The real site uses these now, 2026-08-25 (#298) -- `_layouts/cocktail.html`
# scales `--glass-icon-height` from this list against the tallest real glass,
# the same calculation `_dev/glasses.html`'s relative-scale view already
# proved out. #299, the proportion pass (fixing individual drawings once this
# exposes one that looks wrong at its real height), is still open.
# =============================================================================
# SERVING PHRASE — how a strain step names this glass.
# =============================================================================
# `_layouts/cocktail.html` builds the final strain step out of three fields:
# the technique from `method`, this phrase, and the ice clause from
# _data/cocktails/serve.yml. "Strain." + "an old fashioned glass" +
# ", over a large ice cube" = "Strain into an old fashioned glass, over a large
# ice cube."
#
# WHY GENERATED AND NOT STORED. Helen, 2026-09-05, asked for the glass and the
# ice back in the method: "I'd like to name the glass too where it appears."
# She is right that the method is what you follow while making the drink, and
# looking up to the metadata panel for the glass and down to "To serve" for the
# ice is worse than one sentence.
#
# But STORING that sentence is what produced seventeen spellings of "strain"
# and two truncated ones. So the sentence is composed at render time from
# fields that each hold their fact once. Change the glass and the method
# follows; nothing can drift, because there is only ever one copy.
#
# THE ARTICLE IS PART OF THE PHRASE, deliberately. "an old fashioned glass"
# needs `an`, "a coupe" needs `a`, and no rule short of a dictionary gets that
# right from the key. Writing it out is one word per glass and never wrong.
#
# THE WORD "GLASS" IS PART OF THE PHRASE TOO, and it is not always there.
# Helen's own examples set the pattern: "an old fashioned glass" but "a
# highball" and "a coupe". An old fashioned is also a DRINK, so the noun does
# real work; a coupe is only ever a glass.
#
# KEYED ON THE CANONICAL NAME, so `rocks`, `old-fashioned` and
# `old-fashioned glass` all arrive here as `old fashioned` via
# `canonical_glasses` above. A glass in use with no phrase here fails
# test_every_glass_in_use_has_a_serving_phrase rather than rendering a step
# with a hole in it.
serving:
  brandy glass: "a brandy glass"
  collins: "a collins glass"
  coupe: "a coupe"
  double old fashioned: "a double old fashioned glass"
  flute: "a flute"
  highball: "a highball"
  hurricane: "a hurricane glass"
  martini: "a martini glass"
  martini glass: "a martini glass"
  mug: "a mug"
  nick and nora: "a Nick and Nora"
  old fashioned: "an old fashioned glass"
  pilsner: "a pilsner"
  punch bowl: "a punch bowl"
  sling: "a sling glass"
  sour: "a sour glass"
  tiki mug: "a tiki mug"
  wine: "a wine glass"

heights_mm:
  shot: 60
  old-fashioned: 85
  old-fashioned-double: 100
  # Was 105 as a copper Moscow Mule mug. Lowered to a tea mug's height on
  # 2026-08-26 with the rename, since that is what it actually depicts now.
  # As unmeasured as every other number here — #295 still supersedes the lot.
  mug: 95
  julep-cup: 110
  # A GUESS, AND FLAGGED AS ONE RATHER THAN QUIETLY AVERAGED IN. Added
  # 2026-08-31 with the drawing (#528). A drinking coconut is roughly as wide
  # as it is tall and shorter than any glass here bar the shot and the
  # old-fashioned; 115 puts it between the julep cup and the punch bowl, which
  # is where it sits in the hand. Every number in this block is unmeasured
  # (#295) so this is no worse founded than its neighbours -- but it is the
  # newest and the least looked at, so check it against a real coconut before
  # trusting it over them.
  coconut: 115
  punch-bowl: 130
  brandy: 130
  hot-toddy: 140
  nick-and-nora: 140
  sour: 140
  coupe: 150
  sherry: 150
  highball: 150
  tiki-mug: 150
  pineapple: 150
  absinthe: 160
  martini: 175
  margarita: 175
  goblet: 175
  collins: 180
  pina-colada: 180
  wine: 200
  hurricane: 200
  sling: 200
  pilsner: 220
  flute: 230

# =============================================================================
# DISPLAY SCALE — the cheat, and it is a cheat on purpose.
# =============================================================================
# A multiplier applied to a glass's true-relative height when it is DRAWN on a
# card. Absent means 1, which is almost every glass.
#
# WHY IT EXISTS. Helen, 2026-08-26, looking at the card grid: coupe,
# nick-and-nora and tiki mug look right at the card's size, but "Collins and
# hurricane are so tall that their proportions aren't right". True relative
# height is correct information and, past a certain point, a bad drawing: a
# 180mm Collins next to an 85mm old-fashioned is accurate and reads as a stripe.
#
# A MULTIPLIER RATHER THAN PADDING, which was the first suggestion. Padding
# moves a glass's baseline while leaving it exactly as tall as it was; what is
# wrong at this size is the SIZE, so the size is what gives.
#
# IT IS DATA RATHER THAN CSS because every value is a judgement about ONE
# drawing rather than a fact about glassware, and the honest place for a set of
# per-item judgements is somewhere you can see all of them at once. This file
# already holds the other per-glass judgement (`heights_mm`), so this is its
# neighbour rather than a new idea.
#
# THE GLOBAL CURVE EXISTS NOW AND THIS MAP IS EMPTY -- Helen, 2026-08-31,
# #599/#601, choosing from /dev/card-glasses/.
#
# This paragraph used to say "TRY THE GLOBAL CURVE FIRST if a third glass ever
# wants a line here. The card template raises every ratio to a power before
# applying it." The advice was right and the fact was false: no curve existed,
# on the card or anywhere but the drink page, and `git log -S` over
# cocktails/index.html and _cards.scss confirms one never had. So the file told
# the next reader to reach for a knob that was not there, at exactly the moment
# a third glass wanted a line -- the flute, which is the tallest glass declared
# here and therefore 1.0 BY CONSTRUCTION, filling the whole panel.
#
# The curve is real now: `ratio * 0.5 + 0.5` in cocktails/index.html, with the
# headroom in $card-glass-scale. It does for every glass what these two lines
# did for the two that were noticed, so both came off. Measured on the
# collision they existed to fix -- a Collins beside an old-fashioned -- the pair
# stood 1.74x apart with the cheats and stand 1.34x apart with the curve.
#
# THE MECHANISM STAYS AND THE MAP IS DELIBERATELY EMPTY. `display_scale` is
# still read, still composes with the curve, and is still the right home for a
# judgement about ONE drawing rather than about the range. An empty map is the
# honest state: the range problem has a range answer now, and nothing is
# currently a special case. Add a line only when a specific drawing is wrong in
# a way the curve cannot see.
#
# WHY A DRAWING ARRIVES IN THE WRONG FRAME, since it will happen again. Helen
# builds a glass by editing an existing one, and Inkscape keeps the previous
# canvas silently even when it reports the document as resized. Four icons had
# artwork hanging outside their own viewBox that way (#599). The normaliser
# fits every canvas to its own ink on the way in, and
# test_no_glass_artwork_is_drawn_outside_its_viewbox is the check that it took.
display_scale: {}

