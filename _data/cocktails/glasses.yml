# =============================================================================
# GLASS → ICON. The vocabulary layer for cocktail glassware.
# =============================================================================
# `_layouts/cocktail.html` renders the icon for a drink's `glass:` value by
# looking it up here and inlining `_includes/icons/glasses/<icon>.svg`. Adding
# a glass is a YAML edit, never a template edit — the same contract
# _data/food/taxonomy.yml has.
#
# ABSENT MEANS NO ICON, not a broken one. A glass with no entry here (or an
# entry pointing at a file that does not exist) renders no icon at all rather
# than a 404 or an empty box — the same absent-means-nothing convention
# `reference_links` already uses in _data/sites.yml. (It used to cite
# `footer_svg` and `about_url`; both were retired by issue #374, when the header
# and footer stopped being per-site configuration. The convention is unchanged.)
#
# KEYS ARE THE GLASS STRING AS WRITTEN IN A DRINK'S FRONT MATTER, lowercased.
# The spreadsheet spells several glasses more than one way and those spellings
# are carried through the ingest verbatim rather than silently unified, so the
# aliases are handled HERE, where the variance is visible, instead of being
# tidied away in the data. If the drinks are ever normalised to one spelling
# each, these alias lines are what to delete.
# =============================================================================

icons:
  # --- one spelling, one icon ------------------------------------------------
  # Coupe is the collection's commonest glass by a wide margin -- 37 drinks
  # across the book. Helen drew it 2026-08-16; before that it was the one big
  # gap here and every coupe drink rendered iconless.
  coupe: coupe
  # Helen's spreadsheet spells the coupe two other ways. "champage saucer"
  # is her own typo, carried through the ingest verbatim rather than
  # silently corrected, so it is mapped here alongside the correct spelling.
  champagne saucer: coupe
  champage saucer: coupe
  sour: sour
  collins: collins
  flute: flute
  highball: highball
  hurricane: hurricane
  nick and nora: nick-and-nora
  punch bowl: punch-bowl
  tiki mug: tiki-mug

  # --- SIX DRINKS THAT WERE RENDERING NO ICON FOR NO REASON -------------------
  # Found 2026-08-17 by checking every `glass:` value in the collection against
  # this map, rather than by noticing a blank space on a page. Two shapes of
  # miss, and both are silent by design -- "absent means no icon" is the right
  # default and it cannot tell a deliberate gap from a forgotten one:
  #
  #   - martini and wine: the ARTWORK existed all along and simply had no key.
  #   - pilsner: the artwork did not exist until today (#303).
  #
  # This is why tests/test_cocktails.py now asserts the map and the icon
  # directory agree in both directions. A missing key costs an icon; a key
  # naming a missing file is worse, because `glass_icon = ""` once sent
  # `icons/glasses/.svg` to {% include %} and took the whole build down.
  martini: martini
  martini glass: martini
  wine: wine
  pilsner: pilsner
  sling: sling

  # --- icons added 2026-08-17, ahead of any drink asking for them -------------
  # Spec, not inventory -- the same principle as declaring Plymouth and Genever
  # gin while owning neither. Helen has tiki recipes not yet ingested.
  absinthe: absinthe
  goblet: goblet
  chalice: goblet
  pineapple: pineapple
  hollowed pineapple: pineapple

  # --- four spellings of one glass, all live in the data -----------------------
  # `rocks` used to point at a genuinely different (panelled) drawing -- see
  # the retirement note below. It is an alias now, matching the canonical
  # vocabulary rule ("old fashioned, not rocks") for real rather than in name
  # only.
  old-fashioned: old-fashioned
  old fashioned: old-fashioned
  old-fashioned glass: old-fashioned
  rocks: old-fashioned

  # `old-fashioned-double` redrawn 2026-08-26 to match the new single glass --
  # see the RESOLVED note below. Re-mapped now that the artwork exists.
  double rocks: old-fashioned-double
  double old fashioned: old-fashioned-double
  double old-fashioned: old-fashioned-double

  # --- judgement calls, worth checking by eye before trusting -----------------
  # `brandy glass` is the CANONICAL name and `snifter` is the alias, which is
  # the opposite of the usual convention -- snifter is the commoner word behind
  # a bar. Helen's call, 2026-08-17, and the reason is that she dislikes the
  # word itself on synaesthetic grounds. Recorded because nobody would ever
  # rediscover it, and a future tidy-up would otherwise "correct" it straight
  # back to snifter.
  brandy glass: brandy
  snifter: brandy

# =============================================================================
# GLASSES IN THE DATA WITH NO ICON — deliberately unmapped, not forgotten.
# =============================================================================
# Listed rather than silently absent so the gap is a fact in the repo instead
# of something to rediscover. Nothing reads this list; it is documentation.
#
#   any      NOT A GLASS AND MUST NEVER BE MAPPED. It is a real member of a
#            drink's `glass:` list meaning "no requirement" -- Daisy de
#            Santiago is "anything, but preferably a Collins". The layout
#            takes the first entry that HAS an icon, so `[collins, any]`
#            draws a Collins and `[any]` alone draws nothing, which is right.
#   todo     1 drink, and it is literally the word "todo" — a placeholder in
#            the source spreadsheet, not a glass. Do not map it to anything.
#   mug      1 drink. QQ — ambiguous between `mule mug` and `hot toddy`, which
#            are both mugs and both in the set. Needs Helen, not a guess.
#   long     1 drink. QQ — reads as "a long drink", which is a SERVE rather
#            than a glass. Lands on collins or highball depending on the pour.
#
# UNUSED ICONS, the other side of the same ledger: hot-toddy, julep-cup,
# margarita, mule-mug, pina-colada, sherry, shot, plus the three added ahead
# of demand (absinthe, goblet, pineapple). Several will find a glass once the
# non-rum drinks are ingested — margarita, mule-mug and julep-cup especially —
# so an unused icon is not evidence of a mistake.
#
# =============================================================================
# THE CANONICAL VOCABULARY — Helen, 2026-08-17
# =============================================================================
# When two words mean one glass, these are the ones to prefer in new drinks.
# The aliases above stay live regardless: the point of this file is that a
# drink is never wrong for using the other word.
#
#   coupe                 not "champagne saucer"
#   old fashioned         not "rocks"
#   double old fashioned  not "double rocks"
#   brandy glass          not "snifter"
#
# =============================================================================
# RESOLVED 2026-08-25 — the four-tumbler-icon problem this section used to
# document.
# =============================================================================
# Choosing `old fashioned` over `rocks` as the canonical word left the ARTWORK
# unresolved for a while: four tumbler icons (plain old-fashioned, its double,
# panelled rocks, panelled rocks-tall) against two canonical names, with
# `rocks` and `old fashioned` pointing at two different drawings — invisible
# on any single page, real the moment you looked at the whole set together
# (`_dev/glasses.html`, built for exactly this).
#
# Helen's call, having looked: none of the three options originally floated
# here (panelled wins / plain wins / keep both as different named glasses).
# Instead, `old-fashioned.svg` itself got a fresh redraw, and `rocks.svg` /
# `rocks-tall.svg` / the old `old-fashioned-double.svg` are all retired.
# `rocks` is now a plain alias to `old-fashioned` (see the canonical-vocabulary
# mapping above) rather than its own drawing.
#
# The double variant followed on 2026-08-26: `old-fashioned-double.svg`
# redrawn to match the new single glass (same body, uniformly scaled up,
# same four facet lines) rather than as an independent drawing. `double
# rocks` / `double old fashioned` / `double old-fashioned` are mapped to it
# now — Fancy-Free, Vieux Carré and Ti Punch get an icon again.
# =============================================================================

# =============================================================================
# EVERY ICON FILE, and yes this duplicates the directory listing on purpose.
# =============================================================================
# Liquid cannot read a directory. `_includes/` is not copied to the site, so it
# is not in `site.static_files` either, which means a template has NO way to ask
# "what icons exist?" — it can only look up the ones a key already names. That
# makes the most interesting question invisible to the swatch page: which
# artwork is UNREACHABLE, drawn and normalised and pointed at by nothing.
#
# So the inventory is written down, and tests/test_cocktails.py asserts it
# matches the directory exactly, in both directions. The duplication is real but
# it cannot drift: the test fails the moment an icon is added or removed without
# this list following. Without the test this would be a lie waiting to happen,
# which is the whole reason the assertion comes with it rather than after it.
# =============================================================================
# REAL-WORLD HEIGHTS IN MILLIMETRES — PROVISIONAL, AND HELEN'S TO CORRECT.
# =============================================================================
# THESE ARE NOT MEASURED. They are typical heights for each glass type, written
# by Claude on 2026-08-18 so that the relative-scale view on /dev/glasses/ has
# something honest to size from. Issue #295 is the real version of this list --
# the glasses Helen actually owns, with their volumes -- and it SUPERSEDES every
# number here the moment it exists.
#
# WHY THIS IS NOT THE viewBox HEIGHT, which is the obvious thing to use and is
# wrong. A viewBox records how the artwork was DRAWN, not how big the glass IS,
# and the two disagree badly: `shot` is drawn 77 units tall against `rocks` at
# 68, so at viewBox scale a shot glass stands TALLER than a rocks glass. It is
# about 60mm against 85mm in the real world. Same for `hot-toddy`, drawn
# shortest of everything at 60 units and actually one of the taller vessels.
# Helen, 2026-08-18: "Old fashioned glass needs to be smaller, and shot glass
# much smaller".
#
# Separating the two also means the ARTWORK NEVER HAS TO BE REDRAWN to fix a
# proportion: a wrong size is a number here, not an Inkscape session. That
# matters because redrawing is how you lose a glass's character by accident.
#
# The real site uses these now, 2026-08-25 (#298) -- `_layouts/cocktail.html`
# scales `--glass-icon-height` from this list against the tallest real glass,
# the same calculation `_dev/glasses.html`'s relative-scale view already
# proved out. #299, the proportion pass (fixing individual drawings once this
# exposes one that looks wrong at its real height), is still open.
heights_mm:
  shot: 60
  old-fashioned: 85
  old-fashioned-double: 100
  mule-mug: 105
  julep-cup: 110
  punch-bowl: 130
  brandy: 130
  hot-toddy: 140
  nick-and-nora: 140
  sour: 140
  coupe: 150
  sherry: 150
  highball: 150
  tiki-mug: 150
  pineapple: 150
  absinthe: 160
  martini: 175
  margarita: 175
  goblet: 175
  collins: 180
  pina-colada: 180
  wine: 200
  hurricane: 200
  sling: 200
  pilsner: 220
  flute: 230

# =============================================================================
# DISPLAY SCALE — the cheat, and it is a cheat on purpose.
# =============================================================================
# A multiplier applied to a glass's true-relative height when it is DRAWN on a
# card. Absent means 1, which is almost every glass.
#
# WHY IT EXISTS. Helen, 2026-08-26, looking at the card grid: coupe,
# nick-and-nora and tiki mug look right at the card's size, but "Collins and
# hurricane are so tall that their proportions aren't right". True relative
# height is correct information and, past a certain point, a bad drawing: a
# 180mm Collins next to an 85mm old-fashioned is accurate and reads as a stripe.
#
# A MULTIPLIER RATHER THAN PADDING, which was the first suggestion. Padding
# moves a glass's baseline while leaving it exactly as tall as it was; what is
# wrong at this size is the SIZE, so the size is what gives.
#
# IT IS DATA RATHER THAN CSS because every value is a judgement about ONE
# drawing rather than a fact about glassware, and the honest place for a set of
# per-item judgements is somewhere you can see all of them at once. This file
# already holds the other per-glass judgement (`heights_mm`), so this is its
# neighbour rather than a new idea.
#
# TRY THE GLOBAL CURVE FIRST if a third glass ever wants a line here. The card
# template raises every ratio to a power before applying it, so compressing the
# whole range is one number and does not need a per-glass exception. These two
# are here because the curve that fixed them flattened everything else.
display_scale:
  collins: 0.82
  hurricane: 0.74

