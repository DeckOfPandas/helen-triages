# Where each glass stands, so a label is centred under its base and not under
# its box (a mug's handle is in the box). A signed fraction of the drawing's
# width, from the centre of the viewBox; negative is left. Glasses under 1%
# are omitted. /cocktails/reference/glasses/ shifts each drawing by minus this.
# >>> GENERATED by scripts/glass_base_centres.py -- do not edit by hand
base_centre:
  coconut: 0.038
  hot-toddy: -0.082
  mug: -0.127
  mule-mug: -0.127
  pineapple: -0.089
# <<< END GENERATED base_centre

# Fit rules: how much drink a glass takes. scripts/glass_fit_report.py flags
# drinks that do not fit and _plugins/cocktail_units.rb sizes a top from them.
# A {low, high} range is where the sources disagree (they are in the PR for
# #1238); the report flags on the forgiving end, so a flag means the drink
# fits on no reading. Dilution is a fraction of the RECIPE volume, not of the
# finished drink. shake, short_shake and stir are Helen's figures (#1179):
# both ends carry her number on purpose, so do not restore a sourced range.
# `lost_below` is a judgement, not sourced.
fit_rules:
  dilution:
    shake:          {low: 0.275, high: 0.275}
    short_shake:    {low: 0.15, high: 0.15}
    stir:           {low: 0.20, high: 0.20}
    build:          {low: 0, high: 0}
    swizzle:        {low: 0, high: 0}
    dry_shake_only: {low: 0, high: 0}
  blended_multiplier: {low: 1.9, high: 2.1}
  washline:
    stemmed: 0.75
    tumbler: 0.90
  # The glasses whose line is the lower, stemmed one. Every other type is a
  # tumbler for this purpose, mugs and fruit included.
  stemmed:
    - absinthe
    - brandy
    - coupe
    - flute
    - goblet
    - hot-toddy
    - hurricane
    - margarita
    - martini
    - nick-and-nora
    - pina-colada
    - sherry
    - sling
    - sour
    - wine
  ice_space:
    cubed:   {low: 0.31, high: 0.61}
    crushed: {low: 0.50, high: 0.70}
  half_fill: 0.5
  large_cube_ml: {low: 120, high: 131}
  punch_cup_ml: {low: 90, high: 120}
  lost_below: 0.5
  # Two more judgements (#1244). `tolerance`: a drink is flagged only when it
  # is over by more than this share, which is the model's noise.
  # `top_room_min`: "hardly any room for a top" fires when a build leaves less
  # than this share of the least a top pours.
  tolerance: 0.10
  top_room_min: 0.25

# A multiplier on a glass's height when it is drawn on a CARD; absent means 1.
# The curve in cocktails/index.html, with `$card-glass-scale`, already
# compresses the range for every glass, so this map is empty. Add a line only
# for one drawing that is wrong in a way the curve cannot see.
display_scale: {}

