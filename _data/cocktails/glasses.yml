# Glassware: which icon a `glass:` value draws, the canonical spellings, the
# serving phrases, and what each glass type measures.
#
# `icons:` keys are the glass string as a drink writes it, lowercased, aliases
# included. `_layouts/cocktail.html` inlines `_includes/icons/glasses/<icon>.svg`
# for the value, so adding a glass is an edit here, never to a template. A
# glass with no key renders no icon, silently; a drink naming a glass that is
# not a key fails test_every_glass_value_is_in_the_vocabulary (#491).

icons:
  # --- one spelling, one icon ------------------------------------------------
  coupe: coupe
  # An alias. Retiring one means removing it here AND from `canonical_glasses`:
  # the ingest document prints every key here that the map does not correct.
  champagne saucer: coupe
  sour: sour
  collins: collins
  flute: flute
  highball: highball
  hurricane: hurricane
  nick and nora: nick-and-nora
  # The name is accented prose and the icon slug is plain, as with
  # `nick and nora`.
  piña colada: pina-colada
  punch bowl: punch-bowl
  tiki mug: tiki-mug
  # A tiki mug for now. Helen has not ruled out a zombie glass of its own;
  # that would be new artwork and survey rows, and this alias would move.
  zombie glass: tiki-mug
  julep cup: julep-cup
  julep tin: julep-cup
  julep stainless steel cup: julep-cup

  # --- two mugs, two drawings --------------------------------------------------
  mug: mug
  mule mug: mule-mug

  martini: martini
  martini glass: martini
  wine: wine
  pilsner: pilsner
  sling: sling
  margarita: margarita

  # --- declared ahead of demand: an icon with no drink is normal here ----------
  absinthe: absinthe
  goblet: goblet
  chalice: goblet
  pineapple: pineapple
  hollowed pineapple: pineapple
  coconut: coconut
  coconut shell: coconut

  # --- four spellings of one glass ---------------------------------------------
  old-fashioned: old-fashioned
  old fashioned: old-fashioned
  old-fashioned glass: old-fashioned
  rocks: old-fashioned

  double rocks: old-fashioned-double
  double old fashioned: old-fashioned-double
  double old-fashioned: old-fashioned-double

  # `brandy glass` is canonical and `snifter` the alias, against bar
  # convention. Helen's choice: do not "correct" it.
  brandy glass: brandy
  snifter: brandy

# When two words mean one glass, this is the one a drink must write: alias ->
# canonical. test_drinks_use_the_canonical_glass_spelling derives its whole
# vocabulary from this map. The aliases stay in `icons:` regardless, so a drink
# that slips through still renders. An alias absent from this map is permitted
# in a drink: nobody has ruled on it yet.
canonical_glasses:
  "rocks": "old fashioned"
  "old-fashioned": "old fashioned"
  "old-fashioned glass": "old fashioned"
  "double rocks": "double old fashioned"
  "double old-fashioned": "double old fashioned"
  "champagne saucer": "coupe"
  "snifter": "brandy glass"
  "martini glass": "martini"
  "pineapple": "hollowed pineapple"
  "coconut": "coconut shell"
  # The icon slug, corrected to the prose name.
  "pina-colada": "piña colada"
  "pina colada": "piña colada"
  "julep tin": "julep cup"
  "julep stainless steel cup": "julep cup"
  "zombie glass": "tiki mug"

# How a generated step names the glass. `_layouts/cocktail.html` composes
# "Strain into <phrase><ice clause>." from the method's technique, this phrase
# and serve.yml `in_the_glass`, so the sentence is never stored. Keyed on the
# canonical name. The article and the word "glass" are part of each phrase,
# because no rule gets them right from the key. A glass in use with no phrase
# fails test_every_glass_in_use_has_a_serving_phrase.
serving:
  brandy glass: "a brandy glass"   # kept, Helen 2026-09-25 (#1186): no drink uses it yet
  collins: "a collins glass"
  coconut shell: "a coconut shell"
  coupe: "a coupe"
  double old fashioned: "a double old fashioned glass"
  flute: "a flute"
  highball: "a highball"
  hurricane: "a hurricane glass"
  julep cup: "a julep cup"
  margarita: "a margarita glass"
  martini: "a martini glass"
  martini glass: "a martini glass"   # kept, Helen 2026-09-25 (#1186): no drink uses it yet
  mug: "a mug"
  mule mug: "a mule mug"
  piña colada: "a piña colada glass"
  nick and nora: "a Nick and Nora"
  old fashioned: "an old fashioned glass"
  pilsner: "a pilsner"
  punch bowl: "a punch bowl"
  sling: "a sling glass"
  sour: "a sour glass"
  tiki mug: "a tiki mug"
  wine: "a wine glass"

# The heights that are not the survey's median, each with its reason.
# scripts/glass_survey_stats.py writes these into `heights_mm` in place of the
# median.
height_overrides:
  # 130 against a surveyed 256. The tallest glass is the scale's denominator,
  # so at its real height the bowl would shrink every other glass on the site.
  punch-bowl: 130
  # Kept by Helen against surveyed 89 and 98. The double is the single scaled
  # up (#347).
  old-fashioned: 85
  old-fashioned-double: 100

# A surveyed type that shares another type's drawing but not its size, with
# the `glass:` spellings that mean it. Empty today; the key stays because the
# glasses page, scripts/glass_survey_stats.py and scripts/glass_fit_report.py
# read it.
survey_only_types: {}

