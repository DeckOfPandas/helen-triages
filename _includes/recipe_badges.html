{% comment %} GitHub issue #40 -- a badge is a LINK, in both of the two places
   this partial is included (a recipe row on food/index.html, and the badge row
   at the top of a recipe page via _layouts/recipe.html). One template change
   serves both halves of the issue.

   AN <a> WITH A REAL href, not a <button> that sets location. The href is what
   makes middle-click, open-in-new-tab, copy-link-address and "where does this
   go" on hover all work; a button plus location.href breaks every one of them.
   On the index, filters.js intercepts the click (a delegated handler on
   .recipe-list) and filters in place, so the URL is the fallback there rather
   than the mechanism. On a recipe page nothing intercepts it and it is simply
   a link to the index, pre-filtered.

   THE QUERY GRAMMAR IS assets/js/filter-state.js's -- read its header, not
   this comment, for the full rules. What matters here: one parameter per
   filter KIND, and `url_encode` (Jekyll's CGI.escape) spells a space as `+`,
   which parseQuery is written to undo. `oily fish`, `root veg`, `carbs
   party`, `hot snack`, `ice cream` and `one-handed food` all depend on that.

   data-star/data-tag carry the raw, unencoded value for the click handler, so
   nothing on the JS side ever has to un-encode an href or read a badge's own
   text back out of the DOM.

   EVERY HREF ENDS IN THE FILTER SECTION'S OWN FRAGMENT -- #1059, 2026-09-15.
   On a recipe page nothing intercepts the click, so the fragment is what gets
   the reader onto the lit chip rather than the top of the index; on the index
   row filters.js still intercepts the click first, so the fragment travels
   along unused there, exactly as the query string already did before this
   badge was ever a real link (#40's own argument, restated for a fragment
   rather than a query). `#filter-star` matches `section_id="filter-star"` on
   food/index.html's star filter_group.html call; `#filter-{{ group.name }}`
   matches that same file's per-tag-group call, so a badge and its section can
   never name the fragment differently. {% endcomment %}

{% if include.recipe.star_ingredient %}
  <a class="badge badge-star" data-star="{{ include.recipe.star_ingredient }}" href="{{ '/food/' | relative_url }}?star={{ include.recipe.star_ingredient | url_encode }}#filter-star"><span class="tag-shape" aria-hidden="true"></span>{{ include.recipe.star_ingredient }}</a>
{% endif %}

{% comment %} Group membership comes from _data/taxonomy.yml; the badge class is
   derived from the group name, so adding a tag group needs no change here.
   The tags hash is iterated as [key, value] pairs rather than looked up with
   tags[group.name] — the bracket form with a variable key is not reliable. {% endcomment %}
{% for group in site.data.food.filter_sections.tag_groups %}
  {% assign group_tags = "" | split: "" %}
  {% for pair in site.data.food.taxonomy.tags %}
    {% if pair[0] == group.name %}{% assign group_tags = pair[1] %}{% endif %}
  {% endfor %}

  {% for tag in include.recipe.tags %}
    {% if group_tags contains tag %}
      <a class="badge badge-{{ group.name }}" data-tag="{{ tag }}" href="{{ '/food/' | relative_url }}?tag={{ tag | url_encode }}#filter-{{ group.name }}"><span class="tag-shape" aria-hidden="true"></span>{{ tag }}</a>
    {% endif %}
  {% endfor %}
{% endfor %}
