{% comment %} The temperature charts' one axis: a recipe page's doneness chart and every
   chart on food/reference/internal-temperatures.html. The ticks must match the
   scale, $tc-min/$tc-max in _sass/food/_temperature-chart.scss.
{% endcomment %}
<div class="tc-axis">
  <div class="tc-axis-scale">
    <div class="tc-tick" style="--t:40;">40°C</div>
    <div class="tc-tick" style="--t:50;">50</div>
    <div class="tc-tick" style="--t:60;">60</div>
    <div class="tc-tick" style="--t:70;">70</div>
    <div class="tc-tick" style="--t:80;">80</div>
    <div class="tc-tick" style="--t:90;">90</div>
    <div class="tc-tick" style="--t:100;">100°C</div>
  </div>
</div>
