<!-- SHIP, the goodness mark on a drink card. Supplied by Helen, 2026-08-30.

     SOURCE AND CREDIT: "Ricons", via the Noun Project. The original carried the
     credit as two <text> nodes INSIDE the artwork, which would have drawn
     "Created by Ricons / from Noun Project" on every card. They are removed
     from the drawing and recorded here instead.

     THIS ONE NEEDS A VISIBLE CREDIT AND MOST OF THE OTHERS DO NOT. Helen,
     2026-08-30: most site artwork came from a paid Shutterstock account, which
     is attribution-free; this is a Noun Project icon, which is CC BY unless
     separately licensed. She holds the credit text and plans a footer-linked
     attributions page once the icon set settles, "given icons come in and out".
     So this comment is the RECORD, not the discharge — the obligation is met
     when that page exists and names this file.

     CANVAS FITTED to the ink by scripts/svgrender.py's fit_viewbox. The source
     box was 110x135 for artwork about 100 tall — the slack was the space the
     attribution text sat in — and §9.14 is why that matters: the box is what
     gets sized, so a drawing with air in it renders smaller than one without.

     FILLED, NOT STROKED, and that is deliberate rather than an oversight. It
     replaces a filled square, it is 1rem on a card, and at that size a stroked
     version would read as spindly beside the word it sits with. It is also far
     from the glass column, so it is not competing with the line-art glasses.
     scripts/trace_centrelines.py could convert it, but that tool is only valid
     on artwork of UNIFORM stroke width (§9.13) and this is a solid silhouette.

     Colour comes from .drink-card-ship-icon; the path takes currentColor. -->
