# Dependabot (#1203). Monthly and grouped, with `open-pull-requests-limit: 3`
# per ecosystem: every PR it opens is Helen's to review and merge, and a
# monthly batch is one she can sit down with.
#
# A pip bump needs the devcontainer image rebuilt: requirements-test.txt pins
# pytest, PyYAML and playwright exactly, .devcontainer/Dockerfile repeats the
# pins by hand, and tests/test_devcontainer_pins.py fails when they differ.
version: 2
updates:
  # Ruby: the site itself. A Jekyll or plugin bump changes what gets built.
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      bundler:
        patterns: ["*"]

  # Python: the test suite only. The site needs nothing from Python.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      pip:
        patterns: ["*"]
    ignore:
      # Playwright moves by hand. Its version is written in
      # requirements-test.txt, .devcontainer/Dockerfile and
      # scripts/browser/install.sh, and Dependabot can move only the first;
      # tests/test_browser_harness.py and tests/test_devcontainer_pins.py fail
      # on a mismatch (#1233). It also needs an image rebuild, which no PR can
      # perform.
      - dependency-name: "playwright"

  # GitHub Actions: a pinned-to-major action goes stale silently.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
