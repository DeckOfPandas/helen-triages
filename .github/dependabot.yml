# Dependabot (#1203). Monthly and grouped, with `open-pull-requests-limit: 3`
# per ecosystem: every PR it opens is Helen's to review and merge, and a
# monthly batch is one she can sit down with.
#
# A pip bump needs the container's copy moved too: requirements-test.txt pins
# exactly what .devcontainer/requirements.txt, kit.env and the kit's Dockerfile
# install, and tests/test_ci_matches_container.py fails when they differ.
version: 2
updates:
  # Ruby: the site itself. A Jekyll or plugin bump changes what gets built.
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      bundler:
        patterns: ["*"]

  # Python: the test suite only. The site needs nothing from Python.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      pip:
        patterns: ["*"]
    ignore:
      # Playwright moves by hand: its version is also in kit.env and
      # scripts/browser/install.sh, which Dependabot cannot move (#1233), and
      # it needs an image rebuild, which no PR can perform.
      - dependency-name: "playwright"
      # pytest's image pin is in the kit's Dockerfile, so it moves with a kit
      # sync, never on its own here.
      - dependency-name: "pytest"

  # GitHub Actions: a pinned-to-major action goes stale silently.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
