name: Build and deploy Jekyll site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ONE GROUP FOR DEPLOYS, ONE PER PULL REQUEST. #1281.
#
# Until this change the whole workflow shared the `pages` group, pull-request
# runs included, so a PR's test run queued behind whatever deploy was in
# progress: measured 2026-10-02, a 198s job took 389s to report. Worse, GitHub
# keeps one WAITING run per group, so a PR run arriving dropped a deploy that
# was waiting its turn -- three merges sat undeployed that day.
#
# A push to `main` (or a manual run) stays in `pages` and is never cancelled
# mid-run, exactly as before: deploys are serialised, so an older one can
# never land on top of a newer one. A pull-request run gets a group of its
# own, and a new push to the same PR cancels the run it supersedes -- that
# run's answer is about a commit nobody will merge.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ===========================================================================
  # TESTS GATE THE DEPLOY. GitHub issue #369.
  # ===========================================================================
  # Until 2026-08-18 this workflow checked out, built, rendered PDFs and
  # deployed, with no test step anywhere. Every guard in the repository
  # protected a local `pytest` run and nothing else, so a push to `main` shipped
  # whatever was on `main` however red the suite was -- including, pointedly,
  # the `awaiting-fix` publish gate (#331), whose whole job is to stop a flagged
  # recipe going live.
  #
  # THE GATE IS ON `deploy`, NOT ON `build`, SINCE #1281. `build` used to
  # declare `needs: test`, which made every merge wait for the suite and THEN
  # for the build and the PDFs. They now run side by side and `deploy` declares
  # `needs: [test, build]`, so nothing is deployed unless this job is green --
  # the same guarantee, about two minutes sooner. A red suite now costs one
  # built-and-uploaded artifact that is never deployed.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # FULL HISTORY, AND THIS IS LOAD-BEARING. actions/checkout is shallow
          # by default (depth 1), and in a depth-1 clone `git log -- <file>`
          # reports the same single commit for every file. #367's test reads
          # history to find who last touched each recipe, so on a shallow clone
          # it would examine nothing and pass -- a green that means less than no
          # result. It asserts the clone is not shallow for exactly that reason,
          # so getting this wrong fails loudly rather than lying.
          fetch-depth: 0

      # Ruby, because the suite is not purely static: test_rendered_pages.py
      # runs two real `jekyll build`s (one with the local config, one with
      # production alone) and checks the OUTPUT. That is the only way to catch a
      # link that resolves locally and 404s in production, which has shipped
      # here before.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Python tests
        run: python3 -m pytest -q

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # THE GLOB IS NOT OPTIONAL. `node --test tests/js/` treats the DIRECTORY
      # as a single test file: it reports "tests 1, fail 1" and tells you
      # nothing about the 144 tests inside. The glob runs all of them. Checked,
      # not assumed, on 2026-08-18 -- and worth knowing because the test files'
      # own header comments suggest the directory form.
      #
      # `.node-runtime/` is gitignored, so CI uses its own Node rather than the
      # vendored one. This suite has form for silently not running: it went
      # weeks without executing because the vendored binary had lost its execute
      # bit, and nothing said so.
      - name: JavaScript tests
        run: node --test tests/js/*.test.js

  # NO `needs: test` HERE, ON PURPOSE -- see the note above `test`. This job
  # only produces an artifact; `deploy` is the job that publishes it, and
  # `deploy` is the one that waits for the suite.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # GitHub issue #86. Renders every built recipe page to a PDF beside it,
      # so /food/recipes/<slug>.pdf is a real file rather than something the
      # browser is asked to make. Runs on the FINISHED _site, between the build
      # and the upload -- Jekyll never sees the PDFs.
      #
      # No install step: Google Chrome and Python both ship with the ubuntu
      # runner image (checked against actions/runner-images, not assumed). The
      # script exits non-zero if either the browser or a single render is
      # missing, which fails this job on purpose -- a deploy that quietly
      # stopped producing PDFs would leave every "pdf" link on the site
      # pointing at a 404, and nothing else would catch it.
      - name: Render recipe PDFs
        run: python3 scripts/generate_pdfs.py --site _site --jobs 4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  # BOTH, AND NO STATUS FUNCTION IN THE `if`. A job with `needs` runs only if
  # every job it needs SUCCEEDED, unless its `if` calls always(), failure(),
  # cancelled() or !cancelled() -- any of which would let a red suite deploy.
  # tests/test_site_config.py refuses all four here.
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
