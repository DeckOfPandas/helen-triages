name: Build and deploy Jekyll site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One group for deploys, one per pull request (#1281). A push to `main` or a
# manual run stays in `pages` and is never cancelled mid-run, so deploys are
# serialised and an older one cannot land on top of a newer. A pull-request
# run has its own group, so it neither queues behind a deploy nor displaces
# a waiting one, and a new push to the same PR cancels the run it supersedes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests gate the deploy (#369). The gate is on `deploy`, not on `build`
  # (#1281): the two run side by side and `deploy` declares
  # `needs: [test, build]`, so nothing is deployed unless this job is green.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history, and it is load-bearing. actions/checkout is shallow by
          # default, and the tests that read git history to find who last
          # touched each recipe (#367) assert the clone is not shallow.
          fetch-depth: 0

      # Ruby, because the suite builds the site: tests/test_rendered_pages.py
      # runs real `jekyll build`s and checks the output.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Python tests
        run: python3 -m pytest -q

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The glob is not optional: `node --test tests/js/` treats the directory as
      # a single test file. `.node-runtime/` is gitignored, so CI uses its own
      # Node.
      - name: JavaScript tests
        run: node --test tests/js/*.test.js

  # No `needs: test` here, on purpose -- see the note above `test`. This job
  # only produces an artifact; `deploy` is the job that publishes it, and
  # `deploy` is the one that waits for the suite.
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Renders every built recipe page to a PDF beside it (#86), on the finished
      # _site, between the build and the upload. No install step: Chrome and
      # Python ship with the runner image. The script exits non-zero if the
      # browser or any render is missing, which fails this job on purpose:
      # otherwise every "pdf" link on the site would point at a 404.
      - name: Render recipe PDFs
        run: python3 scripts/generate_pdfs.py --site _site --jobs 4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"

  # Both, and no status function in the `if`. A job with `needs` runs only if
  # every job it needs SUCCEEDED, unless its `if` calls always(), failure(),
  # cancelled() or !cancelled() -- any of which would let a red suite deploy.
  # tests/test_site_config.py refuses all four here.
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
