# =============================================================================
# LOCAL OVERRIDES — never deployed.
#   bundle exec jekyll serve --config _config.yml,_config_local.yml --port 4001
#
# baseurl is deliberately NOT overridden here. Local and production now use the
# same path, so what you see at localhost is what you get when you deploy.
# Your local URL becomes:
#   http://localhost:4001/helen-triages/
# =============================================================================

# Show drafts and unrewritten recipes in the index, with their meta filters.
show_source_wording: true

# No "pdf" link on the working view (GitHub issue #86). The PDFs are rendered
# from a finished build by scripts/generate_pdfs.py -- nothing Jekyll does
# creates them -- so the link would 404 here every time, which is how you learn
# to ignore a link. It IS on at localhost:4002, which is meant to show exactly
# what deploys; to make it work there as well as show, render into that build:
#
#   python3 scripts/generate_pdfs.py --site _site_prod
#
# (that needs a Chrome or Chromium on PATH -- see the script's --chrome flag).
pdf_downloads: false

# Show recipes flagged `meta.awaiting_fix: true`. Production hides them
# entirely (issue #331); locally they must be visible, because they are the
# ones being worked on.
show_awaiting_fix: true

collections:
  # Internal reference pages, readable only here. See _config.yml for why this
  # is a collection and not a loose page (issue #276: unlinked got published).
  dev:
    output: true
    permalink: /dev/:path/
  food_drafts:
    output: true
    permalink: /food/drafts/:path/
  cocktail_drafts:
    output: true
    permalink: /cocktails/drafts/:path/

# Show the approximate ingredient cost in a drink's footer. LOCAL ONLY, by
# Helen's instruction on the day it was built (2026-09-05): "I only want to show
# price on the locally built site, and only as an incidental." Production
# declares no such key, so `site.show_costs` is false there and
# _layouts/cocktail.html renders nothing -- the same idiom as `show_drafts`
# below, and it must stay out of _config.yml for the same reason.
#
# THE PRICES THEMSELVES ARE NOT SECRET and live in _data/cocktails/costs.yml in
# the public repo. This key governs what the SITE says, not what the repo keeps:
# a page telling a stranger what Helen's Chartreuse cost is a different thing
# from a table she uses to decide what to make.
show_costs: true

# Show how many units of alcohol are in a serving (#297). LOCAL ONLY, and for
# now that is a caution rather than a ruling: Helen, 2026-09-06, chose "local
# only now, and I'll note what publishing would need". The note is in the issue
# and in abv.yml's header -- it comes down to the seventeen `qq:` rows, which are
# strengths I could not settle without the label on her shelf. Publishing a unit
# count built partly on those is a different promise from publishing a rough
# price, and it is hers to make once they are cleared.
#
# THE STRENGTHS THEMSELVES ARE NOT SECRET, exactly as the prices are not: they
# are in _data/cocktails/abv.yml in the public repo either way. This key governs
# what the SITE claims.
show_units: true

# Show cocktail drafts on the cocktails index. LOCAL ONLY, AND THAT IS THE
# WHOLE POINT: `output: false` stops Jekyll writing a draft but does NOT take
# it out of site.cocktail_drafts, so a template looping the collection prints
# private drink names into public HTML and links them to URLs that were never
# written -- issue #235. Production declares no such key, so the condition in
# cocktails/index.html is false there and the page falls back to its empty
# state. Never move this into _config.yml.
show_drafts: true

# Build pages whose front matter says `published: false` (#529's rum reference,
# and food's cooking-methods prose archive). Jekyll's own flag; production does
# not declare it, so those pages have no URL and no sitemap entry there.
unpublished: true

# Draw footer reference links marked `local_only` in _data/sites.yml. LOCAL
# ONLY, and it is the second half of the switch above rather than a separate
# feature: a page that does not build in production must not be linked from
# there either. Same idiom as show_costs / show_units / show_drafts, and it
# must stay out of _config.yml for the same reason.
show_local_reference_links: true
