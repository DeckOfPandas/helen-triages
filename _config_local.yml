# Local overrides, never deployed.
#   bundle exec jekyll serve --config _config.yml,_config_local.yml --port 4001
#
# baseurl is deliberately not overridden: local and production use the same
# path, so the local URL is http://localhost:4001/helen-triages/

# Show recipes still carrying the source's wording on the index. See
# _config.yml.
show_source_wording: true

# No "pdf" link on the working view (#86): nothing Jekyll does creates the
# PDFs, so the link would 404 here. It is on at localhost:4002; to make it
# work there as well as show, render into that build:
#
#   python3 scripts/generate_pdfs.py --site _site_prod
#
# (that needs a Chrome or Chromium on PATH -- see the script's --chrome flag).
pdf_downloads: false

# The search-for-anything box in the header of every page (#1210). Local
# only: production declares no such key, so _includes/page-search.html
# renders nothing there. Must stay out of _config.yml.
show_header_search: true

# Build every page whatever its `meta` flags say: this switches off
# _plugins/publish_gate.rb, because the held-back pages are the ones being
# worked on.
show_awaiting_fix: true

collections:
  # Internal reference pages, readable only here. See _config.yml for why this
  # is a collection and not a loose page (issue #276: unlinked got published).
  dev:
    output: true
    permalink: /dev/:path/
  food_drafts:
    output: true
    permalink: /food/drafts/:path/
  cocktail_drafts:
    output: true
    permalink: /cocktails/drafts/:path/

# Show the approximate ingredient cost in a drink's footer. Local only:
# production declares no such key, so `site.show_costs` is false there. Must
# stay out of _config.yml. The prices themselves are public, in
# _data/cocktails/costs.yml; this governs only what the site prints.
show_costs: true

# Show cocktail drafts on the cocktails index. Local only: `output: false`
# stops Jekyll writing a draft but leaves it in site.cocktail_drafts, so a
# template looping the collection would print private drink names into
# public HTML (#235). Never move this into _config.yml.
show_drafts: true

# Build pages whose front matter says `published: false`: food's
# cooking-methods prose archive. Jekyll's own flag; production does not
# declare it, so such a page has no URL and no sitemap entry there.
unpublished: true

# Draw footer reference links marked `local_only` in _data/sites.yml: the
# second half of `unpublished` above, since a page that does not build in
# production must not be linked from there. Must stay out of _config.yml.
# No entry is marked today; the key stays for the next reference page.
show_local_reference_links: true
