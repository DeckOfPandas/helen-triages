# Which GitHub owner, repositories and bot account the scripts/ wrappers act
# on. Parsed by scripts/_github_conf.sh, never executed: plain KEY=value only.
#
# This committed copy holds placeholders. Copy it to scripts/github.local.conf
# (gitignored) and fill that in: the wrappers read the local copy when there is
# one, and a worktree reads the main checkout's.

# The user or organisation that owns the repositories.
GH_OWNER=your-org

# The repositories the agent may act on, space-separated. The FIRST is the
# default for every wrapper that takes an optional repo.
GH_REPOS="your-repo"

# The bot account AGENT_GH_TOKEN belongs to. GitHub authenticates the token,
# not this name, but github-public-status.sh lets Claude check its own page.
GH_AGENT_USER=your-bot-account

# Repositories whose `main` the agent may push to directly, space-separated.
# Each must also be in GH_REPOS. Empty means `main` only moves by a merged PR.
MAIN_PUSH_REPOS=""

# Repositories where the agent may only open and edit pull requests (and read,
# clone, fetch and push branches): gh-write.sh refuses comments, issues and
# labels there. Each must be in GH_REPOS and not in MAIN_PUSH_REPOS.
PR_ONLY_REPOS=""

# Nested clones in this checkout (gitignored folders, cloned with
# git-clone-agent.sh) that scripts/git-nested.sh may run git in, space-separated
# folder names. Empty means none. `folder:repo` also names the repo it clones,
# and session-ground-truth.py then warns, with the clone command, when the
# folder is absent -- for clones the test suite reads.
NESTED_DIRS=""
