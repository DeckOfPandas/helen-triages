# Production config: this is what deploys. Anything that should only be
# visible on your own machine belongs in _config_local.yml.
#
# A mono-repo: one Jekyll build serves /helen-triages/food/ and
# /helen-triages/cocktails/. Per-site identity (wordmark, title, stylesheet)
# lives in _data/sites.yml, selected by `site_key`, set in `defaults:` below.

# The repo-level identity. `title` is the footer's copyright line on every
# page. `description` is only a fallback for a page of neither site: both
# sites declare their own in _data/sites.yml.
title: Helen Triages
description: What not How.

# GitHub Pages project site. Repo is helen-triages, so the published URL is
#   https://<your-github-username>.github.io/helen-triages/
# baseurl must match the repo name exactly: leading slash, no trailing slash.
url: "https://deckofpandas.github.io"
baseurl: "/helen-triages"

# Whether the index shows recipes still carrying the source's wording
# (`meta.rewritten: false`). False here; _config_local.yml sets it true. Not
# about drafts, which are hidden by `output: false` on their collections.
show_source_wording: false

# Whether a recipe page offers its "pdf" link (#86). True here and so on the
# jekyll-prod mockup. _config_local.yml turns it off for jekyll-local, where
# the PDFs do not exist: scripts/generate_pdfs.py renders them from a
# finished build.
pdf_downloads: true

# The "click for short method" toggle and its "In short:" print section. Off
# everywhere (no _config_local.yml override) until the feature is fixed; the
# `method_short` data and the rendering code stay.
short_method_enabled: false

# False here: production removes every page that does not say
# `meta.awaiting_fix: false` and `meta.proofread: true` (and
# `meta.rewritten: true` on a cocktail), via _plugins/publish_gate.rb.
# _config_local.yml sets it true so every page builds locally. Named for the
# first flag; it switches the whole gate (#331, #667, #1137).
show_awaiting_fix: false

# --- Collections -------------------------------------------------------------
# Source directories sit at the repo root: Jekyll only discovers a collection
# at `_<name>` directly under the source root, and one placed at
# `food/_recipes/` silently builds nothing. The site is carried in the
# collection's name, and `permalink` puts the output under /food/ or
# /cocktails/.
collections:
  dev:
    # Internal reference pages. A collection with `output: false`, not loose
    # .html files: Jekyll publishes any page it renders, linked or not (#276).
    # _config_local.yml flips it to true.
    output: false
  food_recipes:
    output: true
    permalink: /food/recipes/:path/
  food_magic_bag:
    # The magic bag: dishes Helen makes without a recipe. Not a recipe: no
    # method, times or source, and an ingredients list that is incomplete by
    # design. A separate collection so the unconditional recipe guards in
    # tests/test_front_matter.py need no exception; its own rules are
    # tests/test_magic_bag.py. No caveat is printed on the page.
    output: true
    permalink: /food/magic-bag/:path/
  food_drafts:
    # output: false means drafts get NO public URL and are NOT in the sitemap.
    # _config_local.yml flips this back to true so you can still read them locally.
    output: false
  cocktail_recipes:
    output: true
    permalink: /cocktails/recipes/:path/
  cocktail_drafts:
    # Same two-part protection as food_drafts: `output: false` stops Jekyll
    # publishing them, and _cocktail_drafts/ is its own gitignored git repo.
    # `output: false` does not take a draft out of `site.cocktail_drafts`, so
    # an index must not list them (#235). _config_local.yml flips this to true.
    output: false

# --- Defaults ----------------------------------------------------------------
# `site_key` makes the shared layout site-aware: it keys into _data/sites.yml
# and into _data/<key>/ for that site's vocabulary. A page with no site_key
# falls back to the repo-level identity above.
defaults:
  - scope:
      path: ""
      type: food_recipes
    values:
      layout: recipe
      site_key: food
  - scope:
      path: ""
      type: food_magic_bag
    values:
      layout: magic_bag
      site_key: food
  - scope:
      path: ""
      type: food_drafts
    values:
      layout: recipe
      site_key: food
      sitemap: false   # belt and braces: excluded even if output is ever flipped
  - scope:
      path: ""
      type: cocktail_recipes
    values:
      layout: cocktail
      site_key: cocktails
  - scope:
      path: ""
      type: cocktail_drafts
    values:
      layout: cocktail
      site_key: cocktails
      sitemap: false   # belt and braces: excluded even if output is ever flipped
  # Pages, by directory. These are ordinary pages rather than collection
  # documents, so they are scoped by path instead of by type.
  - scope:
      path: "food"
    values:
      site_key: food
  - scope:
      path: "cocktails"
    values:
      site_key: cocktails

# Keep non-site files out of the build. Setting `exclude` REPLACES Jekyll's
# defaults, so the standard entries are repeated here.
exclude:
  # Scratch space. Gitignored, but a local build would copy it into
  # _site/tmp/, where `node --test` collects stray test files.
  - tmp/
  # `.claude/` is excluded for the watcher: `exclude:` is also listen's ignore
  # list, and an agent worktree under `.claude/worktrees/` can hold two paths
  # to one directory (scripts/browser/serve.sh symlinks tmp/serve/helen-triages
  # to ../site), which stops `jekyll-local` with "directory is already being
  # watched". The `tmp/` line above does not cover it: exclude patterns anchor
  # at the source root.
  - .claude/
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - node_modules/
  - vendor/
  # Python test suite — not part of the site
  - tests/
  - pytest.ini
  - requirements-test.txt
  # Python build tooling (#247), not part of the site. scripts/generate_pdfs.py
  # runs from the checkout and reads the finished _site, so excluding this
  # cannot affect it.
  - scripts/
  # Project-local Node install for the JS tests. Dev-only, and large.
  - .node-runtime/
  # Working notes and agent instructions — never published
  - model_instructions/
  - CLAUDE.md
  # WSL writes a "<name>:Zone.Identifier" sidecar beside every file dragged in
  # from Windows. The colon makes Jekyll read the name as a URI scheme and
  # jekyll-sitemap crashes the whole build. .gitignore covers them, but Jekyll
  # reads the working directory.
  - "*Zone.Identifier"
  # Build output. `_site` is auto-excluded when it is the destination, but the
  # production preview builds to _site_prod, so each server would otherwise
  # watch the other's output and rebuild in a loop.
  - _site/
  - _site_prod/
  # Sublime's project and workspace files. Untracked, so never on the live
  # site, but a local build reads the working directory and they appeared in
  # the jekyll-prod mockup (#414).
  - htf-sublime.sublime-project
  - htf-sublime.sublime-workspace

sass:
  sass_dir: _sass

plugins:
  - jekyll-sitemap
