# =============================================================================
# PRODUCTION CONFIG — this is what deploys.
# Anything that should only ever be visible on your own machine belongs in
# _config_local.yml, not here.
# =============================================================================
#
# THIS IS A MONO-REPO. One Jekyll build serves two sites:
#
#   /helen-triages/food/       Helen Triages Food
#   /helen-triages/cocktails/  Helen Triages Cocktails
#
# They share an outer layout, a spacing/type scale and a base stylesheet, and
# fork everything below that — palette, decoration, page anatomy, taxonomy.
# Per-site identity (wordmark, title, stylesheet) lives in _data/sites.yml and
# is selected by `site_key`, set in `defaults:` at the bottom of this file.
# =============================================================================

# The repo-level identity. Each site overrides this with its own entry in
# _data/sites.yml — this is only what the root landing page shows.
#
# `description` IS CURRENTLY RENDERED NOWHERE, and that is worth knowing before
# editing it and wondering why nothing changed. It is only ever a fallback:
# default.html reads `this_site.description | default: site.description`, and
# both sites declare their own in _data/sites.yml. The one page that could have
# reached the fallback was the root landing page, which since issue #204 is a
# bare redirect with no layout at all (§2.4). So it waits for a third site, or
# for a page belonging to none.
#
# `title` is different and IS used: the footer's copyright line reads
# `{{ site.title }}` on every page.
title: Helen Triages
description: What not How.

# GitHub Pages project site. Repo is helen-triages, so the published URL is
#   https://<your-github-username>.github.io/helen-triages/
# baseurl must match the repo name exactly: leading slash, no trailing slash.
url: "https://deckofpandas.github.io"
baseurl: "/helen-triages"

# Drafts and unrewritten recipes are never shown in production.
show_unrewritten: false

# Whether a recipe page offers its "pdf" link (GitHub issue #86). True here, so
# it appears both on the deployed site and on the jekyll-prod mockup, which
# exists precisely to show what deploys. _config_local.yml turns it off for the
# jekyll-local working view, where the file genuinely is not there: the PDFs are
# rendered from a finished build by scripts/generate_pdfs.py, so a link in the
# view you work in all day would be a permanent 404.
#
# It used to be `{% if jekyll.environment == "production" %}` in the layout,
# which was wrong in a way only testing found: jekyll-prod serves with
# --config _config.yml and no JEKYLL_ENV, so it is "development" too, and the
# link rendered nowhere you could actually look at it.
pdf_downloads: true

# The "click for short method" toggle and its "In short:" print/PDF section --
# Helen, 2026-08-14: undeployed. Both beef-wellington.md and chocolate-mousse.md
# render it oddly. Off everywhere (no _config_local.yml override, so this one
# value covers jekyll-local, jekyll-prod and the deployed site alike) rather
# than deleting page.method_short data or the rendering code -- flip this back
# to true once the feature itself is fixed and she's happy with it again.
short_method_enabled: false

# DO NOT PUBLISH A RECIPE WAITING ON A FIX. GitHub issue #331.
# `meta.awaiting_fix: true` means a page has a known, open problem. false here
# means production removes those pages entirely -- no URL, no sitemap entry --
# via _plugins/hide_awaiting_fix.rb. _config_local.yml sets it true so you can
# still see and fix them locally.
#
# The point of the flag is that ONE broken page does not hold the site back.
# Flag it, ship everything else, fix it, unflag it.
show_awaiting_fix: false

# --- Collections -------------------------------------------------------------
# WHY THE SOURCE DIRECTORIES ARE AT THE REPO ROOT AND NOT INSIDE food/
#
# Jekyll only discovers a collection at `_<name>` directly under the source
# root (or under a single shared `collections_dir`). A collection source at
# `food/_recipes/` is not found — and it fails SILENTLY: the build succeeds and
# emits nothing at all. That was tested rather than assumed before this config
# was written.
#
# So the site each collection belongs to is carried in its NAME, and `permalink`
# is what puts the output under /food/ or /cocktails/. The URLs are exactly the
# ones agreed; only the on-disk location differs from the original sketch.
collections:
  dev:
    # INTERNAL REFERENCE PAGES, AND THE REASON THIS IS A COLLECTION RATHER THAN
    # A LOOSE .html SOMEWHERE.
    #
    # Issue #276 deleted food/swatch.html and food/swatch-scribbles.html for
    # exactly the failure this avoids: they were internal colour references,
    # linked from nowhere on the site, and they were PUBLISHED ANYWAY, because
    # Jekyll gives any page it renders a default permalink whether or not an
    # <a href> points at it. "Unlinked" is not "unpublished", and the only
    # thing that had noticed was test_page_links.py's PUBLISHED set, which
    # picked them up through that very fallback.
    #
    # `output: false` is the mechanism that actually holds -- the same one
    # protecting both drafts collections -- so a dev page has no URL and no
    # sitemap entry in a production build. _config_local.yml flips it to true.
    output: false
  food_recipes:
    output: true
    permalink: /food/recipes/:path/
  food_drafts:
    # output: false means drafts get NO public URL and are NOT in the sitemap.
    # _config_local.yml flips this back to true so you can still read them locally.
    output: false
  cocktail_recipes:
    output: true
    permalink: /cocktails/recipes/:path/
  cocktail_drafts:
    # Same two-part protection as food_drafts, for the same reason: `output:
    # false` stops Jekyll publishing them, and _cocktail_drafts/ being its own
    # git repo (pushed to helen-triages-cocktails-private, gitignored here)
    # stops the source reaching this public repo at all. Neither half is
    # redundant -- GitHub issue #235 is the case where output: false held and
    # the index still listed ten drafts, linking to URLs Jekyll never wrote.
    # _config_local.yml flips this back to true so they are readable locally.
    output: false

# --- Defaults ----------------------------------------------------------------
# `site_key` is the one value that makes the shared layout site-aware. It keys
# into _data/sites.yml for the wordmark, page title, stylesheet and footer
# decoration, and into _data/<key>/ for that site's vocabulary. A page with no
# site_key falls back to the repo-level identity above — in practice this is
# only the root index.html, which since GitHub issue #204 is a bare redirect
# to food/ rather than a rendered page, so the fallback is largely academic
# now.
defaults:
  - scope:
      path: ""
      type: food_recipes
    values:
      layout: recipe
      site_key: food
  - scope:
      path: ""
      type: food_drafts
    values:
      layout: recipe
      site_key: food
      sitemap: false   # belt and braces: excluded even if output is ever flipped
  - scope:
      path: ""
      type: cocktail_recipes
    values:
      layout: cocktail
      site_key: cocktails
  - scope:
      path: ""
      type: cocktail_drafts
    values:
      layout: cocktail
      site_key: cocktails
      sitemap: false   # belt and braces: excluded even if output is ever flipped
  # Pages, by directory. These are ordinary pages rather than collection
  # documents, so they are scoped by path instead of by type.
  - scope:
      path: "food"
    values:
      site_key: food
  - scope:
      path: "cocktails"
    values:
      site_key: cocktails

# Keep non-site files out of the build. Setting `exclude` REPLACES Jekyll's
# defaults, so the standard entries are repeated here.
exclude:
  # Scratch space (CLAUDE.md: never machine /tmp, always this folder). Gitignored,
  # so a CI build never sees it -- but a LOCAL build copied the whole thing into
  # _site/tmp/, which is how a stray *.test.js backup there ended up being
  # collected by `node --test` and failing against a path that doesn't resolve
  # from its copied location. The scratch folder is not part of the site.
  - tmp/
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - node_modules/
  - vendor/
  # Python test suite — not part of the site
  - tests/
  - pytest.ini
  - requirements-test.txt
  # Python build tooling (generate_pdfs.py, generate_tape.py,
  # build_cooking_methods.py and the rest) — GitHub issue #247. Without this
  # line it was copied whole into _site/scripts/ and served as ordinary
  # static files: harmless, since nothing links to it, but not part of the
  # site. generate_pdfs.py in particular runs from the repo checkout, not
  # from _site, and reads the FINISHED _site as its input after the Jekyll
  # build has already happened (.github/workflows/build-and-deploy.yml) —
  # so excluding this directory from what Jekyll builds cannot touch it.
  - scripts/
  # Project-local Node install for the JS tests. Dev-only, and large.
  - .node-runtime/
  # Working notes and agent instructions — never published
  - model_instructions/
  - CLAUDE.md
  # WSL writes a "<name>:Zone.Identifier" sidecar beside every file dragged in
  # from Windows. The colon makes Jekyll read the name as a URI scheme, and
  # jekyll-sitemap then crashes the ENTIRE build — no output, a raw Ruby
  # backtrace, no mention of the offending file's real location.
  #
  # It only crashes for names that are not legal schemes. Hyphens are legal, so
  # chai-spice.md:Zone.Identifier slipped through for weeks; underscores are
  # not, so RECIPES_SEEN_v23.md:Zone.Identifier killed the build the moment it
  # appeared. .gitignore already covers these, but that only stops them being
  # committed — Jekyll still reads the working directory.
  - "*Zone.Identifier"
  # Build output. `_site` is auto-excluded when it is the destination, but the
  # production preview builds to _site_prod, so each server would otherwise
  # watch the other's output and rebuild in a loop.
  - _site/
  - _site_prod/
  # Sublime's project and workspace files. SAME REASON AS *Zone.Identifier
  # above, and worth reading that comment as one thought with this: .gitignore
  # stops a file being COMMITTED, and Jekyll reads the WORKING DIRECTORY. Two
  # different questions, and being ignored by one says nothing about the other.
  #
  # So these were never on the live site -- a CI checkout has only tracked
  # files, and these are not tracked (verified with `git archive HEAD`, after
  # issue #414 claimed otherwise on the strength of a local build). What they
  # were doing was appearing in the jekyll-prod mockup on :4002, which exists
  # precisely to show what deploys and was therefore lying about two files.
  # Small, but that mockup's whole job is fidelity.
  - htf-sublime.sublime-project
  - htf-sublime.sublime-workspace

sass:
  sass_dir: _sass

plugins:
  - jekyll-sitemap
