# =============================================================================
# PRODUCTION CONFIG — this is what deploys.
# Anything that should only ever be visible on your own machine belongs in
# _config_local.yml, not here.
# =============================================================================
#
# THIS IS A MONO-REPO. One Jekyll build serves two sites:
#
#   /helen-triages/food/       Helen Triages Food
#   /helen-triages/cocktails/  Helen Triages Cocktails
#
# They share an outer layout, a spacing/type scale and a base stylesheet, and
# fork everything below that — palette, decoration, page anatomy, taxonomy.
# Per-site identity (wordmark, title, stylesheet) lives in _data/sites.yml and
# is selected by `site_key`, set in `defaults:` at the bottom of this file.
# =============================================================================

# The repo-level identity. Each site overrides this with its own entry in
# _data/sites.yml — this is only what the root landing page shows.
title: Helen Triages
description: Two decision-support tools. What to cook, and what to drink.

# GitHub Pages project site. Repo is helen-triages, so the published URL is
#   https://<your-github-username>.github.io/helen-triages/
# baseurl must match the repo name exactly: leading slash, no trailing slash.
url: "https://deckofpandas.github.io"
baseurl: "/helen-triages"

# Drafts and unrewritten recipes are never shown in production.
show_unrewritten: false

# Whether a recipe page offers its "pdf" link (GitHub issue #86). True here, so
# it appears both on the deployed site and on the jekyll-prod mockup, which
# exists precisely to show what deploys. _config_local.yml turns it off for the
# jekyll-local working view, where the file genuinely is not there: the PDFs are
# rendered from a finished build by scripts/generate_pdfs.py, so a link in the
# view you work in all day would be a permanent 404.
#
# It used to be `{% if jekyll.environment == "production" %}` in the layout,
# which was wrong in a way only testing found: jekyll-prod serves with
# --config _config.yml and no JEKYLL_ENV, so it is "development" too, and the
# link rendered nowhere you could actually look at it.
pdf_downloads: true

# --- Collections -------------------------------------------------------------
# WHY THE SOURCE DIRECTORIES ARE AT THE REPO ROOT AND NOT INSIDE food/
#
# Jekyll only discovers a collection at `_<name>` directly under the source
# root (or under a single shared `collections_dir`). A collection source at
# `food/_recipes/` is not found — and it fails SILENTLY: the build succeeds and
# emits nothing at all. That was tested rather than assumed before this config
# was written.
#
# So the site each collection belongs to is carried in its NAME, and `permalink`
# is what puts the output under /food/ or /cocktails/. The URLs are exactly the
# ones agreed; only the on-disk location differs from the original sketch.
collections:
  food_recipes:
    output: true
    permalink: /food/recipes/:path/
  food_drafts:
    # output: false means drafts get NO public URL and are NOT in the sitemap.
    # _config_local.yml flips this back to true so you can still read them locally.
    output: false
  cocktail_recipes:
    output: true
    permalink: /cocktails/recipes/:path/

# --- Defaults ----------------------------------------------------------------
# `site_key` is the one value that makes the shared layout site-aware. It keys
# into _data/sites.yml for the wordmark, page title, stylesheet and footer
# decoration, and into _data/<key>/ for that site's vocabulary. A page with no
# site_key (the root landing page) falls back to the repo-level identity above.
defaults:
  - scope:
      path: ""
      type: food_recipes
    values:
      layout: recipe
      site_key: food
  - scope:
      path: ""
      type: food_drafts
    values:
      layout: recipe
      site_key: food
      sitemap: false   # belt and braces: excluded even if output is ever flipped
  - scope:
      path: ""
      type: cocktail_recipes
    values:
      layout: cocktail
      site_key: cocktails
  # Pages, by directory. These are ordinary pages rather than collection
  # documents, so they are scoped by path instead of by type.
  - scope:
      path: "food"
    values:
      site_key: food
  - scope:
      path: "cocktails"
    values:
      site_key: cocktails

# Keep non-site files out of the build. Setting `exclude` REPLACES Jekyll's
# defaults, so the standard entries are repeated here.
exclude:
  - .jekyll-cache/
  - .sass-cache/
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - node_modules/
  - vendor/
  # Python test suite — not part of the site
  - tests/
  - pytest.ini
  - requirements-test.txt
  # Project-local Node install for the JS tests. Dev-only, and large.
  - .node-runtime/
  # Working notes and agent instructions — never published
  - model_instructions/
  - CLAUDE.md
  # WSL writes a "<name>:Zone.Identifier" sidecar beside every file dragged in
  # from Windows. The colon makes Jekyll read the name as a URI scheme, and
  # jekyll-sitemap then crashes the ENTIRE build — no output, a raw Ruby
  # backtrace, no mention of the offending file's real location.
  #
  # It only crashes for names that are not legal schemes. Hyphens are legal, so
  # chai-spice.md:Zone.Identifier slipped through for weeks; underscores are
  # not, so RECIPES_SEEN_v23.md:Zone.Identifier killed the build the moment it
  # appeared. .gitignore already covers these, but that only stops them being
  # committed — Jekyll still reads the working directory.
  - "*Zone.Identifier"
  # Build output. `_site` is auto-excluded when it is the destination, but the
  # production preview builds to _site_prod, so each server would otherwise
  # watch the other's output and rebuild in a loop.
  - _site/
  - _site_prod/

sass:
  sass_dir: _sass

plugins:
  - jekyll-sitemap
